</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">资金监管指标</span>
      <span class="nav-right"><i class="fa-solid fa-calendar-day"></i> 2026-07</span>
    </div>
    <div class="m-seg" style="margin-top:10px;background:rgba(255,255,255,.12)">
      <a href="cockpit.html">总览</a>

      <a class="on">资金</a>
      <a href="rank.html">排行</a>
      <a href="subject.html">主体</a>
    </div>
  </div>

  <div class="m-body" style="padding-bottom:70px">
    <div class="m-kpi-grid" style="margin-bottom:12px">
      <div class="m-kpi gold"><div class="k-l">监管资金余额</div><div class="k-v">38.6<span class="u">亿</span></div><div class="k-d down"><i class="fa-solid fa-arrow-down"></i> 环比 -2.1%</div></div>
      <div class="m-kpi"><div class="k-l">本月拨付</div><div class="k-v">4.2<span class="u">亿</span></div><div class="k-d up"><i class="fa-solid fa-arrow-up"></i> +0.6亿</div></div>
      <div class="m-kpi"><div class="k-l">维修资金归集</div><div class="k-v">12.8<span class="u">亿</span></div><div class="k-d up"><i class="fa-solid fa-arrow-up"></i> +3.2%</div></div>
      <div class="m-kpi"><div class="k-l">监管账户(个)</div><div class="k-v">386</div><div class="k-d"><i class="fa-solid fa-shield"></i> 全覆盖</div></div>
    </div>

    <div class="m-chart" style="margin-bottom:12px">
      <div class="c-title">预售资金 · 归集与拨付（亿元）</div>
      <div class="m-bars">
        <div class="bar"><i style="height:88%"></i><span class="lb">2月</span></div>
        <div class="bar"><i style="height:80%"></i><span class="lb">3月</span></div>
        <div class="bar"><i style="height:92%"></i><span class="lb">4月</span></div>
        <div class="bar"><i style="height:70%"></i><span class="lb">5月</span></div>
        <div class="bar"><i style="height:76%"></i><span class="lb">6月</span></div>
        <div class="bar"><i class="gold" style="height:64%"></i><span class="lb">7月</span></div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-ring"></i> 资金执行情况</div>
      <div style="display:flex;align-items:center;gap:16px">
        <div class="m-ring" style="--v:82;background:conic-gradient(var(--m-success) calc(82%),#e9eef7 0)"><div class="in"><div class="v">82%</div><div class="l">拨付合规率</div></div></div>
        <div style="flex:1">
          <div class="m-kv">
            <div class="row"><span class="k">预售监管</span><span class="v">24.6 亿</span></div>
            <div class="row"><span class="k">存量房交易</span><span class="v">1.2 亿</span></div>
            <div class="row"><span class="k">维修资金</span><span class="v">12.8 亿</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="m-card" style="border-left:3px solid var(--m-seal)">
      <div class="m-card-title"><i class="fa-solid fa-triangle-exclamation m-seal-t"></i> 资金异常预警</div>
      <a class="m-list-item" href="#"><div class="li-ic ic orange"><i class="fa-solid fa-vault"></i></div><div class="li-main"><div class="li-title">某项目拨付超节点比例</div><div class="li-sub">待核查 · 已冻结超额部分</div></div><span class="m-urgency today">橙</span></a>
    </div>
  </div>

  <div class="m-tabbar">

    <a href="../gov/approve.html"><i class="fa-solid fa-stamp"></i>审批</a>

    <a href="../gov/approve-config.html"><i class="fa-solid fa-user-gear"></i>我的</a>
