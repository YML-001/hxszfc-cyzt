<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">

  <div class="m-body" style="padding-bottom:70px">
    <div class="m-kpi-grid" style="margin-bottom:12px">
      <div class="m-kpi"><div class="k-l">商品房网签(套)</div><div class="k-v">1,286</div><div class="k-d up"><i class="fa-solid fa-arrow-up"></i> +12.4%</div></div>
      <div class="m-kpi"><div class="k-l">存量房成交(套)</div><div class="k-v">964</div><div class="k-d down"><i class="fa-solid fa-arrow-down"></i> -3.1%</div></div>
      <div class="m-kpi"><div class="k-l">租赁备案(件)</div><div class="k-v">2,105</div><div class="k-d up"><i class="fa-solid fa-arrow-up"></i> +6.8%</div></div>
      <div class="m-kpi"><div class="k-l">从业机构(家)</div><div class="k-v">312</div><div class="k-d up"><i class="fa-solid fa-arrow-up"></i> +4</div></div>
    </div>

    <div class="m-chart" style="margin-bottom:12px">
      <div class="c-title">各城区网签量对比 <span class="more">套</span></div>
      <div class="m-bars">
        <div class="bar"><i style="height:90%"></i><span class="lb">城中</span></div>
        <div class="bar"><i style="height:72%"></i><span class="lb">鱼峰</span></div>
        <div class="bar"><i style="height:58%"></i><span class="lb">柳南</span></div>
        <div class="bar"><i style="height:64%"></i><span class="lb">柳北</span></div>
        <div class="bar"><i class="gold" style="height:98%"></i><span class="lb">柳东</span></div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-building-circle-exclamation"></i> 保交楼 · 四色风险</div>
      <div class="m-risk">
        <div class="rz red"><div class="n">2</div><div class="t">红</div></div>
        <div class="rz orange"><div class="n">5</div><div class="t">橙</div></div>
        <div class="rz yellow"><div class="n">11</div><div class="t">黄</div></div>
        <div class="rz green"><div class="n">86</div><div class="t">绿</div></div>
      </div>
      <div class="muted" style="margin-top:10px">红/橙风险项目已纳入督办，点击查看清单与处置进度</div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-layer-group"></i> 政策性住房</div>
      <div class="m-kv">
        <div class="row"><span class="k">保障性租赁住房(套)</span><span class="v">3,860</span></div>
        <div class="row"><span class="k">配售型保障房(套)</span><span class="v">1,240</span></div>
        <div class="row"><span class="k">房票安置(张)</span><span class="v">528</span></div>
      </div>
    </div>
  </div>
