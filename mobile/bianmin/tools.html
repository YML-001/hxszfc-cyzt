<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>便民工具 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">便民工具</span>
      <span class="nav-right"></span>
    </div>
  </div>

  <div class="m-body">
    <div class="m-seg" style="margin-bottom:12px" id="seg"><a class="on">房贷计算</a><a>税费试算</a><a>公积金额度</a></div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-calculator"></i> 房贷月供估算</div>
      <div class="m-field"><label>贷款总额（万元）</label><input type="number" id="amt" value="120"></div>
      <div class="m-field"><label>贷款年限（年）</label><input type="number" id="years" value="30"></div>
      <div class="m-field"><label>年利率（%）</label><input type="number" id="rate" value="3.1" step="0.05"></div>
      <button class="m-btn" id="calc"><i class="fa-solid fa-equals"></i> 计算月供</button>
      <div class="m-overview" id="result" style="margin-top:14px">
        <div class="ov"><div class="v" id="monthly">—</div><div class="l">月供(元)</div></div>
        <div class="ov"><div class="v" id="interest">—</div><div class="l">总利息(万)</div></div>
        <div class="ov"><div class="v" id="total">—</div><div class="l">还款总额(万)</div></div>
      </div>
      <div class="muted" style="margin-top:8px">按等额本息估算，结果仅供参考，以银行核定为准</div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-file-invoice-dollar"></i> 交易税费试算</div>
      <a class="m-list-item" href="#"><div class="li-ic ic green"><i class="fa-solid fa-percent"></i></div><div class="li-main"><div class="li-title">契税 / 增值税 / 个税试算</div><div class="li-sub">按首套 / 二套、面积、年限自动匹配</div></div><i class="fa-solid fa-angle-right"></i></a>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-building-columns"></i> 公积金可贷额度</div>
      <a class="m-list-item" href="#"><div class="li-ic ic teal"><i class="fa-solid fa-sack-dollar"></i></div><div class="li-main"><div class="li-title">按缴存基数与年限估算</div></div><i class="fa-solid fa-angle-right"></i></a>
    </div>
  </div>
</div>
<script>
  (function () {
    var seg = document.getElementById('seg');
    if (seg) seg.addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return;
      seg.querySelectorAll('a').forEach(function (x) { x.classList.remove('on'); });
      a.classList.add('on');
    });
    function calcLoan() {
      var p = (parseFloat(document.getElementById('amt').value) || 0) * 10000;
      var n = (parseFloat(document.getElementById('years').value) || 0) * 12;
      var r = (parseFloat(document.getElementById('rate').value) || 0) / 100 / 12;
      if (!p || !n || !r) return;
      var m = p * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1);
      var total = m * n;
      document.getElementById('monthly').textContent = Math.round(m).toLocaleString();
      document.getElementById('total').textContent = (total / 10000).toFixed(1);
      document.getElementById('interest').textContent = ((total - p) / 10000).toFixed(1);
    }
    document.getElementById('calc').addEventListener('click', calcLoan);
    calcLoan();
  })();
</script>
</body>
</html>
