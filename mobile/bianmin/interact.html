<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公众互动 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">公众互动</span>
      <span class="nav-right"><i class="fa-solid fa-headset"></i></span>
    </div>
  </div>

  <div class="m-body">
    <div class="m-grid" style="margin-bottom:14px">
      <a href="#"><span class="ic red"><i class="fa-solid fa-triangle-exclamation"></i></span>投诉举报</a>
      <a href="#"><span class="ic blue"><i class="fa-solid fa-lightbulb"></i></span>建议征集</a>
      <a href="#"><span class="ic gold"><i class="fa-regular fa-face-smile"></i></span>好差评</a>
      <a href="#"><span class="ic green"><i class="fa-solid fa-square-poll-vertical"></i></span>业主表决</a>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-clipboard-list"></i> 投诉处置进度</div>
      <a class="m-list-item" href="#"><div class="li-ic ic orange"><i class="fa-solid fa-hourglass-half"></i></div><div class="li-main"><div class="li-title">关于某中介隐瞒房源信息的投诉</div><div class="li-sub">工单 TS20260728 · 处理中（限 7 日办结）</div></div><span class="m-tag orange">处理中</span></a>
      <a class="m-list-item" href="#"><div class="li-ic ic green"><i class="fa-solid fa-circle-check"></i></div><div class="li-main"><div class="li-title">交易大厅排队叫号建议</div><div class="li-sub">工单 TS20260710 · 已采纳并回复</div></div><span class="m-tag green">已办结</span></a>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-regular fa-face-smile"></i> 我要好差评</div>
      <div style="display:flex;gap:10px" id="rate">
        <div class="m-vote-opt agree" style="flex:1" data-v="good"><i class="fa-solid fa-thumbs-up"></i> 满意</div>
        <div class="m-vote-opt" style="flex:1" data-v="mid"><i class="fa-solid fa-face-meh"></i> 一般</div>
        <div class="m-vote-opt against" style="flex:1" data-v="bad"><i class="fa-solid fa-thumbs-down"></i> 不满意</div>
      </div>
      <div class="m-field" style="margin-top:12px"><textarea placeholder="说说您的办事体验，帮助我们改进服务…"></textarea></div>
      <button class="m-btn" onclick="return false"><i class="fa-solid fa-paper-plane"></i> 提交评价</button>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-square-poll-vertical"></i> 业主表决</div>
      <a class="m-list-item" href="#"><div class="li-ic ic green"><i class="fa-solid fa-vote-yea"></i></div><div class="li-main"><div class="li-title">荣和小区维修资金使用表决</div><div class="li-sub">进行中 · 已表决 62% · 剩 3 天</div></div><span class="m-tag green">去表决</span></a>
    </div>
  </div>
</div>
<script>
  (function () {
    var rate = document.getElementById('rate');
    if (rate) rate.addEventListener('click', function (e) {
      var o = e.target.closest('.m-vote-opt'); if (!o) return;
      rate.querySelectorAll('.m-vote-opt').forEach(function (x) { x.classList.remove('sel'); });
      o.classList.add('sel');
    });
  })();
</script>
</body>
</html>
