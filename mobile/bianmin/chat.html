<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<style>
  .chat-body { padding: 14px; background: #eef1f7; }
  .msg { display: flex; gap: 8px; margin-bottom: 14px; }
  .msg .av { width: 34px; height: 34px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; }
  .msg .bubble { max-width: 74%; padding: 11px 13px; border-radius: 12px; font-size: 14px; line-height: 1.55; background: #fff; box-shadow: 0 2px 8px rgba(15,23,42,.05); }
  .msg.bot .av { background: var(--m-primary); }
  .msg.me { flex-direction: row-reverse; }
  .msg.me .av { background: #12a150; }
  .msg.me .bubble { background: var(--m-primary); color: #fff; }
  .q-chip { display: inline-block; margin: 4px 6px 0 0; padding: 7px 12px; border-radius: 16px; background: #fff; color: var(--m-primary); font-size: 12.5px; border: 1px solid #d6e2ff; }
  .chat-input { position: absolute; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; align-items: center; padding: 10px 12px calc(10px + env(safe-area-inset-bottom)); background: #fff; border-top: 1px solid var(--m-border); }
  .chat-input .ib { flex: 1; background: #f1f3f7; border-radius: 20px; padding: 10px 14px; color: var(--m-text3); font-size: 14px; }
  .chat-input .ic-btn { width: 38px; height: 38px; border-radius: 50%; background: var(--m-primary); color: #fff; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">智能客服 · 桂小房</span>
      <span class="nav-right"><i class="fa-solid fa-user-headset"></i> 人工</span>
    </div>
  </div>

  <div class="m-body chat-body" style="padding-bottom:70px">
    <div class="msg bot">
      <div class="av"><i class="fa-solid fa-robot"></i></div>
      <div class="bubble">您好，我是柳州房产智能助手"桂小房"，可以帮您解答办事、房源、政策等问题。请问需要什么帮助？
        <div style="margin-top:8px">
          <a class="q-chip" href="#">如何办理网签备案？</a>
          <a class="q-chip" href="#">带押过户怎么办？</a>
          <a class="q-chip" href="../fangyuan/list.html">查看在售房源</a>
          <a class="q-chip" href="../banshi/progress.html">我的办件进度</a>
        </div>
      </div>
    </div>

    <div class="msg me">
      <div class="av"><i class="fa-solid fa-user"></i></div>
      <div class="bubble">存量房带押过户需要什么材料？</div>
    </div>

    <div class="msg bot">
      <div class="av"><i class="fa-solid fa-robot"></i></div>
      <div class="bubble">带押过户一般需要：买卖双方身份证明、不动产权证、原贷款合同、新贷款银行受理回执。柳州已支持全程线上办理。<br>为您找到相关服务：
        <div style="margin-top:8px">
          <a class="q-chip" href="../banshi/apply.html">去办理带押过户</a>
          <a class="q-chip" href="../zixun/guide.html">查看图解指南</a>
        </div>
        <div style="margin-top:10px;font-size:12px;color:var(--m-text3)">以上回答对您有帮助吗？　<i class="fa-regular fa-thumbs-up"></i>　<i class="fa-regular fa-thumbs-down"></i></div>
      </div>
    </div>
  </div>

  <div class="chat-input">
    <i class="fa-solid fa-microphone" style="color:var(--m-primary);font-size:20px"></i>
    <div class="ib">输入问题，或按住说话…</div>
    <div class="ic-btn"><i class="fa-solid fa-paper-plane"></i></div>
  </div>
</div>
</body>
</html>
