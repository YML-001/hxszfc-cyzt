<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华信数智房产交易一体化平台 · 移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-portal">
    <div class="m-portal-top">
      <div style="display:flex;align-items:center;justify-content:space-between">
        <div class="m-portal-emblem"><i class="fa-solid fa-city"></i></div>
        <span class="m-badge"><i class="fa-solid fa-location-dot"></i> 广西 · 柳州市</span>
      </div>
      <div class="m-portal-title">华信数智房产<br>交易一体化平台</div>
      <div class="m-portal-sub"><i class="fa-solid fa-check"></i> 网上办事 · 房源超市 · 信息查询 · 阳光监管<br><i class="fa-solid fa-check"></i> 一个入口，办好购房租房每一件事</div>
    </div>

    <div class="m-portal-cards">
      <div class="m-entry">
        <a class="e-open" href="home.html?role=citizen">
          <span class="e-ico"><i class="fa-solid fa-house-user"></i></span>
          <span class="e-main">
            <span class="e-title">公众端</span>
            <span class="e-sub">购房群众 / 租赁当事人：办事、查询、找房、资讯、便民</span>
          </span>
        </a>
        <span class="m-role-pick">
          <a href="home.html?role=citizen">购房群众</a>
          <a href="home.html?role=tenant">租赁当事人</a>
        </span>
      </div>

      <div class="m-entry gov">
        <a class="e-open" href="gov/home.html">
          <span class="e-ico"><i class="fa-solid fa-shield-halved"></i></span>
          <span class="e-main">
            <span class="e-title">政务端 <span style="font-size:11px;font-weight:600;opacity:.85">· 按权限分配</span></span>
            <span class="e-sub">内部人员：移动审批、领导驾驶舱、预警督办</span>
          </span>
        </a>
        <span class="m-role-pick">
          <a href="gov/home.html">审批人员</a>
          <a href="gov/home.html?role=leader">分管领导</a>
        </span>
      </div>

      <a class="m-entry" href="../index.html" style="background:rgba(255,255,255,.08)">
        <span class="e-ico"><i class="fa-solid fa-arrow-left"></i></span>
        <span class="e-main">
          <span class="e-title" style="font-size:15px">返回原型总入口</span>
          <span class="e-sub">六端导航</span>
        </span>
        <span class="e-go"><i class="fa-solid fa-angle-right"></i></span>
      </a>
    </div>

    <div class="m-portal-foot">主办：XXXX市住房和城乡建设局 · 原型演示（H5 400×844）</div>
  </div>
</div>
</body>
</html>
