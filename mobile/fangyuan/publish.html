<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房源发布与验真 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">发布与验真</span>
      <span class="nav-right"></span>
    </div>
  </div>

  <div class="m-body">
    <div class="m-seg" style="margin-bottom:12px" id="seg"><a class="on">自主挂牌</a><a>求购求租</a><a>房源验真</a></div>

    <div class="m-authbar" style="margin-bottom:12px">
      <i class="fa-solid fa-shield-halved"></i> 挂牌需实名与权属核验，核验通过生成核验码
    </div>

    <div class="m-card">
      <div class="m-steps">
        <div class="st on"><span class="d">1</span>房屋信息</div>
        <div class="st"><span class="d">2</span>权属核验</div>
        <div class="st"><span class="d">3</span>发布上架</div>
      </div>
      <div class="m-field"><label>挂牌类型</label><select><option>出售（存量房）</option><option>出租</option></select></div>
      <div class="m-field"><label>坐落 <span style="color:var(--m-seal)">*</span></label><input type="text" placeholder="城区 / 小区 / 楼栋房号"></div>
      <div class="m-field"><label>建筑面积(㎡)</label><input type="number" placeholder="如 118"></div>
      <div class="m-field"><label>期望价格</label><input type="text" placeholder="总价（万）或 元/月"></div>
      <div class="m-field"><label>房屋照片</label>
        <div class="m-upload-grid">
          <div class="m-upload-tile add"><i class="fa-solid fa-camera"></i>上传</div>
          <div class="m-upload-tile thumb"><i class="fa-solid fa-image"></i></div>
          <div class="m-upload-tile thumb"><i class="fa-solid fa-image"></i></div>
        </div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-handshake"></i> 委托经纪机构（可选）</div>
      <div class="m-list-item"><div class="li-ic ic blue"><i class="fa-solid fa-store"></i></div><div class="li-main"><div class="li-title">柳州链家 · 城中店</div><div class="li-sub">佣金标准 1.5% · 已入网</div></div><span class="m-tag blue">选择</span></div>
      <div class="muted">委托与解除全过程留痕；平台不自动撮合、不介入佣金</div>
    </div>

    <a class="m-btn" href="#"><i class="fa-solid fa-shield-halved"></i> 提交核验并发布</a>
    <div style="height:14px"></div>
    <a class="m-btn ghost" href="#" onclick="return false"><i class="fa-solid fa-triangle-exclamation"></i> 举报虚假房源</a>
  </div>
</div>
<script>
  (function () {
    var seg = document.getElementById('seg');
    if (seg) seg.addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return;
      seg.querySelectorAll('a').forEach(function (x) { x.classList.remove('on'); });
      a.classList.add('on');
    });
  })();
</script>
</body>
</html>
