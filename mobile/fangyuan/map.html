<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地图找房 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">地图找房</span>
      <span class="nav-right"><a href="list.html" style="color:#fff"><i class="fa-solid fa-list"></i> 列表</a></span>
    </div>
  </div>

  <div class="m-body" style="padding:0;position:relative">
    <div style="position:relative;height:420px;background:linear-gradient(135deg,#dce7fb,#eef3fd);overflow:hidden">
      <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(120,150,210,.18) 1px,transparent 1px),linear-gradient(90deg,rgba(120,150,210,.18) 1px,transparent 1px);background-size:44px 44px"></div>
      <div style="position:absolute;left:44px;top:70px;background:var(--m-primary);color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;box-shadow:0 4px 10px rgba(26,92,255,.4)">城中区 128套</div>
      <div style="position:absolute;left:180px;top:150px;background:#12a150;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;box-shadow:0 4px 10px rgba(18,161,80,.4)">鱼峰区 96套</div>
      <div style="position:absolute;left:96px;top:250px;background:var(--m-seal);color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700;box-shadow:0 4px 10px rgba(200,16,46,.35)">柳东新区 210套</div>
      <div style="position:absolute;left:230px;top:300px;background:#0891b2;color:#fff;padding:6px 12px;border-radius:16px;font-size:12px;font-weight:700">柳南区 74套</div>
      <div style="position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:8px">
        <span style="width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--m-shadow-1)"><i class="fa-solid fa-location-crosshairs" style="color:var(--m-primary)"></i></span>
        <span style="width:36px;height:36px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:var(--m-shadow-1)"><i class="fa-solid fa-layer-group" style="color:var(--m-primary)"></i></span>
      </div>
    </div>

    <div class="m-chips" style="padding:12px 14px 0">
      <span class="m-chip on">区域</span><span class="m-chip">商圈</span><span class="m-chip">地铁</span><span class="m-chip">学区</span>
    </div>

    <div style="padding:12px 14px 84px">
      <div class="m-sec-title"><span class="bar"></span>城中区 · 128 套在售</div>
      <a class="m-house-card" href="detail.html">
        <div class="hc-cover"><i class="fa-solid fa-building"></i><span class="verify"><i class="fa-solid fa-shield-halved"></i> 已核验</span></div>
        <div class="hc-main">
          <div class="hc-title">荣和公园大道 3 期</div>
          <div class="hc-meta">在售 · 建面 89-135㎡ · 好房子认定</div>
          <div class="hc-price"><span class="p">1.42<span style="font-size:12px">万/㎡</span></span><span class="up">查看销控</span></div>
        </div>
      </a>
      <a class="m-house-card" href="detail.html">
        <div class="hc-cover" style="background:linear-gradient(135deg,#9be0b8,#d7f3e3)"><i class="fa-solid fa-building"></i></div>
        <div class="hc-main">
          <div class="hc-title">彰泰·学府里</div>
          <div class="hc-meta">在售 · 建面 76-110㎡</div>
          <div class="hc-price"><span class="p">1.15<span style="font-size:12px">万/㎡</span></span><span class="up">查看销控</span></div>
        </div>
      </a>
    </div>
  </div>
</div>
</body>
</html>
