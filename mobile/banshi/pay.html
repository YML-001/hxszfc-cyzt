<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动缴款 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">移动缴款</span>
      <span class="nav-right"><i class="fa-solid fa-clock-rotate-left"></i></span>
    </div>
  </div>

  <div class="m-body" style="padding-bottom:84px">
    <div class="m-seg" style="margin-bottom:12px" id="seg"><a class="on">购房款监管</a><a>维修资金</a><a>缴费记录</a></div>

    <div class="m-cert-card" style="background:linear-gradient(135deg,#0d9488,#12a150)">
      <div class="cc-type">交易资金监管 · 待缴存</div>
      <div class="cc-name">荣和公园大道3-1802 购房款</div>
      <div style="font-size:30px;font-weight:800;margin-top:10px">￥1,680,000</div>
      <div class="cc-no">监管账户 6222 **** **** 3301（柳州银行）</div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-circle-info"></i> 缴款信息</div>
      <div class="m-kv">
        <div class="row"><span class="k">缴款类型</span><span class="v">存量房交易资金监管</span></div>
        <div class="row"><span class="k">收款方</span><span class="v">XXXX市房屋交易资金监管账户</span></div>
        <div class="row"><span class="k">应缴金额</span><span class="v m-seal-t">￥1,680,000</span></div>
        <div class="row"><span class="k">缴款期限</span><span class="v">2026-08-05 前</span></div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-building-columns"></i> 支付方式</div>
      <label class="m-check" style="padding:10px 0;border-bottom:1px solid var(--m-line)"><input type="radio" name="pay" checked> <span><b>银行转账（对公监管账户）</b><br><span class="muted">生成专属缴款码，资金进入监管专户</span></span></label>
      <label class="m-check" style="padding:10px 0"><input type="radio" name="pay"> <span><b>银联/网银支付</b><br><span class="muted">大额支付需网银 U 盾</span></span></label>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-receipt"></i> 电子票据</div>
      <a class="m-list-item" href="../chaxun/result.html"><div class="li-ic ic green"><i class="fa-solid fa-file-invoice-dollar"></i></div><div class="li-main"><div class="li-title">维修资金缴存 · 电子票据</div><div class="li-sub">2026-06-18 · ￥6,523</div></div><span class="m-tag green">可下载</span></a>
    </div>
  </div>

  <div class="m-btn-bar">
    <a class="m-btn success" href="progress.html"><i class="fa-solid fa-shield-halved"></i> 确认缴款并生成凭证</a>
  </div>
</div>
<script>
  (function () {
    var seg = document.getElementById('seg');
    if (seg) seg.addEventListener('click', function (e) {
      var a = e.target.closest('a'); if (!a) return;
      seg.querySelectorAll('a').forEach(function (x) { x.classList.remove('on'); });
      a.classList.add('on');
    });
  })();
</script>
</body>
</html>
