<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>移动申报 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">存量房自助申报</span>
      <span class="nav-right"><i class="fa-solid fa-qrcode"></i></span>
    </div>
  </div>

  <div class="m-body" style="padding-bottom:84px">
    <div class="m-card">
      <div class="m-steps">
        <div class="st done"><span class="d"><i class="fa-solid fa-check"></i></span>核验</div>
        <div class="st on"><span class="d">2</span>信息</div>
        <div class="st"><span class="d">3</span>签约</div>
        <div class="st"><span class="d">4</span>资金监管</div>
        <div class="st"><span class="d">5</span>提交</div>
      </div>
    </div>

    <div class="m-authbar" style="margin-bottom:12px">
      <i class="fa-solid fa-shuffle"></i> 支持二手房「直通车」：签约·备案·纳税·过户一次申报分环节流转
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-house-chimney"></i> 房源与交易信息</div>
      <div class="m-field"><label>核验房源</label><input type="text" value="城中区 · 荣和公园大道3-1802" readonly></div>
      <div class="m-field"><label>成交总价（万）<span style="color:var(--m-seal)">*</span></label><input type="number" placeholder="如 168"></div>
      <div class="m-field"><label>买方姓名 <span style="color:var(--m-seal)">*</span></label><input type="text" placeholder="请输入"></div>
      <div class="m-field"><label>付款方式</label><select><option>一次性付款</option><option>商业贷款</option><option>公积金/组合贷款</option><option>带押过户</option></select></div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-camera"></i> 材料影像</div>
      <div class="m-upload-grid">
        <div class="m-upload-tile add"><i class="fa-solid fa-camera"></i>拍照上传</div>
        <div class="m-upload-tile thumb"><i class="fa-solid fa-image"></i>身份证</div>
        <div class="m-upload-tile thumb"><i class="fa-solid fa-image"></i>不动产证</div>
      </div>
      <div class="muted" style="margin-top:8px">已实名可电子证照免提交；补正内容与期限与 PC 端一致</div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-vault"></i> 交易资金监管协议</div>
      <div class="m-list-item"><div class="li-ic ic teal"><i class="fa-solid fa-building-columns"></i></div><div class="li-main"><div class="li-title">选择监管银行</div><div class="li-sub">柳州银行 / 桂林银行 / 农行</div></div><span class="m-tag blue">在线签订</span></div>
      <div class="muted">三方协议签订结果衔接网签备案与纳税过户节点</div>
    </div>
  </div>

  <div class="m-btn-bar">
    <a class="m-btn gray" href="#" style="flex:.7">存草稿</a>
    <a class="m-btn" href="sign.html" style="flex:1.6"><i class="fa-solid fa-arrow-right"></i> 下一步 · 在线签约</a>
  </div>
</div>
</body>
</html>
