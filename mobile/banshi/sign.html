<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>在线签约 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">在线签约</span>
      <span class="nav-right"><i class="fa-solid fa-headset"></i></span>
    </div>
  </div>

  <div class="m-body" style="padding-bottom:84px">
    <div class="m-card">
      <div class="m-steps">
        <div class="st done"><span class="d"><i class="fa-solid fa-check"></i></span>确认合同</div>
        <div class="st on"><span class="d">2</span>人脸核验</div>
        <div class="st"><span class="d">3</span>签署</div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-file-contract"></i> 合同信息确认</div>
      <div class="m-kv">
        <div class="row"><span class="k">合同类型</span><span class="v">存量房买卖合同（示范文本）</span></div>
        <div class="row"><span class="k">房屋坐落</span><span class="v">荣和公园大道3-1802</span></div>
        <div class="row"><span class="k">成交总价</span><span class="v m-seal-t">￥1,680,000</span></div>
        <div class="row"><span class="k">买受人</span><span class="v">吴明</span></div>
        <div class="row"><span class="k">出卖人</span><span class="v">黄芳</span></div>
      </div>
      <a class="m-btn ghost" href="#" style="margin-top:12px"><i class="fa-regular fa-file-lines"></i> 阅读合同全文（12 页）</a>
    </div>

    <div class="m-authbar" style="margin-bottom:12px">
      <i class="fa-solid fa-face-viewfinder"></i> 签署前需人脸核验，确认为本人操作 <span class="go">立即核验</span>
    </div>

    <div class="m-card">
      <label class="m-check"><input type="checkbox" checked> <span>我已阅读并同意合同全部条款及《电子签约须知》</span></label>
    </div>
  </div>

  <div class="m-btn-bar">
    <a class="m-btn gray" href="#" style="flex:.7">拒绝</a>
    <a class="m-btn" href="pay.html" style="flex:1.6"><i class="fa-solid fa-signature"></i> 人脸核验并签署</a>
  </div>
</div>
</body>
</html>
