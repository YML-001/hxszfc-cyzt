<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>查询结果与凭证 · 柳州房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="back" onclick="history.back()"><i class="fa-solid fa-angle-left"></i></span>
      <span class="nav-title">备案证明</span>
      <span class="nav-right"><i class="fa-solid fa-share-nodes"></i></span>
    </div>
  </div>

  <div class="m-body" style="padding-bottom:84px">
    <div class="m-cert-card">
      <div class="cc-type">XXXX市房屋交易备案证明</div>
      <div class="cc-name">吴明 · 荣和公园大道3-1802</div>
      <div class="cc-no">证明编号 LZBA2026073000128</div>
      <div class="cc-foot">
        <div class="cc-qr"><i class="fa-solid fa-qrcode"></i></div>
        <div class="cc-seal">XXXX市住房和城乡建设局备案专用章</div>
      </div>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-circle-info"></i> 证明信息</div>
      <div class="m-kv">
        <div class="row"><span class="k">权利人</span><span class="v">吴明</span></div>
        <div class="row"><span class="k">房屋坐落</span><span class="v">城中区荣和公园大道3-1802</span></div>
        <div class="row"><span class="k">建筑面积</span><span class="v">118.60 ㎡</span></div>
        <div class="row"><span class="k">网签合同号</span><span class="v">LZWQ20260728021</span></div>
        <div class="row"><span class="k">备案时间</span><span class="v">2026-07-30</span></div>
        <div class="row"><span class="k">抵押状态</span><span class="v m-seal-t">在押（柳州银行）</span></div>
      </div>
    </div>

    <div class="m-authbar" style="margin-bottom:12px">
      <i class="fa-solid fa-shield-halved"></i> 本证明含防伪二维码，扫码或输入编号即可
      <span class="go">在线验真</span>
    </div>

    <div class="m-card">
      <div class="m-card-title"><i class="fa-solid fa-id-badge"></i> 电子亮证</div>
      <div class="muted">支持出示到窗口、银行、公积金核验；证照实时同步不动产登记</div>
    </div>
  </div>

  <div class="m-btn-bar">
    <a class="m-btn ghost" href="#" style="flex:1"><i class="fa-solid fa-file-pdf"></i> 下载 PDF</a>
    <a class="m-btn" href="#" style="flex:1"><i class="fa-solid fa-id-card"></i> 出示证照</a>
  </div>
</div>
</body>
</html>
