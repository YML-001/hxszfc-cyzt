<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保障房源 · 房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
</head>
<body>
<div class="phone">
  <div class="m-status theme-owner"><span>9:41</span><span><i class="fa-solid fa-signal"></i> <i class="fa-solid fa-wifi"></i> <i class="fa-solid fa-battery-full"></i></span></div>
  <div class="m-header theme-owner">
    <div class="m-nav">
      <span class="nav-right" style="float:none"><a href="index.html" style="color:#fff"><i class="fa-solid fa-angle-left"></i></a></span>
      <span class="nav-title">保障房源</span>
      <span class="nav-right"><a href="select.html" style="color:#fff"><i class="fa-solid fa-dice"></i> 报名</a></span>
    </div>
    <div class="m-search" style="margin-top:12px"><i class="fa-solid fa-magnifying-glass"></i><span class="tx">小区 / 项目 / 核验码</span><span class="go">搜索</span></div>
  </div>

  <div class="m-body">
    <div class="m-seg" style="margin-bottom:13px" id="seg">
      <a data-t="gz">公租房</a><a data-t="bz">保障性租赁住房</a><a data-t="ps">配售型</a>
    </div>
    <div class="m-chips">
      <span class="m-chip on">城区不限</span><span class="m-chip">城中区</span><span class="m-chip">鱼峰区</span>
      <span class="m-chip">柳南区</span><span class="m-chip">柳北区</span><span class="m-chip">城郊新区</span><span class="m-chip">XX县</span>
    </div>
    <div class="m-chips">
      <span class="m-chip">面积 <i class="fa-solid fa-angle-down"></i></span>
      <span class="m-chip">户型 <i class="fa-solid fa-angle-down"></i></span>
      <span class="m-chip">状态 <i class="fa-solid fa-angle-down"></i></span>
      <span class="m-chip">综合排序 <i class="fa-solid fa-sort"></i></span>
    </div>

    <div class="m-authbar" style="margin-bottom:13px">
      <i class="fa-solid fa-shield-halved"></i> 保障房源均经统一核验编码，可
      <a href="index.html" class="go">核验码验真</a>
    </div>

    <div id="list"></div>

    <div class="m-card" style="text-align:center;color:var(--m-text3);font-size:12.5px">
      房源信息来源于保障性住房综合管理系统，核验状态与更新时间以详情页为准
    </div>
  </div>

  <div class="m-tabbar">
    <a href="../home.html"><i class="fa-solid fa-house"></i>首页</a>
    <a href="house.html" class="active"><i class="fa-solid fa-store"></i>房源</a>
    <a href="select.html"><i class="fa-solid fa-dice"></i>摇号</a>
    <a href="mine.html"><i class="fa-solid fa-user"></i>我的</a>
  </div>
</div>
<script>
(function(){
  var T={gz:['公租房','元/月','rgba(76,175,80,.94)','fa-key'],bz:['保障性租赁住房','元/月','rgba(8,145,178,.94)','fa-building-user'],ps:['配售型保障房','元/㎡','rgba(230,162,60,.95)','fa-house-flag']};
  var IMG=['h1.jpg','h2.jpg','h5.jpg','h6.jpg'];
  var COMM=['和苑','安居家园','幸福里','龙福雅居','德润新居','城东佳苑','翠竹花园','光华人才公寓'];
  var QX=['城中区','鱼峰区','柳南区','柳北区','城郊新区','XX县'];
  function param(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}
  var cur=param('type')||'gz';
  function render(){
    var t=T[cur],n=cur==='ps'?6:8,html='';
    for(var i=0;i<n;i++){
      var mj=cur==='ps'?[65,75,88,95,105][i%5]:[38,42,50,55,60][i%5];
      var price=cur==='ps'?4980+(i%6)*160:cur==='gz'?280+(i%5)*90:720+(i%6)*180;
      var code='BZ'+cur.toUpperCase()+(2026001+i);
      var st=i%7===0?'待摇号':i%5===0?'选房中':'可申请';
      html+='<a class="m-house-card" href="detail.html?type='+cur+'&id='+cur+'-'+(i+1)+'">'
        +'<div class="hc-cover"><img src="../../assets/img/haohaozi/'+IMG[i%IMG.length]+'">'
        +'<span class="verify" style="background:'+t[2]+'"><i class="fa-solid '+t[3]+'"></i> '+t[0]+'</span></div>'
        +'<div class="hc-main"><div class="hc-title">'+COMM[i%COMM.length]+' · '+(mj<45?'一居':mj<70?'两居':'三居')+'</div>'
        +'<div class="hc-meta">'+QX[i%QX.length]+' · 建面 '+mj+'㎡ · 核验码 '+code+'</div>'
        +'<div class="hc-tags"><span>'+st+'</span><span>'+(cur==='ps'?'保本微利':cur==='gz'?'可申请补贴':'低租金')+'</span></div>'
        +'<div class="hc-price"><span class="p">'+price.toLocaleString()+'<span style="font-size:12px">'+t[1]+'</span></span><span class="up">'+(cur==='ps'?'配售价已公示':'低于市场租金')+'</span></div>'
        +'</div></a>';
    }
    document.getElementById('list').innerHTML=html;
  }
  var seg=document.getElementById('seg');
  seg.querySelectorAll('a').forEach(function(a){if(a.getAttribute('data-t')===cur)a.classList.add('on');});
  seg.addEventListener('click',function(e){var a=e.target.closest('a');if(!a)return;
    seg.querySelectorAll('a').forEach(function(x){x.classList.remove('on');});a.classList.add('on');cur=a.getAttribute('data-t');render();});
  document.querySelectorAll('.m-chips').forEach(function(row){row.addEventListener('click',function(e){var c=e.target.closest('.m-chip');if(!c)return;
    row.querySelectorAll('.m-chip').forEach(function(x){x.classList.remove('on');});c.classList.add('on');});});
  render();
})();
</script>
</body>
</html>
