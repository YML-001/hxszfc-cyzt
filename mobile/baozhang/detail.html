<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房源详情 · 房产移动端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/mobile.css">
<style>
  .d-cover{position:relative;height:220px;overflow:hidden}
  .d-cover img{width:100%;height:100%;object-fit:cover}
  .d-back{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);color:#fff;display:flex;align-items:center;justify-content:center}
  .d-badge{position:absolute;left:14px;bottom:14px;color:#fff;font-size:12px;padding:4px 12px;border-radius:5px}
  .d-price{background:#fff;padding:16px;margin:-18px 12px 0;position:relative;z-index:2;border-radius:16px;box-shadow:var(--m-shadow-1)}
  .d-price .v{font-size:26px;font-weight:800;color:#e0733a}
  .d-kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 10px;margin-top:6px}
  .d-kv .k{font-size:11.5px;color:var(--m-text3)}.d-kv .vv{font-size:13.5px;font-weight:700;margin-top:2px}
  .d-fac{display:flex;flex-wrap:wrap;gap:8px}
  .d-fac span{font-size:12px;color:var(--m-text2);background:var(--m-bg,#f5f6f8);padding:5px 11px;border-radius:14px}
  .d-bar{position:fixed;left:0;right:0;bottom:0;max-width:430px;margin:0 auto;background:#fff;box-shadow:0 -2px 12px rgba(0,0,0,.08);display:flex;gap:10px;padding:10px 14px;z-index:20}
  .d-bar .btn{flex:1;text-align:center;border-radius:12px;padding:12px;font-size:15px;font-weight:700;text-decoration:none}
</style>
</head>
<body>
<div class="phone">
  <div class="m-body" style="padding:0 0 80px">
    <div class="d-cover">
      <img id="cover" src="../../assets/img/haohaozi/h6.jpg">
      <a class="d-back" href="house.html"><i class="fa-solid fa-angle-left"></i></a>
      <span class="d-badge" id="badge" style="background:rgba(76,175,80,.94)"><i class="fa-solid fa-shield-halved"></i> 已核验</span>
    </div>

    <div class="d-price">
      <div class="v" id="price">—</div>
      <div style="font-size:12px;color:var(--m-text3);margin-top:2px" id="pnote"></div>
      <div style="font-size:16px;font-weight:800;margin-top:10px" id="title">房源</div>
      <div class="m-house-card hc-tags" style="box-shadow:none;padding:8px 0 0" id="tags"></div>
    </div>

    <div class="m-body-pad" style="padding:14px 12px 0">
      <div class="m-card">
        <div class="m-card-title"><i class="fa-solid fa-circle-info"></i> 房源信息</div>
        <div class="d-kv" id="kv"></div>
      </div>
      <div class="m-card">
        <div class="m-card-title"><i class="fa-solid fa-couch"></i> 小区配套</div>
        <div class="d-fac"><span><i class="fa-solid fa-elevator"></i> 电梯</span><span><i class="fa-solid fa-square-parking"></i> 停车位</span><span><i class="fa-solid fa-fire-extinguisher"></i> 消防达标</span><span><i class="fa-solid fa-wifi"></i> 智能门禁</span><span><i class="fa-solid fa-bus"></i> 公交直达</span><span><i class="fa-solid fa-school"></i> 学校</span></div>
      </div>
      <div class="m-card">
        <div class="m-card-title"><i class="fa-solid fa-list-check"></i> 申请与保障说明</div>
        <div id="rules" style="font-size:13px;color:var(--m-text2);line-height:1.9"></div>
      </div>
    </div>
  </div>

  <div class="d-bar">
    <a class="btn" style="background:var(--m-bg,#f0f2f5);color:var(--m-text1)" href="select.html"><i class="fa-solid fa-dice"></i> 报名/摇号</a>
    <a class="btn" style="background:linear-gradient(120deg,#1f8a4c,#0e7c6b);color:#fff" href="apply.html"><i class="fa-solid fa-file-signature"></i> 一键申请</a>
  </div>
</div>
<script>
(function(){
  function param(k){try{return new URLSearchParams(location.search).get(k)||'';}catch(e){return '';}}
  var T={gz:['公租房','元/月','租金','rgba(76,175,80,.94)'],bz:['保障性租赁住房','元/月','租金','rgba(8,145,178,.94)'],ps:['配售型保障房','元/㎡','配售价','rgba(230,162,60,.95)']};
  var id=param('id')||'gz-1',type=param('type')||id.split('-')[0],idx=(parseInt(id.split('-')[1]||1,10)-1);
  var t=T[type]||T.gz;
  var mj=type==='ps'?[65,75,88,95,105][idx%5]:[38,42,50,55,60][idx%5];
  var price=type==='ps'?4980+(idx%6)*160:type==='gz'?280+(idx%5)*90:720+(idx%6)*180;
  var comm=['和苑','安居家园','幸福里','龙福雅居','德润新居','城东佳苑','翠竹花园','光华人才公寓'][idx%8];
  var code='BZ'+type.toUpperCase()+(2026001+idx);
  document.getElementById('badge').style.background=t[3];
  document.getElementById('badge').innerHTML='<i class="fa-solid fa-shield-halved"></i> '+t[0]+' · 已核验';
  document.getElementById('price').innerHTML=price.toLocaleString()+'<span style="font-size:13px;font-weight:400"> '+t[1]+'（'+t[2]+'）</span>';
  document.getElementById('pnote').textContent=type==='ps'?'配售价按保本微利核定并公示，封闭管理，满 5 年方可回购':'租金低于同地段市场，符合条件可申请租赁补贴';
  document.getElementById('title').textContent=comm+' · '+mj+'㎡ '+(mj<45?'一居':mj<70?'两居':'三居');
  document.getElementById('tags').innerHTML='<span>核验码 '+code+'</span><span>'+(mj<45?'一室一厅':mj<70?'两室一厅':'三室两厅')+'</span><span>'+['朝南','南北通透','朝东南'][idx%3]+'</span>';
  var kv=[['保障类型',t[0]],['房源编码',code],['建筑面积',mj+' ㎡'],['楼层',(idx%18+2)+'/'+(idx%6+18)+'层'],['所在区域',['城中区','鱼峰区','柳南区','柳北区','城郊新区','XX县'][idx%6]],['运营单位','XXXX市安居保障运营公司']];
  document.getElementById('kv').innerHTML=kv.map(function(k){return '<div><div class="k">'+k[0]+'</div><div class="vv">'+k[1]+'</div></div>';}).join('');
  var rules=type==='ps'?['· 面向符合条件的工薪收入群体配售，需通过购房资格审核','· 政府指导价，保本微利，价格向社会公示','· 封闭管理，不得上市交易，满 5 年方可按规定回购']
    :type==='gz'?['· 面向城镇住房困难且收入财产符合规定的家庭及新市民','· 申请纳入「高效办成一件事」，七部门数据共享联办','· 可实物配租或领取租赁补贴，年度资格复核']
    :['· 面向新市民、青年人，以小户型为主、租金低于市场','· 由政府认定纳管，运营单位统一管理','· 租赁合同网签备案，即空即配'];
  document.getElementById('rules').innerHTML=rules.join('<br>');
})();
</script>
</body>
</html>
