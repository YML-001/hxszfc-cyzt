<style>
  /* 本页特有：库房状态卡 */
  .kf-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 1280px) { .kf-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .kf-card { padding: 14px 16px 16px; border-radius: 8px; background: linear-gradient(180deg, #eff3ff, #ffffff); border: 1px solid #e3eaf8; }
  .kf-card.warn { background: linear-gradient(180deg, #fff7e8, #ffffff); border-color: #f4d39a; }
  .kf-top { display: flex; align-items: center; gap: 8px; }
  .kf-top .name { font-size: 16px; font-weight: 700; color: #1f2a44; white-space: nowrap; }
  .kf-top .time { margin-left: auto; min-width: 0; font-size: 12px; color: #909399; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kf-top .st { padding: 2px 8px; border-radius: 3px; font-size: 12px; color: #fff; background: #2ea44f; white-space: nowrap; }
  .kf-top .st.warn { background: #f59e0b; }
  .kf-ring { position: relative; width: 74px; height: 74px; margin: 14px auto 10px; }
  .kf-ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .kf-ring .c { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #1f2a44; }
  .kf-env { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .kf-env > div { text-align: center; border-radius: 6px; background: #fff; padding: 8px 4px; border: 1px solid #e3eaf8; }
  .kf-env .v { font-size: 18px; font-weight: 700; color: #1f2a44; font-variant-numeric: tabular-nums; }
  .kf-env .v.bad { color: #df2026; }
  .kf-env .l { margin-top: 2px; font-size: 12px; color: #909399; }

  /* 本页特有：档案业务导航（圆形彩色图标 + 文字） */
  .nv-grid { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 14px 8px; margin-bottom: 20px; }
  @media (max-width: 1280px) { .nv-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .nv-grid:last-child { margin-bottom: 0; }
  .nv-item { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 4px; text-decoration: none; border-radius: 6px; transition: background .15s; }
  .nv-item:hover { background: #f2f6ff; }
  .nv-item i { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 40px; border-radius: 50%; color: #fff; font-size: 16px; transition: transform .15s; }
  .nv-item:hover i { transform: translateY(-2px) scale(1.06); }
  .nv-item span { font-size: 12px; color: #303133; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .nv-item i.c1 { background: linear-gradient(135deg, #6b97f9, #2556ba); } .nv-item i.c2 { background: linear-gradient(135deg, #4fd1a5, #12a877); }
  .nv-item i.c3 { background: linear-gradient(135deg, #6ee7d8, #0891b2); } .nv-item i.c4 { background: linear-gradient(135deg, #ffb86b, #f5841f); }
  .nv-item i.c5 { background: linear-gradient(135deg, #a9e34b, #5bb318); } .nv-item i.c6 { background: linear-gradient(135deg, #f78fb3, #d63384); }
  .nv-item i.c7 { background: linear-gradient(135deg, #7db8ff, #1f6feb); } .nv-item i.c8 { background: linear-gradient(135deg, #4fd1a5, #2ea44f); }
  .nv-item i.c9 { background: linear-gradient(135deg, #c39bff, #7c3aed); } .nv-item i.c10 { background: linear-gradient(135deg, #ff9db0, #df2026); }
  .nv-item i.c11 { background: linear-gradient(135deg, #ffd166, #f59e0b); }
  .nv-sub { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; font-size: 14px; font-weight: 600; color: #2556ba; }
  .nv-sub i { font-size: 14px; }
</style>

function kfRing(pct, color) {
  var r = 30, C = 2 * Math.PI * r, len = pct / 100 * C;
  return '<div class="kf-ring"><svg viewBox="0 0 74 74">' +
    '<circle r="' + r + '" cx="37" cy="37" fill="none" stroke="#e8edf5" stroke-width="7"></circle>' +
    '<circle r="' + r + '" cx="37" cy="37" fill="none" stroke="' + color + '" stroke-width="7" stroke-linecap="round" stroke-dasharray="' + len + ' ' + (C - len) + '"></circle>' +
    '</svg><div class="c">' + pct + '%</div></div>';
}
function kfCard(o) {
  return '<div class="kf-card' + (o.warn ? ' warn' : '') + '" onclick="location.href=\'warehouse.html\'" style="cursor:pointer">' +
    '<div class="kf-top"><i class="fa-solid ' + (o.warn ? 'fa-triangle-exclamation' : 'fa-warehouse') + '" style="color:' + (o.warn ? '#f59e0b' : '#2556ba') + '"></i><span class="name">' + o.name + '</span>' +
    '<span class="time">' + o.time + '</span><span class="st' + (o.warn ? ' warn' : '') + '">' + o.state + '</span></div>' +
    kfRing(o.pct, o.color) +
    '<div class="kf-env"><div><div class="v">' + o.temp + '</div><div class="l">温度</div></div>' +
    '<div><div class="v' + (o.humBad ? ' bad' : '') + '">' + o.hum + '</div><div class="l">湿度</div></div></div></div>';
}
function nvGrid(items) {
  return '<div class="nv-grid">' + items.map(function (it, i) {
    return '<a class="nv-item" href="' + it[2] + '"><i class="fa-solid ' + it[1] + ' c' + (i % 11 + 1) + '"></i><span>' + it[0] + '</span></a>';
  }).join('') + '</div>';
}
