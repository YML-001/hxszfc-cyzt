.jx-lc .xl { position: absolute; left: 44px; right: 10px; bottom: 6px; display: flex; justify-content: space-between; font-size: 12px; color: #606266; }
.jx-lc .tip { position: absolute; left: 44px; top: 10px; bottom: 30px; border-left: 1px dashed #b9c6e4; }

    var d = document.createElement('div'); d.id = 'wb-tmp'; d.style.display = 'none';

  }
  /* 给柱图叠一条折线（右轴），并在图上方放图例 */
  function withLine(html, vals, top, color, legend) {

    var svg = '<svg class="jx-line" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="' + pts + '" stroke="' + color + '"></polyline></svg>';
    return html.replace('<div class="wb-bars', legend + '<div class="wb-bars').replace('<div class="grid"></div>', '<div class="grid"></div>' + svg);
  }
  function legend(items) {
