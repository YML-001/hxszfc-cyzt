<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算力资源纳管 · AI 应用服务平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-role="pt" data-active="model-library" data-layout="flow">

<main class="app-main">

  <div class="page-head">
    <div class="breadcrumb">
      <i class="fa-solid fa-house bc-home"></i>
      <span class="sep">/</span><span>模型底座</span>
      <span class="sep">/</span><span>模型管理</span>
      <span class="sep">/</span><span class="cur">算力资源纳管</span>
    </div>
  </div>

  <div class="ai-subnav">
    <span class="sn-label"><i class="fa-solid fa-microchip"></i>模型管理 wsai-02</span>
    <a href="model-library.html?role=pt">算法模型库</a>
    <a href="model-deploy.html?role=pt">本地化部署</a>
    <a href="model-version.html?role=pt">版本管理</a>
    <a href="model-eval.html?role=pt">效果评估</a>
    <a class="active" href="compute-resource.html?role=pt">算力纳管</a>
    <a href="agent-orchestrate.html?role=pt">智能体编排</a>
    <a href="upstream-model.html?role=pt">上级模型复用</a>
    <a href="corpus-manage.html?role=pt">行业语料</a>
  </div>

  <div class="ai-tip">
    <i class="fa-solid fa-server"></i>
    <span>配额按场景分配，<b>已用配额不得超过节点总配额</b>，超出时调整被拦截。
      优先使用市级政务云算力与上级已部署能力，避免重复建设底座。</span>
  </div>

  <div class="stat-grid">
    <div class="stat-card">
      <div class="s-icon ai"><i class="fa-solid fa-server"></i></div>
      <div><div class="s-label">推理节点</div><div class="s-value" id="kNode">—</div></div>
    </div>
    <div class="stat-card">
      <div class="s-icon blue"><i class="fa-solid fa-gauge-high"></i></div>
      <div><div class="s-label">总配额（千次/日）</div><div class="s-value" id="kQuota">—</div></div>
    </div>
    <div class="stat-card">
      <div class="s-icon orange"><i class="fa-solid fa-chart-pie"></i></div>
      <div><div class="s-label">整体占用率</div><div class="s-value" id="kUsed">—</div></div>
    </div>
    <div class="stat-card">
      <div class="s-icon green"><i class="fa-solid fa-cloud"></i></div>
      <div><div class="s-label">上级云算力占比</div><div class="s-value" id="kCloud">—</div>
        <div class="s-trend text-2">不重复建设底座</div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3>各节点占用情况</h3><span class="sub">环形为占用率，可直接调整配额</span></div>
    <div class="card-body"><div class="grid-3" id="nodes"></div></div>
  </div>

  <div class="card mt-16">
    <div class="card-head">
      <h3>节点配额明细</h3>
      <span class="sub">承载场景来自智能体编排</span>
    </div>
    <div class="table-wrap">
      <table class="data-table" id="tNode" data-static>
        <thead><tr>
          <th>节点名称</th><th>规格</th><th class="num">总配额</th><th class="num">已用</th>
          <th class="num">剩余</th><th>占用率</th><th class="cell-lg">承载场景</th><th>状态</th><th>操作</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

</main>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/ai-data.js"></script>
<script src="../assets/js/ai-flow.js"></script>
<script src="../assets/js/ai-acts.js"></script>
<script src="../assets/js/ai-acts-analyst.js"></script>
<script>
(function () {
  function rate(c) { return c.quota ? Math.round(c.used / c.quota * 1000) / 10 : 0; }

  function paintKpi() {
    var cs = AI.get('computes');
    var tq = cs.reduce(function (s, c) { return s + c.quota; }, 0);
    var tu = cs.reduce(function (s, c) { return s + c.used; }, 0);
    var cloud = cs.filter(function (c) { return c.mc.indexOf('政务云') >= 0; })
      .reduce(function (s, c) { return s + c.quota; }, 0);
    document.getElementById('kNode').textContent = cs.length;
    document.getElementById('kQuota').textContent = AI.num(tq);
    document.getElementById('kUsed').textContent = AI.stat('quotaUsed') + '%';
    document.getElementById('kCloud').textContent = tq ? (Math.round(cloud / tq * 1000) / 10) + '%' : '—';

    document.getElementById('nodes').innerHTML = cs.map(function (c) {
      var r = rate(c);
      var color = r >= 85 ? 'var(--danger)' : (r >= 65 ? 'var(--lv-yellow)' : 'var(--success)');
      return '<div class="grp-card" style="margin-bottom:0">' +
        '<div class="grp-head"><span class="gi"><i class="fa-solid fa-server"></i></span>' +
          AI.esc(c.mc.replace(/（.*?）/g, '')) + '</div>' +
        AI.ring(r, '占用率', c.used + ' / ' + c.quota + ' 千次每日', color) +
        '<div class="mt-16 btn-row">' +
          '<button class="btn btn-sm" onclick="AI.act.allocQuota(\'' + c.id + '\',10)"><i class="fa-solid fa-plus"></i> 增 10</button>' +
          '<button class="btn btn-sm" onclick="AI.act.allocQuota(\'' + c.id + '\',-10)"><i class="fa-solid fa-minus"></i> 减 10</button>' +
          '<button class="btn btn-sm" onclick="AI.act.allocQuota(\'' + c.id + '\',' + (c.quota - c.used + 50) + ')" ' +
            'title="演示超总量拦截"><i class="fa-solid fa-triangle-exclamation"></i> 试超额</button>' +
        '</div></div>';
    }).join('');
  }

  AI.table({
    id: 'tNode', pageSize: 10,
    rows: function () { return AI.get('computes'); },
    cells: function (c) {
      var r = rate(c);
      var lvl = r >= 85 ? 'red' : (r >= 65 ? 'yellow' : 'blue');
      return [
        '<td>' + AI.esc(c.mc) + '</td>',
        '<td>' + AI.esc(c.spec) + '</td>',
        '<td class="num">' + AI.num(c.quota) + '</td>',
        '<td class="num">' + AI.num(c.used) + '</td>',
        '<td class="num">' + AI.num(c.quota - c.used) + '</td>',
        '<td>' + AI.lv(lvl, r + '%') + '</td>',
        '<td class="cell-lg">' + (c.scenes || []).map(function (s) {
          return '<span class="badge ai">' + AI.dict('scene', s) + '</span>';
        }).join(' ') + '</td>',
        '<td>' + (c.online ? '<span class="badge green">在线</span>' : '<span class="badge gray">离线</span>') + '</td>',
        '<td class="col-ops">' +
          '<button class="btn btn-sm" onclick="AI.act.allocQuota(\'' + c.id + '\',10)"><i class="fa-solid fa-plus"></i> 增配额</button> ' +
          '<button class="btn btn-sm" onclick="AI.act.allocQuota(\'' + c.id + '\',-10)"><i class="fa-solid fa-minus"></i> 减配额</button>' +
        '</td>'
      ];
    },
    empty: '暂无算力节点'
  });

  document.addEventListener('DOMContentLoaded', function () {
    AI.on(function () { paintKpi(); AI.repaintAll(); });
  });
})();
</script>
</body>
</html>
