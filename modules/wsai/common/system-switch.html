<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>切换系统 · AI 应用服务平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-role="pt" data-layout="flow">

<main class="app-main">

  <div class="page-head">
    <div class="breadcrumb">
      <i class="fa-solid fa-house bc-home"></i>
      <span class="sep">/</span><span class="cur">切换系统</span>
    </div>
    <div class="page-actions">
      <a class="btn btn-sm" href="overview.html?role=pt"><i class="fa-solid fa-arrow-left"></i> 返回数智大脑</a>
    </div>
  </div>

  <div class="ai-hero">
    <div class="ah-l">
      <div class="ah-title">华信数智房产交易一体化平台</div>
      <div class="ah-sub">20 个子系统按端分组。当前所在：数智大脑 · AI 应用服务平台（wsai）</div>
    </div>
    <div class="ah-r">
      <div class="ah-s"><div class="ah-v">20</div><div class="ah-lb">子系统</div></div>
      <div class="ah-div"></div>
      <div class="ah-s"><div class="ah-v">6</div><div class="ah-lb">所属端</div></div>
    </div>
  </div>

  <div class="ai-tip">
    <i class="fa-solid fa-circle-info"></i>
    <span>本原型当前已建设「统一工作门户（wsbiz）」与「AI 应用服务平台（wsai）」两个板块，可直接进入；
      其余子系统按《菜单梳理v1.0》口径列出，标注为规划中。</span>
  </div>

  <div id="groups"></div>

</main>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/ai-data.js"></script>
<script src="../assets/js/ai-flow.js"></script>
<script src="../assets/js/ai-acts.js"></script>
<script src="../assets/js/ai-acts-analyst.js"></script>
<script>
(function () {
  /* 20 个子系统：[代号, 名称, 一级菜单数, 功能点数, 图标, 状态, 入口地址]
     口径取自《柳州市数智房产交易一体化平台菜单梳理v1.0 · 子系统一览》 */
  var GROUPS = [
    ['业务办理端', 'fa-building-columns', [
      ['wsbiz', '统一工作门户', 7, 66, 'fa-house-laptop', 'done', '../../统一门户/index.html'],
      ['wsswb', '新建商品房网签备案管理系统', 6, 86, 'fa-file-signature', 'plan', ''],
      ['wscwb', '存量房交易网签备案管理系统', 4, 25, 'fa-house-chimney', 'plan', ''],
      ['wszwb', '房屋租赁网签备案管理系统', 5, 21, 'fa-key', 'plan', ''],
      ['wsdwb', '房屋交易备案管理系统', 4, 14, 'fa-file-contract', 'plan', ''],
      ['wschcg', '房屋交易面积信息管理系统', 5, 15, 'fa-ruler-combined', 'plan', ''],
      ['wsdagl', '房屋交易档案管理系统', 3, 10, 'fa-box-archive', 'plan', ''],
      ['wsztxy', '从业主体与信用监管系统', 4, 18, 'fa-user-shield', 'plan', ''],
      ['wsszjjg', '新建商品房预售资金监管系统', 5, 54, 'fa-sack-dollar', 'plan', ''],
      ['wszjjg', '存量房交易资金监管系统', 4, 8, 'fa-money-bill-transfer', 'plan', ''],
      ['wswxzj', '住宅专项维修资金管理系统', 5, 31, 'fa-screwdriver-wrench', 'plan', ''],
      ['wsjcfx', '房地产市场监管监测系统', 6, 80, 'fa-chart-line', 'plan', ''],
      ['wspt', '应用支撑平台', 7, 75, 'fa-gears', 'plan', ''],
      ['wssvc', '应用服务平台', 6, 69, 'fa-plug', 'plan', ''],
      ['wsops', '平台运行与运维保障系统', 5, 34, 'fa-heart-pulse', 'plan', '']
    ]],
    ['数智大脑', 'fa-brain', [
      ['wsai', 'AI 应用服务平台', 4, 39, 'fa-robot', 'here', 'overview.html']
    ]],
    ['数据中心', 'fa-database', [
      ['wsdata', '房产交易数据中心', 4, 69, 'fa-server', 'plan', ''],
      ['wsdjh', '数据共享与接口监控系统', 4, 31, 'fa-share-nodes', 'plan', '']
    ]],
    ['统一服务门户', 'fa-globe', [
      ['wsmh', '统一服务门户', 8, 184, 'fa-earth-asia', 'plan', '']
    ]],
    ['移动端', 'fa-mobile-screen', [
      ['wsyd', '移动端', 10, 145, 'fa-mobile-screen-button', 'plan', '']
    ]]
  ];

  function render() {
    var q = '?role=' + AI.role();
    document.getElementById('groups').innerHTML = GROUPS.map(function (g) {
      return '<div class="card mt-16">' +
        '<div class="card-head"><h3><i class="fa-solid ' + g[1] + ' text-primary"></i> ' + g[0] + '</h3>' +
          '<span class="sub">' + g[2].length + ' 个子系统</span></div>' +
        '<div class="card-body"><div class="grid-4">' +
        g[2].map(function (s) {
          var on = s[6];
          var tag = s[5] === 'here'
            ? '<span class="badge ai">当前所在</span>'
            : (s[5] === 'done' ? '<span class="badge green">已建设</span>' : '<span class="badge gray">规划中</span>');
          var href = on ? (on.indexOf('统一门户') >= 0 ? on : on + q) : 'javascript:void(0)';
          var click = on ? '' : ' onclick="AI.toast(\'「' + s[1] + '」本轮未建设，仅列出口径\',\'error\')"';
          return '<a class="quick-item" href="' + href + '"' + click +
            ' style="align-items:flex-start;text-align:left;gap:8px' + (on ? '' : ';opacity:.72') + '">' +
            '<div class="flex items-center gap-8" style="width:100%">' +
              '<span class="q-ico ' + (s[5] === 'here' ? 'ai' : s[5] === 'done' ? 'blue' : 'gray') + '" ' +
                'style="width:34px;height:34px;border-radius:9px;font-size:15px"><i class="fa-solid ' + s[4] + '"></i></span>' +
              tag +
            '</div>' +
            '<div style="font-size:13.5px;font-weight:600;color:var(--text-1);line-height:1.4">' + s[1] + '</div>' +
            '<div class="text-3 text-sm">' + s[0] + ' · ' + s[2] + ' 个一级菜单 · ' + s[3] + ' 个功能点</div>' +
          '</a>';
        }).join('') +
        '</div></div></div>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    AI.on(function () { render(); });
  });
})();
</script>
</body>
</html>
