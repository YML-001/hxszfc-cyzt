<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台 · AI 应用服务平台</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../../../assets/css/wb.css">
<style>
  /* 页面私有补充样式（wb.css 没有的三块：渐变头条、折线趋势、能力占比条形），前缀 aiov- */
  .aiov-hero {
    position: relative; margin: 0 0 -16px; padding: 26px 30px 24px; color: #fff; overflow: hidden;
    background: linear-gradient(90deg, #2556ba 0%, #2f6fd6 55%, #4a8ff0 100%);
  }
  .aiov-hero::before {
    content: "\f5dc"; font-family: "Font Awesome 6 Free"; font-weight: 900;
    position: absolute; right: 150px; top: 50%; transform: translateY(-50%);
    font-size: 176px; opacity: .14; pointer-events: none;
  }
  .aiov-hero .ah-badge {
    position: absolute; right: 60px; top: 50%; transform: translateY(-50%);
    width: 84px; height: 84px; border-radius: 14px; display: flex; align-items: center; justify-content: center;
    background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .35);
    font-size: 34px; font-weight: 700; letter-spacing: 1px; box-shadow: 0 8px 24px rgba(0, 21, 41, .18);
  }
  .aiov-hero .ah-t { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
  .aiov-hero .ah-s { margin-top: 8px; font-size: 13px; opacity: .88; }
  .aiov-hero .ah-tiles { display: flex; gap: 12px; margin-top: 22px; }
  .aiov-hero .ah-tile {
    min-width: 100px; padding: 12px 14px 10px; border-radius: 8px; cursor: pointer;
    background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .28); transition: background .15s;
  }
  .aiov-hero .ah-tile:hover { background: rgba(255, 255, 255, .28); }
  .aiov-hero .ah-tile i { display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px; background: rgba(255, 255, 255, .92); color: #2556ba; font-size: 15px; }
  .aiov-hero .ah-tile .l { margin-top: 10px; font-size: 12px; opacity: .9; }
  .aiov-hero .ah-tile .v { margin-top: 2px; font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

  /* KPI 副文案着色（红 / 绿），wb.css 只有带箭头的 up/down */
  .aiov .k-s.red { color: #df2026; }
  .aiov .k-s.green { color: #2ea44f; }

  /* 折线趋势 */
  .aiov-line svg { width: 100%; height: 232px; display: block; }
  .aiov-line .grid line { stroke: #edf0f5; stroke-width: 1; }
  .aiov-line .area { fill: url(#aiovGrad); }
  .aiov-line .line { fill: none; stroke: #df2026; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .aiov-line .dot { fill: #fff; stroke: #df2026; stroke-width: 2; }
  .aiov-line .xlbl { fill: #606266; font-size: 11px; text-anchor: middle; }
  .aiov-line .ylbl { fill: #909399; font-size: 11px; text-anchor: end; }
  .aiov-line .vbox { fill: #fff; stroke: #df2026; stroke-width: 1; rx: 2; }
  .aiov-line .val { fill: #df2026; font-size: 10.5px; text-anchor: middle; font-weight: 600; }

  /* 能力占比条形：名称在上左、数值在上右、条在下 */
  .aiov-dist { display: flex; flex-direction: column; gap: 14px; padding: 2px 0; }
  .aiov-dist .d-row .d-top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 6px; }
  .aiov-dist .d-name { font-size: 13px; color: #303133; }
  .aiov-dist .d-val { font-size: 13px; color: #1f2a44; font-weight: 600; font-variant-numeric: tabular-nums; }
  .aiov-dist .d-val small { font-weight: 400; color: #909399; margin-left: 4px; }
  .aiov-dist .d-track { height: 10px; border-radius: 5px; background: #eef1f6; overflow: hidden; }
  .aiov-dist .d-track span { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #2556ba, #5b8def); }
</style>
</head>
<body data-role="pt" data-active="overview" data-layout="flow">
<main class="app-main aiov">
  <div id="wb-root"></div>
</main>

<script src="../assets/js/app.js"></script>
<script src="../../../assets/js/wb.js"></script>
<script>
/* 内容按 Figma「管理后台-数智大脑 · AI 应用服务平台」工作台逐项还原 */
(function () {
  /* 近 12 月数据归集趋势：按天调用次数（设计图 7 个点，y 轴 0~2500） */
  function lineChart(days, vals) {
    var W = 720, H = 232, padL = 62, padR = 24, padT = 22, padB = 30;
    var iw = W - padL - padR, ih = H - padT - padB, top = 2500, step = 500;
    var sx = iw / (vals.length - 1);
    var pts = vals.map(function (v, i) { return { x: padL + i * sx, y: padT + ih - v / top * ih, v: v }; });
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join(' ');
    var base = (padT + ih).toFixed(1);
    var area = 'M' + pts[0].x.toFixed(1) + ' ' + base + pts.map(function (p) { return ' L' + p.x.toFixed(1) + ' ' + p.y.toFixed(1); }).join('') + ' L' + pts[pts.length - 1].x.toFixed(1) + ' ' + base + ' Z';
    var grid = '';
    for (var g = 0; g <= top / step; g++) {
      var gy = (padT + ih - ih / (top / step) * g).toFixed(1);
      grid += '<line x1="' + padL + '" y1="' + gy + '" x2="' + (W - padR) + '" y2="' + gy + '"></line>' +
        '<text class="ylbl" x="' + (padL - 8) + '" y="' + (+gy + 4).toFixed(1) + '">' + (g * step) + '</text>';
    }
    var xl = pts.map(function (p, i) { return '<text class="xlbl" x="' + p.x.toFixed(1) + '" y="' + (H - 8) + '">' + days[i] + '</text>'; }).join('');
    var vl = pts.map(function (p) {
      var s = String(p.v), w = s.length * 7 + 8;
      return '<rect class="vbox" x="' + (p.x - w / 2).toFixed(1) + '" y="' + (p.y - 24).toFixed(1) + '" width="' + w + '" height="15"></rect>' +
        '<text class="val" x="' + p.x.toFixed(1) + '" y="' + (p.y - 13).toFixed(1) + '">' + s + '</text>';
    }).join('');
    var dots = pts.map(function (p) { return '<circle class="dot" cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="3.4"></circle>'; }).join('');
    return '<div class="aiov-line"><svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="aiovGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="rgba(223,32,38,.16)"></stop><stop offset="1" stop-color="rgba(223,32,38,0)"></stop></linearGradient></defs>' +
      '<g class="grid">' + grid + '</g><path class="area" d="' + area + '"></path><path class="line" d="' + line + '"></path>' + dots + xl + vl + '</svg></div>';
  }

  /* 各 AI 能力调用占比 */
  function dist(rows) {
    var max = rows[0][1];
    return '<div class="aiov-dist">' + rows.map(function (r) {
      return '<div class="d-row"><div class="d-top"><span class="d-name">' + r[0] + '</span>' +
        '<span class="d-val">' + r[1].toLocaleString('zh-CN') + '<small>· ' + r[2] + '%</small></span></div>' +
        '<div class="d-track"><span style="width:' + Math.round(r[1] / max * 100) + '%"></span></div></div>';
    }).join('') + '</div>';
  }

  var hero =
    '<div class="aiov-hero">' +
      '<div class="ah-t">数智大脑 · AI 应用服务平台</div>' +
      '<div class="ah-s">本地化大模型底座 + 知识库图谱 + 智能体编排，统一支撑房产交易全业务链的智能应用</div>' +
      '<div class="ah-tiles">' +
        '<div class="ah-tile" onclick="location.href=\'../admin/model-library.html\'"><i class="fa-solid fa-microchip"></i><div class="l">在服模型</div><div class="v">21</div></div>' +
        '<div class="ah-tile" onclick="location.href=\'../admin/agent-orchestrate.html\'"><i class="fa-solid fa-robot"></i><div class="l">上架智能体</div><div class="v">4</div></div>' +
        '<div class="ah-tile" onclick="location.href=\'../admin/api-gateway.html\'"><i class="fa-solid fa-bolt"></i><div class="l">累计调用</div><div class="v">556,000</div></div>' +
      '</div>' +
      '<div class="ah-badge">AI</div>' +
    '</div>';

  /* ai:false —— wsai 的 app.js 已注入自己的 AI 浮钮，避免出现两个 */
  WB.render({ ai: false, blocks: [
    { type: 'card', pad0: true, html: hero },

    { type: 'note', warn: true, text: 'AI 输出治理四条底线：① 输出必带模型、版本、置信度与知识溯源；② AI 只出建议，未人工确认不产生业务效力；③ 风险线索须人工确认后才推送预警督办；④ 智能问数受数据权限与统计口径双约束。本平台所有智能场景均按此执行，界面上不提供绕过入口。' },

    { type: 'kpis', cols: 5, items: [
      { icon: 'fa-user-check', c: 'blue', label: '待人工确认', value: 8, sub: '未确认不产生业务效力', trend: 'red', href: 'ai-audit-log.html' },
      { icon: 'fa-microchip', c: 'orange', label: '在服模型 / 全部', value: '11 / 13', sub: '待调优样本 44 条', href: '../admin/model-library.html' },
      { icon: 'fa-book', c: 'green', label: '已生效知识库', value: 13, sub: '2 份待审核，未生效不参与检索', trend: 'warn', href: '../admin/knowledge-base.html' },
      { icon: 'fa-triangle-exclamation', c: 'purple', label: '待确认预警线索', value: 3, sub: '已确认推送 0 条', href: '../analyst/risk-judge.html' },
      { icon: 'fa-shield-halved', c: 'green', label: '幻觉防控拦截', value: 34, sub: '阈值 75% · 强制溯源', trend: 'green', href: 'ai-audit-log.html' }
    ] },

    { type: 'row', cols: [
      { type: 'card', title: '近 12 月数据归集趋势', sub: '全平台 AI 能力按天调用次数', more: '统一调用接口', moreHref: '../admin/api-gateway.html',
        html: lineChart(['08-01', '08-02', '08-03', '08-04', '08-05', '08-06', '08-07'], [950, 650, 1570, 1600, 1580, 1600, 1100]) },
      { type: 'card', title: '各 AI 能力调用占比', sub: '按应用场景统计调用分布', more: '效果评估', moreHref: '../admin/model-eval.html',
        html: dist([['智能客服问答', 42680, 46], ['智能导办', 18240, 20], ['AI 辅助填报', 12460, 13], ['合同材料智能审核', 9820, 11], ['智能问数', 6340, 7], ['风险智能研判', 2460, 3]]) }
    ] }
  ] });
})();
</script>
</body>
</html>
