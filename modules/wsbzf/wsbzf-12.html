<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公租房配租 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="manager" data-active="wsbzf-12">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 分配配置 <span class="sep">/</span> <span class="cur">公租房配租</span></div>
      <div class="page-title">公租房实物配租</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="BZ.act('已发布配租方案并公示')"><i class="fa-solid fa-bullhorn"></i> 发布方案</button>
      <button class="btn btn-primary" onclick="BZ.open('wsbzf-16.html')"><i class="fa-solid fa-dice"></i> 摇号配租</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-door-open"></i></div><div><div class="s-label">本批可配房源</div><div class="s-value">420 套</div></div></div>
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-users"></i></div><div><div class="s-label">入围轮候</div><div class="s-value">1,286 户</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-bolt"></i></div><div><div class="s-label">即空即配</div><div class="s-value">36 套</div><div class="s-trend text-3">优先分配给顺位靠前家庭</div></div></div>
    <div class="stat-card"><div class="s-icon cyan"><i class="fa-solid fa-handshake-angle"></i></div><div><div class="s-label">本年已配租</div><div class="s-value">3,140 户</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>配租方式：<b>集中批次摇号配租</b> 与 <b>即空即配</b>（房源退租后按轮候顺位即时递补）并行。摇号统一走「公开摇号管理」。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>配租方案</label><select><option>2026 年第 8 批集中配租</option><option>即空即配日常池</option></select></div>
        <div class="filter-item"><label>小区</label><select><option>全部</option><option>安居·XX园一期</option><option>XX城区 A 地块</option></select></div>
        <div class="filter-item"><label>状态</label><select><option>全部</option><option>待摇号</option><option>已摇号待选房</option><option>已配租</option></select></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>配租批次</th><th>房源</th><th>入围户数</th><th>房源套数</th><th>分配方式</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>2026 第 8 批</td><td>安居·XX园一期</td><td>1,286</td><td>420</td><td>公开摇号</td><td><span class="badge orange">待摇号</span></td><td><a class="link" href="wsbzf-16.html">去摇号</a></td></tr>
            <tr><td>即空即配-0805</td><td>XX城区 A 地块</td><td>—</td><td>36</td><td>顺位递补</td><td><span class="badge blue">配租中</span></td><td><a class="link" href="wsbzf-17.html">去选房</a></td></tr>
            <tr><td>2026 第 7 批</td><td>光华人才公寓</td><td>860</td><td>300</td><td>公开摇号</td><td><span class="badge green">已配租</span></td><td><a class="link" href="wsbzf-18.html">看合同</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
