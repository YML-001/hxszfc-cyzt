<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>动态资格复核 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="reviewer" data-active="wsbzf-21">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 使用监管 <span class="sep">/</span> <span class="cur">动态资格复核</span></div>
      <div class="page-title">动态资格复核</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="BZ.act('已发起年度集中复核')"><i class="fa-solid fa-calendar-check"></i> 年度复核</button>
      <button class="btn btn-primary" onclick="BZ.act('已触发数据共享动态核查')"><i class="fa-solid fa-magnifying-glass-chart"></i> 动态核查</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-users-gear"></i></div><div><div class="s-label">在保家庭</div><div class="s-value">2.71 万</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-user-clock"></i></div><div><div class="s-label">本期待复核</div><div class="s-value">214</div></div></div>
    <div class="stat-card"><div class="s-icon red"><i class="fa-solid fa-arrow-up-right-dots"></i></div><div><div class="s-label">收入超标疑点</div><div class="s-value">36</div></div></div>
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-shield-halved"></i></div><div><div class="s-label">账实相符率</div><div class="s-value">98.2%</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>复核结合<b>年度集中复核</b>与<b>数据共享动态核查</b>：定期比对收入、财产、住房、户籍变化；不再符合条件的按规定调整档次或退出，逾期未复核暂停保障。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>复核类型</label><select><option>全部</option><option>年度复核</option><option>动态核查</option></select></div>
        <div class="filter-item"><label>结论</label><select><option>全部</option><option>继续保障</option><option>调整档次</option><option>应退出</option><option>待复核</option></select></div>
        <div class="filter-item"><label>住户</label><input type="text"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>住户</th><th>保障类型</th><th>收入变化</th><th>住房变化</th><th>复核结论</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>黄**</td><td><span class="bz-type gzf">公租房</span></td><td>基本稳定</td><td>无</td><td><span class="badge green">继续保障</span></td><td><span class="badge green">已复核</span></td><td><a class="link" href="javascript:;" data-bz-act="查看复核记录">记录</a></td></tr>
            <tr class="row-bad"><td>陈**</td><td><span class="bz-type gzf">公租房</span></td><td>收入上升超档</td><td>无</td><td><span class="badge orange">调整档次</span></td><td><span class="badge orange">待确认</span></td><td><a class="link" href="wsbzf-13.html">调补贴档</a></td></tr>
            <tr class="row-bad"><td>刘**</td><td><span class="bz-type gzf">公租房</span></td><td>—</td><td>新购商品房</td><td><span class="badge red">应退出</span></td><td><span class="badge red">转退出</span></td><td><a class="link" href="wsbzf-23.html">办退出</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
