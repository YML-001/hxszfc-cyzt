<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租金收缴管理 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="manager" data-active="wsbzf-20">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 使用监管 <span class="sep">/</span> <span class="cur">租金收缴管理</span></div>
      <div class="page-title">租金收缴管理</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="BZ.act('已推送催缴短信')"><i class="fa-solid fa-bell"></i> 批量催缴</button>
      <button class="btn btn-primary" onclick="BZ.act('已生成本月账单')"><i class="fa-solid fa-file-invoice-dollar"></i> 生成账单</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-sack-dollar"></i></div><div><div class="s-label">本月应收</div><div class="s-value">418.6 万</div></div></div>
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-circle-check"></i></div><div><div class="s-label">已收缴</div><div class="s-value">392.1 万</div><div class="s-trend text-3" style="color:var(--success)">收缴率 93.7%</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-triangle-exclamation"></i></div><div><div class="s-label">逾期未缴</div><div class="s-value">26.5 万</div><div class="s-trend text-3">涉及 142 户</div></div></div>
    <div class="stat-card"><div class="s-icon red"><i class="fa-solid fa-user-xmark"></i></div><div><div class="s-label">连欠 3 期</div><div class="s-value">12 户</div><div class="s-trend text-3">转违规处置</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="filter-bar">
        <div class="filter-item"><label>小区</label><select><option>全部</option><option>安居·XX园一期</option><option>光华人才公寓</option></select></div>
        <div class="filter-item"><label>缴费状态</label><select><option>全部</option><option>已缴</option><option>逾期</option><option>连欠3期</option></select></div>
        <div class="filter-item"><label>住户</label><input type="text"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>住户</th><th>房号</th><th>类型</th><th>月租金</th><th>已欠期数</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>黄**</td><td>3#-1-502</td><td><span class="bz-type gzf">公租房</span></td><td>750 元</td><td>0</td><td><span class="badge green">已缴</span></td><td><a class="link" href="javascript:;" data-bz-act="查看缴费记录">记录</a></td></tr>
            <tr class="row-bad"><td>吴**</td><td>6#-2-808</td><td><span class="bz-type gzf">公租房</span></td><td>680 元</td><td>3</td><td><span class="badge red">连欠3期</span></td><td><a class="link" href="wsbzf-22.html">转处置</a></td></tr>
            <tr><td>覃**</td><td>4#-1-201</td><td><span class="bz-type bzf">保租房</span></td><td>1,120 元</td><td>1</td><td><span class="badge orange">逾期</span></td><td><a class="link" href="javascript:;" data-bz-act="发送催缴" data-bz-type="warning">催缴</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
