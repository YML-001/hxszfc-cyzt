<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>交付入住办理 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>
<body data-role="manager" data-active="wsbzf-19">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 合同交付 <span class="sep">/</span> <span class="cur">交付入住办理</span></div>
      <div class="page-title">交付入住办理</div>
    </div>
    <div class="page-actions"><button class="btn btn-primary" onclick="BZ.act('已生成入住交接单')"><i class="fa-solid fa-key"></i> 办理入住</button></div>
  </div>

  <div class="card" style="margin-bottom:12px">
    <div class="card-head"><h3>入住办理流程</h3><span class="sub">签约后一站式交付</span></div>
    <div class="card-body">
      <div class="bz-flow">
        <div class="step done"><div class="t">1. 签约生效</div><div class="d">合同网签完成</div></div>
        <div class="step done"><div class="t">2. 缴纳押金/首付</div><div class="d">进入资金专户</div></div>
        <div class="step active"><div class="t">3. 房屋交接验收</div><div class="d">水电燃气/钥匙/设施清点</div></div>
        <div class="step"><div class="t">4. 门禁/水电开户</div><div class="d">智能门禁人脸录入</div></div>
        <div class="step"><div class="t">5. 入住登记归档</div><div class="d">一户一档更新</div></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="filter-bar">
        <div class="filter-item"><label>小区</label><select><option>全部</option><option>安居·XX园一期</option><option>幸福里配售型</option></select></div>
        <div class="filter-item"><label>状态</label><select><option>全部</option><option>待交接</option><option>交接中</option><option>已入住</option></select></div>
        <div class="filter-item"><label>住户</label><input type="text"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>住户</th><th>房源</th><th>类型</th><th>交接验收</th><th>门禁开户</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>黄**</td><td>安居·XX园 3#-1-502</td><td><span class="bz-type gzf">公租房</span></td><td><span class="badge orange">待验收</span></td><td><span class="badge gray">未开户</span></td><td><span class="badge orange">待交接</span></td><td><a class="link" href="javascript:;" data-bz-act="登记交接验收">交接</a></td></tr>
            <tr><td>李**</td><td>幸福里 2#-3-1103</td><td><span class="bz-type psx">配售型</span></td><td><span class="badge green">已验收</span></td><td><span class="badge green">已开户</span></td><td><span class="badge green">已入住</span></td><td><a class="link" href="wsbzf-08-detail.html">看档案</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>

</html>
