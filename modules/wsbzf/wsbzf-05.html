<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运营单位管理 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="manager" data-active="wsbzf-05">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 规划筹集 <span class="sep">/</span> <span class="cur">运营单位管理</span></div>
      <div class="page-title">运营单位管理</div>
    </div>
    <div class="page-actions"><button class="btn btn-primary" data-open-drawer="opDrawer"><i class="fa-solid fa-plus"></i> 登记运营单位</button></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>政府按规定选定<b>运营单位（专门项目公司）</b>承担配售型/保租房的建设、收购、配售、运营与封闭管理，实行「政府—企业—租户/购房人」三方联动，绩效考核挂钩运营补贴。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>范围</label><select><option>全部（市县汇总）</option><option>XXXX市本级</option><option>XX城区</option><option>XX县</option></select></div>
        <div class="filter-item"><label>承担业务</label><select><option>全部</option><option>配售型</option><option>保障性租赁住房</option><option>公租房运营</option></select></div>
        <div class="filter-item"><label>状态</label><select><option>全部</option><option>正常</option><option>考核整改</option><option>已退出</option></select></div>
        <div class="filter-item"><label>关键词</label><input type="text" placeholder="单位名称"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>运营单位</th><th>承担业务</th><th>受托项目</th><th>在管房源</th><th>绩效评级</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>XXXX市安居保障运营有限公司</td><td><span class="bz-type psx">配售型</span> <span class="bz-type gzf">公租房</span></td><td>12</td><td>9,860 套</td><td><span class="badge green">A</span></td><td><span class="badge green">正常</span></td><td><a class="link" href="javascript:;" data-bz-act="查看运营协议与绩效">详情</a></td></tr>
            <tr><td>XX城投人才安居发展公司</td><td><span class="bz-type bzf">保租房</span></td><td>6</td><td>4,120 套</td><td><span class="badge green">A</span></td><td><span class="badge green">正常</span></td><td><a class="link" href="javascript:;" data-bz-act="查看运营协议与绩效">详情</a></td></tr>
            <tr><td>县保障房建设投资有限公司</td><td><span class="bz-type gzf">公租房</span></td><td>4</td><td>2,340 套</td><td><span class="badge orange">B</span></td><td><span class="badge orange">考核整改</span></td><td><a class="link" href="javascript:;" data-bz-act="下达整改通知">整改</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="drawer-mask"></div>
<div class="drawer" id="opDrawer">
  <div class="drawer-head"><h3>登记运营单位</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="filter-bar" style="flex-wrap:wrap;border:none;padding:0">
      <div class="filter-item" style="flex:1 1 100%"><label>单位名称</label><input type="text"></div>
      <div class="filter-item"><label>统一社会信用代码</label><input type="text"></div>
      <div class="filter-item"><label>选定方式</label><select><option>政府指定</option><option>公开招标</option><option>竞争性磋商</option></select></div>
      <div class="filter-item" style="flex:1 1 100%"><label>承担业务</label><select multiple size="3"><option>配售型建设配售</option><option>保障性租赁住房运营</option><option>公租房运营</option><option>存量收购</option></select></div>
    </div>
  </div>
  <div class="drawer-foot"><button class="btn" data-close-drawer>取消</button><button class="btn btn-primary" onclick="PMS.closeDrawer();BZ.toast('运营单位已登记','success')">保存</button></div>
</div>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
