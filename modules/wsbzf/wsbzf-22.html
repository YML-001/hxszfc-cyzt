<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>违规查处 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="reviewer" data-active="wsbzf-22">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 使用监管 <span class="sep">/</span> <span class="cur">违规查处</span></div>
      <div class="page-title">违规使用查处</div>
    </div>
    <div class="page-actions"><button class="btn btn-primary" data-open-drawer="laDrawer"><i class="fa-solid fa-gavel"></i> 立案查处</button></div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-magnifying-glass"></i></div><div><div class="s-label">线索待核</div><div class="s-value">18</div></div></div>
    <div class="stat-card"><div class="s-icon red"><i class="fa-solid fa-house-lock"></i></div><div><div class="s-label">转租转借</div><div class="s-value">6</div></div></div>
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-door-closed"></i></div><div><div class="s-label">长期空置</div><div class="s-value">9</div></div></div>
    <div class="stat-card"><div class="s-icon cyan"><i class="fa-solid fa-user-slash"></i></div><div><div class="s-label">骗保线索</div><div class="s-value">4</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-warning"><i class="fa-solid fa-triangle-exclamation"></i><div>违规情形含<b>转租转借、擅自改变用途、长期空置、骗取保障、拒不腾退</b>等；查实后责令退出并记入信用，骗保 5 年内不再受理申请。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>违规类型</label><select><option>全部</option><option>转租转借</option><option>长期空置</option><option>改变用途</option><option>骗取保障</option></select></div>
        <div class="filter-item"><label>处置状态</label><select><option>全部</option><option>核查中</option><option>已立案</option><option>责令退出</option><option>已办结</option></select></div>
        <div class="filter-item"><label>住户/房号</label><input type="text"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>案件编号</th><th>住户</th><th>房号</th><th>违规类型</th><th>线索来源</th><th>处置状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr class="row-bad"><td>WG-2026-0033</td><td>吴**</td><td>6#-2-808</td><td>转租转借</td><td>水电零消耗+门禁无记录</td><td><span class="badge red">已立案</span></td><td><a class="link" href="javascript:;" data-bz-act="下达责令退出通知" data-bz-type="warning">责令退出</a></td></tr>
            <tr><td>WG-2026-0031</td><td>周**</td><td>3#-1-1102</td><td>长期空置</td><td>动态核查</td><td><span class="badge orange">核查中</span></td><td><a class="link" href="javascript:;" data-bz-act="登记现场核查">核查</a></td></tr>
            <tr class="row-bad"><td>WG-2026-0028</td><td>刘**</td><td>—</td><td>骗取保障</td><td>七部门核对比中</td><td><span class="badge red">责令退出</span></td><td><a class="link" href="wsbzf-28.html">记入信用</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="drawer-mask"></div>
<div class="drawer" id="laDrawer">
  <div class="drawer-head"><h3>立案查处</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="filter-bar" style="flex-wrap:wrap;border:none;padding:0">
      <div class="filter-item"><label>被查住户</label><input type="text"></div>
      <div class="filter-item"><label>房号</label><input type="text"></div>
      <div class="filter-item"><label>违规类型</label><select><option>转租转借</option><option>长期空置</option><option>改变用途</option><option>骗取保障</option><option>拒不腾退</option></select></div>
      <div class="filter-item"><label>线索来源</label><select><option>动态核查</option><option>群众举报</option><option>物业上报</option><option>数据比对</option></select></div>
      <div class="filter-item" style="flex:1 1 100%"><label>违规事实</label><textarea rows="3" style="width:100%"></textarea></div>
    </div>
  </div>
  <div class="drawer-foot"><button class="btn" data-close-drawer>取消</button><button class="btn btn-primary" onclick="PMS.closeDrawer();BZ.toast('已立案，进入调查处置','success')">立案</button></div>
</div>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
