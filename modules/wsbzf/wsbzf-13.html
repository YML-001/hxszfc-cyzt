<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>租赁补贴发放 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="manager" data-active="wsbzf-13">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 分配配置 <span class="sep">/</span> <span class="cur">租赁补贴发放</span></div>
      <div class="page-title">公租房租赁补贴发放</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="BZ.act('已导出发放明细')"><i class="fa-solid fa-download"></i> 导出</button>
      <button class="btn btn-primary" onclick="BZ.act('已生成本月发放批次，待财政复核')"><i class="fa-solid fa-money-bill-transfer"></i> 生成发放批次</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-hand-holding-dollar"></i></div><div><div class="s-label">在补家庭</div><div class="s-value">5,610 户</div></div></div>
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-coins"></i></div><div><div class="s-label">本月发放</div><div class="s-value">386.2 万</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-sliders"></i></div><div><div class="s-label">待动态调整</div><div class="s-value">142 户</div><div class="s-trend text-3">收入变化触发调档</div></div></div>
    <div class="stat-card"><div class="s-icon cyan"><i class="fa-solid fa-inbox"></i></div><div><div class="s-label">常态化受理</div><div class="s-value">28 件</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>补贴<b>分档发放</b>：按家庭收入与住房困难程度确定档次与面积标准，收入变化触发动态调整；实物配租与货币补贴不重复享受。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>范围</label><select><option>全部（市县汇总）</option><option>XXXX市本级</option><option>XX城区</option><option>XX县</option></select></div>
        <div class="filter-item"><label>补贴档次</label><select><option>全部</option><option>一档</option><option>二档</option><option>三档</option></select></div>
        <div class="filter-item"><label>状态</label><select><option>全部</option><option>正常发放</option><option>待调整</option><option>暂停</option></select></div>
        <div class="filter-item"><label>家庭</label><input type="text" placeholder="姓名/证件号"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>家庭</th><th>档次</th><th>补贴面积</th><th>月补贴额</th><th>发放账户</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>梁××（3 人）</td><td><span class="badge blue">一档</span></td><td>45㎡</td><td>630 元</td><td>尾号 6621</td><td><span class="badge green">正常</span></td><td><a class="link" href="javascript:;" data-bz-act="查看发放记录">记录</a></td></tr>
            <tr><td>韦××（2 人）</td><td><span class="badge blue">二档</span></td><td>36㎡</td><td>432 元</td><td>尾号 3088</td><td><span class="badge green">正常</span></td><td><a class="link" href="javascript:;" data-bz-act="查看发放记录">记录</a></td></tr>
            <tr class="row-bad"><td>陈××（4 人）</td><td><span class="badge orange">待调整</span></td><td>54㎡</td><td>—</td><td>尾号 7712</td><td><span class="badge orange">收入超档</span></td><td><a class="link" href="javascript:;" data-bz-act="核定新档次" data-bz-type="warning">调档</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
