<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>安居工程统计 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="leader" data-active="wsbzf-30">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 监督统计 <span class="sep">/</span> <span class="cur">安居工程统计</span></div>
      <div class="page-title">安居工程统计</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="BZ.act('已上报自治区统计报表')"><i class="fa-solid fa-cloud-arrow-up"></i> 上报省级</button>
      <button class="btn btn-primary" onclick="BZ.act('已导出统计报表')"><i class="fa-solid fa-download"></i> 导出报表</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-list-check"></i></div><div><div class="s-label">年度任务完成率</div><div class="s-value">86.9%</div></div></div>
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-house-chimney-window"></i></div><div><div class="s-label">累计保障</div><div class="s-value">6.4 万户</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-hand-holding-heart"></i></div><div><div class="s-label">保障覆盖率</div><div class="s-value">96.3%</div><div class="s-trend text-3">户籍住房困难家庭</div></div></div>
    <div class="stat-card"><div class="s-icon cyan"><i class="fa-solid fa-star"></i></div><div><div class="s-label">绩效自评</div><div class="s-value">优秀</div></div></div>
  </div>

  <div class="grid-2">
    <div class="card"><div class="card-head"><h3>市县完成情况对比</h3><span class="sub">任务完成率</span></div><div class="card-body">
      <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>XXXX市本级</span><b>89.2%</b></div><div class="progress green"><span style="width:89.2%"></span></div></div>
      <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>XX城区</span><b>84.6%</b></div><div class="progress"><span style="width:84.6%"></span></div></div>
      <div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>XX县</span><b>81.0%</b></div><div class="progress orange"><span style="width:81%"></span></div></div>
      <div><div style="display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px"><span>XX新区</span><b>92.4%</b></div><div class="progress green"><span style="width:92.4%"></span></div></div>
    </div></div>

    <div class="card"><div class="card-head"><h3>分类型统计</h3></div><div class="card-body">
      <table class="data-table compact">
        <thead><tr><th>保障类型</th><th>年度任务</th><th>已完成</th><th>完成率</th><th>在保户数</th></tr></thead>
        <tbody>
          <tr><td><span class="bz-type gzf">公租房</span></td><td>4,200 套</td><td>3,760</td><td>89.5%</td><td>1.86 万</td></tr>
          <tr><td><span class="bz-type bzf">保障性租赁住房</span></td><td>3,000 套</td><td>2,520</td><td>84.0%</td><td>0.62 万</td></tr>
          <tr><td><span class="bz-type psx">配售型</span></td><td>1,800 套</td><td>1,540</td><td>85.6%</td><td>0.23 万</td></tr>
          <tr><td><span class="bz-type btf">租赁补贴</span></td><td>6,000 户</td><td>5,610</td><td>93.5%</td><td>5,610 户</td></tr>
        </tbody>
      </table>
    </div></div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
