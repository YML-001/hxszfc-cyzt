<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小区资产运营 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="ops" data-active="wsbzf-26">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 小区运营 <span class="sep">/</span> <span class="cur">小区资产运营</span></div>
      <div class="page-title">小区资产运营</div>
    </div>
    <div class="page-actions"><button class="btn btn-primary" onclick="BZ.act('已下达设施维护工单')"><i class="fa-solid fa-screwdriver-wrench"></i> 派维护工单</button></div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-city"></i></div><div><div class="s-label">在管小区</div><div class="s-value">28 个</div></div></div>
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-warehouse"></i></div><div><div class="s-label">资产设施</div><div class="s-value">1.2 万项</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-microchip"></i></div><div><div class="s-label">智能化改造</div><div class="s-value">18 小区</div><div class="s-trend text-3">门禁/监控/消防联网</div></div></div>
    <div class="stat-card"><div class="s-icon red"><i class="fa-solid fa-fire-extinguisher"></i></div><div><div class="s-label">消防隐患待整改</div><div class="s-value">7</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>覆盖小区<b>资产台账、设施维护、智能化改造与消防安全</b>；推进老旧保障小区智能化提升，落实消防安全责任。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>小区</label><select><option>全部</option><option>安居·XX园一期</option><option>光华人才公寓</option><option>XX城区 A 地块</option></select></div>
        <div class="filter-item"><label>事项</label><select><option>全部</option><option>设施维护</option><option>智能化改造</option><option>消防安全</option><option>资产盘点</option></select></div>
        <div class="filter-item"><label>状态</label><select><option>全部</option><option>待处理</option><option>处理中</option><option>已完成</option></select></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>工单号</th><th>小区</th><th>事项</th><th>内容</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr class="row-bad"><td>GD-2026-0210</td><td>光华人才公寓</td><td>消防安全</td><td>6# 楼消防栓压力不足</td><td><span class="badge red">待整改</span></td><td><a class="link" href="javascript:;" data-bz-act="派单整改" data-bz-type="warning">整改</a></td></tr>
            <tr><td>GD-2026-0208</td><td>安居·XX园一期</td><td>智能化改造</td><td>人脸门禁加装</td><td><span class="badge orange">处理中</span></td><td><a class="link" href="javascript:;" data-bz-act="查看进度">进度</a></td></tr>
            <tr><td>GD-2026-0201</td><td>XX城区 A 地块</td><td>设施维护</td><td>电梯年检维保</td><td><span class="badge green">已完成</span></td><td><a class="link" href="javascript:;" data-bz-act="查看记录">记录</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>
<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
