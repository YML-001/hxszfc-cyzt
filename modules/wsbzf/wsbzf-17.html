<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>选房活动管理 · 保障性住房综合管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wsbzf.css">
</head>
<body data-role="manager" data-active="wsbzf-17">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb"><i class="fa-solid fa-house bc-home"></i> 保障性住房综合管理系统 <span class="sep">/</span> 分配配置 <span class="sep">/</span> <span class="cur">选房活动管理</span></div>
      <div class="page-title">选房活动管理</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="BZ.act('已发布本期选房房源')"><i class="fa-solid fa-house-flag"></i> 发布房源</button>
      <button class="btn btn-primary" data-open-drawer="hdDrawer"><i class="fa-solid fa-plus"></i> 新建选房活动</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-calendar-week"></i></div><div><div class="s-label">本周选房场次</div><div class="s-value">3</div><div class="s-trend text-3">周周选房常态化</div></div></div>
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-house"></i></div><div><div class="s-label">发布房源</div><div class="s-value">420 套</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-list-check"></i></div><div><div class="s-label">入围待选</div><div class="s-value">420 户</div></div></div>
    <div class="stat-card"><div class="s-icon cyan"><i class="fa-solid fa-right-left"></i></div><div><div class="s-label">房源互换申请</div><div class="s-value">12</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>选房按<b>摇号选房顺序号</b>叫号，逐户在线选房；支持<b>周周选房</b>、入围名单公布、排序查询与配租/配售后<b>房源互换</b>。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>活动</label><select><option>2026 第 7 批公租房选房</option><option>幸福里配售型选房</option></select></div>
        <div class="filter-item"><label>状态</label><select><option>全部</option><option>待选房</option><option>选房中</option><option>已选定</option><option>放弃</option></select></div>
        <div class="filter-item"><label>顺序号</label><input type="text" placeholder="输入顺序号/姓名"></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>顺序号</th><th>入围人</th><th>类型</th><th>叫号时间</th><th>选定房号</th><th>状态</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>1</td><td>黄**</td><td><span class="bz-type gzf">公租房</span></td><td>今日 09:30</td><td>3#-1-502</td><td><span class="badge green">已选定</span></td><td><a class="link" href="wsbzf-18.html">去签约</a></td></tr>
            <tr class="row-bad"><td>2</td><td>周**</td><td><span class="bz-type gzf">公租房</span></td><td>今日 09:45（叫号中）</td><td>—</td><td><span class="badge orange">选房中</span></td><td><a class="link" href="wsbzf-07.html">看房态</a></td></tr>
            <tr><td>3</td><td>覃**</td><td><span class="bz-type gzf">公租房</span></td><td>—</td><td>—</td><td><span class="badge gray">待叫号</span></td><td><a class="link" href="javascript:;" data-bz-act="标记放弃/顺延">顺延</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<div class="drawer-mask"></div>
<div class="drawer" id="hdDrawer">
  <div class="drawer-head"><h3>新建选房活动</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="filter-bar" style="flex-wrap:wrap;border:none;padding:0">
      <div class="filter-item" style="flex:1 1 100%"><label>活动名称</label><input type="text" placeholder="如 2026 第 8 批公租房选房"></div>
      <div class="filter-item"><label>关联批次</label><select><option>2026 第 8 批（已摇号）</option></select></div>
      <div class="filter-item"><label>选房方式</label><select><option>按摇号顺序号叫号</option><option>集中现场选房</option><option>线上自主选房</option></select></div>
      <div class="filter-item"><label>选房时间</label><input type="datetime-local"></div>
      <div class="filter-item"><label>每户时限(分)</label><input type="number" value="10"></div>
    </div>
  </div>
  <div class="drawer-foot"><button class="btn" data-close-drawer>取消</button><button class="btn btn-primary" onclick="PMS.closeDrawer();BZ.toast('选房活动已创建并通知入围家庭','success')">创建</button></div>
</div>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wsbzf.js"></script>
</body>
</html>
