<body data-role="manager" data-active="wsbzf-25">
<main class="app-main">

    <div class="page-actions"><button class="btn btn-primary" onclick="BZ.act('已生成资金绩效自评报告')"><i class="fa-solid fa-chart-line"></i> 资金绩效</button></div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-landmark"></i></div><div><div class="s-label">上级补助资金</div><div class="s-value">6.2 亿</div><div class="s-trend text-3">中央+自治区</div></div></div>

    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-percent"></i></div><div><div class="s-label">资金执行率</div><div class="s-value">88.4%</div></div></div>
    <div class="stat-card"><div class="s-icon cyan"><i class="fa-solid fa-star"></i></div><div><div class="s-label">绩效自评</div><div class="s-value">优</div></div></div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>归集<b>上级补助资金、租赁补贴资金</b>的下达、分配、拨付与绩效；补助资金专款专用，与安居任务完成挂钩。</div></div>
      <div class="filter-bar">
        <div class="filter-item"><label>资金来源</label><select><option>全部</option><option>中央补助</option><option>自治区补助</option><option>本级配套</option></select></div>
        <div class="filter-item"><label>用途</label><select><option>全部</option><option>新建/收购</option><option>租赁补贴</option><option>运营维护</option></select></div>
        <div class="filter-item"><label>年度</label><select><option>2026</option><option>2025</option></select></div>
        <button class="btn btn-primary"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
      </div>
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>资金项目</th><th>来源</th><th>下达</th><th>已拨付</th><th>执行率</th><th>绩效</th><th>操作</th></tr></thead>
          <tbody>
            <tr><td>保障房建设/收购补助</td><td>中央补助</td><td>3.2 亿</td><td>2.9 亿</td><td><div class="progress green"><span style="width:90%"></span></div></td><td><span class="badge green">优</span></td><td><a class="link" href="javascript:;" data-bz-act="查看拨付明细">明细</a></td></tr>

            <tr><td>小区运营维护补助</td><td>本级配套</td><td>1,800 万</td><td>1,240 万</td><td><div class="progress orange"><span style="width:69%"></span></div></td><td><span class="badge orange">待提升</span></td><td><a class="link" href="wsbzf-26.html">看运营</a></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>
