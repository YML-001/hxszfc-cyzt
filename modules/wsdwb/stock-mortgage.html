<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>存量房抵押合同备案 · 房屋交易备案管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<style>
  /* 本页特有：权属核验左右对照面板 */
  .cmp-head { display: grid; grid-template-columns: 150px 1fr 1fr 108px; gap: 0; font-size: 12.5px; font-weight: 700; color: var(--text-2); }
  .cmp-head > div { padding: 10px 14px; background: #f0f5ff; border-bottom: 1px solid var(--border); }
  .cmp-row { display: grid; grid-template-columns: 150px 1fr 1fr 108px; gap: 0; font-size: 13.5px; }
  .cmp-row > div { padding: 11px 14px; border-bottom: 1px solid #eef0f6; display: flex; align-items: center; min-width: 0; word-break: break-all; }
  .cmp-row .ck { background: #f7f9fc; color: var(--text-2); font-size: 13px; }
  .cmp-row .cv { font-weight: 600; }
  .cmp-row .cs { justify-content: center; font-size: 12.5px; }
  .cmp-row.bad > div { background: var(--danger-light); }
  .cmp-row.bad .cv { color: #b91c1c; }
  .cmp-wrap { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  @media (max-width: 900px) {
    .cmp-head { display: none; }
    .cmp-row { grid-template-columns: 120px 1fr; }
    .cmp-row .cs { grid-column: span 2; justify-content: flex-start; }
  }
  .rk { display: inline-block; min-width: 52px; text-align: center; padding: 2px 8px; border-radius: 5px; font-size: 12px; font-weight: 600; color: #fff; }
  .rk.r1 { background: var(--primary); } .rk.r2 { background: var(--warning); }
  .ack {
    display: flex; align-items: flex-start; gap: 9px; background: var(--primary-light); border: 1px solid var(--primary-soft);
    border-radius: var(--radius); padding: 12px 15px; font-size: 13.5px; margin-top: 12px;
  }
  .ack input { margin-top: 3px; }
</style>
</head>
<body data-role="reviewer" data-active="wsdwb-07">
<main class="app-main">

  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb">
        <i class="fa-solid fa-house bc-home"></i> 房屋交易备案管理系统
        <span class="sep">/</span> 抵押合同备案
        <span class="sep">/</span> <span class="cur">存量房抵押合同备案</span>
      </div>
      <div class="page-title">存量房抵押合同备案</div>
    </div>
    <div class="page-actions">
      <button type="button" class="btn" onclick="switchCase()"><i class="fa-solid fa-repeat"></i> 切换核验示例</button>
      <button type="button" class="btn" onclick="location.href='mortgage-list.html'"><i class="fa-solid fa-arrow-left"></i> 返回台账</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-magnifying-glass"></i> 抵押物查询</h3><span class="sub">凭产权证号或不动产单元号调取登记信息</span></div>
    <div class="card-body">
      <div class="form-grid form-align">
        <div class="form-item">
          <label>查询方式<span class="req">*</span></label>
          <select><option>不动产单元号</option><option>产权证号</option><option>房屋坐落</option></select>
        </div>
        <div class="form-item" style="grid-column:span 2">
          <label>查询内容<span class="req">*</span></label>
          <div class="flex gap-8">
            <input type="text" style="flex:1" value="450202001005GB00123F00020017">
            <button type="button" class="btn btn-primary" onclick="PMS.toast('已调取不动产登记核验结果，用时 286 ms')"><i class="fa-solid fa-magnifying-glass"></i> 查询并核验</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head">
      <h3><i class="fa-solid fa-scale-balanced"></i> 权属核验对比</h3>
      <span class="sub" id="cmpSub">申报信息与不动产登记核验结果逐项比对</span>
    </div>
    <div class="card-body">
      <div id="cmpAlert"></div>
      <div class="cmp-wrap" style="margin-top:12px">
        <div class="cmp-head">
          <div>核验项</div><div>申报信息</div><div>不动产登记核验结果</div><div style="text-align:center">比对结论</div>
        </div>
        <div id="cmpBody"></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-layer-group"></i> 在先抵押情况</h3><span class="sub">决定本次抵押顺位</span></div>
    <div class="card-body">
      <table class="data-table compact" data-static>
        <thead><tr><th>备案编号</th><th>抵押权人</th><th>被担保债权金额</th><th>抵押顺位</th><th>备案日期</th><th>债务履行期限止</th><th>状态</th></tr></thead>
        <tbody>
          <tr>
            <td class="nowrap fw-600">DYBA450200202300426</td>
            <td class="nowrap">中国银行柳州分行</td>
            <td class="num nowrap">320,000.00</td>
            <td class="nowrap"><span class="rk r1">第 1 顺位</span></td>
            <td class="nowrap">2023-03-20</td>
            <td class="nowrap">2053-03-19</td>
            <td class="nowrap"><span class="badge green">有效</span></td>
          </tr>
        </tbody>
      </table>
      <div class="ack">
        <input type="checkbox" id="ackRk" onchange="checkSubmit()">
        <label for="ackRk">该房屋当前存在 <b>1 笔有效抵押</b>，本次备案为 <b class="text-warning">第 2 顺位</b> 抵押。已向抵押权人告知在先抵押情况，抵押权人确认知悉并同意办理。</label>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h3><i class="fa-solid fa-file-contract"></i> 抵押合同要素</h3></div>
    <div class="card-body">
      <div class="form-grid form-align">
        <div class="form-item"><label>抵押合同编号<span class="req">*</span></label><input type="text" value="DY450200202600186"></div>
        <div class="form-item"><label>抵押方式<span class="req">*</span></label><select><option>0 单独抵押</option><option>1 组合抵押</option><option>2 最高额抵押</option></select></div>
        <div class="form-item"><label>抵押权人<span class="req">*</span></label><select><option>中国建设银行柳州分行</option><option>中国银行柳州分行</option><option>中国工商银行柳州分行</option><option>柳州银行</option></select></div>
        <div class="form-item"><label>被担保债权金额（元）<span class="req">*</span></label><input type="text" value="486,000.00"></div>
        <div class="form-item"><label>债务类型<span class="req">*</span></label><select><option>0 一般债务</option><option>1 最高额债务</option></select></div>
        <div class="form-item"><label>债务履行期限起<span class="req">*</span></label><input type="date" value="2026-08-01"></div>
        <div class="form-item"><label>债务履行期限止<span class="req">*</span></label><input type="date" value="2046-07-20"></div>
        <div class="form-item"><label>抵押顺位<span class="req">*</span></label><input type="text" value="第 2 顺位" readonly></div>
        <div class="form-item"><label>评估价值（元）</label><input type="text" value="1,486,000.00"></div>
        <div class="form-item"><label>抵押率</label><input type="text" value="54.4%（含在先抵押）" readonly></div>
        <div class="form-item"><label>合同签订日期<span class="req">*</span></label><input type="date" value="2026-07-30"></div>
        <div class="form-item"><label>是否带押过户</label><select><option>否</option><option selected>是（关联 CFBA450200202600512）</option></select></div>
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <div class="btn-row justify-between">
        <span class="text-3 text-sm" id="tipTxt">
          <i class="fa-solid fa-circle-info"></i> 核验一致且已确认在先抵押后方可提交备案。
        </span>
        <span class="flex gap-8">
          <button type="button" class="btn" onclick="PMS.toast('备案草稿已保存','success')"><i class="fa-regular fa-floppy-disk"></i> 保存草稿</button>
          <button type="button" class="btn btn-primary" id="btnSubmit" disabled onclick="doSubmit()"><i class="fa-solid fa-paper-plane"></i> 提交备案</button>
        </span>
      </div>
    </div>
  </div>

</main>
<script src="../../assets/js/app.js"></script>
<script>
/* 两套演示：一致（可提交）与存在不符项（拦截） */
var CASES = {
  ok: {
    ok: true,
    sub: '彰泰滨江学府 12-2-1802 · 核验一致',
    rows: [
      ['产权人姓名', '陈**', '陈**', 1],
      ['证件号码', '450***********0028', '450***********0028', 1],
      ['产权证号', '桂(2023)柳州市不动产权第 0086421 号', '桂(2023)柳州市不动产权第 0086421 号', 1],
      ['不动产单元号', '450202001005GB00123F00020017', '450202001005GB00123F00020017', 1],
      ['房屋坐落', '柳州市城中区彰泰滨江学府 12 栋 2 单元 1802', '柳州市城中区彰泰滨江学府 12 栋 2 单元 1802', 1],
      ['建筑面积', '118.65 ㎡', '118.65 ㎡', 1],
      ['房屋用途', '成套住宅', '成套住宅', 1],
      ['共有情况', '共同共有（陈**、李**）', '共同共有（陈**、李**）', 1]
    ]
  },
  bad: {
    ok: false,
    sub: '荣和公园大道 12-1-703 · 存在 2 项不符',
    rows: [
      ['产权人姓名', '覃**', '覃**', 1],
      ['证件号码', '450***********3182', '450***********3182', 1],
      ['产权证号', '桂(2021)柳州市不动产权第 0052841 号', '桂(2021)柳州市不动产权第 0052846 号', 0],
      ['不动产单元号', '450202001005GB00266F00010012', '450202001005GB00266F00010012', 1],
      ['房屋坐落', '柳州市城中区荣和公园大道 12 栋 1 单元 703', '柳州市城中区荣和公园大道 12 栋 1 单元 703', 1],
      ['建筑面积', '96.80 ㎡', '89.60 ㎡', 0],
      ['房屋用途', '成套住宅', '成套住宅', 1],
      ['共有情况', '单独所有', '单独所有', 1]
    ]
  }
};
var cur = 'ok';

function renderCmp() {
  var d = CASES[cur];
  document.getElementById('cmpSub').textContent = d.sub;
  document.getElementById('cmpAlert').innerHTML = d.ok
    ? '<div class="alert alert-success" style="margin-bottom:0"><i class="fa-solid fa-circle-check"></i><div><b>权属核验通过</b>，8 项要素与不动产登记信息完全一致，可继续办理抵押备案。核验时间 2026-08-01 09:06，数据来源 XXXX市不动产登记中心。</div></div>'
    : '<div class="alert alert-danger" style="margin-bottom:0"><i class="fa-solid fa-circle-xmark"></i><div><b>权属核验不通过</b>，存在 2 项与登记信息不符（产权证号、建筑面积），提交已被阻止。请核对申报材料后重新录入，或联系不动产登记机构核实。</div></div>';
  document.getElementById('cmpBody').innerHTML = d.rows.map(function (r) {
    return '<div class="cmp-row' + (r[3] ? '' : ' bad') + '">' +
      '<div class="ck">' + r[0] + '</div>' +
      '<div class="cv">' + r[1] + '</div>' +
      '<div class="cv">' + r[2] + '</div>' +
      '<div class="cs">' + (r[3]
        ? '<span class="text-success"><i class="fa-solid fa-circle-check"></i> 一致</span>'
        : '<span class="text-danger fw-700"><i class="fa-solid fa-circle-xmark"></i> 与登记信息不符</span>') + '</div>' +
      '</div>';
  }).join('');
  checkSubmit();
}

function checkSubmit() {
  var d = CASES[cur];
  var acked = document.getElementById('ackRk').checked;
  var btn = document.getElementById('btnSubmit');
  btn.disabled = !(d.ok && acked);
  document.getElementById('tipTxt').innerHTML = !d.ok
    ? '<i class="fa-solid fa-circle-xmark text-danger"></i> 权属核验存在不符项，无法提交备案。'
    : (acked
      ? '<i class="fa-solid fa-circle-check text-success"></i> 核验一致，已确认在先抵押，可提交备案。'
      : '<i class="fa-solid fa-circle-info"></i> 请先勾选确认已知悉在先抵押与本次抵押顺位。');
}

function switchCase() {
  cur = cur === 'ok' ? 'bad' : 'ok';
  renderCmp();
  PMS.toast('已切换至' + (cur === 'ok' ? '核验一致' : '核验不通过') + '示例');
}

function doSubmit() {
  PMS.confirm({
    title: '确认提交抵押备案',
    message: '本次为第 2 顺位抵押，提交后进入备案审核，是否确认？',
    detail: '抵押权人 中国建设银行柳州分行 · 被担保债权金额 486,000.00 元 · 关联带押过户 CFBA450200202600512。',
    type: 'info',
    okText: '确认提交',
    onOk: function () { PMS.toast('已提交备案，备案编号 DYBA450200202600186', 'success'); }
  });
}

renderCmp();
</script>
</body>
</html>
