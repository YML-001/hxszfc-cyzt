<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台 · 新建商品房预售资金监管系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../../assets/css/app.css">
<link rel="stylesheet" href="../../../assets/css/wb.css">
<style>
  /* 问候卡右上角的两个快捷按钮（预警中心 / 去审批用款） */
  .zj-ops { display: flex; gap: 8px; }
  .zj-ops a { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 14px; border-radius: 4px; font-size: 13px; text-decoration: none; white-space: nowrap; }
  .zj-ops a.ghost { border: 1px solid rgba(255, 255, 255, .7); background: rgba(255, 255, 255, .12); color: #fff; }
  .zj-ops a.ghost:hover { background: rgba(255, 255, 255, .24); }
  .zj-ops a.solid { background: #fff; color: #2556ba; font-weight: 600; }
  /* 待办行右侧「去处理」按钮 */
  .zj-go { display: inline-flex; align-items: center; gap: 4px; flex-shrink: 0; padding: 3px 10px; border-radius: 3px; background: #2556ba; color: #fff; font-size: 12px; }
  /* 四色风险预警：环图 + 表格 */
  .zj-donut { padding: 0 0 16px; }
  .zj-donut .wb-donut { justify-content: center; gap: 40px; }
  .zj-donut .wb-donut .legend { flex: 0 0 200px; }
  .zj-lv { display: inline-block; padding: 1px 8px; border-radius: 3px; font-size: 12px; }
  .zj-lv.red { background: #fdeaea; color: #df2026; } .zj-lv.orange { background: #fff4e2; color: #f59e0b; }
  /* 重点项目资金水位 */
  .zj-wl { display: flex; flex-direction: column; }
  .zj-wl .r { padding: 9px 0 10px; border-bottom: 1px solid #f0f2f5; }
  .zj-wl .r:last-child { border-bottom: 0; }
  .zj-wl .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 7px; }
  .zj-wl .name { font-size: 13.5px; font-weight: 600; color: #1f2a44; }
  .zj-wl .num { font-size: 12.5px; color: #606266; font-variant-numeric: tabular-nums; }
  .zj-wl .num.red { color: #df2026; font-weight: 600; }
  .zj-wl .track { height: 10px; border-radius: 5px; background: #eef1f6; overflow: hidden; }
  .zj-wl .track span { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #12a877, #5fd39a); }
  .zj-wl .track span.orange { background: linear-gradient(90deg, #f59e0b, #ffc36b); }
  .zj-wl .track span.red { background: linear-gradient(90deg, #df2026, #f47c7c); }
  /* 在监资金余额走势（SVG 折线） */
  .zj-line { display: block; width: 100%; height: 240px; }
  .zj-line .g line { stroke: #edf0f5; stroke-width: 1; }
  .zj-line .ln { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .zj-line .ln.a { stroke: #2556ba; }
  .zj-line .ln.b { stroke: #12a877; }
  .zj-line .area { fill: url(#zjFill); }
  .zj-line .dot { fill: #fff; stroke: #2556ba; stroke-width: 2; }
  .zj-line .lbl { fill: #909399; font-size: 11px; }
  .zj-line .tip { fill: #1f2a44; font-size: 11px; font-weight: 600; }
</style>
</head>
<body data-role="reviewer" data-active="wsszjjg-01">
<main class="app-main"><div id="wb-root"></div></main>
<script src="../../../assets/js/app.js"></script>
<script src="../../../assets/js/wb.js"></script>
<script>
/* 内容按 Figma「新建商品房预售资金监管系统」我的工作台逐项还原 */
(function () {
  /* 环图 SVG（与 wb.js 内部 ringSVG 同款） */
  function ring(parts) {
    var total = parts.reduce(function (a, p) { return a + p[1]; }, 0) || 1;
    var r = 46, C = 2 * Math.PI * r, off = 0, segs = '';
    parts.forEach(function (p) {
      var len = p[1] / total * C;
      segs += '<circle r="' + r + '" cx="60" cy="60" fill="none" stroke="' + p[2] + '" stroke-width="16" stroke-dasharray="' + len + ' ' + (C - len) + '" stroke-dashoffset="' + (-off) + '"></circle>';
      off += len;
    });
    return '<svg viewBox="0 0 120 120"><circle r="46" cx="60" cy="60" fill="none" stroke="#eef1f6" stroke-width="16"></circle>' + segs + '</svg>';
  }
  var warnParts = [['红色 · 严重', 3, '#df2026'], ['橙色 · 预警', 8, '#f59e0b'], ['黄色 · 提示', 12, '#f5d000'], ['蓝色 · 正常', 105, '#2556ba']];
  var warnHtml =
    '<div class="wb-donut"><div class="legend">' + warnParts.map(function (p) {
      return '<div class="li"><span class="dot" style="background:' + p[2] + '"></span><span>' + p[0] + '</span><span class="pct" style="color:#1f2a44;font-weight:600">' + p[1] + '</span></div>';
    }).join('') + '</div>' +
    '<div class="ring">' + ring(warnParts) + '<div class="c"><b>23</b><span>待处置</span></div></div></div>' +
    '<table class="wb-table" style="margin-top:16px"><thead><tr><th>级别</th><th>预警项目</th><th>预警事由</th></tr></thead><tbody>' +
    '<tr><td><span class="zj-lv red">严重</span></td><td class="first">万科·柳东新城 二期</td><td>账户余额 1,208 万元已低于剩余重点监管额度 2,450 万元</td></tr>' +
    '<tr><td><span class="zj-lv red">严重</span></td><td class="first">柳南·锦绣华府</td><td>连续 3 日未收到银行余额推送，超过约定时效</td></tr>' +
    '<tr><td><span class="zj-lv orange">预警</span></td><td class="first">恒祥·江湾一号</td><td>已网签未缴存金额 1,860 万元，超期 15 天</td></tr>' +
    '</tbody></table>';

  /* 重点项目资金水位：账户余额 / 重点监管额度 */
  var wl = [
    ['荣和·公园大道 三期', '8,620 / 6,500 万元', 100, ''],
    ['彰泰·山水间 二期', '5,180 / 4,800 万元', 100, ''],
    ['保利·柳江天悦', '3,960 / 3,600 万元', 100, ''],
    ['龙光·玖誉城 一期', '2,740 / 3,200 万元', 86, 'orange'],
    ['万科·柳东新城 二期', '1,208 / 2,450 万元', 49, 'red']
  ];
  var wlHtml = '<div class="zj-wl">' + wl.map(function (r) {
    return '<div class="r"><div class="top"><span class="name">' + r[0] + '</span><span class="num ' + (r[3] === 'red' ? 'red' : '') + '">' + r[1] + '</span></div>' +
      '<div class="track"><span class="' + r[3] + '" style="width:' + r[2] + '%"></span></div></div>';
  }).join('') + '</div>';

  /* 在监资金余额走势：近 12 个月，单位亿元。在监余额 36.2 → 42.68，重点监管额度合计始终在其下方 */
  var bal = [36.2, 36.8, 37.1, 37.9, 38.6, 39.0, 39.4, 40.1, 40.6, 41.3, 42.0, 42.68];
  var quota = [34.4, 34.1, 33.6, 33.1, 32.8, 32.4, 32.6, 32.1, 31.8, 31.4, 31.1, 30.6];
  var months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
  /* 纵轴与设计图一致：30 / 38 / 46 / 54 / 62 等距刻度，底边基线标 0 */
  function lineSVG(W) {
    var H = 240, L = 44, R = 24, T = 14, B = 30, yMin = 22, yMax = 62;
    var px = function (i) { return L + i * (W - L - R) / 11; };
    var py = function (v) { return T + (yMax - v) / (yMax - yMin) * (H - T - B); };
    var pts = function (arr) { return arr.map(function (v, i) { return px(i).toFixed(1) + ',' + py(v).toFixed(1); }).join(' '); };
    var yTicks = [30, 38, 46, 54, 62], base = H - B;
    return '<svg class="zj-line" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="在监资金余额走势">' +
      '<defs><linearGradient id="zjFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2556ba" stop-opacity=".18"/><stop offset="1" stop-color="#2556ba" stop-opacity="0"/></linearGradient></defs>' +
      '<g class="g">' + yTicks.map(function (t) { return '<line x1="' + L + '" y1="' + py(t).toFixed(1) + '" x2="' + (W - R) + '" y2="' + py(t).toFixed(1) + '"/>'; }).join('') +
      '<line x1="' + L + '" y1="' + base + '" x2="' + (W - R) + '" y2="' + base + '" style="stroke:#d9dee8"/></g>' +
      yTicks.map(function (t) { return '<text class="lbl" x="' + (L - 8) + '" y="' + (py(t) + 4).toFixed(1) + '" text-anchor="end">' + t + '</text>'; }).join('') +
      '<text class="lbl" x="' + (L - 8) + '" y="' + (base + 4) + '" text-anchor="end">0</text>' +
      '<polygon class="area" points="' + px(0).toFixed(1) + ',' + base + ' ' + pts(bal) + ' ' + px(11).toFixed(1) + ',' + base + '"/>' +
      '<polyline class="ln b" points="' + pts(quota) + '"/>' +
      '<polyline class="ln a" points="' + pts(bal) + '"/>' +
      '<circle class="dot" cx="' + px(11).toFixed(1) + '" cy="' + py(42.68).toFixed(1) + '" r="4"/>' +
      '<text class="tip" x="' + (px(11) - 8).toFixed(1) + '" y="' + (py(42.68) - 10).toFixed(1) + '" text-anchor="end">42.68</text>' +
      months.map(function (m, i) { return '<text class="lbl" x="' + px(i).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="middle">' + m + '</text>'; }).join('') +
      '</svg>';
  }
  var lineHtml =
    '<div class="wb-legend" style="justify-content:center"><span><i style="background:#2556ba"></i>在监余额</span><span><i style="background:#12a877"></i>重点监管额度合计</span></div>' +
    '<div id="zj-line-box">' + lineSVG(1100) + '</div>';

  WB.render({ blocks: [
    { type: 'note', text: '监控模式办理口径：购房款直接存入银行监管账户，资金存管与划转由银行执行；平台只做备案、核对、监控、预警与留痕，不直接操作资金。 平台侧出账指令与银行侧执行回执一一对应留痕，缺回执或金额不一致的自动挂起并提示经办人。' },

    { type: 'row', ratio: '1fr 1fr', cols: [
      { type: 'greet', compact: true, dateInline: true, hello: '上午好', name: '韦国强',
        org: '市房产交易所 · 业务审核员', sys: '今天有 12 笔用款申请待你审批，其中 3 笔已临近办结时限',
        date: '2026 年 7 月 31 日 星期五 · 全市在监项目 128 个',
        tiles: [
          { icon: 'fa-diagram-project', label: '在监项目', value: 128, href: 'project.html' },
          { icon: 'fa-wallet', label: '在监资金(亿元)', value: '42.68', href: 'account.html' },
          { icon: 'fa-triangle-exclamation', label: '待处置预警', value: 23, href: 'warning.html' }
        ] },
      { type: 'todos', title: '待办事项', summary: '按剩余时限排序', weather: false, more: '查看全部', moreHref: 'usage.html',
        items: [
          { tag: '拨付审批', c: 'orange', text: '荣和·公园大道 三期　主体结构封顶节点用款 1,860.00 万元', time: '剩 6h', href: 'usage-approve.html' },
          { tag: '拨付审批', c: 'orange', text: '彰泰·山水间 二期　±0.00 完成节点用款 920.00 万元', time: '剩 5h', href: 'usage-approve.html' },
          { tag: '对账差异', c: 'red', text: '柳州银行营业部 7 月 30 日日终对账存在 2 笔差异待处理', time: '已超期', over: true, href: 'reconcile-diff.html' },
          { tag: '解除监管', c: 'purple', text: '保利·柳江天悦 1#、2# 楼　竣工验收备案后申请分栋解除', time: '剩 4h', href: 'release-detail.html' }
        ] }
    ] },

    { type: 'kpis', cols: 5, items: [
      { icon: 'fa-diagram-project', c: 'blue', label: '在监项目', value: '486,286', sub: '本月新增 6 个', trend: 'up', href: 'project.html' },
      { icon: 'fa-wallet', c: 'cyan', label: '在监资金余额（万元）', value: '426,835', sub: '较上月 +3.2%', trend: 'up', href: 'account.html' },
      { icon: 'fa-money-check-dollar', c: 'green', label: '本月归集（万元）', value: '32,608', sub: '环比 +8.6%', trend: 'up', href: 'collect.html' },
      { icon: 'fa-clock', c: 'purple', label: '待我审批用款', value: 12, sub: '3 笔临近时限', trend: 'warn', href: 'usage.html' },
      { icon: 'fa-triangle-exclamation', c: 'red', label: '未处置预警', value: 23, sub: '红色 3 项', trend: 'down', href: 'warning.html' }
    ] },

    { type: 'quick', title: '快速入口', sub: '按业务主线排列', rows: [[
      { label: '监管项目', icon: 'fa-diagram-project', href: 'project.html' },
      { label: '监管账户', icon: 'fa-building-columns', href: 'account.html' },
      { label: '资金归集', icon: 'fa-money-check-dollar', href: 'collect.html' },
      { label: '资金使用', icon: 'fa-sack-dollar', href: 'usage.html' },
      { label: '资金核退', icon: 'fa-rotate-left', href: 'refund.html' },
      { label: '资金对账', icon: 'fa-scale-balanced', href: 'reconcile.html' },
      { label: '解除监管', icon: 'fa-unlock', href: 'release.html' },
      { label: '风险预警', icon: 'fa-triangle-exclamation', href: 'warning.html' }
    ]] },

    { type: 'row', cols: [
      { type: 'bar', title: '本年资金归集与拨付对比', unit: '单位：万元 · 双柱对照', series: ['归集入账', '审批拨付'],
        data: [['3月', 200, 150], ['4月', 200, 150], ['5月', 150, 100], ['6月', 150, 100], ['7月', 200, 150], ['8月', 150, 100]],
        note: '本年累计归集 22.30 亿元、累计拨付 16.84 亿元，净增在监资金 5.46 亿元；拨付节奏整体低于归集，符合节点管控要求。' },
      { type: 'card', title: '四色风险预警', meta: '未处置 23 项', more: '去处置', moreHref: 'warning.html', html: warnHtml }
    ] },

    { type: 'row', cols: [
      { type: 'hbar', title: '各城区在监资金分布', unit: '单位：亿元 · 按余额占比',
        data: [['柳南区', 9.86], ['柳北区', 9.02], ['鱼峰区', 8.14], ['城中区', 6.28], ['柳江区', 4.52], ['柳东新区', 3.06], ['五县合计', '1.80']],
        note: '市区五区占全市在监资金 95.8%；五县项目体量小但缴存率偏低，已纳入监测督办。' },
      { type: 'card', title: '重点项目资金水位', meta: '账户余额 / 重点监管额度', more: '全部项目', moreHref: 'project.html', html: wlHtml,
        note: '水位低于 100% 表示账户余额已不足剩余重点监管额度，该项目的用款申请将被锁一拦截。' }
    ] },

    { type: 'card', title: '在监资金余额走势', meta: '近 12 个月 · 单位：亿元', html: lineHtml,
      note: '在监余额由 36.2 亿升至 42.68 亿，连续 9 个月高于重点监管额度合计，整体安全垫充足。' }
  ] });

  /* 问候卡右上角按钮（预警中心 / 去审批用款）；待办行补「去处理」按钮 */
  var ops = document.querySelector('.wb-greet .g-ops');
  if (ops) ops.innerHTML = '<div class="zj-ops"><a class="ghost" href="warning.html"><i class="fa-solid fa-bell"></i> 预警中心</a><a class="solid" href="usage.html"><i class="fa-solid fa-sack-dollar"></i> 去审批用款</a></div>';
  document.querySelectorAll('.wb-todo .t-row').forEach(function (r) {
    var b = document.createElement('span'); b.className = 'zj-go'; b.innerHTML = '去处理 <i class="fa-solid fa-angle-right"></i>'; r.appendChild(b);
  });
  /* 折线图按容器实际宽度重绘，避免文字被拉伸 */
  function fitLine() {
    var box = document.getElementById('zj-line-box');
    if (box && box.clientWidth > 200) box.innerHTML = lineSVG(box.clientWidth);
  }
  fitLine(); window.addEventListener('resize', fitLine);
})();
</script>
</body>
