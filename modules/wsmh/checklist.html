(function () {
  var list = document.getElementById('ck-list');
  var kw = '', type = '';

  function render() {
    var hit = 0;
    var blocks = {};
    CK.forEach(function (m) {
      var rows = m[3].filter(function (r) {
        var id = m[1] + '-' + r[0];
        if (type && r[2] !== type) return false;
        if (kw && (id + r[1] + r[4]).toLowerCase().indexOf(kw.toLowerCase()) < 0) return false;
        return true;
      });
      if (!rows.length) return;
      hit += rows.length;
      if (!blocks[m[0]]) blocks[m[0]] = [];
      blocks[m[0]].push({ code: m[1], name: m[2], rows: rows, total: m[3].length });
    });
    var COLOR = { '操作型': 'blue', '展示型': 'cyan', '配置型': 'orange' };
    var html = '';
    Object.keys(blocks).forEach(function (bk) {
      var n = 0; blocks[bk].forEach(function (m) { n += m.rows.length; });
      html += '<div class="ck-blk"><h3>' + bk + '<span>' + blocks[bk].length + ' 个模块 · ' + n + ' 个功能点</span></h3>';
      blocks[bk].forEach(function (m) {
        html += '<div class="ck-mod"><div class="ck-h"><h4>' + m.code + '　' + m.name + '</h4>'
          + '<span class="ck-c">' + m.rows.length + ' / ' + m.total + ' 点</span></div>';
        html += m.rows.map(function (r) {
          return '<div class="ck-item">'
            + '<span class="ck-id">' + m.code + '-' + r[0] + '</span>'
            + '<span class="ck-n">' + r[1] + '</span>'
            + '<span class="badge ' + COLOR[r[2]] + '" style="flex:none">' + r[2] + '</span>'
            + '<span class="ck-p" title="' + r[4] + '">' + r[4] + '</span>'
            + '<a class="btn btn-sm ck-go" href="' + r[3] + '" data-fp="' + m.code + '-' + r[0] + '">验证 <i class="fa-solid fa-arrow-right"></i></a>'
            + '</div>';
        }).join('');
        html += '</div>';
      });
      html += '</div>';
    });
    list.innerHTML = html || UI.empty('没有匹配的功能点', '换个关键词或类型试试');
    document.getElementById('ck-hit').textContent = hit;
  }

  document.getElementById('ck-kw').oninput = function () { kw = this.value.trim(); render(); };
  document.querySelectorAll('#ck-type a').forEach(function (a) {
    a.onclick = function () {
      document.querySelectorAll('#ck-type a').forEach(function (x) { x.classList.remove('on'); });
      a.classList.add('on'); type = a.getAttribute('data-t'); render();
    };
  });

  var total = 0; CK.forEach(function (m) { total += m[3].length; });
  document.getElementById('s-total').textContent = total;
  render();
})();
</script>
</body>
</html>
