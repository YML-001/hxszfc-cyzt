<style>
  /* 本页专属布局 */
  .corp-bar {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card);
    padding: 12px 16px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 18px;
  }
  .corp-bar .cb-t { font-size: 13.5px; font-weight: 700; color: var(--text-2); white-space: nowrap; }
  .corp-bar .cb-d { font-size: 12.5px; color: var(--text-3); margin-left: auto; }
  .todo-i { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--row-line); }
  .todo-i:last-child { border-bottom: 0; }
  .todo-i .ti-n { flex: 1; min-width: 0; }
  .todo-i .ti-t { font-size: 14.5px; font-weight: 700; color: var(--text-1); }
  .todo-i .ti-d { font-size: 12.5px; color: var(--text-3); margin-top: 3px; }
  .pub-q { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .pub-q a {
    border: 1px solid var(--border); border-radius: var(--radius-card); padding: 13px 15px;
    display: flex; align-items: center; gap: 11px; color: inherit; background: #fff;
  }
  .pub-q a:hover { border-color: var(--primary); background: var(--primary-light-2); color: var(--primary); }
  .pub-q a i { font-size: 18px; color: var(--primary); width: 22px; text-align: center; flex: none; }
  .pub-q .pq-t { font-size: 14px; font-weight: 700; }
  .pub-q .pq-d { font-size: 12px; color: var(--text-3); margin-top: 2px; }
  .pub-q a:hover .pq-d { color: var(--primary); }
</style>

/* ============ 公共骨架：主体角色 / 左侧菜单 / 登录拦截 / 材料上传 ============ */
var ROLES = [
  { k: '开发企业', n: '开发企业', lx: '房地产开发企业', ico: 'fa-building-flag' },
  { k: '经纪机构', n: '房地产经纪机构', lx: '房地产经纪机构', ico: 'fa-handshake' },
  { k: '测绘机构', n: '房产测绘机构', lx: '房产测绘机构', ico: 'fa-ruler-combined' },
  { k: '评估公证', n: '评估公证机构', lx: '评估公证机构', ico: 'fa-stamp' },
  { k: '租赁企业', n: '住房租赁企业', lx: '住房租赁企业', ico: 'fa-key' }
];
function ssGet(k, d) { try { return sessionStorage.getItem(k) || d; } catch (e) { return d; } }
function ssSet(k, v) { try { sessionStorage.setItem(k, v); } catch (e) { } }
function roleName(k) { for (var i = 0; i < ROLES.length; i++) if (ROLES[i].k === k) return ROLES[i].n; return k; }

var CORP = {
  key: function () {
    var q = UI.param('corp');
    if (q) { for (var i = 0; i < ROLES.length; i++) { if (ROLES[i].k === q || ROLES[i].n === q) { ssSet('wsmh.corp', ROLES[i].k); break; } } }
    return ssGet('wsmh.corp', '开发企业');
  },
  role: function () { var k = CORP.key(); for (var i = 0; i < ROLES.length; i++) if (ROLES[i].k === k) return ROLES[i]; return ROLES[0]; },
  set: function (k) { ssSet('wsmh.corp', k); },
  is: function (k) { return CORP.key() === k; },
  agency: function () {
    var r = CORP.role(), list = PORTAL.agencies({ lx: r.lx });
    if (r.k === '开发企业') {
      var me = list.filter(function (a) { return a.mc === UI.user().name; })[0];
      if (me) return me;
    }
    var ok = list.filter(function (a) { return a.rwzt === '1'; })[0];
    if (ok) return ok;
    if (list.length) return list[0];
    if (r.k === '评估公证') {
      var a = PORTAL.act('agency.apply', {
        mc: 'XXXX市信衡房地产评估咨询有限公司', lx: '评估公证机构', code: '91450200MA5K7721X8',
        fr: '梁*平', qx: '城中区', dz: '城中区文昌路 128 号 12 层', tel: '0772-2825518', zz: '房地产估价机构二级'
      });
      PORTAL.act('agency.audit', { id: a.id, pass: true, yj: '演示环境预置评估公证机构入网档案，便于体验机构端功能' });
      return PORTAL.agency(a.id);
    }
    return null;
  },
  name: function () { var a = CORP.agency(); return a ? a.mc : UI.user().name; }
};

  var r = CORP.role(), a = CORP.agency();
  var nm = r.k === '开发企业' ? UI.user().name : (a ? a.mc : UI.user().name);
  var G = [
    ['', [['index.html', '工作台首页', 'fa-gauge', '']]],
    ['主体管理', [
      ['net-apply.html', '企业入网备案', 'fa-id-card-clip', ''],
      ['staff-register.html', '从业人员实名登记', 'fa-user-check', ''],
      ['cert-library.html', '我的证照与材料库', 'fa-folder-tree', '']]],
    ['开发企业', [
      ['dev-project.html', '项目预售与进度申报', 'fa-building-flag', '开发企业'],
      ['dev-fund.html', '监管账户与资金申报', 'fa-shield-halved', '开发企业']]],
    ['机构服务', [
      ['agency-desk.html', '经纪机构端', 'fa-handshake', '经纪机构'],
      ['org-desk.html', '测绘与评估公证端', 'fa-ruler-combined', '测绘机构,评估公证'],
      ['rent-company.html', '租赁企业办事', 'fa-key', '租赁企业']]],
    ['', [['../web/home.html', '返回门户首页', 'fa-arrow-left', '']]]
  ];
  var h = '<div class="sm-head"><div class="sm-n">' + UI.esc(nm.length > 13 ? nm.slice(0, 13) + '…' : nm) + '</div>'
    + '<div class="sm-r"><i class="fa-solid ' + r.ico + '"></i> ' + r.n + '　'
    + (a ? PORTAL.AG_ST[a.rwzt].n : '未入网') + '</div></div>';
  G.forEach(function (g) {
    h += '<div class="sm-g">' + (g[0] ? '<div class="sm-gt">' + g[0] + '</div>' : '');
    g[1].forEach(function (x) {
      var allow = x[3] ? x[3].split(',') : null;
      var ok = !allow || allow.indexOf(r.k) >= 0;
      if (ok) {
        h += '<a class="' + (x[0] === active ? 'on' : '') + '" href="' + x[0] + '" data-fp="wsmh-23-01">'
          + '<i class="fa-solid ' + x[2] + '"></i>' + x[1] + '</a>';
      } else {
        var ns = allow.map(roleName).join('、');
        h += '<a href="javascript:;" style="opacity:.42" data-dis="' + ns + '" data-fp="wsmh-23-01">'
          + '<i class="fa-solid ' + x[2] + '"></i>' + x[1]
          + '<i class="fa-solid fa-lock" style="margin-left:auto;font-size:11px"></i></a>';
      }
    });
    h += '</div>';
  });
  var el = document.getElementById('side');
  el.innerHTML = h;
  el.querySelectorAll('[data-dis]').forEach(function (x) {
    x.onclick = function () { UI.toast('该功能仅' + x.getAttribute('data-dis') + '可用，请先在页面顶部切换主体角色', 'warning'); };
  });
}

function renderCorpBar(id, fp) {
  var cur = CORP.key(), box = document.getElementById(id);
  box.innerHTML = '<span class="cb-t"><i class="fa-solid fa-user-gear text-primary"></i> 主体角色</span>'
    + '<div class="pill-tabs">' + ROLES.map(function (r) {
      return '<a class="' + (r.k === cur ? 'on' : '') + '" data-corp="' + r.k + '" data-fp="' + fp + '">'
        + '<i class="fa-solid ' + r.ico + '"></i> ' + r.n + '</a>';
    }).join('') + '</div>'
    + '<span class="cb-d">同一门户账号可关联多类主体身份，切换后左侧菜单与页面内容按角色适配</span>';
  box.querySelectorAll('[data-corp]').forEach(function (a) {
    a.onclick = function () {
      var k = a.getAttribute('data-corp');
      if (k === CORP.key()) { UI.toast('当前已是「' + roleName(k) + '」角色', 'info'); return; }
      CORP.set(k);
      UI.toast('已切换为「' + roleName(k) + '」，页面即将按新角色刷新', 'success');
      setTimeout(function () { location.href = location.pathname; }, 700);
    };
  });
}

function corpGuard(file) {
  if (UI.isLogin()) return true;
  UI.needLogin('企业与机构工作台');
  var m = document.querySelector('.desk-main');
  if (m) m.innerHTML = '<div class="desk-card"><div class="card-body">' + UI.empty(

    '<a class="btn btn-primary" href="' + file + '?user=company" data-fp="wsmh-23-01">使用企业演示账号进入</a>'
    + '<a class="btn" style="margin-left:10px" href="../web/login.html" data-fp="wsmh-23-01">去登录页</a>')
    + '</div></div>';
  var s = document.getElementById('side'); if (s) s.style.display = 'none';
  return false;
}

/* 材料上传（演示） */
var UP = {};
function upBox(id, mats, tip) {
  UP[id] = { mats: mats, done: [] };
  return '<div class="file-up" data-up="' + id + '"><i class="fa-solid fa-cloud-arrow-up"></i>'
    + '点击模拟上传（演示环境不实际传输文件，支持 PDF / JPG / PNG，单个不超过 20MB）'
    + '<div class="text-xs text-3" style="margin-top:6px">应上传：' + mats.join('、') + '</div></div>'
    + '<div class="file-list" id="' + id + '"></div>'
    + (tip ? '<div class="tip" style="font-size:12.5px;color:var(--text-3);margin-top:6px">' + tip + '</div>' : '');
}
function upRender(id) {
  var u = UP[id], box = document.getElementById(id); if (!u || !box) return;
  box.innerHTML = u.done.map(function (f, i) {
    return '<div class="file-chip"><i class="fa-solid fa-file-pdf"></i><span>' + UI.esc(f) + '</span>'
      + '<span class="fx" data-updel="' + id + ':' + i + '"><i class="fa-solid fa-xmark"></i></span></div>';
  }).join('');
}
function upAdd(id) {
  var u = UP[id]; if (!u) return;
  var next = '';
  for (var i = 0; i < u.mats.length; i++) { if (u.done.indexOf(u.mats[i] + '.pdf') < 0) { next = u.mats[i] + '.pdf'; break; } }
  if (!next) next = '补充材料' + (u.done.length + 1) + '.pdf';
  u.done.push(next); upRender(id);
  UI.toast('已上传「' + next + '」', 'success');
}
function upNum(id) { return UP[id] ? UP[id].done.length : 0; }
document.addEventListener('click', function (e) {
  var a = e.target.closest('[data-up]');
  if (a) { upAdd(a.getAttribute('data-up')); return; }
  var d = e.target.closest('[data-updel]');
  if (d) {
    var p = d.getAttribute('data-updel').split(':');
    if (UP[p[0]]) { UP[p[0]].done.splice(Number(p[1]), 1); upRender(p[0]); UI.toast('已移除该材料', 'info'); }
  }
});

/* -------- 企业基本信息 -------- */
function renderInfo() {
  var a = CORP.agency(), r = CORP.role();

  UI.confirm('重置经办人登录密码',
    '将为 <b>' + UI.esc(PORTAL.mask('name', o.xm)) + '</b> 重置登录密码，重置后系统向其手机号 <b>'
    + UI.esc(PORTAL.mask('tel', o.tel)) + '</b> 发送一次性验证码，首次登录须重新设置密码。确定重置吗？',
    function () {
      UI.toast('已重置，一次性验证码已发送至 ' + PORTAL.mask('tel', o.tel) + '，30 分钟内有效', 'success');
    }, '确定重置');
}

  var arr = [
    ['企业名录公示', '主体类型、入网状态与有效期', 'fa-list-check', '../web/agency-list.html'],
    ['企业详情公示', '资质、门店、项目与信用记录', 'fa-building-circle-check', a ? '../web/agency-detail.html?id=' + a.id : '../web/agency-public.html'],
    ['信用评价与红黑榜', '信用分 ' + (a ? a.score : '—') + ' 分 · ' + (a ? a.dj : '—') + ' 级', 'fa-award', '../web/credit-rank.html'],
    ['从业人员名录', '本机构在册 ' + PORTAL.staffs({ jg: nm, zt: '1' }).length + ' 人', 'fa-user-tie', '../web/agency-list.html?tab=al-staff']
  ];
  if (k === '开发企业') {
    arr.push(['预售楼盘公示', '本企业 ' + myProjects().length + ' 个在售项目', 'fa-building-flag', '../web/public-presale.html']);
    arr.push(['监管账户公示', '逐项目监管账号与监管银行', 'fa-building-columns', '../web/public-fund.html']);
  } else if (k === '经纪机构') {
    arr.push(['二手房专区', '本机构核验通过房源对外展示', 'fa-house', '../web/second-house.html']);
    arr.push(['从业主体公示总览', '机构、人员与信用一站查看', 'fa-briefcase', '../web/agency-public.html']);
  } else if (k === '测绘机构') {
    arr.push(['测绘成果公示', '备案办结后自动生成公示', 'fa-ruler-combined', '../web/public-affairs.html?tab=pa-survey']);
    arr.push(['政务公开与通知公告', '检查通报与政策文件', 'fa-bullhorn', '../web/public-affairs.html']);
  } else if (k === '租赁企业') {
    arr.push(['租房专区', '本企业在租核验房源', 'fa-key', '../web/rent-house.html']);
    arr.push(['租房公共服务', '租金参考价与调解网点', 'fa-hand-holding-heart', '../web/rent-public.html']);
  } else {
    arr.push(['从业主体公示总览', '机构、人员与信用一站查看', 'fa-briefcase', '../web/agency-public.html']);
    arr.push(['政务公开与通知公告', '检查通报与政策文件', 'fa-bullhorn', '../web/public-affairs.html']);
  }
  document.getElementById('pub-box').innerHTML = arr.map(function (x) {
    return '<a href="' + x[3] + '" data-fp="wsmh-23-01"><i class="fa-solid ' + x[2] + '"></i>'
      + '<span><span class="pq-t">' + x[0] + '</span><span class="pq-d" style="display:block">' + x[1] + '</span></span>'
      + '<i class="fa-solid fa-angle-right text-3" style="margin-left:auto;font-size:13px"></i></a>';
  }).join('');
}
