<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助查询与打印 · 房产交易自助服务终端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  /* 自助终端专属：1080×1920 竖屏触控，正文 ≥18px，按钮高 ≥64px */
  .k-btn {
    height: 84px; padding: 0 40px; font-size: 28px; font-weight: 700; border-radius: 14px;
    border: 0; background: var(--primary); color: #fff; cursor: pointer; font-family: var(--font);
    display: inline-flex; align-items: center; justify-content: center; gap: 14px; flex: none;
  }
  .k-btn:hover { background: var(--primary-hover); }
  .k-btn.ghost { background: #fff; color: var(--primary); border: 3px solid var(--primary); }
  .k-btn.accent { background: var(--accent); }
  .k-btn.accent:hover { background: #d8352b; }
  .k-btn.gray { background: #e2e7f0; color: var(--text-2); }
  .k-tip {
    background: #fff; border-radius: 18px; padding: 26px 30px; margin-bottom: 26px;
    box-shadow: 0 6px 20px rgba(16, 38, 76, .1); display: flex; align-items: center; gap: 24px;
    border-left: 10px solid var(--success);
  }
  .k-tip .kt-i {
    width: 76px; height: 76px; border-radius: 22px; flex: none; display: flex; align-items: center;
    justify-content: center; font-size: 34px; background: var(--success-light); color: var(--success);
  }
  .k-tip .kt-t { font-size: 27px; font-weight: 700; }
  .k-tip .kt-d { font-size: 18px; color: var(--text-2); margin-top: 8px; line-height: 1.7; }
  .k-sec-t { font-size: 26px; font-weight: 700; margin: 0 0 20px; display: flex; align-items: center; gap: 12px; }
  .k-sec-t span { font-size: 18px; color: var(--text-3); font-weight: 400; }
  .k-mode { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-bottom: 30px; }
  .k-mode button {
    height: 110px; border-radius: 16px; border: 3px solid var(--border-strong); background: #fff;
    font-size: 28px; font-weight: 700; cursor: pointer; font-family: var(--font); color: var(--text-1);
    display: flex; align-items: center; justify-content: center; gap: 16px;
  }
  .k-mode button i { font-size: 34px; color: var(--primary); }
  .k-mode button.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .k-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 28px; }
  .k-3 button {
    height: 130px; border-radius: 16px; border: 3px solid var(--border-strong); background: #fff;
    font-size: 24px; font-weight: 700; cursor: pointer; font-family: var(--font); color: var(--text-1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
  }
  .k-3 button i { font-size: 32px; color: var(--primary); }
  .k-3 button.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .k-card { background: #fff; border-radius: 18px; padding: 28px 30px; box-shadow: 0 6px 20px rgba(16, 38, 76, .08); margin-bottom: 26px; }
  .k-tb { width: 100%; border-collapse: collapse; font-size: 20px; }
  .k-tb th {
    background: var(--primary-light); color: var(--primary); font-size: 20px; text-align: left;
    padding: 18px 20px; white-space: nowrap;
  }
  .k-tb td { padding: 20px; border-bottom: 1px solid var(--row-line); color: var(--text-1); }
  .k-tb tr:last-child td { border-bottom: 0; }
  .k-tb .b { font-weight: 700; font-size: 22px; }
  .k-in {
    width: 100%; height: 78px; font-size: 30px; padding: 0 22px; letter-spacing: 3px;
    border: 2px solid var(--border-strong); border-radius: 12px; background: #fff;
    font-family: var(--font); color: var(--text-1); outline: 0;
  }
  .k-lb { font-size: 20px; font-weight: 700; margin-bottom: 12px; display: block; }
  .k-key-wrap { display: flex; gap: 26px; align-items: flex-start; margin-top: 22px; }
  .k-way { flex: 1; }
  .k-way button {
    width: 100%; height: 74px; font-size: 22px; margin-bottom: 16px; border-radius: 12px;
    border: 2px solid var(--primary); background: #fff; color: var(--primary); cursor: pointer;
    font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .k-way button:hover { background: var(--primary-light); }
  .k-chip {
    display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--primary-soft);
    background: var(--primary-light-2); color: var(--primary); border-radius: 12px;
    padding: 12px 18px; font-size: 19px; cursor: pointer; margin: 0 12px 12px 0; font-family: var(--font);
  }
  .k-chip:hover { border-color: var(--primary); }
  .k-note {
    background: var(--warning-light); border: 1px solid #f5dab0; color: #b45309;
    border-radius: 12px; padding: 16px 20px; font-size: 18px; line-height: 1.8; margin-top: 20px;
  }
  .k-ok {
    background: var(--success-light); border: 1px solid #bfe8cf; color: #15803d;
    border-radius: 12px; padding: 16px 20px; font-size: 18px; line-height: 1.8; margin-top: 20px;
  }
  /* 大字四节点进度 */
  .k-steps { display: flex; align-items: flex-start; gap: 0; }
  .k-steps .ks-i { flex: 1; text-align: center; position: relative; }
  .k-steps .ks-i::after {
    content: ''; position: absolute; right: 0; top: 38px; width: 100%; height: 5px;
    background: var(--border-strong); z-index: 0;
  }
  .k-steps .ks-i:last-child::after { display: none; }
  .k-steps .ks-i.done::after { background: var(--success); }
  .k-steps .ks-n {
    width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 14px; position: relative; z-index: 2;
    background: #e6ebf4; color: var(--text-3); display: flex; align-items: center; justify-content: center;
    font-size: 32px; border: 5px solid #fff;
  }
  .k-steps .ks-i.done .ks-n { background: var(--success); color: #fff; }
  .k-steps .ks-i.cur .ks-n { background: var(--primary); color: #fff; box-shadow: 0 0 0 8px var(--primary-light); }
  .k-steps .ks-t { font-size: 22px; font-weight: 700; }
  .k-steps .ks-d { font-size: 17px; color: var(--text-3); margin-top: 6px; }
  /* 弹层 */
  .k-layer {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8, 20, 45, .74);
    z-index: 900; display: none; align-items: center; justify-content: center; padding: 60px 40px;
  }
  .k-layer.on { display: flex; }
  .k-panel {
    background: #f5f8fc; border-radius: 26px; width: 100%; max-width: 900px; max-height: 88vh;
    overflow: auto; box-shadow: 0 30px 90px rgba(0, 0, 0, .45);
  }
  .k-panel .kp-h {
    background: linear-gradient(135deg, var(--primary), var(--primary-deep)); color: #fff;
    padding: 26px 34px; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 14px;
  }
  .k-panel .kp-b { padding: 30px 34px; font-size: 20px; line-height: 1.85; color: var(--text-1); }
  .k-panel .kp-f { padding: 0 34px 30px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .k-dl dl { display: flex; flex-wrap: wrap; margin: 0; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; background: #fff; }
  .k-dl dt, .k-dl dd { margin: 0; padding: 18px 22px; font-size: 19px; border-bottom: 1px solid var(--row-line); }
  .k-dl dt { width: 210px; flex: none; background: var(--bg-soft); color: var(--text-3); }
  .k-dl dd { flex: 1; min-width: 260px; color: var(--text-1); }
  .k-glist button {
    width: 100%; text-align: left; background: #fff; border: 2px solid var(--border);
    border-radius: 14px; padding: 20px 22px; font-size: 21px; margin-bottom: 12px; cursor: pointer;
    font-family: var(--font); color: var(--text-1); display: flex; align-items: center; gap: 16px;
  }
  .k-glist button:hover, .k-glist button.on { border-color: var(--primary); background: var(--primary-light-2); }
  .k-glist button .gl-d { font-size: 17px; color: var(--text-3); display: block; margin-top: 6px; }
  /* 证明预览与打印动画 */
  .cert-pv {
    background: #fff; border: 3px double var(--primary); border-radius: 12px; padding: 30px;
    text-align: center; position: relative;
  }
  .cert-pv .cp-t { font-size: 30px; font-weight: 700; letter-spacing: 4px; color: var(--primary-deep); }
  .cert-pv .cp-s { font-size: 18px; color: var(--text-3); margin-top: 8px; letter-spacing: 2px; }
  .cert-pv .cp-c { font-size: 20px; line-height: 2; text-align: left; margin: 24px 0; }
  .cert-pv .cp-code { font-size: 34px; font-weight: 700; letter-spacing: 6px; color: var(--accent); font-family: "DIN Alternate", var(--font); }
  .cert-pv .cp-qr {
    width: 150px; height: 150px; border: 2px solid var(--border); border-radius: 8px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 80px; color: var(--primary);
    background: var(--bg-soft);
  }
  .pr-bar { height: 22px; border-radius: 11px; background: #e2e7f0; overflow: hidden; margin: 20px 0 10px; }
  .pr-bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6b95e8, var(--primary)); animation: prg 2.2s linear forwards; }
  @keyframes prg { from { width: 0; } to { width: 100%; } }
  .kiosk-foot a { font-size: 19px; }
</style>
</head>
<body class="kiosk">

<div class="kiosk-frame">
  <div class="kiosk-head">
    <button class="k-btn ghost" style="height:70px;font-size:22px;padding:0 26px" onclick="location.href='index.html'" data-fp="wsmh-28">
      <i class="fa-solid fa-arrow-left"></i> 返回首页</button>
    <div>
      <div class="kh-t1" style="font-size:32px" id="pg-t">自助查询</div>
      <div class="kh-t2">与网上入口同源同数据 · 查询与出证全程留痕</div>
    </div>
    <div class="kh-r">
      <div id="clock" style="font-size:22px;font-weight:700">--:--:--</div>
      <div style="margin-top:6px">文昌大厅 T01</div>
    </div>
  </div>

  <div class="kiosk-body">
    <div class="k-tip" id="auth-bar"></div>

    <div class="k-mode" id="mode"></div>

    <!-- 自助查询 -->
    <div id="p-query" style="display:none">
      <div class="k-sec-t"><i class="fa-solid fa-magnifying-glass text-primary"></i> 请选择查询类型</div>
      <div class="k-3" id="q-types"></div>
      <div id="q-body"></div>
    </div>

    <!-- 自助打印 -->
    <div id="p-print" style="display:none">
      <div class="k-sec-t"><i class="fa-solid fa-print text-primary"></i> 可打印的办结件与已出具证明
        <span>打印记录与网上出证记录同源</span></div>
      <div id="pr-body"></div>
    </div>
  </div>

  <div class="kiosk-foot">
    <span><i class="fa-solid fa-phone"></i> 咨询电话 <b id="f-tel">—</b></span>
    <span><i class="fa-solid fa-circle-info"></i> 打印记录与网上出证记录同源，可在网页版查询中心验真</span>
    <span style="margin-left:auto"></span>
    <a class="k-btn ghost" style="height:64px;font-size:21px;padding:0 24px" href="../web/cert-print.html" data-fp="wsmh-27-01">
      <i class="fa-solid fa-globe"></i> 网页版出证</a>
    <button class="k-btn gray" style="height:64px;font-size:21px;padding:0 24px" onclick="location.href='index.html'" data-fp="wsmh-28">
      <i class="fa-solid fa-house"></i> 终端首页</button>
  </div>
</div>

<div class="k-layer" id="layer">
  <div class="k-panel">
    <div class="kp-h" id="lay-h"></div>
    <div class="kp-b" id="lay-b"></div>
    <div class="kp-f" id="lay-f"></div>
  </div>
</div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
/* ===== 终端通用：核验状态、弹层、数字键盘 ===== */
var KUSER = '韦*强';
var KV = false;
var PEND = null;
function kvGet() { try { return sessionStorage.getItem('wsmh.kiosk.v') === '1'; } catch (e) { return KV; } }
function kvSet(v) { KV = v; try { sessionStorage.setItem('wsmh.kiosk.v', v ? '1' : '0'); } catch (e) { } }

function layer(title, body, foot) {
  document.getElementById('lay-h').innerHTML = title;
  document.getElementById('lay-b').innerHTML = body;
  document.getElementById('lay-f').innerHTML = foot || '<button class="k-btn ghost" onclick="layerClose()">关闭</button>';
  document.getElementById('layer').classList.add('on');
}
function layerClose() { document.getElementById('layer').classList.remove('on'); }

function keypad(targetId, maxLen) {
  var K = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'X', '0', 'del'];
  return '<div class="kiosk-key">' + K.map(function (k) {
    var t = k === 'del' ? '<i class="fa-solid fa-delete-left"></i>' : k;
    return '<button data-fp="wsmh-28" onclick="kpTap(\'' + targetId + '\',\'' + k + '\',' + (maxLen || 18) + ')">' + t + '</button>';
  }).join('') + '</div>';
}
function kpTap(id, k, maxLen) {
  var el = document.getElementById(id); if (!el) return;
  if (k === 'del') { el.value = el.value.slice(0, -1); return; }
  if (el.value.length >= maxLen) { UI.toast('已达到最大输入长度', 'warning'); return; }
  el.value += k;
}

function authOpen(afterName) {
  layer('<i class="fa-solid fa-id-card"></i> 身份核验',
    '<div style="font-size:20px;line-height:1.9;margin-bottom:22px">'
    + '按对外服务口径，终端查询与打印均须先核验身份，核验与查询全过程留痕。</div>'
    + '<label class="k-lb">身份证号码</label>'
    + '<input class="k-in" id="au-id" placeholder="请点击右侧数字键盘输入" readonly>'
    + '<div class="k-key-wrap">' + keypad('au-id', 18)
    + '<div class="k-way">'
    + '<button data-fp="wsmh-28" onclick="authCard()"><i class="fa-solid fa-id-card-clip"></i> 刷身份证（读卡区）</button>'
    + '<button data-fp="wsmh-28" onclick="authFace()"><i class="fa-solid fa-face-smile"></i> 人脸识别（对准摄像头）</button>'
    + '<div style="font-size:17px;color:var(--text-3);line-height:1.8">'
    + '演示环境：数字键盘输入 6 位以上即可通过；刷卡与人脸识别为模拟过程。</div>'
    + '</div></div>'
    + '<div class="k-note"><i class="fa-solid fa-shield-halved"></i> '
    + '本终端不留存您的证件信息，办理结束或离开后自动清除。'
    + (afterName ? '核验通过后将继续「' + UI.esc(afterName) + '」。' : '') + '</div>',
    '<button class="k-btn ghost" data-fp="wsmh-28" onclick="layerClose()">取消</button>'
    + '<button class="k-btn" data-fp="wsmh-28" onclick="authOk()"><i class="fa-solid fa-check"></i> 核验并继续</button>');
}
function authCard() {
  var el = document.getElementById('au-id');
  if (el) el.value = '450202198703150000';
  UI.toast('已读取身份证信息，请点击「核验并继续」', 'success');
}
function authFace() {
  UI.toast('正在进行人脸识别，请对准摄像头…', 'info');
  setTimeout(function () {
    var el = document.getElementById('au-id');
    if (el) el.value = '450202198703150000';
    UI.toast('人脸识别通过，与公安人口库比对一致', 'success');
    setTimeout(authOk, 500);
  }, 1400);
}
function authOk() {
  var el = document.getElementById('au-id');
  if (!el || el.value.length < 6) { UI.toast('请输入身份证号码（演示环境 6 位以上即可）', 'warning'); return; }
  kvSet(true); layerClose();
  UI.toast('身份核验通过，已核验：' + KUSER + '，本次核验已记入查询留痕', 'success');
  renderAuth();
  if (PEND) { var f = PEND; PEND = null; setTimeout(f, 300); }
}
var BOOTED = 0;
function needAuth(name, fn) {
  if (kvGet()) return true;
  if (BOOTED) UI.toast('请先完成身份核验', 'warning');
  PEND = fn || null;
  authOpen(name);
  return false;
}

/* ===== 页面 ===== */
var MODE = 'query', QT = 'house';
var INITED = 0;
function pageInit() {
  if (INITED) return; INITED = 1;
  MODE = UI.param('fn') === 'print' ? 'print' : 'query';
  document.getElementById('f-tel').textContent = PORTAL.site().tel;
  tick(); setInterval(tick, 1000);

  document.getElementById('mode').innerHTML =
    '<button data-mode="query" data-fp="wsmh-28-01"><i class="fa-solid fa-magnifying-glass"></i> 自助查询</button>'
    + '<button data-mode="print" data-fp="wsmh-28-02"><i class="fa-solid fa-print"></i> 自助打印证明</button>';
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.onclick = function () { MODE = b.getAttribute('data-mode'); renderMode(); };
  });

  document.getElementById('q-types').innerHTML = [
    ['house', '房产信息', 'fa-house-circle-check'],
    ['case', '办件进度', 'fa-magnifying-glass-chart'],
    ['guide', '政策与办事指南', 'fa-book-open']
  ].map(function (x) {
    return '<button data-qt="' + x[0] + '" data-fp="wsmh-28-01"><i class="fa-solid ' + x[2] + '"></i>' + x[1] + '</button>';
  }).join('');
  document.querySelectorAll('[data-qt]').forEach(function (b) {
    b.onclick = function () { QT = b.getAttribute('data-qt'); renderQuery(); };
  });

  renderAuth(); renderMode();
  BOOTED = 1;
}
function tick() {
  var d = new Date();
  function p(n) { return n < 10 ? '0' + n : n; }
  document.getElementById('clock').textContent =
    d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
    + '　' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function renderAuth() {
  var ok = kvGet();
  var bar = document.getElementById('auth-bar');
  bar.style.borderLeftColor = ok ? 'var(--success)' : 'var(--accent)';
  bar.innerHTML = ok
    ? '<span class="kt-i"><i class="fa-solid fa-user-check"></i></span>'
    + '<div style="flex:1"><div class="kt-t">已核验：' + KUSER + '</div>'
    + '<div class="kt-d">可查询名下房产、办件进度与政策指南，并打印备案证明；查询与打印记录已留痕。</div></div>'
    + '<button class="k-btn ghost" onclick="authOpen()" data-fp="wsmh-28"><i class="fa-solid fa-repeat"></i> 重新核验</button>'
    : '<span class="kt-i" style="background:var(--accent-soft);color:var(--accent)"><i class="fa-solid fa-id-card"></i></span>'
    + '<div style="flex:1"><div class="kt-t">请先完成身份核验</div>'
    + '<div class="kt-d">核验后可查询名下房产、办件进度并打印备案证明。</div></div>'
    + '<button class="k-btn accent" onclick="authOpen()" data-fp="wsmh-28"><i class="fa-solid fa-fingerprint"></i> 身份核验</button>';
}
function renderMode() {
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-mode') === MODE);
  });
  document.getElementById('pg-t').textContent = MODE === 'print' ? '自助打印证明' : '自助查询';
  document.getElementById('p-query').style.display = MODE === 'query' ? 'block' : 'none';
  document.getElementById('p-print').style.display = MODE === 'print' ? 'block' : 'none';
  if (MODE === 'query') renderQuery(); else renderPrint();
}

/* ---------- 自助查询（wsmh-28-01） ---------- */
function renderQuery() {
  document.querySelectorAll('[data-qt]').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-qt') === QT);
  });
  if (QT === 'house') return qHouse();
  if (QT === 'case') return qCase();
  return qGuide();
}
function qHouse() {
  if (!needAuth('查询名下房产', qHouse)) {
    document.getElementById('q-body').innerHTML =
      '<div class="k-card"><div style="font-size:22px;text-align:center;color:var(--text-3);padding:30px 0">'
      + '<i class="fa-solid fa-lock" style="font-size:40px;display:block;margin-bottom:16px"></i>'
      + '查询名下房产需先完成身份核验</div></div>';
    return;
  }
  var cts = PORTAL.contracts(), loans = PORTAL.loans();
  var mortgage = loans.filter(function (l) { return l.zt === '已放款'; })[0];
  PORTAL.act('query.log', { dx: '本人名下房产', lx: '个人房产信息查询', yt: '自用', way: '政务自助终端' });

  document.getElementById('q-body').innerHTML =
    '<div class="k-card"><table class="k-tb"><thead><tr>'
    + '<th>房屋坐落</th><th style="width:150px">建筑面积</th><th style="width:230px">权属状态</th><th style="width:250px">抵押状态</th>'
    + '</tr></thead><tbody>'
    + cts.map(function (c, i) {
      var mo = i === 0 && mortgage;
      return '<tr><td class="b">' + UI.esc(c.xmmc) + ' ' + UI.esc(PORTAL.mask('fh', c.fw)) + '</td>'
        + '<td>' + c.mj + ' ㎡</td>'
        + '<td>' + (c.ba === '已备案' ? '合同已备案，待产权过户' : '合同备案中') + '</td>'
        + '<td>' + (mo ? '抵押中（' + UI.esc(mortgage.yh) + '）' : '无抵押登记记录') + '</td></tr>';
    }).join('') + '</tbody></table>'
    + '<div class="k-ok"><i class="fa-solid fa-clipboard-check"></i> '
    + '共查询到 <b>' + cts.length + '</b> 处名下房屋。本次查询记录已留痕（查询人 ' + KUSER
    + '，查询方式 政务自助终端，时间 ' + PDATA.ymdhm(Date.now()) + '），'
    + '可在网页版「查询中心 → 查询授权与留痕」查看完整记录。房号按规定截断展示。</div>'
    + '<div class="k-note"><i class="fa-solid fa-triangle-exclamation"></i> '
    + '本查询结果仅反映交易备案环节的权属与抵押状态，产权登记信息以不动产登记机构出具的证书为准。'
    + '如需正式书面结果，请切换到「自助打印证明」出具带二维码防伪的证明。</div>'
    + '<div style="text-align:center;margin-top:24px">'
    + '<button class="k-btn" onclick="MODE=\'print\';renderMode();" data-fp="wsmh-28-02">'
    + '<i class="fa-solid fa-print"></i> 打印查询结果证明</button></div>'
    + '</div>';
}
function qCase() {
  if (!needAuth('查询办件进度', qCase)) {
    document.getElementById('q-body').innerHTML =
      '<div class="k-card"><div style="font-size:22px;text-align:center;color:var(--text-3);padding:30px 0">'
      + '<i class="fa-solid fa-lock" style="font-size:40px;display:block;margin-bottom:16px"></i>'
      + '查询办件进度需先完成身份核验</div></div>';
    return;
  }
  var cs = PORTAL.cases();
  document.getElementById('q-body').innerHTML =
    '<div class="k-card">'
    + '<label class="k-lb">请输入办件编号（可只输入编号中的数字部分）</label>'
    + '<input class="k-in" id="bh" placeholder="例：2026001862" readonly>'
    + '<div class="k-key-wrap">' + keypad('bh', 14)
    + '<div class="k-way">'
    + '<button data-fp="wsmh-28-01" onclick="doCase()"><i class="fa-solid fa-magnifying-glass"></i> 查询进度</button>'
    + '<button data-fp="wsmh-28-01" onclick="document.getElementById(\'bh\').value=\'\'"><i class="fa-solid fa-eraser"></i> 清空重输</button>'
    + '<div style="font-size:18px;color:var(--text-3);line-height:1.8">'
    + '凭办件编号查询；名下办件编号见下方，点击即可填入。</div>'
    + '</div></div>'
    + '<div style="margin-top:22px">' + cs.slice(0, 4).map(function (c) {
      return '<button class="k-chip" onclick="document.getElementById(\'bh\').value=\''
        + c.bh.replace(/\D/g, '') + '\';doCase()" data-fp="wsmh-28-01">'
        + '<i class="fa-solid fa-hashtag"></i>' + c.bh + '　' + UI.esc(c.sxmc.slice(0, 12)) + '</button>';
    }).join('') + '</div>'
    + '<div id="case-res"></div></div>';
}
function doCase() {
  var v = document.getElementById('bh').value.trim();
  if (v.length < 4) { UI.toast('请输入至少 4 位办件编号数字', 'warning'); return; }
  var hit = PORTAL.cases().filter(function (c) {
    return c.bh.indexOf(v) >= 0 || c.bh.replace(/\D/g, '').indexOf(v) >= 0;
  })[0];
  if (!hit) {
    document.getElementById('case-res').innerHTML =
      '<div class="k-note" style="margin-top:26px"><i class="fa-solid fa-circle-exclamation"></i> '
      + '未查询到编号包含「' + UI.esc(v) + '」的办件。请核对办件编号，或凭身份证到窗口查询，咨询电话 '
      + PORTAL.site().tel + '。</div>';
    UI.toast('未查询到该办件，请核对编号', 'error');
    return;
  }
  PORTAL.act('query.log', { dx: hit.bh + ' ' + hit.sxmc, lx: '网签备案进度查询', yt: '自用', way: '政务自助终端' });
  var st = PORTAL.CASE_ST[hit.zt];
  document.getElementById('case-res').innerHTML =
    '<div style="margin-top:26px">'
    + '<div class="k-dl"><dl>'
    + '<dt>办件编号</dt><dd><b style="font-size:24px">' + UI.esc(hit.bh) + '</b></dd>'
    + '<dt>事项名称</dt><dd>' + UI.esc(hit.sxmc) + '</dd>'
    + '<dt>房屋坐落</dt><dd>' + UI.esc(PORTAL.mask('fh', hit.fw)) + '</dd>'
    + '<dt>承办科室</dt><dd>' + UI.esc(hit.dept) + '</dd>'
    + '<dt>当前状态</dt><dd><b style="font-size:24px;color:var(--primary)">' + st.n + '</b>'
    + (hit.zt === '3' ? '　<span style="color:var(--accent)">需补正：' + UI.esc(hit.bzyq) + '</span>' : '')
    + (hit.zt === '5' ? '　<span style="color:var(--accent)">退件原因：' + UI.esc(hit.tjly) + '</span>' : '')
    + '</dd>'
    + '<dt>提交时间</dt><dd>' + UI.esc(hit.sqrq) + '</dd>'
    + '<dt>办结时间</dt><dd>' + (hit.bjrq ? UI.esc(hit.bjrq) : '办理中') + '</dd>'
    + '</dl></div>'
    + '<div class="k-card" style="margin-top:24px"><div class="k-steps">'
    + hit.steps.map(function (s) {
      var cls = s.s === 1 ? 'done' : (s.s === 2 || s.s === 3 ? 'cur' : '');
      var ico = s.s === 1 ? '<i class="fa-solid fa-check"></i>'
        : (s.s === 3 ? '<i class="fa-solid fa-exclamation"></i>'
          : (s.s === 4 ? '<i class="fa-solid fa-xmark"></i>' : '<i class="fa-solid fa-hourglass-half"></i>'));
      return '<div class="ks-i ' + cls + '"><div class="ks-n">' + ico + '</div>'
        + '<div class="ks-t">' + s.n + '</div>'
        + '<div class="ks-d">' + (s.d || (s.s === 0 ? '待办理' : '进行中')) + '</div></div>';
    }).join('') + '</div></div>'
    + '<div class="k-ok"><i class="fa-solid fa-clipboard-check"></i> '
    + '本次查询已留痕。终端与网上入口同源，可在网页版「二手房进度查询」或个人中心「我的办件」查看完整时间轴与材料清单。</div>'
    + (hit.zt === '4'
      ? '<div style="text-align:center;margin-top:24px"><button class="k-btn" onclick="MODE=\'print\';renderMode();" data-fp="wsmh-28-02">'
      + '<i class="fa-solid fa-print"></i> 该办件已办结，去打印备案证明</button></div>' : '')
    + '</div>';
  UI.toast('已查询到办件 ' + hit.bh + '，当前状态：' + st.n, 'success');
}
function qGuide() {
  var items = PORTAL.items().slice(0, 8);
  document.getElementById('q-body').innerHTML =
    '<div class="k-card">'
    + '<div style="font-size:19px;color:var(--text-2);margin-bottom:18px">'
    + '政策与办事指南为公开信息，无需核验即可查看。点击事项查看办理要点。</div>'
    + '<div class="k-glist" id="g-list">' + items.map(function (it, i) {
      return '<button data-gi="' + i + '" data-fp="wsmh-28-01"><i class="fa-solid fa-file-lines text-primary"></i>'
        + '<span>' + UI.esc(it.name)
        + '<span class="gl-d">' + it.dept + '　承诺 ' + it.nsrq + ' 个工作日　' + it.clnum + ' 份材料　'
        + (it.wb ? '全程网办' : '需到窗口') + '</span></span></button>';
    }).join('') + '</div>'
    + '<div id="g-detail"></div>'
    + '<div style="text-align:center;margin-top:24px">'
    + '<a class="k-btn ghost" href="../web/guide.html" data-fp="wsmh-28-01"><i class="fa-solid fa-globe"></i> 网页版查看全部指南与政策原文</a>'
    + '</div></div>';

  document.querySelectorAll('[data-gi]').forEach(function (b) {
    b.onclick = function () {
      document.querySelectorAll('[data-gi]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      var it = items[Number(b.getAttribute('data-gi'))];
      document.getElementById('g-detail').innerHTML =
        '<div class="k-dl" style="margin-top:10px"><dl>'
        + '<dt>事项名称</dt><dd><b>' + UI.esc(it.name) + '</b></dd>'
        + '<dt>办理时限</dt><dd>法定 ' + it.fdrq + ' 个工作日，承诺 <b>' + it.nsrq + '</b> 个工作日</dd>'
        + '<dt>办理条件</dt><dd>' + UI.esc(it.tj) + '</dd>'
        + '<dt>申请材料</dt><dd>' + it.cl.map(function (c) {
          return UI.esc(c.mc) + (c.mian ? '（可免提交）' : '');
        }).join('、') + '</dd>'
        + '<dt>收费标准</dt><dd>' + UI.esc(it.sf) + '</dd>'
        + '<dt>办理地点</dt><dd>' + UI.esc(it.dd) + '</dd>'
        + '</dl></div>';
      UI.toast('已展示「' + it.name + '」办理要点', 'info');
    };
  });
}

/* ---------- 自助打印（wsmh-28-02 / wsmh-27-01） ---------- */
function renderPrint() {
  if (!needAuth('自助打印证明', renderPrint)) {
    document.getElementById('pr-body').innerHTML =
      '<div class="k-card"><div style="font-size:22px;text-align:center;color:var(--text-3);padding:30px 0">'
      + '<i class="fa-solid fa-lock" style="font-size:40px;display:block;margin-bottom:16px"></i>'
      + '打印证明需先完成身份核验</div></div>';
    return;
  }
  var done = PORTAL.cases({ zt: '4' });
  var certs = PORTAL.certs();

  var h = '<div class="k-card">'
    + '<div class="k-sec-t" style="font-size:23px"><i class="fa-solid fa-file-circle-check text-success"></i> 已办结办件（可出具备案证明）</div>';
  if (!done.length) {
    h += '<div style="font-size:20px;color:var(--text-3);padding:20px 0">'
      + '当前没有已办结的办件。办件办结后可在此处自助出具并打印备案证明。</div>';
  } else {
    h += '<table class="k-tb"><thead><tr><th>事项名称</th><th style="width:230px">房屋坐落</th>'
      + '<th style="width:190px">办结时间</th><th style="width:230px">操作</th></tr></thead><tbody>'
      + done.map(function (c) {
        return '<tr><td class="b">' + UI.esc(c.sxmc) + '<div style="font-size:17px;color:var(--text-3)">'
          + UI.esc(c.bh) + '</div></td>'
          + '<td>' + UI.esc(PORTAL.mask('fh', c.fw)) + '</td>'
          + '<td>' + UI.esc(c.bjrq) + '</td>'
          + '<td><button class="k-btn" style="height:64px;font-size:21px;padding:0 22px" '
          + 'onclick="doPrint(\'' + c.id + '\')" data-fp="wsmh-28-02">'
          + '<i class="fa-solid fa-print"></i> 打印备案证明</button></td></tr>';
      }).join('') + '</tbody></table>';
  }
  h += '</div>';

  h += '<div class="k-card">'
    + '<div class="k-sec-t" style="font-size:23px"><i class="fa-solid fa-file-shield text-primary"></i> 已出具证明（可重复打印）</div>';
  if (!certs.length) {
    h += '<div style="font-size:20px;color:var(--text-3);padding:20px 0">暂无已出具的证明。</div>';
  } else {
    h += '<table class="k-tb"><thead><tr><th>证明类型</th><th style="width:200px">证明编号</th>'
      + '<th style="width:150px">验真码</th><th style="width:150px">有效期至</th><th style="width:190px">操作</th></tr></thead><tbody>'
      + certs.map(function (c) {
        var valid = c.zt === '1';
        return '<tr><td class="b">' + UI.esc(c.lx) + '<div style="font-size:17px;color:var(--text-3)">'
          + UI.esc(PORTAL.mask('fh', c.fw)) + '</div></td>'
          + '<td>' + UI.esc(c.bh) + '</td>'
          + '<td><b style="color:var(--accent);letter-spacing:3px">' + UI.esc(c.yzm) + '</b></td>'
          + '<td>' + UI.esc(c.yxq) + (valid ? '' : '<div style="color:var(--accent);font-size:17px">已过期</div>') + '</td>'
          + '<td><button class="k-btn ' + (valid ? 'ghost' : 'gray') + '" style="height:64px;font-size:21px;padding:0 22px" '
          + 'onclick="rePrint(\'' + c.id + '\')" data-fp="wsmh-27-01">'
          + '<i class="fa-solid fa-print"></i> ' + (valid ? '重新打印' : '重新出证') + '</button></td></tr>';
      }).join('') + '</tbody></table>';
  }
  h += '<div class="k-note"><i class="fa-solid fa-circle-info"></i> '
    + '终端打印的证明与网上出证记录<b>同源同效</b>，均带二维码与验真码，可在网页版「查询中心 → 扫码验真」核验真伪；'
    + '证明有效期 90 天，过期可重新出证。</div></div>';

  document.getElementById('pr-body').innerHTML = h;
}
function doPrint(caseId) {
  var c = PORTAL.caseOf(caseId);
  if (!c) { UI.toast('未找到该办件', 'error'); return; }
  var lx = c.sxmc.replace('网签备案', '备案证明').replace(/申请|登记|缴存/, '证明');
  var cert = PORTAL.act('cert.issue', { lx: lx, fw: c.fw, yt: '自助终端打印' });
  showCert(cert, c);
}
function rePrint(certId) {
  var c = PORTAL.certs().filter(function (x) { return x.id === certId; })[0];
  if (!c) { UI.toast('未找到该证明', 'error'); return; }
  if (c.zt !== '1') {
    var nc = PORTAL.act('cert.issue', { lx: c.lx, fw: c.fw, yt: '自助终端重新出证' });
    showCert(nc, null);
    return;
  }
  showCert(c, null);
}
function showCert(cert, c) {
  layer('<i class="fa-solid fa-print"></i> 正在打印证明，请稍候',
    '<div class="cert-pv">'
    + '<div class="cp-t">XXXX市房产交易管理中心</div>'
    + '<div class="cp-s">' + UI.esc(cert.lx) + '</div>'
    + '<div class="cp-c">' + UI.esc(cert.nr) + '</div>'
    + '<div class="k-dl"><dl>'
    + '<dt>证明编号</dt><dd><b>' + UI.esc(cert.bh) + '</b></dd>'
    + '<dt>房屋坐落</dt><dd>' + UI.esc(PORTAL.mask('fh', cert.fw)) + '</dd>'
    + '<dt>出证时间</dt><dd>' + UI.esc(cert.d) + '　出证方式：政务自助终端</dd>'
    + '<dt>有效期至</dt><dd>' + UI.esc(cert.yxq) + '（90 天）</dd>'
    + '<dt>用途</dt><dd>' + UI.esc(cert.yt) + '</dd>'
    + '</dl></div>'
    + '<div style="margin-top:24px;display:flex;align-items:center;gap:30px;justify-content:center">'
    + '<div><div style="font-size:19px;color:var(--text-3);margin-bottom:8px">验真码</div>'
    + '<div class="cp-code">' + UI.esc(cert.yzm) + '</div></div>'
    + '<div><div class="cp-qr"><i class="fa-solid fa-qrcode"></i></div>'
    + '<div style="font-size:17px;color:var(--text-3);margin-top:8px">扫码验真</div></div>'
    + '</div></div>'
    + '<div class="pr-bar"><i></i></div>'
    + '<div id="pr-st" style="text-align:center;font-size:22px;font-weight:700;color:var(--primary)">'
    + '<i class="fa-solid fa-spinner fa-spin"></i> 正在打印… 请在出纸口取走凭证</div>',
    '<button class="k-btn gray" data-fp="wsmh-28-02" onclick="layerClose()">关闭</button>');

  setTimeout(function () {
    var st = document.getElementById('pr-st');
    if (st) {
      st.innerHTML = '<i class="fa-solid fa-circle-check text-success"></i> 打印完成，共 1 页，请取走凭证';
      st.style.color = 'var(--success)';
    }
    document.getElementById('lay-h').innerHTML = '<i class="fa-solid fa-circle-check"></i> 打印完成';
    document.getElementById('lay-f').innerHTML =
      '<button class="k-btn ghost" data-fp="wsmh-28-02" onclick="layerClose();renderPrint()">完成</button>'
      + '<a class="k-btn" href="../web/query-verify.html" data-fp="wsmh-27-01"><i class="fa-solid fa-qrcode"></i> 网页版验真</a>';
    UI.toast('打印完成，请取走凭证。该证明与网上出证记录同源，可在网页版查询中心验真', 'success');
  }, 2300);
}

/* 无 data-nav 时 portal.js 仍会调用 pageInit；此处兜底调用一次 */
pageInit();
</script>
</body>
</html>
