<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自助申报 · 缴款 · 取号 · 房产交易自助服务终端</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  /* 自助终端专属：1080×1920 竖屏触控，正文 ≥18px，按钮高 ≥64px */
  .k-btn {
    height: 84px; padding: 0 40px; font-size: 28px; font-weight: 700; border-radius: 14px;
    border: 0; background: var(--primary); color: #fff; cursor: pointer; font-family: var(--font);
    display: inline-flex; align-items: center; justify-content: center; gap: 14px; flex: none;
  }
  .k-btn:hover { background: var(--primary-hover); }
  .k-btn.ghost { background: #fff; color: var(--primary); border: 3px solid var(--primary); }
  .k-btn.accent { background: var(--accent); }
  .k-btn.accent:hover { background: #d8352b; }
  .k-btn.gray { background: #e2e7f0; color: var(--text-2); }
  .k-tip {
    background: #fff; border-radius: 18px; padding: 26px 30px; margin-bottom: 26px;
    box-shadow: 0 6px 20px rgba(16, 38, 76, .1); display: flex; align-items: center; gap: 24px;
    border-left: 10px solid var(--success);
  }
  .k-tip .kt-i {
    width: 76px; height: 76px; border-radius: 22px; flex: none; display: flex; align-items: center;
    justify-content: center; font-size: 34px; background: var(--success-light); color: var(--success);
  }
  .k-tip .kt-t { font-size: 27px; font-weight: 700; }
  .k-tip .kt-d { font-size: 18px; color: var(--text-2); margin-top: 8px; line-height: 1.7; }
  .k-sec-t { font-size: 26px; font-weight: 700; margin: 0 0 20px; display: flex; align-items: center; gap: 12px; }
  .k-sec-t span { font-size: 18px; color: var(--text-3); font-weight: 400; }
  .k-mode { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
  .k-mode button {
    height: 116px; border-radius: 16px; border: 3px solid var(--border-strong); background: #fff;
    font-size: 25px; font-weight: 700; cursor: pointer; font-family: var(--font); color: var(--text-1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
  }
  .k-mode button i { font-size: 30px; color: var(--primary); }
  .k-mode button.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .k-card { background: #fff; border-radius: 18px; padding: 28px 30px; box-shadow: 0 6px 20px rgba(16, 38, 76, .08); margin-bottom: 26px; }
  .k-in {
    width: 100%; height: 78px; font-size: 30px; padding: 0 22px; letter-spacing: 2px;
    border: 2px solid var(--border-strong); border-radius: 12px; background: #fff;
    font-family: var(--font); color: var(--text-1); outline: 0;
  }
  .k-in[readonly] { background: var(--bg-soft); color: var(--text-2); }
  .k-lb { font-size: 20px; font-weight: 700; margin-bottom: 12px; display: block; }
  .k-key-wrap { display: flex; gap: 26px; align-items: flex-start; margin-top: 22px; }
  .k-way { flex: 1; }
  .k-way button {
    width: 100%; height: 74px; font-size: 22px; margin-bottom: 16px; border-radius: 12px;
    border: 2px solid var(--primary); background: #fff; color: var(--primary); cursor: pointer;
    font-family: var(--font); display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .k-way button:hover { background: var(--primary-light); }
  .k-chip {
    display: inline-flex; align-items: center; gap: 8px; border: 2px solid var(--primary-soft);
    background: var(--primary-light-2); color: var(--primary); border-radius: 12px;
    padding: 12px 18px; font-size: 19px; cursor: pointer; margin: 0 12px 12px 0; font-family: var(--font);
  }
  .k-chip:hover { border-color: var(--primary); }
  .k-note {
    background: var(--warning-light); border: 1px solid #f5dab0; color: #b45309;
    border-radius: 12px; padding: 16px 20px; font-size: 18px; line-height: 1.8; margin-top: 20px;
  }
  .k-danger {
    background: var(--danger-light); border: 2px solid #f5c2be; color: #b91c1c;
    border-radius: 12px; padding: 16px 20px; font-size: 20px; font-weight: 700; line-height: 1.7; margin-top: 18px;
  }
  .k-ok {
    background: var(--success-light); border: 1px solid #bfe8cf; color: #15803d;
    border-radius: 12px; padding: 16px 20px; font-size: 18px; line-height: 1.8; margin-top: 20px;
  }
  /* 大字分步 */
  .k-wz { display: flex; gap: 14px; margin-bottom: 28px; }
  .k-wz .wi {
    flex: 1; background: #fff; border-radius: 14px; padding: 20px; text-align: center;
    border: 3px solid var(--border); color: var(--text-3);
  }
  .k-wz .wi.on { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
  .k-wz .wi.done { border-color: var(--success); background: var(--success-light); color: #15803d; }
  .k-wz .wi .wn { font-size: 30px; font-weight: 700; }
  .k-wz .wi .wt { font-size: 21px; font-weight: 700; margin-top: 6px; }
  /* 缴款大卡 */
  .pay-card { border: 3px solid var(--border); border-radius: 18px; padding: 26px 28px; background: #fff; margin-bottom: 22px; }
  .pay-card.on { border-color: var(--primary); }
  .pay-card .pc-h { display: flex; align-items: center; gap: 16px; }
  .pay-card .pc-t { font-size: 26px; font-weight: 700; }
  .pay-card .pc-je { font-size: 46px; font-weight: 700; color: var(--accent); font-family: "DIN Alternate", var(--font); margin-left: auto; }
  .k-dl dl { display: flex; flex-wrap: wrap; margin: 0; border: 2px solid var(--border); border-radius: 14px; overflow: hidden; background: #fff; }
  .k-dl dt, .k-dl dd { margin: 0; padding: 18px 22px; font-size: 19px; border-bottom: 1px solid var(--row-line); }
  .k-dl dt { width: 210px; flex: none; background: var(--bg-soft); color: var(--text-3); }
  .k-dl dd { flex: 1; min-width: 260px; color: var(--text-1); }
  /* 网点与业务类型选择 */
  .k-pick { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .k-pick button {
    text-align: left; background: #fff; border: 3px solid var(--border); border-radius: 14px;
    padding: 20px 22px; font-size: 22px; cursor: pointer; font-family: var(--font); color: var(--text-1);
  }
  .k-pick button .pk-d { font-size: 17px; color: var(--text-3); display: block; margin-top: 8px; line-height: 1.6; }
  .k-pick button.on { border-color: var(--primary); background: var(--primary-light-2); }
  .k-pick.c3 { grid-template-columns: repeat(3, 1fr); }
  /* 弹层 */
  .k-layer {
    position: fixed; left: 0; top: 0; right: 0; bottom: 0; background: rgba(8, 20, 45, .74);
    z-index: 900; display: none; align-items: center; justify-content: center; padding: 60px 40px;
  }
  .k-layer.on { display: flex; }
  .k-panel {
    background: #f5f8fc; border-radius: 26px; width: 100%; max-width: 900px; max-height: 88vh;
    overflow: auto; box-shadow: 0 30px 90px rgba(0, 0, 0, .45);
  }
  .k-panel .kp-h {
    background: linear-gradient(135deg, var(--primary), var(--primary-deep)); color: #fff;
    padding: 26px 34px; font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 14px;
  }
  .k-panel.ok .kp-h { background: linear-gradient(135deg, #1eab5c, #12783a); }
  .k-panel .kp-b { padding: 30px 34px; font-size: 20px; line-height: 1.85; color: var(--text-1); }
  .k-panel .kp-f { padding: 0 34px 30px; display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .big-no { font-size: 96px; font-weight: 700; color: var(--accent); letter-spacing: 6px; font-family: "DIN Alternate", var(--font); line-height: 1.1; }
  .big-bh { font-size: 40px; font-weight: 700; color: var(--primary); letter-spacing: 3px; font-family: "DIN Alternate", var(--font); }
  .qr-ph {
    width: 160px; height: 160px; border: 2px solid var(--border); border-radius: 10px; margin: 0 auto;
    display: flex; align-items: center; justify-content: center; font-size: 86px; color: var(--primary); background: #fff;
  }
  .kiosk-foot a { font-size: 19px; }
</style>
</head>
<body class="kiosk">

<div class="kiosk-frame">
  <div class="kiosk-head">
    <button class="k-btn ghost" style="height:70px;font-size:22px;padding:0 26px" onclick="location.href='index.html'" data-fp="wsmh-28">
      <i class="fa-solid fa-arrow-left"></i> 返回首页</button>
    <div>
      <div class="kh-t1" style="font-size:32px" id="pg-t">存量房自助申报</div>
      <div class="kh-t2">终端与网上入口同源 · 办理结果可在网页版继续查看</div>
    </div>
    <div class="kh-r">
      <div id="clock" style="font-size:22px;font-weight:700">--:--:--</div>
      <div style="margin-top:6px">文昌大厅 T01</div>
    </div>
  </div>

  <div class="kiosk-body">
    <div class="k-tip" id="auth-bar"></div>
    <div class="k-mode" id="mode"></div>
    <div id="body"></div>
  </div>

  <div class="kiosk-foot">
    <span><i class="fa-solid fa-phone"></i> 咨询电话 <b id="f-tel">—</b></span>
    <span><i class="fa-solid fa-clock"></i> <span id="f-time">—</span></span>
    <span style="margin-left:auto"></span>
    <button class="k-btn" style="height:64px;font-size:22px;padding:0 28px" onclick="location.href='index.html'" data-fp="wsmh-28">
      <i class="fa-solid fa-house"></i> 返回终端首页</button>
  </div>
</div>

<div class="k-layer" id="layer">
  <div class="k-panel" id="panel">
    <div class="kp-h" id="lay-h"></div>
    <div class="kp-b" id="lay-b"></div>
    <div class="kp-f" id="lay-f"></div>
  </div>
</div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
/* ===== 终端通用：核验状态、弹层、数字键盘 ===== */
var KUSER = '韦*强';
var KV = false;
var PEND = null;
var BOOTED = 0;
function kvGet() { try { return sessionStorage.getItem('wsmh.kiosk.v') === '1'; } catch (e) { return KV; } }
function kvSet(v) { KV = v; try { sessionStorage.setItem('wsmh.kiosk.v', v ? '1' : '0'); } catch (e) { } }

function layer(title, body, foot, ok) {
  document.getElementById('panel').className = 'k-panel' + (ok ? ' ok' : '');
  document.getElementById('lay-h').innerHTML = title;
  document.getElementById('lay-b').innerHTML = body;
  document.getElementById('lay-f').innerHTML = foot || '<button class="k-btn ghost" onclick="layerClose()">关闭</button>';
  document.getElementById('layer').classList.add('on');
}
function layerClose() { document.getElementById('layer').classList.remove('on'); }

function keypad(targetId, maxLen) {
  var K = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'X', '0', 'del'];
  return '<div class="kiosk-key">' + K.map(function (k) {
    var t = k === 'del' ? '<i class="fa-solid fa-delete-left"></i>' : k;
    return '<button data-fp="wsmh-28" onclick="kpTap(\'' + targetId + '\',\'' + k + '\',' + (maxLen || 18) + ')">' + t + '</button>';
  }).join('') + '</div>';
}
function kpTap(id, k, maxLen) {
  var el = document.getElementById(id); if (!el) return;
  if (k === 'del') { el.value = el.value.slice(0, -1); return; }
  if (el.value.length >= maxLen) { UI.toast('已达到最大输入长度', 'warning'); return; }
  el.value += k;
}

function authOpen(afterName) {
  layer('<i class="fa-solid fa-id-card"></i> 身份核验',
    '<div style="font-size:20px;line-height:1.9;margin-bottom:22px">'
    + '按对外服务口径，终端申报、缴款与取号均须先核验身份，核验与办理过程全程留痕。</div>'
    + '<label class="k-lb">身份证号码</label>'
    + '<input class="k-in" id="au-id" placeholder="请点击右侧数字键盘输入" readonly>'
    + '<div class="k-key-wrap">' + keypad('au-id', 18)
    + '<div class="k-way">'
    + '<button data-fp="wsmh-28" onclick="authCard()"><i class="fa-solid fa-id-card-clip"></i> 刷身份证（读卡区）</button>'
    + '<button data-fp="wsmh-28" onclick="authFace()"><i class="fa-solid fa-face-smile"></i> 人脸识别（对准摄像头）</button>'
    + '<div style="font-size:17px;color:var(--text-3);line-height:1.8">'
    + '演示环境：数字键盘输入 6 位以上即可通过；刷卡与人脸识别为模拟过程。</div>'
    + '</div></div>'
    + '<div class="k-note"><i class="fa-solid fa-shield-halved"></i> '
    + '本终端不留存您的证件信息，办理结束或离开后自动清除。'
    + (afterName ? '核验通过后将继续办理「' + UI.esc(afterName) + '」。' : '') + '</div>',
    '<button class="k-btn ghost" data-fp="wsmh-28" onclick="layerClose()">取消</button>'
    + '<button class="k-btn" data-fp="wsmh-28" onclick="authOk()"><i class="fa-solid fa-check"></i> 核验并继续</button>');
}
function authCard() {
  var el = document.getElementById('au-id');
  if (el) el.value = '450202198703150000';
  UI.toast('已读取身份证信息，请点击「核验并继续」', 'success');
}
function authFace() {
  UI.toast('正在进行人脸识别，请对准摄像头…', 'info');
  setTimeout(function () {
    var el = document.getElementById('au-id');
    if (el) el.value = '450202198703150000';
    UI.toast('人脸识别通过，与公安人口库比对一致', 'success');
    setTimeout(authOk, 500);
  }, 1400);
}
function authOk() {
  var el = document.getElementById('au-id');
  if (!el || el.value.length < 6) { UI.toast('请输入身份证号码（演示环境 6 位以上即可）', 'warning'); return; }
  kvSet(true); layerClose();
  UI.toast('身份核验通过，已核验：' + KUSER, 'success');
  renderAuth();
  if (PEND) { var f = PEND; PEND = null; setTimeout(f, 300); } else { render(); }
}
function needAuth(name, fn) {
  if (kvGet()) return true;
  if (BOOTED) UI.toast('请先完成身份核验', 'warning');
  PEND = fn || null;
  authOpen(name);
  return false;
}
function lockCard(text) {
  return '<div class="k-card"><div style="font-size:22px;text-align:center;color:var(--text-3);padding:30px 0">'
    + '<i class="fa-solid fa-lock" style="font-size:40px;display:block;margin-bottom:16px"></i>' + text + '</div></div>';
}

/* ===== 页面 ===== */
var MODE = 'apply', STEP = 1;
var DATA = { hym: '', hid: '', zj: '', mf: '', sf: '' };
var PICK = { wd: 'WD01', yw: '存量房备案' };
var INITED = 0;

function pageInit() {
  if (INITED) return; INITED = 1;
  var fn = UI.param('fn');
  MODE = (fn === 'pay' || fn === 'queue') ? fn : 'apply';
  var s = PORTAL.site();
  document.getElementById('f-tel').textContent = s.tel;
  document.getElementById('f-time').textContent = '自助服务时间 07:00-22:00';
  tick(); setInterval(tick, 1000);

  document.getElementById('mode').innerHTML = [
    ['apply', '存量房自助申报', 'fa-file-signature', 'wsmh-16-04'],
    ['pay', '购房款缴存', 'fa-money-check-dollar', 'wsmh-28-03'],
    ['queue', '业务取号', 'fa-ticket', 'wsmh-28-03']
  ].map(function (x) {
    return '<button data-mode="' + x[0] + '" data-fp="' + x[3] + '">'
      + '<i class="fa-solid ' + x[2] + '"></i>' + x[1] + '</button>';
  }).join('');
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.onclick = function () { MODE = b.getAttribute('data-mode'); STEP = 1; render(); };
  });

  renderAuth(); render();
  BOOTED = 1;
}
function tick() {
  var d = new Date();
  function p(n) { return n < 10 ? '0' + n : n; }
  document.getElementById('clock').textContent =
    d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate())
    + '　' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
}
function renderAuth() {
  var ok = kvGet(), bar = document.getElementById('auth-bar');
  bar.style.borderLeftColor = ok ? 'var(--success)' : 'var(--accent)';
  bar.innerHTML = ok
    ? '<span class="kt-i"><i class="fa-solid fa-user-check"></i></span>'
    + '<div style="flex:1"><div class="kt-t">已核验：' + KUSER + '</div>'
    + '<div class="kt-d">可自助申报存量房网签备案、缴存购房款与维修资金、选网点取号；办理结果同步到网页版。</div></div>'
    + '<button class="k-btn ghost" onclick="authOpen()" data-fp="wsmh-28"><i class="fa-solid fa-repeat"></i> 重新核验</button>'
    : '<span class="kt-i" style="background:var(--accent-soft);color:var(--accent)"><i class="fa-solid fa-id-card"></i></span>'
    + '<div style="flex:1"><div class="kt-t">请先完成身份核验</div>'
    + '<div class="kt-d">核验后可自助申报、缴款与取号。</div></div>'
    + '<button class="k-btn accent" onclick="authOpen()" data-fp="wsmh-28"><i class="fa-solid fa-fingerprint"></i> 身份核验</button>';
}
function render() {
  document.querySelectorAll('[data-mode]').forEach(function (b) {
    b.classList.toggle('on', b.getAttribute('data-mode') === MODE);
  });
  document.getElementById('pg-t').textContent =
    MODE === 'pay' ? '购房款缴存' : (MODE === 'queue' ? '业务取号' : '存量房自助申报');
  if (MODE === 'apply') return renderApply();
  if (MODE === 'pay') return renderPay();
  return renderQueue();
}

/* ---------- 一、存量房自助申报（wsmh-16-04） ---------- */
function renderApply() {
  if (!needAuth('存量房自助申报', renderApply)) {
    document.getElementById('body').innerHTML = lockCard('存量房自助申报需先完成身份核验');
    return;
  }
  if (STEP > 1 && !PORTAL.house(DATA.hid)) STEP = 1;
  var wz = ['房源核验码', '交易信息与双方身份', '确认提交'].map(function (t, i) {
    var n = i + 1;
    return '<div class="wi ' + (STEP === n ? 'on' : (STEP > n ? 'done' : '')) + '">'
      + '<div class="wn">' + (STEP > n ? '<i class="fa-solid fa-check"></i>' : n) + '</div>'
      + '<div class="wt">' + t + '</div></div>';
  }).join('');
  var h = '<div class="k-wz">' + wz + '</div>';

  if (STEP === 1) {
    var demo = PORTAL.houses({ lx: '2' }).slice(0, 3);
    h += '<div class="k-card">'
      + '<div class="k-sec-t" style="font-size:23px"><i class="fa-solid fa-shield-halved text-success"></i> 第 1 步：录入房源核验码</div>'
      + '<label class="k-lb">房源核验码（输入核验码中的数字部分）</label>'
      + '<input class="k-in" id="a-hym" value="' + UI.esc(DATA.hym) + '" placeholder="例：2026000137" readonly>'
      + '<div class="k-key-wrap">' + keypad('a-hym', 12)
      + '<div class="k-way">'
      + '<button data-fp="wsmh-16-04" onclick="step1()"><i class="fa-solid fa-magnifying-glass"></i> 核验并带出房源</button>'
      + '<button data-fp="wsmh-16-04" onclick="document.getElementById(\'a-hym\').value=\'\'"><i class="fa-solid fa-eraser"></i> 清空重输</button>'
      + '<div style="font-size:18px;color:var(--text-3);line-height:1.8">'
      + '核验码在房源详情页展示；核验通过才能签约备案，可有效防止虚假房源。</div>'
      + '</div></div>'
      + '<div style="margin-top:22px"><div style="font-size:18px;color:var(--text-3);margin-bottom:10px">'
      + '演示可用核验码，点击即可填入：</div>'
      + demo.map(function (x) {
        return '<button class="k-chip" onclick="document.getElementById(\'a-hym\').value=\''
          + x.hym.replace(/\D/g, '') + '\';step1()" data-fp="wsmh-16-04">'
          + '<i class="fa-solid fa-house"></i>' + UI.esc(x.hym) + '　' + UI.esc(x.xqmc) + '</button>';
      }).join('') + '</div>'
      + '<div id="a-res"></div></div>';
  }

  if (STEP === 2) {
    var hs = PORTAL.house(DATA.hid);
    h += '<div class="k-card">'
      + '<div class="k-sec-t" style="font-size:23px"><i class="fa-solid fa-file-pen text-primary"></i> 第 2 步：交易信息与双方身份</div>'
      + '<div class="k-dl" style="margin-bottom:24px"><dl>'
      + '<dt>房屋坐落</dt><dd><b>' + UI.esc(hs.xqmc) + ' ' + UI.esc(hs.fhMask) + '</b></dd>'
      + '<dt>建筑面积</dt><dd>' + hs.mj + ' ㎡　' + UI.esc(hs.hx) + '　' + UI.esc(hs.cx) + '</dd>'

function sumQueue() {

    + (w.dd * 6 + 3) + '</b> 分钟';

function takeNo() {
  var w = PORTAL.outlets({ lx: '交易备案办理点' }).filter(function (x) { return x.id === PICK.wd; })[0];
  if (!w) { UI.toast('请先选择办理网点', 'warning'); return; }
  if (w.xm.indexOf(PICK.yw) < 0) { UI.toast('该网点不办理' + PICK.yw + '，请改选', 'warning'); return; }
  var r = PORTAL.act('queue.take', { id: PICK.wd });
  if (!r) { UI.toast('取号失败，请到窗口取号', 'error'); return; }
  layer('<i class="fa-solid fa-ticket"></i> 取号成功',
    '<div style="text-align:center">'
    + '<div style="font-size:22px;color:var(--text-3)">您的号码</div>'
    + '<div class="big-no">' + UI.esc(r.no) + '</div>'
    + '<div style="font-size:24px;font-weight:700;color:var(--accent);margin:10px 0 22px">'
    + '请到等候区就座，叫号后到对应窗口办理</div></div>'
    + '<div class="k-dl"><dl>'
    + '<dt>办理网点</dt><dd><b>' + UI.esc(r.w.n) + '</b></dd>'
    + '<dt>网点地址</dt><dd>' + UI.esc(r.w.dz) + '　电话 ' + UI.esc(r.w.tel) + '</dd>'
    + '<dt>业务类型</dt><dd>' + UI.esc(PICK.yw) + '</dd>'
    + '<dt>当前叫号</dt><dd><b>' + UI.esc(r.w.jh) + '</b></dd>'
    + '<dt>前面等待</dt><dd><b>' + r.wait + '</b> 人，预计等待 ' + (r.wait * 6) + ' 分钟</dd>'
    + '<dt>取号时间</dt><dd>' + PDATA.ymdhm(Date.now()) + '</dd>'
    + '<dt>取号渠道</dt><dd>政务自助终端（文昌大厅 T01）</dd>'
    + '</dl></div>'
    + '<div style="display:flex;align-items:center;gap:26px;margin-top:24px">'
    + '<div class="qr-ph"><i class="fa-solid fa-qrcode"></i></div>'
    + '<div class="k-ok" style="flex:1;margin-top:0"><i class="fa-solid fa-mobile-screen"></i> '
    + '扫码可在手机上查看实时叫号进度并接收叫号提醒；号票已推送到您的「我的消息」，'
    + '也可在网页版「业务办理 → 网点导航与排队」查看。</div></div>',
    '<button class="k-btn ghost" onclick="UI.toast(\'号票正在打印，请在出纸口取走号票\',\'success\')" data-fp="wsmh-28-03">'
    + '<i class="fa-solid fa-print"></i> 打印号票</button>'
    + '<a class="k-btn" href="../web/outlets.html" data-fp="wsmh-28-03">'
    + '<i class="fa-solid fa-globe"></i> 网页版看叫号</a>'
    + '<button class="k-btn gray" data-fp="wsmh-28-03" onclick="layerClose();renderQueue()">完成</button>', 1);
  UI.toast('号票已推送至您的手机，号码 ' + r.no + '，前面还有 ' + r.wait + ' 人等待', 'success');
}

/* 无 data-nav 时 portal.js 仍会调用 pageInit；此处兜底调用一次 */
pageInit();
</script>
