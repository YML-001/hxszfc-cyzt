<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>保障房源 · 保障房专区</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .bz-tabs{display:flex;gap:10px;margin:2px 0 14px}
  .bz-tabs a{padding:9px 20px;border-radius:24px;background:#fff;border:1px solid var(--border);font-size:14px;font-weight:600;color:var(--text-2);cursor:pointer}
  .bz-tabs a.on{background:var(--primary);border-color:var(--primary);color:#fff}
  .bz-filter{background:#fff;border:1px solid var(--border);border-radius:var(--radius-card);padding:6px 18px}
  .fr{display:flex;align-items:flex-start;gap:14px;padding:11px 0;border-bottom:1px dashed var(--border)}
  .fr:last-child{border-bottom:0}
  .fr .fl{flex:none;width:74px;color:var(--text-3);font-size:13px;padding-top:2px}
  .fr .fo{display:flex;flex-wrap:wrap;gap:6px}
  .fr .fo a{padding:4px 13px;border-radius:16px;font-size:13px;color:var(--text-2);cursor:pointer}
  .fr .fo a.on{background:var(--primary-soft,#eaf1ff);color:var(--primary);font-weight:600}
  .bz-code{position:absolute;left:10px;bottom:10px;background:rgba(16,102,60,.92);color:#fff;font-size:11.5px;padding:2px 8px;border-radius:3px}
  .tag-q.gz{background:#eaf2ff;color:#2656bb}.tag-q.bz{background:#e5f6fb;color:#0e7c93}.tag-q.ps{background:#fdf3e2;color:#b45309}
</style>
</head>
<body data-nav="baozhang">

<div class="wrap"><div class="crumb"><a href="home.html">首页</a><i class="fa-solid fa-angle-right"></i><a href="baozhang-index.html">保障房专区</a><i class="fa-solid fa-angle-right"></i>保障房源</div></div>

<div class="wrap">
  <div class="bz-tabs" id="type-tabs"></div>
  <div class="bz-filter">
    <div class="fr" data-key="qx"><span class="fl">区域</span><div class="fo" id="f-qx"></div></div>
    <div class="fr" data-key="mj"><span class="fl">面积</span><div class="fo" id="f-mj"></div></div>
    <div class="fr" data-key="hx"><span class="fl">户型</span><div class="fo" id="f-hx"></div></div>
    <div class="fr" data-key="zt"><span class="fl">状态</span><div class="fo" id="f-zt"></div></div>
  </div>
</div>

<div class="section">
  <div class="wrap">
    <div class="col-head"><h2 id="list-title">在配公租房</h2><span class="ch-en" id="list-en">Listings</span>
      <div class="ml-auto flex items-center gap-10">
        <a class="btn btn-sm" href="baozhang-select.html"><i class="fa-solid fa-dice"></i> 报名 / 摇号</a>
        <a class="btn btn-sm" href="baozhang-apply.html"><i class="fa-solid fa-file-signature"></i> 我要申请</a>
      </div>
    </div>
    <div class="alert alert-success" style="margin-top:0"><i class="fa-solid fa-shield-halved"></i>
      <span>保障房源均经<b>统一核验编码</b>，逐套标注核验码、保障类型、租金或配售价与更新时间，成交或下架后实时下线。房号按规定截断展示。</span></div>
    <div class="house-grid" id="grid" style="margin-top:14px"></div>
    <div id="src-note"></div>
  </div>
</div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
var TYPES = {
  gz: { name:'公租房', en:'Public Rental', cls:'gz', unit:'元/月', price:'租金' },
  bz: { name:'保障性租赁住房', en:'Guaranteed Rental', cls:'bz', unit:'元/月', price:'租金' },
  ps: { name:'配售型保障房', en:'For-sale', cls:'ps', unit:'元/㎡', price:'配售价' }
};
var QX = ['城中区','鱼峰区','柳南区','柳北区','城郊新区','XX县'];
var IMGS = ['1560448204-e02f11c3d0e2','1545324418-cc1a3fa10c00','1502672260266-1c1ef2d93688','1560518883-ce09059eeffa','1522708323590-d24dbb6b0267','1493809842364-78817add7ffb'];
function img(i){return 'https://images.unsplash.com/photo-'+IMGS[i%IMGS.length]+'?auto=format&fit=crop&w=600&q=70';}

var COMM = ['和苑','安居家园','幸福里','龙福雅居','德润新居','城东佳苑','翠竹花园','光华人才公寓','惠民公寓','阳光家园'];
function genList(type){
  var arr=[], n = type==='bz'?12:type==='gz'?10:8;
  for(var i=0;i<n;i++){
    var mj = type==='ps' ? [65,75,88,95,105][i%5] : [38,42,50,55,60][i%5];
    var price = type==='ps' ? 4980+(i%6)*160 : type==='gz' ? 280+(i%5)*90 : 720+(i%6)*180;
    arr.push({
      id:type+'-'+(i+1), type:type, xq:COMM[(i+ (type==='bz'?2:type==='ps'?5:0))%COMM.length],
      qx:QX[i%QX.length], mj:mj, hx:mj<45?'一室一厅':mj<70?'两室一厅':'三室两厅',
      cx:['朝南','南北通透','朝东南'][i%3], floor:(i%18+2)+'/'+ (i%6+18)+'层',
      price:price, code:'BZ'+type.toUpperCase()+(2026001+i),
      zt: i%7===0?'待摇号':i%5===0?'选房中':'可申请',
      note: type==='ps'?'保本微利 · 封闭管理':type==='gz'?'实物配租 · 可申请租赁补贴':'小户型 · 低租金'
    });
  }
  return arr;
}

var CUR = UI.param('type') || 'gz';
var FIL = { qx:'', mj:'', hx:'', zt:'' };

function pageInit(){
  renderTabs(); renderFilters(); renderGrid();
  document.getElementById('src-note').innerHTML = UI.sourceNote('保障房源与配租配售信息来源于保障性住房综合管理系统业务库，经统一核验编码后对外展示。');
}

function renderTabs(){
  document.getElementById('type-tabs').innerHTML = Object.keys(TYPES).map(function(k){
    return '<a class="'+(k===CUR?'on':'')+'" data-t="'+k+'">'+TYPES[k].name+'</a>';
  }).join('');
  document.getElementById('type-tabs').onclick=function(e){
    var a=e.target.closest('[data-t]'); if(!a)return;
    CUR=a.getAttribute('data-t'); FIL={qx:'',mj:'',hx:'',zt:''};
    renderTabs(); renderFilters(); renderGrid();
  };
  document.getElementById('list-title').textContent = (CUR==='ps'?'在售':'在配')+TYPES[CUR].name;
  document.getElementById('list-en').textContent = TYPES[CUR].en;
}

function fopts(id,key,arr){
  document.getElementById(id).innerHTML = [['','不限']].concat(arr).map(function(o){
    var v=o[0]!==undefined?o[0]:o, t=o[1]!==undefined?o[1]:o;
    return '<a class="'+(FIL[key]===v?'on':'')+'" data-v="'+v+'">'+t+'</a>';
  }).join('');
  document.getElementById(id).onclick=function(e){
    var a=e.target.closest('[data-v]'); if(!a)return;
    FIL[key]=a.getAttribute('data-v'); renderFilters(); renderGrid();
  };
}
function renderFilters(){
  fopts('f-qx','qx',QX.map(function(q){return [q,q];}));
  fopts('f-mj','mj',[['0-45','45㎡以下'],['45-70','45-70㎡'],['70-','70㎡以上']]);
  fopts('f-hx','hx',[['一室一厅','一室一厅'],['两室一厅','两室一厅'],['三室两厅','三室两厅']]);
  fopts('f-zt','zt',[['可申请','可申请'],['待摇号','待摇号'],['选房中','选房中']]);
}

function renderGrid(){
  var list = genList(CUR).filter(function(h){
    if(FIL.qx&&h.qx!==FIL.qx)return false;
    if(FIL.hx&&h.hx!==FIL.hx)return false;
    if(FIL.zt&&h.zt!==FIL.zt)return false;
    if(FIL.mj){var p=FIL.mj.split('-'),lo=+p[0],hi=p[1]?+p[1]:9999;if(h.mj<lo||h.mj>=hi)return false;}
    return true;
  });
  var t=TYPES[CUR];
  document.getElementById('grid').innerHTML = list.map(function(h,i){
    var st = h.zt==='可申请'?'green':h.zt==='待摇号'?'orange':'blue';
    return '<a class="house-card" href="baozhang-house-detail.html?id='+h.id+'&type='+CUR+'">'
      +'<div class="hc-img"><img src="'+img(i)+'" alt="'+UI.esc(h.xq)+'">'
      +'<span class="hc-badge"><i class="fa-solid fa-shield-halved"></i> 已核验</span>'
      +'<span class="hc-state">'+h.zt+'</span>'
      +'<span class="bz-code">核验码 '+h.code+'</span></div>'
      +'<div class="hc-body">'
      +'<div class="hc-t">'+h.xq+' <span class="tag-q '+t.cls+'">'+t.name+'</span></div>'
      +'<div class="hc-sub">'+h.qx+' · '+h.floor+' · '+h.cx+'</div>'
      +'<div class="hc-tags"><span class="tag-q">'+h.mj+'㎡</span><span class="tag-q">'+h.hx+'</span><span class="tag-q">'+h.note+'</span></div>'
      +'<div class="hc-price">'+UI.money(h.price,0)+'<em>'+t.unit+'</em><span class="hc-unit">'+t.price+'</span></div>'
      +'<div class="hc-foot"><span>运营单位：XXXX市安居保障运营有限公司</span><span>更新 '+UI.today().slice(5)+'</span></div>'
      +'</div></a>';
  }).join('') || UI.empty('暂无符合条件的房源','可放宽筛选条件后重试');
}
</script>
</body>
</html>
