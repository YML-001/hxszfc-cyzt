<style>
  /* 本页专属布局 */
  .px-search { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .px-search .input { height: 38px; }
  .px-search .select { height: 38px; width: auto; min-width: 130px; }
  .px-search .btn { height: 38px; }
  .px-sub { margin-left: auto; display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text-2); }
  .px-sub b { color: var(--accent); font-family: "DIN Alternate", var(--font); font-size: 17px; }

  .px-two { display: grid; grid-template-columns: 246px 1fr; gap: 18px; align-items: start; }
  .px-menu { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card); overflow: hidden; }
  .px-menu .pm-h { padding: 11px 16px; background: var(--primary-light-2); border-bottom: 1px solid var(--border); font-size: 13.5px; font-weight: 700; color: var(--primary); }
  .px-menu a {
    display: flex; align-items: center; gap: 9px; padding: 10px 16px; color: var(--text-2);
    font-size: 13.5px; border-left: 3px solid transparent; cursor: pointer; border-bottom: 1px solid var(--row-line);
  }
  .px-menu a:last-child { border-bottom: 0; }
  .px-menu a i { width: 16px; text-align: center; color: var(--text-3); }
  .px-menu a:hover { background: var(--primary-light-2); color: var(--primary); }
  .px-menu a:hover i { color: var(--primary); }
  .px-menu a.on { background: var(--primary-light); color: var(--primary); font-weight: 700; border-left-color: var(--primary); }
  .px-menu a.on i { color: var(--primary); }
  .px-menu a .mn { margin-left: auto; font-size: 12px; color: var(--text-3); font-family: "DIN Alternate", var(--font); }
  .px-menu a.on .mn { color: var(--primary); }

  .px-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--row-line); }
  .px-row:last-child { border-bottom: 0; }
  .px-row .pr-b { flex: 1; min-width: 0; }
  .px-row .pr-t { font-size: 14.5px; color: var(--text-1); font-weight: 500; }
  .px-row a.pr-t:hover { color: var(--accent); }
  .px-row .pr-m { font-size: 12.5px; color: var(--text-3); margin-top: 5px; line-height: 1.75; }
  .px-row .pr-d { flex: none; font-size: 12.5px; color: var(--text-3); text-align: right; }
</style>

/* 房号截断脱敏：楼栋座单元后紧跟的房号只保留末两位（wsmh-35-06 对外展示脱敏口径） */
function maskFh(s) {
  return String(s || '').replace(/([楼栋座元])(\s*)(\d{3,5})(?![\d\-年月日])/g, function (m, a, b, c) {
    return a + b + '**' + c.slice(-2);
  });
}
function mk(a, s) { return (a.lm === 'refund' || a.lm === 'survey') ? maskFh(s) : s; }

function artRow(href) {
  return function (a) {
    var zy = mk(a, a.zy);
    return {
      t: mk(a, a.bt), m: a.ly + '　' + (zy.length > 52 ? zy.slice(0, 52) + '…' : zy),
      d: a.fbsj, s: (a.yxq && a.yxq < UI.today()) ? '已归档' : '公示中',
      href: 'article-detail.html?id=' + a.id
    };
  };
}
function lvName(v) { return ['无', '蓝色', '黄色', '橙色', '红色'][v] || '无'; }

function pageInit() {
  var cats = CATS();

  /* 左侧 13 类目录 */
  document.getElementById('px-menu').innerHTML =
    '<div class="pm-h"><i class="fa-solid fa-folder-tree"></i> 公示类目（共 13 类）</div>'
    + cats.map(function (c) {
      return '<a data-cat="' + c.k + '" data-fp="wsmh-05-12"><i class="fa-solid ' + c.ico + '"></i> ' + c.n
        + '<span class="mn">' + c.rows.length + '</span></a>';
    }).join('');
  document.getElementById('px-menu').onclick = function (e) {
    var a = e.target.closest('a[data-cat]'); if (!a) return;
    renderCat(a.getAttribute('data-cat'));
  };

  /* 检索条：类别下拉 */
  document.getElementById('px-cat').innerHTML = '<option value="">公示类别：全部</option>'
    + cats.map(function (c) { return '<option value="' + c.k + '">' + c.n + '</option>'; }).join('');

  document.getElementById('px-go').onclick = doSearch;
  document.getElementById('px-kw').onkeydown = function (e) { if (e.key === 'Enter') doSearch(); };
  document.getElementById('px-reset').onclick = function () {
    document.getElementById('px-kw').value = '';
    document.getElementById('px-cat').value = '';
    document.getElementById('px-st').value = '';
    document.getElementById('px-tm').value = '0';
    searched = 0; prPage = 1;
    document.querySelector('#px-tabs [data-tab="pi-cat"]').click();
    UI.toast('已重置检索条件', 'info');
  };
  document.getElementById('px-export').onclick = function () {
    if (!searched) { doSearch(); }
    UI.toast('已导出 ' + prRows.length + ' 条公示记录（CSV），文件名 公示检索结果_' + UI.today().replace(/-/g, '') + '.csv', 'success');
  };

  document.getElementById('px-mgsub').onclick = manageSub;

  renderCat(UI.param('cat') || 'presale');
  renderArch();
  renderSubCount();
  PORTAL.on(function () { renderSubCount(); renderCat(curCat); });

  var t = UI.param('tab');
  if (t) { var el = document.querySelector('#px-tabs [data-tab="' + t + '"]'); if (el) el.click(); }
  var kw = UI.param('kw');
  if (kw) { document.getElementById('px-kw').value = kw; doSearch(); }

  document.getElementById('src-note').innerHTML =
    UI.sourceNote('13 类公示的数据来源、统计口径与更新时间在各类目下单独标注，以标注为准。');
}

/* ---------------- 类目联动（wsmh-05-12） ---------------- */
function renderCat(k) {
  var cats = CATS(), c = null;
  cats.forEach(function (x) { if (x.k === k) c = x; });
  if (!c) c = cats[0];
  curCat = c.k;

  var as = document.getElementById('px-menu').querySelectorAll('a[data-cat]');
  for (var i = 0; i < as.length; i++) as[i].classList.toggle('on', as[i].getAttribute('data-cat') === c.k);

  document.getElementById('pc-title').textContent = c.n;
  document.getElementById('pc-count').textContent = '现行公示 ' + c.rows.length + ' 条，以下展示最近 6 条';
  document.getElementById('pc-desc').innerHTML = '<i class="fa-solid fa-circle-info"></i><span>' + c.d + '</span>';
  document.getElementById('pc-full').href = c.page;

  var top = c.rows.slice(0, 6);
  document.getElementById('pc-rows').innerHTML = top.length ? top.map(function (r) {
    return '<div class="px-row"><div class="pr-b">'
      + '<a class="pr-t" href="' + r.href + '" data-fp="wsmh-05-12">' + UI.esc(r.t) + '</a>'
      + '<div class="pr-m">' + UI.esc(r.m) + '</div></div>'
      + '<div class="pr-d">' + r.d + '<br>' + PORTAL.badge(r.s, r.s === '公示中' ? 'green' : 'gray') + '</div></div>';
  }).join('') : UI.empty('当前无' + c.n + '信息',
    c.k === 'refund' ? '退房与备案注销申请办结后将自动在此公示，房号按规定脱敏' : '新公示发布后将在此展示，可先订阅本类目提醒',
    c.k === 'refund' ? '<a class="btn btn-primary" href="buy-service.html?tab=bs-refund" data-fp="wsmh-05-09">退房申请入口</a>' : '');

  document.getElementById('pc-note').innerHTML =
    '<b>数据来源：</b>' + c.src + '　|　<b>统计口径：</b>' + c.jk + '　|　<b>更新时间：</b>' + UI.today() + ' 06:00';

  var btn = document.getElementById('pc-sub');
  var hit = PORTAL.subs().filter(function (s) { return s.lm === c.lm; })[0];
  btn.innerHTML = hit ? '<i class="fa-solid fa-bell-slash"></i> 取消订阅' : '<i class="fa-solid fa-bell"></i> 订阅此类';
  btn.className = hit ? 'btn btn-sm' : 'btn btn-sm btn-accent';
  btn.onclick = function () {
    if (hit) {
      PORTAL.act('sub.del', { id: hit.id });
      UI.toast('已取消订阅「' + c.lmmc + '」', 'success');
      return;
    }
    if (!UI.needLogin('订阅「' + c.lmmc + '」')) return;
    var r = PORTAL.act('sub.add', { lm: c.lm, lmmc: c.lmmc, way: '站内消息+短信' });
    UI.toast(r === 'exist' ? '您已订阅本类目'
      : '订阅成功，「' + c.lmmc + '」新增公示将推送到「个人中心 → 我的消息」', r === 'exist' ? 'warning' : 'success');
  };
}

/* ---------------- 统一检索（wsmh-05-12） ---------------- */
function doSearch() {
  var kw = document.getElementById('px-kw').value.trim();
  var cat = document.getElementById('px-cat').value;
  var st = document.getElementById('px-st').value;
  var tm = Number(document.getElementById('px-tm').value || 0);
  var since = tm ? PDATA.ymd(PDATA.shift(-tm)) : '';

  var rows = [];
  CATS().forEach(function (c) {
    if (cat && c.k !== cat) return;
    c.rows.forEach(function (r) {
      if (kw && (r.t + r.m).indexOf(kw) < 0) return;
      if (st && r.s !== st) return;
      if (since && r.d < since) return;
      rows.push({ cat: c.n, ico: c.ico, r: r });
    });
  });
  /* 归档件在「历史归档」单独可查，选择「已归档」时补充文章型归档记录 */
  if (st === '已归档' || st === '') {
    PORTAL.articles({ expired: 1 }).forEach(function (a) {
      if (kw && (a.bt + a.zy + a.ly).indexOf(kw) < 0) return;
      if (since && a.fbsj < since) return;
      rows.push({
        cat: '历史归档', ico: 'fa-box-archive',
        r: { t: mk(a, a.bt), m: a.ly + '　公示期至 ' + a.yxq + '，已自动归档', d: a.fbsj, s: '已归档', href: 'article-detail.html?id=' + a.id }
      });
    });
  }

  prRows = rows; prPage = 1; searched = 1;
  document.querySelector('#px-tabs [data-tab="pi-result"]').click();
  renderResult();
  UI.toast('检索完成，命中 ' + rows.length + ' 条公示记录', rows.length ? 'success' : 'warning');
}

function renderResult() {
  document.getElementById('pr-count').innerHTML = '共 <b>' + prRows.length + '</b> 条'
    + '　跨预售楼盘、监管账户、监管项目、银行名录、造价咨询、维修资金、高风险楼盘、在建抵押、测绘成果、退房注销、市场日报、政务公开、通知公告 13 类检索';

  var page = prRows.slice((prPage - 1) * prSize, prPage * prSize);
  document.getElementById('pr-list').innerHTML = page.length ? page.map(function (x) {
    return '<div class="px-row"><div class="pr-b">'
      + '<a class="pr-t" href="' + x.r.href + '" data-fp="wsmh-05-12">' + UI.esc(x.r.t) + '</a>'
      + '<div class="pr-m"><span class="badge blue"><i class="fa-solid ' + x.ico + '"></i> ' + x.cat + '</span>　'
      + UI.esc(x.r.m) + '</div></div>'
      + '<div class="pr-d">' + x.r.d + '<br>' + PORTAL.badge(x.r.s, x.r.s === '公示中' ? 'green' : 'gray') + '</div></div>';
  }).join('') : UI.empty('没有检索到符合条件的公示信息',
    '可放宽公示类别、公示期状态或时间范围，也可以只输入项目或企业名称的一部分',
    '<button class="btn btn-primary" id="pr-reset" data-fp="wsmh-05-12">重置检索条件</button>');
  var rr = document.getElementById('pr-reset');
  if (rr) rr.onclick = function () { document.getElementById('px-reset').click(); };

  UI.pager(document.getElementById('pr-pager'), prRows.length, prPage, prSize, function (p) {
    prPage = p; renderResult(); window.scrollTo({ top: 320, behavior: 'smooth' });
  });
}

/* ---------------- 历史归档（wsmh-05-13） ---------------- */
function renderArch() {
  var arr = PORTAL.articles({ expired: 1 });
  document.getElementById('pa-count').textContent = '共 ' + arr.length + ' 条';
  document.getElementById('pa-list').innerHTML = arr.length ? arr.map(function (a) {
    var zy = mk(a, a.zy);
    return '<div class="px-row"><div class="pr-b">'
      + '<a class="pr-t" href="article-detail.html?id=' + a.id + '" data-fp="wsmh-05-13">' + UI.esc(mk(a, a.bt)) + '</a>'
      + '<div class="pr-m">' + UI.esc(a.ly) + '　发布 ' + a.fbsj + '　公示期至 ' + a.yxq + '　'
      + UI.esc(zy.length > 60 ? zy.slice(0, 60) + '…' : zy) + '</div></div>'
      + '<div class="pr-d">' + a.yxq + '<br>' + PORTAL.badge('已归档', 'gray') + '</div></div>';
  }).join('') : UI.empty('当前没有已过公示期的历史公示',
    '设有公示期的公示（通知公告、退房注销、测绘成果等）到期后会自动移入本列表，归档后仍可检索查阅。'
    + '公示期限在门户运营后台「栏目内容管理 → 公示时效」中按类目配置。',
    '<button class="btn btn-primary" id="pa-back" data-fp="wsmh-05-12">查看现行公示目录</button>');
  var b = document.getElementById('pa-back');
  if (b) b.onclick = function () { document.querySelector('#px-tabs [data-tab="pi-cat"]').click(); };
}

/* ---------------- 订阅管理（链条 9） ---------------- */
function renderSubCount() {
  document.getElementById('px-subn').textContent = PORTAL.subs().length;
}

function manageSub() {
  var list = PORTAL.subs();
  UI.drawer('<i class="fa-solid fa-bell text-accent"></i> 我的公示订阅',
    '<div class="alert alert-info"><i class="fa-solid fa-circle-info"></i>'
    + '<span>已订阅类目在运营后台发布新公示时，会即时推送到「个人中心 → 我的消息」并按设置的方式提醒。</span></div>'
    + (list.length ? '<div class="table-wrap"><table class="pub-table">'
      + '<thead><tr><th>订阅类目</th><th style="width:150px">推送方式</th><th style="width:110px">订阅日期</th><th style="width:90px">操作</th></tr></thead><tbody>'
      + list.map(function (s) {
        return '<tr><td class="strong">' + UI.esc(s.lmmc || s.lm) + (s.kw ? '（关键字：' + UI.esc(s.kw) + '）' : '') + '</td>'
          + '<td>' + UI.esc(s.way) + '</td><td>' + s.d + '</td>'
          + '<td class="acts"><a href="javascript:;" data-unsub="' + s.id + '" data-fp="wsmh-05-12">取消订阅</a></td></tr>';
      }).join('') + '</tbody></table>'
      + '<div class="table-note">共 ' + list.length + ' 个订阅类目。取消订阅后不再接收该类目的新增公示推送。</div></div>'
      : UI.empty('还没有订阅任何公示类目', '在左侧类目中点击「订阅此类」即可订阅，新增公示会推送到我的消息')),
    '<button class="btn" data-act="close-drawer">关闭</button>'
    + '<a class="btn btn-primary" href="../person/my-cert.html" data-fp="wsmh-05-12">去我的消息查看推送</a>');

  var us = document.querySelectorAll('[data-unsub]');
  for (var i = 0; i < us.length; i++) {
    us[i].onclick = function () {
      PORTAL.act('sub.del', { id: this.getAttribute('data-unsub') });
      UI.toast('已取消订阅', 'success');
      manageSub();
    };
  }
}
</script>
