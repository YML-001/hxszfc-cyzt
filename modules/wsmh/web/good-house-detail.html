<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>好房子项目详情 · 统一服务门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  /* 好房子项目详情专属布局 */
  .g-top { display: grid; grid-template-columns: 640px 1fr; gap: 24px; align-items: start; }
  .g-main-img { height: 400px; border-radius: var(--radius-card); overflow: hidden; background: var(--bg-soft); position: relative; }
  .g-main-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-vr {
    position: absolute; right: 14px; bottom: 14px; background: rgba(0, 0, 0, .58); color: #fff;
    border: 1px solid rgba(255, 255, 255, .4); border-radius: 22px; padding: 7px 18px; cursor: pointer; font-size: 14px;
  }
  .g-vr:hover { background: var(--accent); border-color: var(--accent); }
  .g-cap { position: absolute; left: 0; bottom: 0; padding: 9px 14px; font-size: 12.5px; color: #fff;
    background: linear-gradient(0deg, rgba(0, 0, 0, .6), rgba(0, 0, 0, 0)); right: 0; }
  .g-thumbs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-top: 10px; }
  .g-thumbs div { height: 72px; border-radius: 4px; overflow: hidden; cursor: pointer; border: 2px solid transparent; background: var(--bg-soft); position: relative; }
  .g-thumbs div.on { border-color: var(--primary); }
  .g-thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .g-thumbs .tl {
    position: absolute; left: 0; right: 0; bottom: 0; background: rgba(0, 0, 0, .5); color: #fff;
    font-size: 11px; text-align: center; line-height: 17px;
  }
  .g-tagbox { background: var(--success-light); border: 1px solid #bfe8cf; border-radius: var(--radius-card); padding: 14px 16px; }
  .idx-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .idx-i { border: 1px solid var(--border); border-radius: var(--radius-card); padding: 14px 16px; background: #fff; }
  .idx-i .ii-h { display: flex; align-items: center; gap: 8px; }
  .idx-i .ii-ico {
    width: 34px; height: 34px; border-radius: 10px; background: var(--primary-light); color: var(--primary);
    display: flex; align-items: center; justify-content: center; font-size: 15px; flex: none;
  }
  .idx-i .ii-v { font-size: 20px; font-weight: 700; color: var(--primary); font-family: "DIN Alternate", var(--font); line-height: 1.2; }
  .idx-i .ii-l { font-size: 12.5px; color: var(--text-3); }
  .idx-i .ii-d { font-size: 12.5px; color: var(--text-2); margin-top: 9px; line-height: 1.75; }
  .vr-stage {
    height: 300px; border-radius: 8px; position: relative; overflow: hidden;
    background: linear-gradient(135deg, #1b3f8f 0%, #2656bb 45%, #4272d8 100%); color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .vr-stage .vs-ico { font-size: 58px; opacity: .9; }
  .vr-stage .vs-t { font-size: 18px; font-weight: 700; margin-top: 14px; }
  .vr-stage .vs-d { font-size: 13px; opacity: .85; margin-top: 8px; text-align: center; max-width: 460px; line-height: 1.8; }
  .vr-pts { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; justify-content: center; }
  .vr-pts a { background: rgba(255, 255, 255, .18); border: 1px solid rgba(255, 255, 255, .34); color: #fff; padding: 5px 15px; border-radius: 20px; font-size: 13px; cursor: pointer; }
  .vr-pts a.on, .vr-pts a:hover { background: #fff; color: var(--primary); }
  .g-acts { display: flex; gap: 10px; flex-wrap: wrap; }
</style>
</head>
<body data-nav="house">

<div class="wrap">
  <div class="crumb">
    <a href="home.html">首页</a><i class="fa-solid fa-angle-right"></i>
    <a href="house-market.html">房源超市</a><i class="fa-solid fa-angle-right"></i>
    <a href="good-house.html">好房子专区</a><i class="fa-solid fa-angle-right"></i>项目详情
  </div>
</div>

<div class="wrap" style="padding-bottom:36px" id="g-wrap"></div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
var P = null, GAL = [];

function pageInit() {
  var id = UI.param('id') || 'XM01';
  P = PORTAL.project(id);
  var box = document.getElementById('g-wrap');
  if (!P) {
    box.innerHTML = UI.empty('未找到该项目', '请回到好房子专区选择已认定项目。',
      '<a class="btn btn-primary" href="good-house.html" data-fp="wsmh-12-01">回好房子专区</a>');
    return;
  }
  GAL = [
    [P.img, '项目实景'],
    ['https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=1000&q=70', '样板间客厅'],
    ['https://images.unsplash.com/photo-1616486338812-3dadae4b4ace?auto=format&fit=crop&w=1000&q=70', '样板间主卧'],
    ['https://images.unsplash.com/photo-1556909212-d5b604d0c90d?auto=format&fit=crop&w=1000&q=70', '厨房与收纳'],
    ['https://images.unsplash.com/photo-1600566753086-00f18fb6b3ea?auto=format&fit=crop&w=1000&q=70', '社区园林与全龄场地']
  ];
  render();
  PORTAL.on(render);
}

function dl(k, v) { return '<dt>' + k + '</dt><dd>' + v + '</dd>'; }
function card(ico, title, sub, body, foot) {
  return '<div class="card mb-16"><div class="card-head"><h3><i class="fa-solid ' + ico + ' text-primary"></i> ' + title + '</h3>'
    + (sub ? '<span class="sub">' + sub + '</span>' : '')
    + (foot ? '<div class="ca">' + foot + '</div>' : '') + '</div><div class="card-body">' + body + '</div></div>';
}
function cmpGet() { try { var s = sessionStorage.getItem('wsmh.cmp.proj'); return s ? s.split(',') : []; } catch (e) { return []; } }
function cmpSet(a) { try { sessionStorage.setItem('wsmh.cmp.proj', a.join(',')); } catch (e) { } }

function render() {
  P = PORTAL.project(P.id);
  var g = P.gIdx || {};
  var good = P.good === 1;

  document.getElementById('g-wrap').innerHTML =
    (good ? '' : '<div class="alert alert-warning"><i class="fa-solid fa-triangle-exclamation"></i>'
      + '<span>该项目<b>尚未列入好房子认定名录</b>，因此不展示品质指标与五方责任主体公示。'
      + '下方仅展示项目基础信息，完整销控与价格公示请查看新房专区。</span></div>')

    /* ---------- 顶部：图集 + 概要 ---------- */
    + '<div class="g-top">'
    + '<div>'
    + '<div class="g-main-img"><img id="g-img" src="' + GAL[0][0] + '" alt="' + UI.esc(P.xmmc) + '实景">'
    + '<div class="g-cap" id="g-cap">' + GAL[0][1] + '　实景与样板间图片由开发企业提供并承诺真实，交付标准以合同附件为准</div>'
    + '<div class="g-vr" onclick="vrOpen()" data-fp="wsmh-12-03"><i class="fa-solid fa-panorama"></i> 全景看房</div></div>'
    + '<div class="g-thumbs" id="g-thumbs">' + GAL.map(function (x, i) {
      return '<div class="' + (i === 0 ? 'on' : '') + '" onclick="galGo(' + i + ')" data-fp="wsmh-12-03">'
        + '<img src="' + x[0] + '" alt="' + x[1] + '"><span class="tl">' + x[1] + '</span></div>';
    }).join('') + '</div>'
    + '</div>'

    + '<div>'
    + '<h1 style="font-size:24px">' + UI.esc(P.xmmc) + '</h1>'
    + '<div class="flex gap-8 wrapf mt-12">'
    + (good ? '<span class="badge green"><i class="fa-solid fa-medal"></i> 好房子认定项目</span>' : '')
    + '<span class="badge blue">' + P.zt + '</span>'
    + (P.risk ? '<span class="badge red"><i class="fa-solid fa-triangle-exclamation"></i> 风险提示项目</span>' : '')
    + '</div>'
    + '<div class="text-3 text-sm mt-12"><i class="fa-solid fa-location-dot"></i> ' + P.qx + ' · ' + P.sq + ' · ' + UI.esc(P.dz) + '</div>'

    + (good ? '<div class="g-tagbox mt-16">'
      + '<div class="flex items-center gap-8 mb-8"><i class="fa-solid fa-medal text-success"></i>'
      + '<b>品质标签</b><span class="text-xs text-3">经市住建部门认定</span></div>'
      + '<div class="flex gap-8 wrapf">' + (P.gTags || []).map(function (t) {
        return '<span class="badge green" style="font-size:13px"><i class="fa-solid fa-check"></i> ' + UI.esc(t) + '</span>';
      }).join('') + '</div>'
      + '<div class="text-sm mt-12"><span class="text-3">认定批次：</span><b>' + P.rdpc + '</b>'
      + '　<span class="text-3">有效期至：</span><b>' + P.rdyxq + '</b></div>'
      + '</div>' : '')

    + '<div class="stat-grid c3 mt-16">'
    + kpi('fa-coins', 'red', UI.money(P.junjia, 0), '备案拟售均价（元/㎡）')
    + kpi('fa-house', 'blue', P.ksts, '当前可售（套）')
    + kpi('fa-building', 'cyan', P.zts, '规划总套数（套）')
    + '</div>'
    + '<div class="text-xs text-3 mt-8">价格区间 ' + P.jgqj + ' 元/㎡　·　'
    + '<b class="text-accent">备案（拟售）价格，实际成交以合同为准</b></div>'

    + '<div class="g-acts mt-16">'
    + '<button class="btn btn-accent btn-lg" onclick="ghCmp()" data-fp="wsmh-12-08"><i class="fa-solid fa-scale-balanced"></i> 加入对比</button>'
    + '<a class="btn btn-primary btn-lg" href="price-table.html?id=' + P.id + '" data-fp="wsmh-12-04"><i class="fa-solid fa-table-cells"></i> 查看一房一价</a>'
    + '<button class="btn btn-lg" onclick="fbOpen()" data-fp="wsmh-12-08"><i class="fa-solid fa-comment-dots"></i> 提交品质问题反馈</button>'
    + '<a class="btn btn-lg" href="good-house.html?tab=gh-cert" data-fp="wsmh-12-06"><i class="fa-solid fa-clipboard-check"></i> 查看认定公示</a>'
    + '</div>'
    + '</div></div>'

    /* ---------- 品质指标（wsmh-12-04） ---------- */
    + '<div class="mt-24">'
    + (good ? card('fa-gauge-high', '品质指标公示', '依据好房子建设标准逐项公示',
      '<div class="idx-grid">'
      + idx('fa-up-down', g.cg + ' m', '室内净层高', '层高影响居住舒适度与空间感，标准要求不低于 3.0 米。')
      + idx('fa-vector-square', g.dfl, '得房率', '套内可使用面积占建筑面积的比例，得房率越高实际可用空间越大。')
      + idx('fa-chart-pie', g.gt, '公摊比例', '电梯厅、楼梯间等共有部位分摊比例，与得房率互为补充。')
      + idx('fa-volume-off', g.gs, '楼板隔声等级', '分户墙与楼板的空气声隔声性能等级，等级越高越安静。')
      + idx('fa-leaf', g.jn, '建筑节能率', '相比基准建筑的能耗降低比例，直接影响后续采暖制冷费用。')
      + idx('fa-sun', g.rz, '大寒日日照时长', '主要居住空间在大寒日的有效日照时长，兼顾采光与通风组织。')
      + '</div>'
      + '<div class="alert alert-info mt-16" style="margin-bottom:0"><i class="fa-solid fa-circle-info"></i>'
      + '<span>以上指标由建设单位申报、认定机构核验后公示，交付时的实测值以竣工验收资料与合同附件为准。'
      + '如发现实际情况与公示不符，可通过「提交品质问题反馈」反映。</span></div>', '') : '')

    /* 配套与服务 */
    + card('fa-screwdriver-wrench', '配套设施与服务标准', '与购房关键信息公示同源',
      '<div class="desc-list c2"><dl>'
      + dl('前期物业', UI.esc(P.wuye))
      + dl('物业服务费', P.wyf + ' 元/㎡·月')
      + dl('维修资金标准', P.wxzj + ' 元/㎡')
      + dl('白蚁防治收费', P.byfz + ' 元/㎡')
      + dl('电梯与无障碍', good && (P.gTags || []).join('').indexOf('适老化') >= 0
        ? '按适老化设计标准配置，含无障碍通道、电梯轿厢扶手与紧急呼叫' : '按国家标准配置电梯与无障碍设施')
      + dl('社区场地', good && (P.gTags || []).join('').indexOf('全龄') >= 0
        ? '设置全龄活动场地，含儿童游乐、老人健身与共享会客空间' : '按规划配置活动场地与绿化')
      + dl('装配式建造', good && (P.gTags || []).join('').indexOf('装配率') >= 0
        ? (P.gTags || []).filter(function (t) { return t.indexOf('装配率') >= 0; })[0] : '按项目施工图设计文件执行')
      + dl('绿色建筑', good && (P.gTags || []).join('').indexOf('绿色建筑') >= 0
        ? (P.gTags || []).filter(function (t) { return t.indexOf('绿色建筑') >= 0; })[0] : '按现行绿色建筑标准执行')
      + '</dl></div>', '')

    /* ---------- 五方责任主体（wsmh-12-05） ---------- */
    + (good ? card('fa-people-group', '五方责任主体公示', '建设 · 勘察 · 设计 · 施工 · 监理',
      '<div class="table-wrap"><table class="pub-table">'
      + '<thead><tr><th style="width:130px">责任主体</th><th>单位名称</th><th style="width:150px">项目负责人</th><th style="width:200px">质量终身责任</th></tr></thead><tbody>'
      + (P.wfzt || []).map(function (w) {
        return '<tr><td class="strong">' + w.r + '</td><td>' + UI.esc(w.n) + '</td>'
          + '<td>' + UI.esc(w.p) + ' <span class="text-3 text-xs">（姓名已脱敏）</span></td>'
          + '<td>已签署工程质量终身责任承诺书</td></tr>';
      }).join('') + '</tbody></table>'
      + '<div class="table-note">五方责任主体及项目负责人依法对工程质量承担终身责任。'
      + '负责人姓名按脱敏口径展示，完整信息可凭有效证件到窗口查询。</div></div>',
      '<a class="btn btn-sm" href="agency-public.html" data-fp="wsmh-12-05">从业主体公示总览</a>'
      + '<a class="btn btn-sm" href="complaint.html" data-fp="wsmh-12-05">质量问题投诉</a>') : '')

    /* ---------- 项目基础信息 ---------- */
    + card('fa-circle-info', '项目基础信息', '来源于商品房网签备案管理系统',
      '<div class="desc-list"><dl>'
      + dl('项目名称', UI.esc(P.xmmc))
      + dl('开发企业', '<a href="agency-list.html?kw=' + encodeURIComponent(P.kfqy) + '" data-fp="wsmh-12-04">' + UI.esc(P.kfqy) + '</a>')
      + dl('项目坐落', P.qx + ' · ' + P.sq + ' · ' + UI.esc(P.dz))
      + dl('预售许可证', P.yszh + '　<span class="text-3 text-xs">发证日期 ' + P.ysrq + '</span>')
      + dl('销售状态', P.zt + '　总建筑面积 ' + UI.money(P.jzmj, 0) + ' ㎡')
      + dl('备案拟售均价', '<b class="text-accent">' + UI.money(P.junjia, 0) + '</b> 元/㎡（区间 ' + P.jgqj + '）'
        + '<span class="text-3 text-xs">　备案（拟售）价格，实际成交以合同为准</span>')
      + dl('可售套数', P.ksts + ' 套　<span class="text-3 text-xs">规划总套数 ' + P.zts + ' 套，已竣工交付 ' + P.jjts + ' 套</span>')
      + dl('前期物业', UI.esc(P.wuye) + '　物业费 ' + P.wyf + ' 元/㎡·月')
      + dl('维修资金标准', P.wxzj + ' 元/㎡')
      + dl('预售资金监管', UI.esc(P.jgyh) + '　监管账号 ' + P.jgzh
        + '<div class="text-xs text-accent"><i class="fa-solid fa-triangle-exclamation"></i> 购房款必须缴入公示的监管账户，任何要求转入个人账户的都是诈骗</div>')
      + (P.zjdy ? dl('在建工程抵押', P.zjdy.lc + '　' + P.zjdy.fw + '　' + P.zjdy.zt + '　抵押权人 ' + UI.esc(P.zjdy.yh)) : '')
      + (P.risk ? dl('风险提示', '<span class="lv ' + (P.risk === 3 ? 'orange' : 'yellow') + '"><i></i>' + UI.esc(P.riskNote) + '</span>') : '')
      + '</dl></div>',
      '<a class="btn btn-sm" href="new-house-detail.html?id=' + P.id + '" data-fp="wsmh-12-04">查看楼盘完整公示</a>')

    /* ---------- 交付节点 ---------- */
    + card('fa-flag-checkered', '建设与交付节点', '与购房办事服务的交付公示同源',
      '<div class="timeline">' + (P.jfjd || []).map(function (n) {
        var cls = n.s === 1 ? 'done' : (n.d ? 'on' : 'wait');
        return '<div class="tl-i ' + cls + '"><div class="tl-t">' + n.n + '</div>'
          + '<div class="tl-m">' + (n.d ? n.d : '按计划推进中，具体时间以正式公告为准')
          + '　' + (n.s === 1 ? '<span class="badge green">已完成</span>' : '<span class="badge gray">未完成</span>') + '</div></div>';
      }).join('') + '</div>',
      '<a class="btn btn-sm" href="buy-service.html?tab=bs-delivery" data-fp="wsmh-12-04">交付节点公示</a>')

    + '</div><div id="src-note"></div>';

  document.getElementById('src-note').innerHTML = UI.sourceNote('品质指标与五方责任主体由建设单位申报、认定机构核验后公示。');
}

function kpi(ico, color, v, l) {
  return '<div class="stat-card" style="padding:13px 15px"><span class="s-ico ' + color + '" style="width:38px;height:38px;font-size:16px">'
    + '<i class="fa-solid ' + ico + '"></i></span><span><span class="s-value" style="font-size:20px">' + v + '</span>'
    + '<span class="s-label">' + l + '</span></span></div>';
}
function idx(ico, v, l, d) {
  return '<div class="idx-i"><div class="ii-h"><span class="ii-ico"><i class="fa-solid ' + ico + '"></i></span>'
    + '<span><span class="ii-v">' + (v || '—') + '</span><span class="ii-l" style="display:block">' + l + '</span></span></div>'
    + '<div class="ii-d">' + d + '</div></div>';
}

/* ---------------- 图集与全景（wsmh-12-03） ---------------- */
function galGo(i) {
  document.getElementById('g-img').src = GAL[i][0];
  document.getElementById('g-cap').innerHTML = GAL[i][1] + '　实景与样板间图片由开发企业提供并承诺真实，交付标准以合同附件为准';
  var ts = document.getElementById('g-thumbs').children;
  for (var k = 0; k < ts.length; k++) ts[k].className = (k === i ? 'on' : '');
}

function vrOpen() {
  var pts = ['客厅', '主卧', '次卧', '厨房', '卫生间', '阳台与景观'];
  UI.modal('<i class="fa-solid fa-panorama text-primary"></i> ' + UI.esc(P.xmmc) + ' · 全景看房',
    '<div class="vr-stage">'
    + '<div class="vs-ico"><i class="fa-solid fa-vr-cardboard"></i></div>'
    + '<div class="vs-t" id="vr-t">客厅 · 720° 全景</div>'
    + '<div class="vs-d">演示环境使用全景占位区展示。正式环境接入实景全景漫游，可拖动视角、切换空间点位，'
    + '并叠加尺寸标注与装修交付标准说明。</div>'
    + '<div class="vr-pts" id="vr-pts">' + pts.map(function (p, i) {
      return '<a class="' + (i === 0 ? 'on' : '') + '" onclick="vrGo(this,\'' + p + '\')" data-fp="wsmh-12-03">' + p + '</a>';
    }).join('') + '</div>'
    + '</div>'
    + '<div class="alert alert-info mt-16" style="margin-bottom:0"><i class="fa-solid fa-circle-info"></i>'
    + '<span>样板间的装修、家具与陈设<b>不属于交付标准</b>，实际交付以《商品房买卖合同》约定的装修标准与附件为准。</span></div>',
    '<button class="btn" data-act="close-modal">关闭</button>'
    + '<a class="btn btn-primary" href="price-table.html?id=' + P.id + '" data-fp="wsmh-12-03">看一房一价与户型</a>', 1);
}
function vrGo(el, name) {
  var box = document.getElementById('vr-pts');
  box.querySelectorAll('a').forEach(function (a) { a.classList.remove('on'); });
  el.classList.add('on');
  document.getElementById('vr-t').innerHTML = name + ' · 720° 全景';
}

/* ---------------- 对比与反馈 ---------------- */
function ghCmp() {
  var ids = cmpGet();
  if (ids.indexOf(P.id) >= 0) { UI.toast('该项目已在对比栏中', 'info'); return; }
  if (ids.length >= 4) { UI.toast('最多同时对比 4 个项目', 'warning'); return; }
  ids.push(P.id); cmpSet(ids);
  if (ids.length >= 2) {
    UI.confirm('已加入对比', '对比栏已有 <b>' + ids.length + '</b> 个项目，可按品质指标、价格与配套横向对比。是否立即查看？',
      function () { UI.go('web/house-compare.html', { ids: ids.join(',') }); }, '查看对比');
  } else UI.toast('已加入对比栏，再选 1 个项目即可横向对比', 'success');
}

/* 品质问题反馈（wsmh-12-08） */
function fbOpen() {
  if (!UI.needLogin('提交品质问题反馈')) return;
  UI.drawer('<i class="fa-solid fa-comment-dots text-primary"></i> 提交品质问题反馈',
    '<div class="alert alert-info"><i class="fa-solid fa-circle-info"></i>'
    + '<span>反馈用于核实公示的品质指标、标签与实际是否一致，受理后可在「个人中心 → 我的消息」查看处理情况。'
    + '涉及工程质量的投诉请使用<a href="complaint.html" data-fp="wsmh-12-08">咨询投诉</a>通道。</span></div>'
    + '<div class="form-grid c1">'
    + '<div class="form-item"><label>反馈项目</label><input class="input" value="' + UI.esc(P.xmmc) + '" readonly></div>'
    + '<div class="form-item"><label><span class="req">*</span>问题所属</label><select class="select" id="gf-lx">'
    + ['品质标签与实际不符', '品质指标公示有误', '五方责任主体信息有误', '配套设施与公示不一致', '样板间与交付标准不符', '其他']
      .map(function (x) { return '<option>' + x + '</option>'; }).join('') + '</select></div>'
    + '<div class="form-item"><label><span class="req">*</span>问题描述</label>'
    + '<textarea class="textarea" id="gf-desc" placeholder="请具体描述公示内容与实际情况的差异，例如实测层高、隔声效果、适老化设施缺失等"></textarea></div>'
    + '<div class="form-item"><label>联系方式（选填）</label><input class="input" id="gf-tel" placeholder="便于回访，留空则不回访"></div>'
    + '<div class="form-item"><label>佐证材料（选填）</label>'
    + '<div class="file-up" onclick="UI.toast(\'演示环境不上传真实文件，已模拟附件：现场照片.jpg\',\'info\')" data-fp="wsmh-12-08">'
    + '<i class="fa-solid fa-cloud-arrow-up"></i>点击上传现场照片或检测报告</div></div>'
    + '</div>',
    '<button class="btn" data-act="close-drawer">取消</button>'
    + '<button class="btn btn-primary" id="gf-ok" data-fp="wsmh-12-08">提交反馈</button>');
  document.getElementById('gf-ok').onclick = function () {
    var d = document.getElementById('gf-desc').value.trim();
    if (!d) { UI.toast('请填写问题描述', 'warning'); return; }
    var no = PORTAL.act('feedback.add', {
      type: '品质问题反馈', page: P.xmmc,
      desc: '【' + document.getElementById('gf-lx').value + '】' + d,
      tel: document.getElementById('gf-tel').value
    });
    UI.closeDrawer();
    UI.toast('品质问题反馈已提交，受理编号 ' + no + '，我们将在 5 个工作日内核实并反馈', 'success');
  };
}
</script>
