<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>扫码验真与电子亮证 · 统一服务门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .vf-box {
    background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card); padding: 34px;
    text-align: center; max-width: 720px; margin: 0 auto;
  }
  .vf-box .vb-ico { font-size: 46px; color: var(--primary); margin-bottom: 14px; }
  .vf-box .vb-t { font-size: 20px; font-weight: 700; }
  .vf-box .vb-d { font-size: 13.5px; color: var(--text-3); margin-top: 8px; line-height: 1.9; }
  .vf-input {
    display: flex; gap: 10px; max-width: 480px; margin: 22px auto 0;
  }
  .vf-input input {
    flex: 1; height: 48px; border: 2px solid var(--primary-soft); border-radius: 6px; padding: 0 16px;
    font-size: 20px; letter-spacing: 5px; text-align: center; text-transform: uppercase;
    font-family: "DIN Alternate", var(--font); outline: 0;
  }
  .vf-input input:focus { border-color: var(--primary); }
  .res-ok, .res-warn, .res-bad {
    border-radius: var(--radius-card); padding: 22px 26px; margin-top: 22px; text-align: left;
  }
  .res-ok { background: var(--success-light); border: 2px solid #bfe8cf; }
  .res-warn { background: var(--warning-light); border: 2px solid #f5dab0; }
  .res-bad { background: var(--danger-light); border: 2px solid #f7cdca; }
  .res-hd { display: flex; align-items: center; gap: 12px; font-size: 19px; font-weight: 700; }
  .res-ok .res-hd { color: #15803d; }
  .res-warn .res-hd { color: #b45309; }
  .res-bad .res-hd { color: #b91c1c; }
  .res-hd i { font-size: 26px; }
  .cert-view {
    background: #fff; border-radius: 8px; padding: 22px; margin-top: 16px; border: 1px solid var(--border);
  }
  /* 电子亮证 */
  .id-card {
    max-width: 420px; margin: 0 auto; border-radius: 14px; overflow: hidden; position: relative;
    background: linear-gradient(140deg, var(--primary) 0%, var(--primary-deep) 100%); color: #fff;
    box-shadow: var(--shadow-lg);
  }
  .id-card .ic-wm {
    position: absolute; inset: 0; opacity: .13; font-size: 12px; line-height: 2.4; pointer-events: none;
    transform: rotate(-22deg) scale(1.5); white-space: nowrap; overflow: hidden;
  }
  .id-card .ic-in { position: relative; z-index: 2; padding: 22px 24px; }
  .id-card .ic-h { display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 700;
    padding-bottom: 14px; border-bottom: 1px solid rgba(255,255,255,.25); }
  .id-card dl { display: flex; flex-wrap: wrap; margin: 14px 0 0; font-size: 13.5px; }
  .id-card dt { width: 84px; opacity: .8; padding: 5px 0; }
  .id-card dd { width: calc(100% - 84px); margin: 0; padding: 5px 0; font-weight: 500; }
  .id-card .ic-qr {
    background: #fff; border-radius: 8px; width: 96px; height: 96px; margin: 16px auto 0;
    display: flex; align-items: center; justify-content: center; font-size: 42px; color: var(--primary);
  }
  .id-card .ic-f { text-align: center; font-size: 11.5px; opacity: .85; padding: 12px 0 0; line-height: 1.8; }
  .id-card .ic-cd { text-align: center; font-size: 13px; margin-top: 10px; }
  .id-card .ic-cd b { font-size: 19px; font-family: "DIN Alternate", var(--font); }
</style>
</head>
<body data-nav="query">

<div class="wrap"><div class="crumb"><a href="home.html">首页</a><i class="fa-solid fa-angle-right"></i><a href="query-center.html">查询中心</a><i class="fa-solid fa-angle-right"></i>扫码验真与电子亮证</div></div>

<div class="wrap">
  <div class="tabs" data-tabs data-scope="vf-box-wrap" id="vf-tabs">
    <a class="on" data-tab="qv-cert"><i class="fa-solid fa-file-shield"></i> 证明验真</a>
    <a data-tab="qv-house"><i class="fa-solid fa-house-circle-check"></i> 房源核验码验真</a>
    <a data-tab="qv-show"><i class="fa-solid fa-id-card"></i> 电子亮证</a>
  </div>

  <div id="vf-box-wrap">
    <!-- 证明验真 -->
    <div class="tab-pane on" id="qv-cert">
      <div class="vf-box">
        <div class="vb-ico"><i class="fa-solid fa-file-shield"></i></div>
        <div class="vb-t">备案证明与查询结果单验真</div>
        <div class="vb-d">输入证明右下角的<b>验真码</b>或<b>证明编号</b>，或直接扫描证明上的二维码，即可核验真伪与有效期。<br>本功能无需登录，任何人都可以核验收到的证明是否真实。</div>
        <div class="vf-input">
          <input id="c-code" placeholder="验真码" maxlength="20">
          <button class="btn btn-primary btn-lg" style="flex:none" id="btn-cv" data-fp="wsmh-26-02">
            <i class="fa-solid fa-shield-halved"></i> 核验</button>
        </div>
        <div class="mt-12">
          <button class="btn btn-sm" id="btn-scan"><i class="fa-solid fa-qrcode"></i> 扫描二维码核验</button>
        </div>
        <div id="cv-result"></div>
      </div>

      <div class="card mt-20">
        <div class="card-head"><h3><i class="fa-solid fa-list text-primary"></i> 本站已出具的证明</h3>
          <span class="sub">演示用：点「用此码验真」可直接体验真码核验效果</span>
          <div class="ca"><a class="btn btn-sm" href="cert-print.html">证明打印出证</a></div></div>
        <div class="card-body np" id="cert-list"></div>
      </div>
    </div>

    <!-- 房源核验码验真 -->
    <div class="tab-pane" id="qv-house">
      <div class="vf-box">
        <div class="vb-ico"><i class="fa-solid fa-house-circle-check"></i></div>
        <div class="vb-t">房源核验码验真</div>
        <div class="vb-d">房源核验码是平台对房源权属与挂牌资格核验通过后生成的唯一编码。<br>
          输入核验码可查询房源真实性、挂牌状态、委托经纪机构与核验有效期。<b>签约前请务必核验。</b></div>
        <div class="vf-input">
          <input id="h-code" placeholder="LZ2H2026000000" maxlength="20" style="letter-spacing:2px;font-size:17px">
          <button class="btn btn-primary btn-lg" style="flex:none" id="btn-hv" data-fp="wsmh-09-02">
            <i class="fa-solid fa-shield-halved"></i> 验真</button>
        </div>
        <div class="mt-12">
          <button class="btn btn-sm" id="btn-hdemo"><i class="fa-solid fa-wand-magic-sparkles"></i> 填入一个真实核验码</button>
        </div>
        <div id="hv-result"></div>
      </div>
    </div>

    <!-- 电子亮证 -->
    <div class="tab-pane" id="qv-show">
      <div class="card">
        <div class="card-head"><h3><i class="fa-solid fa-id-card text-primary"></i> 电子亮证</h3>
          <span class="sub">出示电子备案证明与电子证照，带动态水印防截图传播</span></div>
        <div class="card-body" id="show-body"></div>
      </div>
    </div>
  </div>

  <div id="src-note"></div>
</div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
var showTimer = null;

function pageInit() {
  var tab = UI.param('tab'), code = UI.param('code');
  if (tab) {
    document.querySelectorAll('#vf-tabs a').forEach(function (a) { a.classList.remove('on'); });
    document.querySelectorAll('.tab-pane').forEach(function (p) { p.classList.remove('on'); });
    var t = document.querySelector('#vf-tabs a[data-tab="' + tab + '"]');
    if (t) { t.classList.add('on'); document.getElementById(tab).classList.add('on'); }
  }

  document.getElementById('btn-cv').onclick = doCertVerify;
  document.getElementById('c-code').onkeydown = function (e) { if (e.key === 'Enter') doCertVerify(); };
  document.getElementById('btn-scan').onclick = function () {
    UI.toast('请使用微信或本站小程序扫描证明右下角的二维码，扫码后自动跳转本页完成核验', 'info');
  };

  document.getElementById('btn-hv').onclick = doHouseVerify;
  document.getElementById('h-code').onkeydown = function (e) { if (e.key === 'Enter') doHouseVerify(); };
  document.getElementById('btn-hdemo').onclick = function () {
    var h = PORTAL.houses({ lx: '2' })[0];
    document.getElementById('h-code').value = h.hym;
    UI.toast('已填入真实核验码 ' + h.hym + '，点「验真」查看结果', 'success');
  };

  renderCertList();
  renderShow();

  if (code) {
    document.getElementById('c-code').value = code;
    doCertVerify();
  }

  document.getElementById('src-note').innerHTML = UI.sourceNote(
    '验真结果直接读取出证台账，出具的每一份证明都在台账留档并带二维码与验真码，第三方扫码可核验真伪。'
  );
}

/* 证明验真（wsmh-26-02） */
function doCertVerify() {
  var code = document.getElementById('c-code').value.trim();
  if (!code) { UI.toast('请输入验真码或证明编号', 'warning'); return; }
  var r = PORTAL.act('cert.verify', { code: code });
  var box = document.getElementById('cv-result');

  if (r.ok) {
    var c = r.cert;
    box.innerHTML = '<div class="res-ok">'
      + '<div class="res-hd"><i class="fa-solid fa-circle-check"></i> 验真通过 · 本证明真实有效</div>'
      + '<div class="cert-view">'
      + '<div class="center" style="font-size:18px;font-weight:700;letter-spacing:2px">' + UI.esc(c.lx) + '</div>'
      + '<div class="center text-3 text-xs mt-8">证明编号：' + c.bh + '</div>'
      + '<div style="font-size:13.5px;line-height:2.1;margin-top:16px;text-indent:2em">' + UI.esc(c.nr) + '</div>'
      + '<div class="desc-list c2 mt-16"><dl>'
      + '<dt>证明类型</dt><dd>' + UI.esc(c.lx) + '</dd>'
      + '<dt>涉及房屋</dt><dd>' + PORTAL.mask('fh', c.fw) + '</dd>'
      + '<dt>出证时间</dt><dd>' + c.d + '</dd>'
      + '<dt>有效期至</dt><dd class="text-success bold">' + c.yxq + '</dd>'
      + '<dt>出证用途</dt><dd>' + UI.esc(c.yt) + '</dd>'
      + '<dt>出证单位</dt><dd>XXXX市房产交易管理中心</dd>'
      + '</dl></div></div>'
      + '<div class="text-2 text-sm mt-16" style="line-height:1.9"><i class="fa-solid fa-circle-info"></i> '
      + '本次核验时间 ' + PDATA.ymdhm(Date.now()) + '。如对证明内容有疑问，可拨打 <b>0772-2822168</b> 咨询。</div>'
      + '</div>';
  } else if (r.cert) {
    box.innerHTML = '<div class="res-warn">'
      + '<div class="res-hd"><i class="fa-solid fa-triangle-exclamation"></i> 证明已过期</div>'
      + '<div class="text-2 mt-12" style="font-size:14px;line-height:2">' + UI.esc(r.msg) + '<br>'
      + '证明编号 <b>' + r.cert.bh + '</b>，类型「' + UI.esc(r.cert.lx) + '」，出证时间 ' + r.cert.d + '。</div>'
      + '<div class="flex gap-8 mt-16"><a class="btn btn-primary btn-sm" href="cert-print.html">重新出证</a></div>'
      + '</div>';
  } else {
    box.innerHTML = '<div class="res-bad">'
      + '<div class="res-hd"><i class="fa-solid fa-circle-xmark"></i> 未查询到该证明</div>'
      + '<div class="text-2 mt-12" style="font-size:14px;line-height:2">' + UI.esc(r.msg) + '</div>'
      + '<div class="flex gap-8 mt-16" style="flex-wrap:wrap">'
      + '<button class="btn btn-sm" onclick="document.getElementById(\'c-code\').value=\'\';document.getElementById(\'c-code\').focus();document.getElementById(\'cv-result\').innerHTML=\'\'">重新输入</button>'
      + '<button class="btn btn-sm" data-act="chat"><i class="fa-solid fa-headset"></i> 咨询客服</button>'
      + '<a class="btn btn-sm" href="complaint.html">举报伪造证明</a>'
      + '</div></div>';
  }
}

/* 房源核验码验真（wsmh-09-02） */
function doHouseVerify() {
  var code = document.getElementById('h-code').value.trim().toUpperCase();
  if (!code) { UI.toast('请输入房源核验码', 'warning'); return; }
  var h = PORTAL.houses({ all: 1 }).filter(function (x) { return String(x.hym).toUpperCase() === code; })[0];
  var box = document.getElementById('hv-result');
  PORTAL.act('query.log', { dx: '房源核验码 ' + code, lx: '房源核验码验真', yt: '自用', way: '门户网站' });

  if (!h) {
    box.innerHTML = '<div class="res-bad">'
      + '<div class="res-hd"><i class="fa-solid fa-circle-xmark"></i> 未查询到该核验码</div>'
      + '<div class="text-2 mt-12" style="font-size:14px;line-height:2">'
      + '该房源可能<b>未经平台核验</b>，请勿轻信。本平台只展示核验通过的房源，每套房源都有唯一核验码。'
      + '如遇有人使用虚假核验码，请及时举报，核实后将下架房源并记入机构与人员信用记录。</div>'
      + '<div class="flex gap-8 mt-16" style="flex-wrap:wrap">'
      + '<a class="btn btn-accent btn-sm" href="second-house.html"><i class="fa-solid fa-flag"></i> 到房源专区举报</a>'
      + '<a class="btn btn-sm" href="second-house.html">浏览核验房源</a>'
      + '</div></div>';
    return;
  }

  var expired = h.fyzt === '5' || (h.hyyxq && h.hyyxq < UI.today());
  var offline = h.fyzt === '3' || h.fyzt === '4';
  box.innerHTML = '<div class="' + (expired || offline ? 'res-warn' : 'res-ok') + '">'
    + '<div class="res-hd"><i class="fa-solid fa-' + (expired || offline ? 'triangle-exclamation' : 'circle-check') + '"></i> '
    + (expired ? '核验码已过期' : offline ? '房源已' + h.ztmc : '核验通过 · 房源真实有效') + '</div>'
    + '<div class="cert-view"><div class="desc-list c2"><dl>'
    + '<dt>房源核验码</dt><dd class="num bold">' + h.hym + '</dd>'
    + '<dt>核验有效期</dt><dd class="' + (expired ? 'text-danger bold' : '') + '">' + h.hyyxq + '</dd>'
    + '<dt>房源标题</dt><dd>' + UI.esc(h.bt) + '</dd>'
    + '<dt>挂牌状态</dt><dd>' + PORTAL.houseBadge(h) + '</dd>'
    + '<dt>所在小区</dt><dd>' + UI.esc(h.qx) + ' ' + UI.esc(h.xqmc) + '</dd>'
    + '<dt>房号</dt><dd>' + h.fhMask + '</dd>'
    + '<dt>建筑面积</dt><dd>' + h.mj + ' ㎡</dd>'
    + '<dt>户型朝向</dt><dd>' + h.hx + ' · ' + h.cx + '</dd>'
    + '<dt>房源来源</dt><dd>' + h.lymc + '</dd>'
    + '<dt>委托经纪机构</dt><dd>' + (h.wtjg ? UI.esc(h.wtjg) : '无（个人自主房源）') + '</dd>'
    + '<dt>在册经纪人</dt><dd>' + (h.wtjjr ? UI.esc(h.wtjjr) + '　' + (h.jjrzsh || '') : '—') + '</dd>'
    + '<dt>数据来源</dt><dd>' + UI.esc(h.sjly) + '　更新 ' + h.gxsj + '</dd>'
    + '</dl></div></div>'
    + (expired ? '<div class="text-2 text-sm mt-12"><i class="fa-solid fa-circle-info"></i> '
      + '该房源核验码已过有效期，房源已自动下架并留痕。如需继续挂牌，请委托方在「我的房源与挂牌」中续期。</div>' : '')
    + '<div class="text-2 text-sm mt-12" style="line-height:1.9"><i class="fa-solid fa-shield-halved"></i> '
    + '本平台一律不展示权利人姓名、身份证号与联系方式。如有人以房主身份私下联系并索要款项，请谨慎核实。</div>'
    + '<div class="flex gap-8 mt-16" style="flex-wrap:wrap">'
    + '<a class="btn btn-primary btn-sm" href="second-house-detail.html?id=' + h.id + '">查看房源详情</a>'
    + (h.wtjg ? '<a class="btn btn-sm" href="agency-list.html">核验委托机构</a>' : '')
    + '</div></div>';
}

function renderCertList() {
  var arr = PORTAL.certs();
  var box = document.getElementById('cert-list');
  if (!arr.length) {
    box.innerHTML = '<div style="padding:18px">' + UI.empty('暂无已出具的证明',
      '办件办结后备案证明会自动出具，也可在证明打印出证页主动出证',
      '<a class="btn btn-primary btn-sm" href="cert-print.html">去出证</a>') + '</div>';
    return;
  }
  box.innerHTML = '<table class="pub-table"><thead><tr>'
    + '<th style="width:52px">序号</th><th style="width:150px">证明编号</th><th>证明类型</th>'
    + '<th>涉及房屋</th><th style="width:150px">出证时间</th><th style="width:110px">有效期至</th>'
    + '<th style="width:96px">验真码</th><th style="width:88px">状态</th><th style="width:110px">操作</th>'
    + '</tr></thead><tbody>'
    + arr.map(function (c, i) {
      return '<tr><td class="num">' + (i + 1) + '</td><td class="num">' + c.bh + '</td>'
        + '<td class="strong">' + UI.esc(c.lx) + '</td><td>' + PORTAL.mask('fh', c.fw) + '</td>'
        + '<td>' + c.d + '</td><td>' + c.yxq + '</td>'
        + '<td class="num bold text-accent">' + c.yzm + '</td>'
        + '<td>' + PORTAL.badge(c.ztmc, c.zt === '1' ? 'green' : 'gray') + '</td>'
        + '<td class="acts"><a href="javascript:;" data-use="' + c.yzm + '">用此码验真</a></td></tr>';
    }).join('') + '</tbody></table>'
    + '<div class="table-note">出证台账数据来源：证明出证信息表（PSP_ZMCZXX）。每份证明带二维码与验真码，重复出证按次留痕。</div>';

  box.querySelectorAll('[data-use]').forEach(function (a) {
    a.onclick = function () {
      document.getElementById('c-code').value = a.getAttribute('data-use');
      doCertVerify();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  });
}

/* 电子亮证（wsmh-26-03） */
function renderShow() {
  var box = document.getElementById('show-body');
  if (!UI.isLogin()) {
    box.innerHTML = '<div class="alert alert-info"><i class="fa-solid fa-circle-info"></i>'
      + '<span>电子亮证需登录后使用，出示的是您本人名下的电子证照与备案证明。</span></div>'
      + '<div class="center"><a class="btn btn-primary" href="login.html?from=query-verify.html">'
      + '<i class="fa-solid fa-right-to-bracket"></i> 登录后出示证照</a></div>';
    return;
  }
  var arr = PORTAL.certs().filter(function (c) { return c.zt === '1'; });
  if (!arr.length) {
    box.innerHTML = UI.empty('暂无可出示的有效证照',
      '办件办结后备案证明会自动出具并可用于电子亮证',
      '<a class="btn btn-primary btn-sm" href="cert-print.html">去出证</a>');
    return;
  }
  box.innerHTML = '<div class="alert alert-warning"><i class="fa-solid fa-triangle-exclamation"></i>'
    + '<span>电子亮证带<b>动态水印</b>（含出示时间与查看人），仅供本次出示，请勿截图传播。'
    + '出示界面 15 秒后自动关闭。</span></div>'
    + '<div class="form-grid c1" style="max-width:520px">'
    + '<div class="form-item"><label>选择要出示的证照</label>'
    + '<select class="select" id="sc-pick">' + arr.map(function (c) {
      return '<option value="' + c.id + '">' + UI.esc(c.lx) + '（' + c.bh + '，有效期至 ' + c.yxq + '）</option>';
    }).join('') + '</select></div></div>'
    + '<div class="flex gap-8 mt-16"><button class="btn btn-primary" id="btn-show" data-fp="wsmh-26-03">'
    + '<i class="fa-solid fa-id-card"></i> 出示证照</button></div>';

  document.getElementById('btn-show').onclick = function () {
    var id = document.getElementById('sc-pick').value;
    var c = PORTAL.certs().filter(function (x) { return x.id === id; })[0];
    if (!c) return;
    var wm = [];
    for (var i = 0; i < 26; i++) wm.push('房产交易管理网 ' + PDATA.ymdhm(Date.now()) + ' ' + PORTAL.mask('name', UI.user().name) + '　');
    var left = 15;
    UI.modal('<i class="fa-solid fa-id-card text-primary"></i> 电子亮证',
      '<div class="id-card"><div class="ic-wm">' + wm.join('') + '</div>'
      + '<div class="ic-in">'
      + '<div class="ic-h"><i class="fa-solid fa-shield-halved"></i> ' + UI.esc(c.lx) + '</div>'
      + '<dl>'
      + '<dt>持证人</dt><dd>' + PORTAL.mask('name', UI.user().name) + '</dd>'
      + '<dt>证件号码</dt><dd>' + (UI.user().idno || '450202198703****') + '</dd>'
      + '<dt>涉及房屋</dt><dd>' + PORTAL.mask('fh', c.fw) + '</dd>'
      + '<dt>证明编号</dt><dd>' + c.bh + '</dd>'
      + '<dt>出证时间</dt><dd>' + c.d + '</dd>'
      + '<dt>有效期至</dt><dd>' + c.yxq + '</dd>'
      + '<dt>验真码</dt><dd>' + c.yzm + '</dd>'
      + '</dl>'
      + '<div class="ic-qr"><i class="fa-solid fa-qrcode"></i></div>'
      + '<div class="ic-f">扫码核验真伪　出证单位：XXXX市房产交易管理中心<br>仅供本次出示，请勿截图传播</div>'
      + '<div class="ic-cd">界面将在 <b id="sc-left">15</b> 秒后自动关闭</div>'
      + '</div></div>',
      '<button class="btn" data-act="close-modal">立即关闭</button>');
    clearInterval(showTimer);
    showTimer = setInterval(function () {
      left--;
      var el = document.getElementById('sc-left');
      if (!el) { clearInterval(showTimer); return; }
      el.textContent = left;
      if (left <= 0) {
        clearInterval(showTimer); UI.closeModal();
        UI.toast('电子证照已关闭，出示记录已留痕', 'success');
      }
    }, 1000);
  };
}
</script>
</body>
</html>
