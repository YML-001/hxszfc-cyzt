<style>
  .sg-body { padding: 0 0 40px; }

    background: linear-gradient(120deg, var(--primary-deep), var(--primary) 70%, #4272d8);

  }

  .sg-head .sh-d { font-size: 14.5px; opacity: .9; margin-top: 8px; }
  .sg-pick { display: flex; gap: 8px; margin-top: 20px; flex-wrap: wrap; }
  .sg-pick a {
    padding: 7px 18px; border-radius: 20px; font-size: 14px; color: #fff;
    background: rgba(255,255,255,.16); border: 1px solid rgba(255,255,255,.28);
  }
  .sg-pick a:hover { background: rgba(255,255,255,.28); color: #fff; }
  .sg-pick a.on { background: #fff; color: var(--primary); font-weight: 700; border-color: #fff; }
  .sg-main { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  .mat-list li {
    display: flex; align-items: flex-start; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--row-line); font-size: 13.5px;
  }
  .mat-list li:last-child { border-bottom: 0; }
  .mat-list .mi-n { width: 22px; flex: none; color: var(--text-3); font-family: "DIN Alternate", var(--font); }
  .mat-list .mi-t { flex: 1; }
  .mat-list .mi-t b { font-weight: 500; }
  .mat-list .mi-d { font-size: 12.5px; color: var(--text-3); margin-top: 2px; }

<body data-nav="home">

<div class="sg-head">

    </div>
    <h1 id="sg-title">办事情形引导</h1>
    <div class="sh-d" id="sg-desc">按群众的办事情形组织入口，一个情形聚合材料清单、办理流程、办理时限与在线办理入口，不用先弄懂事项名称。</div>
    <div class="sg-pick" id="sg-pick"></div>
  </div>
</div>

<div class="wrap sg-body">
  <div class="section" style="padding:22px 0">
    <div class="sg-main">
      <div>
        <!-- 办理流程（wsmh-04-02） -->
        <div class="card mb-16">
          <div class="card-head"><h3><i class="fa-solid fa-route text-primary"></i> 办理流程</h3>
            <span class="sub" id="flow-sub"></span></div>
          <div class="card-body"><div class="step-flow" id="sg-flow"></div></div>
        </div>

        <!-- 涉及事项 -->
        <div class="card mb-16">
          <div class="card-head"><h3><i class="fa-solid fa-list-check text-primary"></i> 本情形涉及的办理事项</h3>
            <span class="sub">逐项显示办理方式、时限与是否全程网办</span></div>
          <div class="card-body np">
            <div class="table-wrap" style="border:0;border-radius:0">
              <table class="pub-table">
                <thead><tr><th style="width:52px">序号</th><th>事项名称</th><th style="width:130px">承办科室</th>

                <tbody id="sg-items"></tbody>
              </table>
            </div>
          </div>
        </div>

            <div class="ca"><span class="badge green" id="mat-exempt"></span></div></div>
          <div class="card-body"><ul class="mat-list" id="sg-mats"></ul></div>
        </div>
      </div>

      <div>
        <div class="card mb-16">
          <div class="card-head"><h3><i class="fa-solid fa-bolt text-accent"></i> 在线办理入口</h3></div>

        </div>

          <div class="card-body" id="sg-risk"></div>
        </div>

            <div class="ca"><a class="btn btn-sm" href="help.html">更多</a></div></div>
          <div class="card-body" id="sg-faq"></div>
        </div>
      </div>
    </div>
    <div id="src-note"></div>
  </div>
</div>

function pageInit() {
  var key = UI.param('scene') || 'buy-new';
  if (!SG[key]) key = 'buy-new';

  document.getElementById('sg-pick').innerHTML = PDATA.SCENES.map(function (s) {
    return '<a class="' + (s.k === key ? 'on' : '') + '" href="scene-guide.html?scene=' + s.k + '">'
      + '<i class="fa-solid ' + s.ico + '"></i> ' + s.n + '</a>';
  }).join('');

  var g = SG[key];
  document.getElementById('sg-title').textContent = '我要' + g.n;
  document.getElementById('sg-desc').textContent = g.d;
  document.getElementById('flow-sub').textContent = '共 ' + g.flow.length + ' 个步骤，逐步骤标注办理部门与线上线下方式';

  /* 流程图解（wsmh-04-02） */
  document.getElementById('sg-flow').innerHTML = g.flow.map(function (f, i) {
    return '<div class="sf-i"><div class="sf-n"><i class="fa-solid ' + f[1] + '"></i></div>'
      + '<div class="sf-t">' + (i + 1) + '. ' + f[0] + '</div>'
      + '<div class="sf-d">' + f[2] + '</div>'
      + '<div class="sf-tag"><span class="badge ' + (f[3] === '本人办理' ? 'green' : f[3] === '系统自动' ? 'cyan' : 'blue') + '">' + f[3] + '</span></div></div>';
  }).join('');

  /* 涉及事项 */
  document.getElementById('sg-items').innerHTML = g.items.map(function (code, i) {
    var it = PORTAL.item(code); if (!it) return '';
    return '<tr><td class="num">' + (i + 1) + '</td>'
      + '<td class="strong"><a href="item-detail.html?code=' + it.code + '">' + it.name + '</a></td>'
      + '<td>' + it.dept + '</td>'
      + '<td>法定 ' + it.fdrq + ' 日 / 承诺 <b class="text-accent">' + it.nsrq + '</b> 日</td>'
      + '<td class="num">' + it.clnum + ' 份</td>'
      + '<td>' + (it.wb ? '<span class="badge green">全程网办</span>' : '<span class="badge orange">需到窗口</span>') + '</td>'
      + '<td class="acts"><a href="item-detail.html?code=' + it.code + '">办事指南</a>'
      + '<a href="javascript:;" data-apply="' + it.code + '" data-fp="wsmh-02-02">在线办理</a></td></tr>';
  }).join('');

  /* 一套材料清单（去重，标注可免提交） */
  var mats = [], seen = {}, exempt = 0;
  g.items.forEach(function (code) {
    var it = PORTAL.item(code); if (!it) return;
    it.cl.forEach(function (m) {
      if (seen[m.mc]) return; seen[m.mc] = 1; mats.push(m); if (m.mian) exempt++;
    });
  });
  document.getElementById('mat-exempt').textContent = exempt + ' 份可电子证照免提交';
  document.getElementById('sg-mats').innerHTML = mats.map(function (m, i) {
    return '<li><span class="mi-n">' + (i + 1) + '</span>'
      + '<span class="mi-t"><b>' + m.mc + '</b>'
      + (m.bt ? ' <span class="badge red">必需</span>' : ' <span class="badge gray">条件必需</span>')
      + (m.mian ? ' <span class="badge green">电子证照免提交</span>' : (m.fy ? ' <span class="badge cyan">材料库可复用</span>' : ''))
      + '<span class="mi-d">' + m.lx + '　原件或加盖公章的复印件，支持 PDF / JPG</span></span></li>';
  }).join('');

  /* 在线办理入口 */
  document.getElementById('sg-entry').innerHTML = g.entry.map(function (e) {
    return '<a class="btn btn-block ' + (e === g.entry[0] ? 'btn-accent' : '') + ' mb-8" '
      + 'href="' + e[1] + '" data-need="' + (e[3] ? 1 : 0) + '" data-name="' + e[0] + '">'
      + '<i class="fa-solid ' + e[2] + '"></i> ' + e[0] + '</a>';
  }).join('')
    + '<div class="text-3 text-xs mt-12"><i class="fa-solid fa-circle-info"></i> 带锁标的入口需登录并完成实名认证；未登录时点击会引导登录。</div>';

  /* 风险提示（wsmh-04-06） */
  document.getElementById('sg-risk').innerHTML = g.risk.map(function (r) {
    return '<div class="alert alert-warning" style="margin-bottom:8px"><i class="fa-solid fa-triangle-exclamation"></i><span>' + r + '</span></div>';
  }).join('');

  /* 相关问答 */
  var faqs = PORTAL.faq().filter(function (q) {
    return g.items.some(function (c) { var it = PORTAL.item(c); return it && q.a.indexOf(it.name.slice(0, 3)) >= 0; })
      || q.lb.indexOf(g.n.slice(-2)) >= 0;
  }).slice(0, 3);
  if (!faqs.length) faqs = PORTAL.faq().slice(0, 3);
  document.getElementById('sg-faq').innerHTML = faqs.map(function (q) {
    return '<div style="padding:9px 0;border-bottom:1px dashed var(--row-line)">'
      + '<div class="text-1" style="font-size:13.5px;font-weight:500"><i class="fa-solid fa-q text-primary"></i> ' + q.q + '</div>'
      + '<div class="text-3 text-xs mt-8" style="line-height:1.8">' + q.a + '</div></div>';
  }).join('')
    + '<button class="btn btn-block mt-12" data-act="chat"><i class="fa-solid fa-headset"></i> 问智能客服</button>';

  /* 入口登录拦截（wsmh-34-06） */
  document.querySelectorAll('[data-need]').forEach(function (a) {
    a.onclick = function (e) {
      if (a.getAttribute('data-need') === '1' && !UI.needLogin(a.getAttribute('data-name'))) { e.preventDefault(); return false; }
    };
  });
  document.querySelectorAll('[data-apply]').forEach(function (a) {
    a.onclick = function () {
      var code = a.getAttribute('data-apply');
      if (!UI.needLogin('在线办理')) return;
      PORTAL.act('prefs.recent', { code: code, name: PORTAL.item(code).name });
      var MAP = { SX0201: 'second-hand-apply.html', SX0202: 'second-hand-apply.html', SX0203: 'second-hand-apply.html',
        SX0301: 'rent-sign.html', SX0303: 'rent-sign.html', SX0304: 'rent-sign.html', SX0101: 'select-room.html' };
      UI.go(MAP[code] || ('item-detail.html?code=' + code));
    };
  });

  document.getElementById('src-note').innerHTML = UI.sourceNote('本页办事指南内容与广西政务服务网事项目录同源，材料清单以事项详情页为准。');
}
</script>
</body>
</html>
