<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>正文详情 · 统一服务门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  /* 本页专属布局 */
  .ad-main { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
  .ad-paper { background: #fff; border: 1px solid var(--border); border-radius: var(--radius-card); padding: 30px 40px 26px; }
  .ad-h1 { font-size: 26px; line-height: 1.55; color: var(--text-1); text-align: center; }
  .ad-meta {
    margin-top: 18px; padding: 10px 0; border-top: 1px solid var(--row-line); border-bottom: 1px solid var(--row-line);
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap; font-size: 12.5px; color: var(--text-3);
  }
  .ad-tools { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .ad-tools .fz { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 4px; overflow: hidden; }
  .ad-tools .fz a { padding: 2px 9px; color: var(--text-2); border-right: 1px solid var(--border); cursor: pointer; }
  .ad-tools .fz a:last-child { border-right: 0; }
  .ad-tools .fz a.on { background: var(--primary); color: #fff; }
  .ad-tools .tb { padding: 2px 9px; border: 1px solid var(--border-strong); border-radius: 4px; color: var(--text-2); cursor: pointer; }
  .ad-tools .tb:hover { border-color: var(--primary); color: var(--primary); }

  .ad-zw { font-size: 16px; line-height: 2.05; color: var(--text-1); padding: 24px 0 6px; }
  .ad-zw p { margin: 0 0 16px; text-indent: 2em; }
  .ad-zw b { color: var(--text-1); }
  .ad-zw img { max-width: 100%; border-radius: 6px; }
  .ad-pic { width: 100%; max-height: 320px; object-fit: cover; border-radius: 6px; margin-bottom: 18px; }

  .ad-att { margin-top: 20px; border-top: 1px dashed var(--border-strong); padding-top: 16px; }
  .ad-att .at-i {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: var(--radius); margin-bottom: 8px; font-size: 13.5px; background: var(--bg-soft);
  }
  .ad-att .at-i i.fa-file-pdf { color: var(--accent); font-size: 17px; }
  .ad-att .at-i i.fa-file-word { color: var(--primary); font-size: 17px; }
  .ad-att .at-i .at-s { color: var(--text-3); font-size: 12.5px; }

  .ad-foot { display: flex; gap: 12px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--row-line); }
  .ad-foot .af-i { flex: 1; min-width: 0; font-size: 13.5px; }
  .ad-foot .af-i .af-l { color: var(--text-3); font-size: 12.5px; margin-bottom: 4px; }
  .ad-foot .af-i a { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ad-foot .af-i.dis span { color: var(--text-3); }
  .ad-rel li { display: flex; gap: 8px; padding: 9px 0; border-bottom: 1px dashed var(--row-line); font-size: 13.5px; }
  .ad-rel li:last-child { border-bottom: 0; }
  .ad-rel li i { color: var(--primary-soft); margin-top: 6px; font-size: 6px; }
  .ad-rel li .rl-d { color: var(--text-3); font-size: 12px; margin-top: 3px; }
</style>
</head>
<body data-nav="guide">

<div class="wrap">
  <div class="crumb" id="ad-crumb"><a href="home.html">首页</a><i class="fa-solid fa-angle-right"></i>正文详情</div>
</div>

<div class="wrap" style="padding-bottom:40px">
  <div id="ad-box"></div>
  <div id="src-note"></div>
</div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
/* 栏目：名称、徽章色、返回列表页 */
var LM = {
  notice: ['通知公告', 'blue', 'public-affairs.html?tab=pa-notice'],
  news: ['工作动态', 'cyan', 'public-affairs.html?tab=pa-notice'],
  policy: ['政策法规', 'blue', 'policy.html'],
  open: ['政务信息公开', 'cyan', 'public-affairs.html?tab=pa-open'],
  risk: ['风险提示', 'red', 'help.html?tab=hp-risk'],
  train: ['培训材料', 'purple', 'help.html?tab=hp-train'],
  refund: ['退房与备案注销公示', 'orange', 'public-affairs.html?tab=pa-refund'],
  survey: ['测绘成果公示', 'green', 'public-affairs.html?tab=pa-survey']
};
/* 正文关键字 → 关联办事事项 */
var REL = [
  [['租赁', '租房'], ['SX0301', 'SX0304']],
  [['存量房', '二手房'], ['SX0201', 'SX0202']],
  [['商品房', '预售', '好房子'], ['SX0101', 'SX0102']],
  [['资金监管', '监管账户', '维修资金'], ['SX0202', 'SX0901']],
  [['测绘', '面积'], ['SX0601', 'SX0701']],
  [['经纪', '从业', '中介'], ['SX1001', 'SX1002']],
  [['抵押', '公积金', '贷款'], ['SX0401', 'SX0402']],
  [['查询', '证明', '出证', '信息公开'], ['SX0701', 'SX0201']]
];
var art = null, safe = null;

/* 房号截断脱敏：楼栋座单元后紧跟的房号只保留末两位（wsmh-35-06 对外展示脱敏口径） */
function maskFh(s) {
  return String(s || '').replace(/([楼栋座元])(\s*)(\d{3,5})(?![\d\-年月日])/g, function (m, a, b, c) {
    return a + b + '**' + c.slice(-2);
  });
}
/* 退房与测绘类公示涉及具体房号，展示前统一脱敏 */
function mk(a, s) { return (a && (a.lm === 'refund' || a.lm === 'survey')) ? maskFh(s) : s; }

function pageInit() {
  var id = UI.param('id');
  art = id ? PORTAL.article(id) : null;

  if (!art) {
    document.getElementById('ad-box').innerHTML = '<div class="card"><div class="card-body">'
      + UI.empty('未找到该文章', '文章可能已下架、已删除，或链接中的编号 ' + (UI.esc(id) || '（空）') + ' 不正确',
        '<a class="btn btn-primary" href="policy.html" data-fp="wsmh-04-05">返回政策专栏</a> '
        + '<a class="btn" href="public-index.html" data-fp="wsmh-05-12">返回公示中心</a> '
        + '<a class="btn" href="home.html">回到首页</a>')
      + '</div></div>';
    document.getElementById('src-note').innerHTML = UI.sourceNote();
    return;
  }

  /* 浏览量 +1（与列表页浏览量同源） */
  art.llcs = Number(art.llcs || 0) + 1;
  try { PDATA.persist(PORTAL.db()); } catch (e) { }

  safe = { bt: mk(art, art.bt), zy: mk(art, art.zy), zw: mk(art, art.zw) };

  var lm = LM[art.lm] || ['信息公示', 'gray', 'public-index.html'];
  document.title = safe.bt + ' · 统一服务门户';
  document.getElementById('ad-crumb').innerHTML =
    '<a href="home.html">首页</a><i class="fa-solid fa-angle-right"></i>'
    + '<a href="' + lm[2] + '">' + lm[0] + '</a><i class="fa-solid fa-angle-right"></i>正文详情';

  var expired = art.yxq && art.yxq < UI.today();
  var atts = attachments(art);
  var sameLm = PORTAL.articles({ lm: art.lm });
  var idx = -1;
  sameLm.forEach(function (a, i) { if (a.id === art.id) idx = i; });
  var prev = idx > 0 ? sameLm[idx - 1] : null;
  var next = idx >= 0 && idx < sameLm.length - 1 ? sameLm[idx + 1] : null;

  document.getElementById('ad-box').innerHTML =
    '<div class="ad-main"><div>'
    /* ---------- 正文 ---------- */
    + '<div class="ad-paper">'
    + '<h1 class="ad-h1">' + UI.esc(safe.bt) + '</h1>'
    + '<div class="ad-meta">'
    + PORTAL.badge(lm[0], lm[1])
    + '<span><i class="fa-regular fa-building"></i> 来源：' + UI.esc(art.ly) + '</span>'
    + '<span><i class="fa-regular fa-calendar"></i> 发布日期：' + art.fbsj + '</span>'
    + '<span><i class="fa-regular fa-eye"></i> 浏览 ' + UI.money(art.llcs, 0) + ' 次</span>'
    + (art.yxq ? '<span><i class="fa-regular fa-clock"></i> 公示期至：' + art.yxq
      + (expired ? ' <span class="badge gray">已归档</span>' : ' <span class="badge green">公示中</span>') + '</span>' : '')
    + '<span class="ad-tools">'
    + '<span class="fz"><a data-fz="14" data-fp="wsmh-04-05">A-</a><a class="on" data-fz="16" data-fp="wsmh-04-05">A</a><a data-fz="18" data-fp="wsmh-04-05">A+</a></span>'
    + '<span class="tb" id="ad-print" data-fp="wsmh-04-05"><i class="fa-solid fa-print"></i> 打印</span>'
    + '<span class="tb" id="ad-share" data-fp="wsmh-04-05"><i class="fa-solid fa-share-nodes"></i> 分享</span>'
    + '</span></div>'
    + (art.img ? '<img class="ad-pic mt-16" src="' + art.img + '" alt="' + UI.esc(safe.bt) + '">' : '')
    + '<div class="ad-zw" id="ad-zw">' + safe.zw + '</div>'
    /* ---------- 附件 ---------- */
    + '<div class="ad-att"><div class="text-2 bold mb-12"><i class="fa-solid fa-paperclip text-primary"></i> 相关附件（' + atts.length + '）</div>'
    + atts.map(function (f, i) {
      return '<div class="at-i"><i class="fa-solid ' + f[2] + '"></i><span>' + UI.esc(f[0]) + '</span>'
        + '<span class="at-s">' + f[1] + '</span>'
        + '<a class="btn btn-sm ml-auto" href="javascript:;" data-dl="' + i + '" data-fp="wsmh-04-05">'
        + '<i class="fa-solid fa-download"></i> 下载</a></div>';
    }).join('')
    + '<div class="flex gap-8 mt-16">'
    + '<button class="btn" id="ad-fix" data-fp="wsmh-04-05"><i class="fa-solid fa-pen-to-square"></i> 信息纠错</button>'
    + '<button class="btn" data-act="chat" data-fp="wsmh-04-03"><i class="fa-solid fa-headset"></i> 就本文咨询客服</button>'
    + '<a class="btn ml-auto" href="' + lm[2] + '" data-fp="wsmh-04-05">返回' + lm[0] + '列表</a>'
    + '</div></div>'
    /* ---------- 上一篇 / 下一篇 ---------- */
    + '<div class="ad-foot">'
    + '<div class="af-i' + (prev ? '' : ' dis') + '"><div class="af-l">上一篇</div>'
    + (prev ? '<a href="article-detail.html?id=' + prev.id + '" data-fp="wsmh-04-05">' + UI.esc(mk(prev, prev.bt)) + '</a>'
      : '<span>已经是本栏目最新一篇</span>') + '</div>'
    + '<div class="af-i right' + (next ? '' : ' dis') + '"><div class="af-l">下一篇</div>'
    + (next ? '<a href="article-detail.html?id=' + next.id + '" data-fp="wsmh-04-05">' + UI.esc(mk(next, next.bt)) + '</a>'
      : '<span>已经是本栏目最后一篇</span>') + '</div>'
    + '</div>'
    + '</div>'

    /* ---------- 右侧栏 ---------- */
    + '</div><div>'
    + '<div class="card mb-16"><div class="card-head"><h3><i class="fa-solid fa-newspaper text-primary"></i> ' + lm[0] + '·相关文章</h3></div>'
    + '<div class="card-body" style="padding:8px 18px 12px"><ul class="ad-rel" id="ad-rel"></ul></div></div>'
    + '<div class="card mb-16"><div class="card-head"><h3><i class="fa-solid fa-bell text-accent"></i> 订阅本栏目</h3></div>'
    + '<div class="card-body"><div class="text-2 text-sm mb-12" style="line-height:1.9">订阅「' + lm[0]
    + '」后，本栏目每有新稿件发布都会推送到「个人中心 → 我的消息」。</div><div id="ad-subbox"></div></div></div>'
    + '<div class="card"><div class="card-head"><h3><i class="fa-solid fa-list-check text-primary"></i> 关联办事事项</h3></div>'
    + '<div class="card-body" style="padding:8px 18px 14px" id="ad-items"></div></div>'
    + '</div></div>';

  renderRel(sameLm);
  renderRelItems();
  renderSub(lm);
  bindTools(atts);

  document.getElementById('src-note').innerHTML =
    UI.sourceNote('本文由' + UI.esc(art.ly) + '发布，正文与附件以正式发文文本为准。');
}

/* 相关文章 5 条 */
function renderRel(sameLm) {
  var rel = sameLm.filter(function (a) { return a.id !== art.id; }).slice(0, 5);
  document.getElementById('ad-rel').innerHTML = rel.length ? rel.map(function (a) {
    return '<li><i class="fa-solid fa-circle"></i><span><a href="article-detail.html?id=' + a.id + '" data-fp="wsmh-04-05">'
      + UI.esc(mk(a, a.bt)) + '</a><div class="rl-d">' + a.fbsj + '　浏览 ' + UI.money(a.llcs, 0) + ' 次</div></span></li>';
  }).join('') : '<li><span class="text-3">本栏目暂无其他文章</span></li>';
}

/* 关联办事事项 */
function renderRelItems() {
  var s = art.bt + art.zy, codes = [];
  REL.forEach(function (r) {
    if (codes.length >= 2) return;
    for (var i = 0; i < r[0].length; i++) {
      if (s.indexOf(r[0][i]) >= 0) { codes = r[1]; break; }
    }
  });
  if (!codes.length) codes = ['SX0201', 'SX0301'];
  document.getElementById('ad-items').innerHTML = codes.map(function (c) {
    var it = PORTAL.item(c); if (!it) return '';
    return '<div style="padding:10px 0;border-bottom:1px dashed var(--row-line)">'
      + '<div style="font-size:14px;font-weight:500">' + it.name + '</div>'
      + '<div class="text-3 text-xs mt-8">' + it.dept + '　承诺 ' + it.nsrq + ' 个工作日　'
      + (it.wb ? '全程网办' : '需到窗口') + '</div>'
      + '<a class="btn btn-sm btn-primary mt-8" href="item-detail.html?code=' + it.code + '" data-fp="wsmh-04-01">查看办事指南</a>'
      + '</div>';
  }).join('') + '<div class="text-3 text-xs mt-12">关联事项按正文涉及的业务自动匹配，完整目录见 <a href="guide.html">办事指南</a>。</div>';
}

/* 订阅本栏目（链条 9） */
function renderSub(lm) {
  var box = document.getElementById('ad-subbox');
  var hit = PORTAL.subs().filter(function (s) { return s.lm === art.lm; })[0];
  if (hit) {
    box.innerHTML = '<div class="alert alert-success" style="margin-bottom:10px"><i class="fa-solid fa-circle-check"></i>'
      + '<span>已订阅「' + lm[0] + '」（' + hit.d + '），推送方式：' + hit.way + '</span></div>'
      + '<button class="btn btn-block" id="ad-unsub" data-fp="wsmh-05-12">取消订阅</button>';
    document.getElementById('ad-unsub').onclick = function () {
      PORTAL.act('sub.del', { id: hit.id });
      UI.toast('已取消「' + lm[0] + '」订阅', 'success');
      renderSub(lm);
    };
  } else {
    box.innerHTML = '<button class="btn btn-block btn-accent" id="ad-dosub" data-fp="wsmh-05-12">'
      + '<i class="fa-solid fa-bell"></i> 订阅「' + lm[0] + '」</button>';
    document.getElementById('ad-dosub').onclick = function () {
      if (!UI.needLogin('订阅「' + lm[0] + '」')) return;
      var r = PORTAL.act('sub.add', { lm: art.lm, lmmc: lm[0], way: '站内消息+短信' });
      UI.toast(r === 'exist' ? '您已订阅本栏目' : '订阅成功，本栏目新稿件将推送到我的消息', r === 'exist' ? 'warning' : 'success');
      renderSub(lm);
    };
  }
}

/* 附件清单（按栏目生成） */
function attachments(a) {
  var t = mk(a, a.bt);
  var name = t.length > 22 ? t.slice(0, 22) + '…' : t;
  var base = [[name + '（正式文本）.pdf', pdfSize(a), 'fa-file-pdf']];
  if (a.lm === 'policy') base.push(['政策解读材料.docx', '182 KB', 'fa-file-word']);
  if (a.lm === 'open') base.push(['政府信息公开申请表.docx', '96 KB', 'fa-file-word']);
  if (a.lm === 'train') base.push(['培训报名回执表.docx', '78 KB', 'fa-file-word']);
  if (a.lm === 'notice') base.push(['办理指引一页纸.pdf', '340 KB', 'fa-file-pdf']);
  return base;
}
function pdfSize(a) { return (380 + (a.llcs % 40) * 21) + ' KB'; }

/* 字号 / 打印 / 分享 / 下载 / 信息纠错 */
function bindTools(atts) {
  var fzs = document.querySelectorAll('[data-fz]');
  for (var i = 0; i < fzs.length; i++) {
    fzs[i].onclick = function () {
      for (var k = 0; k < fzs.length; k++) fzs[k].classList.remove('on');
      this.classList.add('on');
      var v = this.getAttribute('data-fz');
      document.getElementById('ad-zw').style.fontSize = v + 'px';
      UI.toast('正文字号已切换为 ' + v + 'px' + (v === '18' ? '（大字号，适合长辈阅读）' : ''), 'success');
    };
  }

  document.getElementById('ad-print').onclick = function () {
    UI.toast('正在调起打印，建议使用 A4 纵向、缩放 100%', 'info');
    setTimeout(function () { window.print(); }, 300);
  };

  document.getElementById('ad-share').onclick = function () {
    UI.modal('<i class="fa-solid fa-share-nodes text-primary"></i> 分享本文',
      '<div class="form-item"><label>页面链接</label>'
      + '<input class="input" id="sh-url" readonly value="' + UI.esc(location.href) + '"></div>'
      + '<div class="flex gap-12 mt-16" style="align-items:center">'
      + '<div class="qr-b" style="width:110px;height:110px;background:var(--bg-soft);border:1px solid var(--border);'
      + 'border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:44px;color:var(--primary)">'
      + '<i class="fa-solid fa-qrcode"></i></div>'
      + '<div class="text-2 text-sm" style="line-height:1.9">用微信扫描左侧二维码，可在手机端与微信小程序继续阅读本文；'
      + '门户、H5 与小程序内容一源发布，三端同步更新。</div></div>',
      '<button class="btn" data-act="close-modal">关闭</button>'
      + '<button class="btn btn-primary" id="sh-copy" data-fp="wsmh-04-05">复制链接</button>');
    document.getElementById('sh-copy').onclick = function () {
      var el = document.getElementById('sh-url');
      el.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      UI.toast(ok ? '页面链接已复制到剪贴板' : '请手动长按或 Ctrl+C 复制上方链接', ok ? 'success' : 'warning');
    };
  };

  var dls = document.querySelectorAll('[data-dl]');
  for (var j = 0; j < dls.length; j++) {
    dls[j].onclick = function () {
      var f = atts[Number(this.getAttribute('data-dl'))];
      UI.toast('《' + f[0] + '》开始下载（' + f[1] + '），演示环境不产生真实文件', 'success');
    };
  }

  document.getElementById('ad-fix').onclick = function () {
    UI.drawer('<i class="fa-solid fa-pen-to-square text-primary"></i> 信息纠错',
      '<div class="alert alert-info"><i class="fa-solid fa-circle-info"></i>'
      + '<span>发现本文存在错别字、数据不准确、链接失效或内容过期的，请在此提交。受理后可在「个人中心 → 我的消息」查看处理情况。</span></div>'
      + '<div class="form-grid c1">'
      + '<div class="form-item"><label>纠错页面</label><input class="input" readonly value="' + UI.esc(safe.bt) + '"></div>'
      + '<div class="form-item"><label>问题类型</label><select class="select" id="fx-type">'
      + '<option>错别字或表述错误</option><option>数据或口径不准确</option><option>链接失效或附件打不开</option>'
      + '<option>内容已过期需更新</option><option>其他</option></select></div>'
      + '<div class="form-item"><label><span class="req">*</span>问题描述</label>'
      + '<textarea class="textarea" id="fx-desc" placeholder="请指出具体位置与建议修改内容，例如：第三段「3 个工作日」应为「2 个工作日」"></textarea></div>'
      + '<div class="form-item"><label>联系方式（选填）</label><input class="input" id="fx-tel" placeholder="便于回访，留空则不回访"></div>'
      + '</div>',
      '<button class="btn" data-act="close-drawer">取消</button>'
      + '<button class="btn btn-primary" id="fx-ok" data-fp="wsmh-04-05">提交纠错</button>');
    document.getElementById('fx-ok').onclick = function () {
      var d = document.getElementById('fx-desc').value.trim();
      if (!d) { UI.toast('请填写问题描述', 'warning'); return; }
      var no = PORTAL.act('feedback.add', {
        type: '信息纠错', page: safe.bt,
        desc: '【' + document.getElementById('fx-type').value + '】' + d,
        tel: document.getElementById('fx-tel').value
      });
      UI.closeDrawer();
      UI.toast('纠错信息已提交，受理编号 ' + no + '，运营人员将在 5 个工作日内核实处理', 'success');
    };
  };
}
</script>
</body>
</html>
