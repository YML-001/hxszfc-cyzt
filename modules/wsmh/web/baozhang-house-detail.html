<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房源详情 · 保障房专区</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .dt-top{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}
  .dt-gal{border-radius:var(--radius-card);overflow:hidden;height:340px;position:relative;background:var(--bg-soft)}
  .dt-gal img{width:100%;height:100%;object-fit:cover;display:block}
  .dt-gal .gtag{position:absolute;left:14px;top:14px;background:rgba(16,102,60,.92);color:#fff;font-size:12.5px;padding:4px 12px;border-radius:4px}
  .dt-info h1{font-size:23px;font-weight:800}
  .dt-price{margin:14px 0;padding:16px 18px;background:linear-gradient(120deg,#eef4ff,#f7faff);border:1px solid var(--border);border-radius:var(--radius-card)}
  .dt-price .v{font-size:30px;font-weight:800;color:var(--accent);font-family:"DIN Alternate",var(--font)}
  .kv{display:grid;grid-template-columns:repeat(2,1fr);gap:12px 22px;margin-top:8px}
  .kv .k{color:var(--text-3);font-size:13px}.kv .vv{font-weight:600;font-size:14px}
  .tag-q.gz{background:#eaf2ff;color:#2656bb}.tag-q.bz{background:#e5f6fb;color:#0e7c93}.tag-q.ps{background:#fdf3e2;color:#b45309}
  .fac{display:flex;flex-wrap:wrap;gap:10px}
  .fac span{padding:5px 13px;background:var(--bg-soft);border-radius:16px;font-size:13px;color:var(--text-2)}
</style>
</head>
<body data-nav="baozhang">

<div class="wrap"><div class="crumb"><a href="home.html">首页</a><i class="fa-solid fa-angle-right"></i><a href="baozhang-index.html">保障房专区</a><i class="fa-solid fa-angle-right"></i><a href="baozhang-house.html">保障房源</a><i class="fa-solid fa-angle-right"></i>房源详情</div></div>

<div class="wrap">
  <div class="dt-top">
    <div class="dt-gal"><img id="g-img" src="" alt="房源"><span class="gtag" id="g-code"><i class="fa-solid fa-shield-halved"></i> 核验码</span></div>
    <div class="dt-info">
      <h1 id="g-title">房源</h1>
      <div class="flex gap-8 mt-8" id="g-tags"></div>
      <div class="dt-price"><span class="v" id="g-price">—</span> <span id="g-unit" class="text-3"></span>
        <div class="text-xs text-3 mt-8" id="g-pnote"></div></div>
      <div class="kv" id="g-kv"></div>
      <div class="flex gap-10 mt-16 wrapf">
        <a class="btn btn-primary btn-lg" href="baozhang-apply.html"><i class="fa-solid fa-file-signature"></i> 一键申请</a>
        <a class="btn btn-lg" href="baozhang-select.html"><i class="fa-solid fa-dice"></i> 报名 / 摇号</a>
        <button class="btn btn-lg" id="btn-fav"><i class="fa-regular fa-star"></i> 收藏</button>
      </div>
    </div>
  </div>
</div>

<div class="section">
  <div class="wrap grid-2" style="align-items:start">
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-couch text-primary"></i> 小区配套与设施</h3></div>
      <div class="card-body">
        <div class="fac"><span><i class="fa-solid fa-elevator"></i> 电梯</span><span><i class="fa-solid fa-square-parking"></i> 停车位</span><span><i class="fa-solid fa-fire-extinguisher"></i> 消防达标</span><span><i class="fa-solid fa-wifi"></i> 智能门禁</span><span><i class="fa-solid fa-bus"></i> 公交直达</span><span><i class="fa-solid fa-school"></i> 学校</span><span><i class="fa-solid fa-hospital"></i> 卫生服务站</span><span><i class="fa-solid fa-basket-shopping"></i> 农贸市场</span></div>
        <div class="alert alert-info mt-16" style="margin-bottom:0"><i class="fa-solid fa-circle-info"></i><span id="g-mgr">本房源实行封闭管理，配套党建网格与红色物业服务。</span></div>
      </div>
    </div>
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-circle-check text-primary"></i> 申请与保障说明</h3></div>
      <div class="card-body">
        <ul class="news-list" id="g-rules"></ul>
      </div>
    </div>
  </div>
  <div class="wrap"><div id="src-note"></div></div>
</div>

<script src="../assets/js/portal-data.js"></script>
<script src="../assets/js/portal-flow.js"></script>
<script src="../assets/js/portal.js"></script>
<script>
var T = { gz:['公租房','gz','元/月','租金'], bz:['保障性租赁住房','bz','元/月','租金'], ps:['配售型保障房','ps','元/㎡','配售价'] };
function pageInit(){
  var id=UI.param('id')||'gz-1', type=UI.param('type')||id.split('-')[0], idx=parseInt(id.split('-')[1]||1,10)-1;
  var t=T[type]||T.gz;
  var mj = type==='ps'?[65,75,88,95,105][idx%5]:[38,42,50,55,60][idx%5];
  var price = type==='ps'?4980+(idx%6)*160:type==='gz'?280+(idx%5)*90:720+(idx%6)*180;
  var comm=['和苑','安居家园','幸福里','龙福雅居','德润新居','城东佳苑','翠竹花园','光华人才公寓','惠民公寓','阳光家园'][idx%10];
  var code='BZ'+type.toUpperCase()+(2026001+idx);
  document.getElementById('g-img').src='https://images.unsplash.com/photo-1560448204-e02f11c3d0e2?auto=format&fit=crop&w=900&q=75';
  document.getElementById('g-code').innerHTML='<i class="fa-solid fa-shield-halved"></i> 核验码 '+code;
  document.getElementById('g-title').textContent=comm+' · '+mj+'㎡';
  document.getElementById('g-tags').innerHTML='<span class="tag-q '+t[1]+'">'+t[0]+'</span><span class="tag-q">已核验</span><span class="tag-q">'+(mj<45?'一室一厅':mj<70?'两室一厅':'三室两厅')+'</span>';
  document.getElementById('g-price').textContent=UI.money(price,0);
  document.getElementById('g-unit').textContent=t[2]+'（'+t[3]+'）';
  document.getElementById('g-pnote').textContent = type==='ps'?'配售价按保本微利原则核定并经价格公示，实行封闭管理，满 5 年方可按规定回购。':'租金低于同地段市场租金，符合条件可申请租赁补贴。';
  document.getElementById('g-kv').innerHTML=[
    ['保障类型',t[0]],['房源编码',code],['建筑面积',mj+' ㎡'],['户型',mj<45?'一室一厅':mj<70?'两室一厅':'三室两厅'],
    ['朝向',['朝南','南北通透','朝东南'][idx%3]],['楼层',(idx%18+2)+' / '+(idx%6+18)+' 层'],
    ['所在区域',['城中区','鱼峰区','柳南区','柳北区','城郊新区','XX县'][idx%6]],['运营单位','XXXX市安居保障运营有限公司']
  ].map(function(k){return '<div><div class="k">'+k[0]+'</div><div class="vv">'+k[1]+'</div></div>';}).join('');
  var rules = type==='ps'
    ? ['面向符合条件的工薪收入群体配售，需通过购房资格审核','实行政府指导价，保本微利，价格向社会公示','封闭管理：不得上市交易，满 5 年方可申请按规定回购','购房可同步办理不动产登记「一件事」']
    : type==='gz'
    ? ['面向城镇住房困难且收入财产符合规定的家庭及符合条件的新市民','申请纳入「高效办成一件事」，七部门数据共享联办','可选择实物配租或领取租赁补贴','实行年度资格复核，账实相符方可续租']
    : ['面向新市民、青年人等群体，以小户型为主、租金低于市场','由政府认定纳管，运营单位统一管理','租赁合同网签备案，享受基本公共服务','退出时按合同约定腾退，房源即空即配'];
  document.getElementById('g-rules').innerHTML = rules.map(function(r){return '<li><span class="nl-dot"></span><span class="nl-t" style="white-space:normal">'+r+'</span></li>';}).join('');
  document.getElementById('btn-fav').onclick=function(){ if(UI.needLogin&&!UI.needLogin('收藏房源'))return; UI.toast('已收藏，可在个人中心查看','success'); };
  document.getElementById('src-note').innerHTML = UI.sourceNote('保障房源信息来源于保障性住房综合管理系统业务库，经统一核验编码后对外展示。');
}
</script>
</body>
</html>
