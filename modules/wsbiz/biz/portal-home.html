<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一网通办门户 · 统一工作门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
<script>try{if(window.self!==window.top)document.documentElement.classList.add('pt-embed');}catch(e){document.documentElement.classList.add('pt-embed');}</script>
</head>
<body class="pt-body">

<!-- 顶部导航：门户全屏独立风格，不内嵌任何右侧框架 -->
<header class="pt-nav">
  <div class="pt-brand">
    <div class="logo">
      <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="华信房产交易中心">
        <rect width="32" height="32" rx="7" fill="#2656BB"/>
        <path d="M16 7L7 15v10h7v-7h4v7h7V15L16 7z" fill="#fff"/>
      </svg>
    </div>
    <div class="name">华信房产交易中心<small>一网通办 · 统一工作门户</small></div>
  </div>
  <nav class="pt-nav-menu">
    <a class="pt-nav-link" href="task-center.html?role=biz"><i class="fa-solid fa-gauge-high"></i> 工作台</a>
    <a class="pt-nav-link active" href="portal-home.html?role=biz"><i class="fa-solid fa-globe"></i> 一网通办</a>
    <a class="pt-nav-link" href="shell.html?role=biz&amp;page=guide.html"><i class="fa-solid fa-book"></i> 业务指引</a>
    <a class="pt-nav-link" href="shell.html?role=biz&amp;page=case-ledger.html"><i class="fa-solid fa-chart-column"></i> 办件台账</a>
  </nav>
  <div class="pt-nav-right">
    <a class="pt-ico" href="shell.html?role=biz&amp;page=news.html" title="消息"><i class="fa-solid fa-bell"></i><span class="dot" id="navDot" style="display:none">0</span></a>
    <a class="pt-ico" href="shell.html?role=biz&amp;page=guide.html" title="帮助"><i class="fa-solid fa-circle-question"></i></a>
    <div class="pt-user">
      <div class="avatar">韦</div>
      <div><div class="u-name">韦晓明</div><div class="u-role">综合受理科 · 业务审核员</div></div>
    </div>
    <a class="pt-ico" href="../../../index.html" title="返回原型导航 / 退出"><i class="fa-solid fa-right-from-bracket"></i></a>
  </div>
</header>

<!-- 渐变头图 + 玻璃搜索 -->
<section class="pt-hero">
  <img class="hero-photo" src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&amp;fit=crop&amp;w=1600&amp;q=70" alt="城市建筑">
  <div class="pt-hero-inner">
    <div class="badge-line"><i class="fa-solid fa-shield-halved"></i> 一窗统一收件 · 一网通办 · 一次办好</div>
    <h1>华信房产交易一网通办平台</h1>
    <div class="sub">全平台办件唯一入口，覆盖商品房、存量房、租赁、抵押、资金监管等全业务流程</div>
    <div class="pt-search">
      <i class="fa-solid fa-magnifying-glass s-ico"></i>
      <input type="text" id="portalSearch" placeholder="输入事项名称或业务关键词，如：网签备案、抵押、维修资金" onkeydown="if(event.key==='Enter')doSearch()">
      <button class="btn-search" onclick="doSearch()">搜索事项</button>
    </div>
    <div class="pt-hot-keys" id="heroKeys"></div>
  </div>
</section>

<div class="pt-wrap pull">

  <!-- 快捷指标：直达待办中心各视图 -->
  <div class="pt-quick" id="quickBar"></div>

  <!-- 热门服务 -->
  <div class="pt-section">
    <div class="pt-sec-head">
      <div class="t"><span class="bar"></span>热门服务</div>
      <div class="sub">高频办理事项，点击直达统一收件并自动预选</div>
    </div>
    <div class="pt-sec-body">
      <div class="pt-svc-grid" id="hotGrid"></div>
    </div>
  </div>

  <!-- 全部流程 -->
  <div class="pt-section" data-tabs-scope>
    <div class="pt-sec-head">
      <div class="t"><span class="bar"></span>全部流程</div>
      <div class="sub" id="itemCount">—</div>
      <div class="actions">
        <div class="pt-search" style="box-shadow:none;padding:0;background:transparent">
          <input type="text" id="itemFilter" placeholder="筛选流程" style="height:36px;width:200px;border:1px solid var(--border);border-radius:999px;padding:0 16px" oninput="renderItems()">
        </div>
      </div>
    </div>
    <div class="pt-sec-body">
      <div class="pt-flow">
        <div class="pt-cat-nav" id="catNav"></div>
        <div id="itemPanel"></div>
      </div>
    </div>
  </div>

  <div class="alert alert-info">
    <i class="fa-solid fa-circle-info"></i>
    <span>事项目录、办事指南与材料清单由「收件受理 / 事项目录」统一维护，本页与窗口受理、统一服务门户共用同一套口径；县区未单独配置属地差异的，继承市级口径。</span>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/flow-data.js"></script>
<script src="../assets/js/flow.js"></script>
<script>
(function () {
  /* 热门服务磁贴：图标与配色按业务大类映射 */
  var ICONS = {
    'SX0101': ['fa-file-signature', 'blue'], 'SX0201': ['fa-house-chimney', 'green'],
    'SX0301': ['fa-key', 'cyan'], 'SX0401': ['fa-building-columns', 'purple'],
    'SX0801': ['fa-sack-dollar', 'orange'], 'SX0901': ['fa-screwdriver-wrench', 'red'],
    'SX0701': ['fa-folder-open', 'blue'], 'SX0601': ['fa-ruler-combined', 'cyan'],
    'SX1401': ['fa-rotate-left', 'orange'], 'SX0501': ['fa-people-roof', 'green']
  };

  function shellHref(page, query) {
    var target = page + (query ? '?' + query : '');
    return 'shell.html?role=' + FLOW.role() + '&page=' + encodeURIComponent(target);
  }

  /* 顶部快捷指标：直达统一待办中心 */
  function renderQuick() {
    var q = '?role=' + FLOW.role();
    var cards = [
      { i: 'fa-clipboard-list', c: 'blue', l: '我的待办', v: FLOW.stat('myTodo'), h: 'task-center.html' + q + '&tab=todo' },
      { i: 'fa-bolt', c: 'red', l: '紧急待办', v: urgentCount(), h: 'task-center.html' + q + '&tab=urgent' },
      { i: 'fa-paper-plane', c: 'cyan', l: '我的发起', v: FLOW.myCases().length, h: 'task-center.html' + q + '&tab=start' },
      { i: 'fa-circle-check', c: 'green', l: '我的已办', v: FLOW.myDone().length, h: 'task-center.html' + q + '&tab=done' }
    ];
    document.getElementById('quickBar').innerHTML = cards.map(function (k) {
      return '<a class="q" href="' + k.h + '">' +
        '<span class="ico i-' + k.c + '"><i class="fa-solid ' + k.i + '"></i></span>' +
        '<span><span class="v">' + k.v + '</span><span class="l">' + k.l + '</span></span></a>';
    }).join('');
  }
  function urgentCount() {
    return FLOW.myTasks().filter(function (t) {
      var r = FLOW.remain(FLOW.caseOf(t));
      return t.jjcd === '2' || r.level === 'orange' || r.level === 'red';
    }).length;
  }

  window.renderHot = function () {
    var hot = FLOW.get('items').filter(function (it) { return it.hot; }).slice(0, 10);
    document.getElementById('hotGrid').innerHTML = hot.map(function (it) {
      var m = ICONS[it.sxdm] || ['fa-file-lines', 'blue'];
      return '<a class="pt-svc" href="' + shellHref('intake.html', 'sxdm=' + it.sxdm) + '">' +
        '<span class="hot-flag">热门</span>' +
        '<span class="svc-ico c-' + m[1] + '"><i class="fa-solid ' + m[0] + '"></i></span>' +
        '<span class="svc-name">' + FLOW.esc(it.sxmc) + '</span>' +
        '<span class="svc-tag">' + FLOW.esc(FLOW.dict('ywdlm', it.ywdlm)) + '</span></a>';
    }).join('');
  };

  /* 左侧业务大类 + 右侧分组流程 */
  var CAT_ICON = {
    '': 'fa-border-all', '01': 'fa-file-signature', '02': 'fa-house-chimney', '03': 'fa-key',
    '04': 'fa-building-columns', '05': 'fa-people-roof', '06': 'fa-ruler-combined',
    '07': 'fa-folder-open', '08': 'fa-sack-dollar', '09': 'fa-hand-holding-dollar',
    '10': 'fa-screwdriver-wrench', '12': 'fa-city', '14': 'fa-rotate-left'
  };
  var CATS = [['', '全部流程'], ['01', '商品房交易'], ['12', '项目监管与好房子'], ['02', '存量房交易'], ['03', '房屋租赁'],
              ['04', '抵押与交易限制'], ['05', '政策性住房与安置房'], ['06', '测绘成果与面积'],
              ['08', '预售资金监管'], ['09', '存量房资金监管'], ['10', '维修资金监管'],
              ['07', '房产档案'], ['14', '更正与撤销']];
  var curCat = '';

  window.pickCat = function (code) { curCat = code; renderItems(); };

  window.renderItems = function () {
    var kw = (document.getElementById('itemFilter').value || '').trim();
    var all = FLOW.get('items').filter(function (it) { return it.enabled; });

    document.getElementById('catNav').innerHTML = CATS.map(function (c) {
      var n = c[0] ? all.filter(function (it) { return it.ywdlm === c[0]; }).length : all.length;
      if (c[0] && !n) return '';
      var on = curCat === c[0];
      return '<div class="pt-cat' + (on ? ' active' : '') + '" onclick="pickCat(\'' + c[0] + '\')">' +
        '<i class="fa-solid ' + (CAT_ICON[c[0]] || 'fa-folder') + '"></i><span>' + c[1] + '</span>' +
        '<span class="n">' + n + '</span></div>';
    }).join('');

    var list = all.filter(function (it) {
      if (curCat && it.ywdlm !== curCat) return false;
      if (kw && it.sxmc.indexOf(kw) < 0 && it.sxdm.indexOf(kw) < 0) return false;
      return true;
    });
    document.getElementById('itemCount').textContent = '共 ' + list.length + ' 个可办流程';

    if (!list.length) {
      document.getElementById('itemPanel').innerHTML =
        '<div class="empty"><i class="fa-regular fa-folder-open"></i><div>没有匹配的流程，试试其他关键词</div></div>';
      return;
    }
    var groups = {};
    list.forEach(function (it) {
      if (!groups[it.ywdlm]) groups[it.ywdlm] = [];
      groups[it.ywdlm].push(it);
    });
    var order = CATS.map(function (c) { return c[0]; }).filter(function (k) { return k && groups[k]; });
    document.getElementById('itemPanel').innerHTML = order.map(function (k) {
      return '<div class="pt-grp">' +
        '<div class="pt-grp-head"><span class="gi"><i class="fa-solid ' + (CAT_ICON[k] || 'fa-layer-group') + '"></i></span>' +
          FLOW.dict('ywdlm', k) + '<span class="badge blue" style="margin-left:6px">' + groups[k].length + '</span></div>' +
        '<div class="pt-flow-grid">' + groups[k].map(function (it) {
          var m = ICONS[it.sxdm] || ['fa-file-lines'];
          return '<a class="pt-flow-item" href="' + shellHref('intake.html', 'sxdm=' + it.sxdm) + '">' +
            '<span class="fi-ico"><i class="fa-solid ' + m[0] + '"></i></span>' +
            '<span class="fi-name" title="' + FLOW.esc(it.sxmc) + '">' + FLOW.esc(it.sxmc) + '</span>' +
            '<i class="fa-solid fa-angle-right fi-go"></i></a>';
        }).join('') + '</div></div>';
    }).join('');
  };

  window.doSearch = function () {
    var kw = (document.getElementById('portalSearch').value || '').trim();
    if (!kw) { PMS.toast('请输入事项名称或业务关键词', 'error'); return; }
    document.getElementById('itemFilter').value = kw;
    curCat = '';
    renderItems();
    document.getElementById('itemCount').scrollIntoView({ block: 'center' });
    PMS.toast('已按「' + kw + '」筛选流程清单');
  };
  window.fillSearch = function (kw) {
    document.getElementById('portalSearch').value = kw;
    doSearch();
  };

  function renderHeroKeys() {
    var hot = FLOW.get('items').filter(function (it) { return it.hot; }).slice(0, 6);
    document.getElementById('heroKeys').innerHTML = '<span style="opacity:.85">热门搜索：</span>' +
      hot.map(function (it) {
        var short = it.sxmc.length > 8 ? it.sxmc.slice(0, 8) : it.sxmc;
        return '<span class="k" onclick="fillSearch(\'' + FLOW.esc(short) + '\')">' + FLOW.esc(short) + '</span>';
      }).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    FLOW.on(function () {
      renderHot();
      renderItems();
      renderQuick();
      renderHeroKeys();
      var dot = document.getElementById('navDot');
      var n = FLOW.stat('unread');
      if (dot) { dot.textContent = n; dot.style.display = n ? '' : 'none'; }
    });
  });
})();
</script>
</body>
</html>
