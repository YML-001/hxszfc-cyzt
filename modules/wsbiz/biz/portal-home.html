<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一网通办 · 统一工作门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/portal.css">
<style>
  .yw-wrap { width: min(1440px, calc(100% - 48px)); margin: -60px auto 40px; position: relative; display: flex; flex-direction: column; gap: 20px; }
  .pt-hero.yw { padding: 64px 24px 100px; }
  .pt-hero.yw .h-title { font-size: 46px; }
  .yw-empty { padding: 40px; text-align: center; color: #909399; font-size: 13px; }
</style>
</head>
<body data-role="biz" data-active="portal-home" data-layout="full">
<main class="app-main">

  <!-- 英雄区 + 搜索：按 Figma「一网通办」 -->
  <section class="pt-hero yw">
    <div class="h-title">华信房产交易</div>
    <div class="h-sub">全平台办件唯一入口，覆盖商品房、存量房、租赁、抵押、资金监管等全业务流程</div>
    <div class="h-search">
      <input type="text" id="portalSearch" placeholder="输入事项名称或业务关键词，如：网签备案、抵押、维修资金" onkeydown="if(event.key==='Enter')doSearch()">
      <button onclick="doSearch()"><i class="fa-solid fa-magnifying-glass"></i></button>
    </div>
    <div class="h-chips" id="heroKeys"></div>
  </section>

  <div class="yw-wrap">
    <!-- 四个办件指标 -->
    <div class="yw-stats" id="quickBar"></div>

    <!-- 热门服务 -->
    <div class="pt-card">
      <div class="c-h"><span class="t">热门服务</span><span class="sub">高频办理事项，点击直达统一收件并自动预选</span></div>
      <div class="c-b"><div class="yw-hot" id="hotGrid"></div></div>
    </div>

    <!-- 全部流程 -->
    <div class="pt-card">
      <div class="c-h"><span class="t">全部流程</span><span class="sub" id="itemCount">共 18 个可办流程</span>
        <div style="margin-left:auto;display:flex;align-items:center;gap:8px;background:#f5f7fb;border-radius:4px;padding:0 12px;height:34px;width:260px">
          <i class="fa-solid fa-magnifying-glass" style="color:#909399;font-size:13px"></i>
          <input type="text" id="itemFilter" placeholder="请输入搜索内容" oninput="renderItems()" style="border:none;background:transparent;outline:none;font-size:13px;flex:1">
        </div>
      </div>
      <div class="c-b">
        <div class="yw-flow">
          <div class="cats" id="catNav"></div>
          <div class="groups" id="itemPanel"></div>
        </div>
        <div class="yw-note" style="margin-top:16px"><i class="fa-solid fa-circle-info"></i>
          事项目录、办事指南与材料清单由「收件受理 / 事项目录」统一维护，本页与窗口受理、统一服务门户共用同一套口径；县区未单独配置属地差异的，继承市级口径。</div>
      </div>
    </div>
  </div>

  <!-- 右侧悬浮：我的发起 / 我的待办 -->
  <div class="yw-side" id="ywSide"></div>
</main>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/flow-data.js"></script>
<script src="../assets/js/flow.js"></script>
<script>
(function () {
  var ICONS = {
    'SX0101': ['fa-file-signature', 'c1'], 'SX0201': ['fa-house-chimney', 'c2'],
    'SX0301': ['fa-key', 'c3'], 'SX0401': ['fa-building-columns', 'c4'],
    'SX0801': ['fa-sack-dollar', 'c5'], 'SX0901': ['fa-screwdriver-wrench', 'c6'],
    'SX0701': ['fa-folder-open', 'c7'], 'SX0601': ['fa-ruler-combined', 'c8'],
    'SX1401': ['fa-rotate-left', 'c9'], 'SX0501': ['fa-people-roof', 'c10']
  };
  function shellHref(page, query) {
    var target = page + (query ? '?' + query : '');
    /* 在外壳内直接换 iframe；独立打开时进外壳 */
    try { if (window.self !== window.top) return target; } catch (e) {}
    return 'shell.html?role=' + FLOW.role() + '&page=' + encodeURIComponent(target);
  }
  function urgentCount() {
    return FLOW.myTasks().filter(function (t) {
      var r = FLOW.remain(FLOW.caseOf(t));
      return t.jjcd === '2' || r.level === 'orange' || r.level === 'red';
    }).length;
  }

  function renderQuick() {
    var q = '?role=' + FLOW.role();
    var cards = [
      { i: 'fa-paper-plane', c: 'b', l: '我的发起', v: FLOW.myCases().length, h: 'task-center.html' + q + '&tab=start' },
      { i: 'fa-bolt', c: 'r', l: '紧急待办', v: urgentCount(), h: 'task-center.html' + q + '&tab=urgent' },
      { i: 'fa-clipboard-list', c: 'o', l: '我的待办', v: FLOW.stat('myTodo'), h: 'task-center.html' + q + '&tab=todo' },
      { i: 'fa-circle-check', c: 'g', l: '我的已办', v: FLOW.myDone().length, h: 'task-center.html' + q + '&tab=done' }
    ];
    document.getElementById('quickBar').innerHTML = cards.map(function (k) {
      return '<div class="yw-stat" onclick="location.href=\'' + k.h + '\'"><i class="' + k.c + '"><i class="fa-solid ' + k.i + '"></i></i>' +
        '<div><div class="l">' + k.l + '</div><div class="v">' + k.v + '</div></div></div>';
    }).join('');
    document.getElementById('ywSide').innerHTML =
      '<a href="task-center.html' + q + '&tab=start"><i style="background:linear-gradient(135deg,#6b97f9,#2556ba)" class="fa-solid fa-paper-plane"></i><span>我的发起</span><span class="n">' + FLOW.myCases().length + '</span></a>' +
      '<a href="task-center.html' + q + '&tab=todo"><i style="background:linear-gradient(135deg,#ffc36b,#f59e0b)" class="fa-solid fa-clipboard-list"></i><span>我的待办</span><span class="n">' + FLOW.stat('myTodo') + '</span></a>';
  }

  window.renderHot = function () {
    var hot = FLOW.get('items').filter(function (it) { return it.hot; }).slice(0, 10);
    document.getElementById('hotGrid').innerHTML = hot.map(function (it, i) {
      var m = ICONS[it.sxdm] || ['fa-file-lines', 'c' + (i % 10 + 1)];
      return '<a href="' + shellHref('intake.html', 'sxdm=' + it.sxdm) + '">' + (i < 2 ? '<span class="hot">热门</span>' : '') +
        '<i class="fa-solid ' + m[0] + ' ' + m[1] + '"></i><span class="n">' + FLOW.esc(it.sxmc) + '</span>' +
        '<span class="s">' + FLOW.esc(FLOW.dict('ywdlm', it.ywdlm)) + '</span></a>';
    }).join('');
  };

  var CAT_ICON = {
    '': 'fa-border-all', '01': 'fa-file-signature', '02': 'fa-house-chimney', '03': 'fa-key',
    '04': 'fa-building-columns', '05': 'fa-people-roof', '06': 'fa-ruler-combined',
    '07': 'fa-folder-open', '08': 'fa-sack-dollar', '09': 'fa-hand-holding-dollar',
    '10': 'fa-screwdriver-wrench', '12': 'fa-city', '14': 'fa-rotate-left'
  };
  var CATS = [['', '全部流程'], ['01', '商品房交易'], ['12', '项目监管与好房子'], ['02', '存量房交易'], ['03', '房屋租赁'],
              ['04', '抵押与交易限制'], ['05', '政策性住房与安置房'], ['06', '测绘成果与面积'],
              ['08', '预售资金监管'], ['09', '存量房资金监管'], ['10', '维修资金监管'],
              ['07', '房产档案'], ['14', '更正与撤销']];
  var curCat = '';
  window.pickCat = function (code) { curCat = code; renderItems(); };

  window.renderItems = function () {
    var kw = (document.getElementById('itemFilter').value || '').trim();
    var all = FLOW.get('items').filter(function (it) { return it.enabled; });
    document.getElementById('catNav').innerHTML = CATS.map(function (c) {
      var n = c[0] ? all.filter(function (it) { return it.ywdlm === c[0]; }).length : all.length;
      var on = curCat === c[0];
      return '<a href="javascript:void(0)" class="' + (on ? 'on' : '') + '" onclick="pickCat(\'' + c[0] + '\')">' +
        '<i class="fa-solid ' + (CAT_ICON[c[0]] || 'fa-folder') + '"></i><span>' + c[1] + '</span>' +
        (n ? '<b style="margin-left:auto;font-size:12px;opacity:.8">' + n + '</b>' : '') + (on ? '<i class="ar fa-solid fa-arrow-right" style="margin-left:8px"></i>' : '') + '</a>';
    }).join('');
    var list = all.filter(function (it) {
      if (curCat && it.ywdlm !== curCat) return false;
      if (kw && it.sxmc.indexOf(kw) < 0 && it.sxdm.indexOf(kw) < 0) return false;
      return true;
    });
    document.getElementById('itemCount').textContent = '共 ' + list.length + ' 个可办流程';
    if (!list.length) { document.getElementById('itemPanel').innerHTML = '<div class="yw-empty"><i class="fa-regular fa-folder-open"></i> 没有匹配的流程，试试其他关键词</div>'; return; }
    var groups = {};
    list.forEach(function (it) { (groups[it.ywdlm] = groups[it.ywdlm] || []).push(it); });
    var order = CATS.map(function (c) { return c[0]; }).filter(function (k) { return k && groups[k]; });
    document.getElementById('itemPanel').innerHTML = order.map(function (k) {
      return '<div class="grp"><div class="gh"><i class="fa-solid ' + (CAT_ICON[k] || 'fa-layer-group') + '"></i>' + FLOW.dict('ywdlm', k) + '<b>' + groups[k].length + '</b></div>' +
        '<div class="gi">' + groups[k].map(function (it) {
          return '<a href="' + shellHref('intake.html', 'sxdm=' + it.sxdm) + '" title="' + FLOW.esc(it.sxmc) + '"><span>' + FLOW.esc(it.sxmc) + '</span><i class="fa-solid fa-angle-right"></i></a>';
        }).join('') + '</div></div>';
    }).join('');
  };

  window.doSearch = function () {
    var kw = (document.getElementById('portalSearch').value || '').trim();
    if (!kw) { PMS.toast('请输入事项名称或业务关键词', 'error'); return; }
    document.getElementById('itemFilter').value = kw; curCat = ''; renderItems();
    document.getElementById('itemCount').scrollIntoView({ block: 'center', behavior: 'smooth' });
    PMS.toast('已按「' + kw + '」筛选流程清单');
  };
  window.fillSearch = function (kw) { document.getElementById('portalSearch').value = kw; doSearch(); };

  function renderHeroKeys() {
    var hot = FLOW.get('items').filter(function (it) { return it.hot; }).slice(0, 6);
    document.getElementById('heroKeys').innerHTML = hot.map(function (it) {
      var short = it.sxmc.length > 8 ? it.sxmc.slice(0, 8) : it.sxmc;
      return '<span onclick="fillSearch(\'' + FLOW.esc(short) + '\')">' + FLOW.esc(short) + '</span>';
    }).join('');
  }

  document.addEventListener('DOMContentLoaded', function () {
    FLOW.on(function () { renderHot(); renderItems(); renderQuick(); renderHeroKeys(); });
    var ft = document.querySelector('.app-foot');
    if (ft) {
      var brand = ft.querySelector('.ft-brand'); ft.innerHTML = ''; ft.appendChild(brand);
      ft.insertAdjacentHTML('beforeend', '<div class="ft-right"><span>技术支持：湖南华信软件股份有限公司</span><span>Copyright © 2018-2026</span></div>');
    }
  });
})();
</script>
</body>
</html>
