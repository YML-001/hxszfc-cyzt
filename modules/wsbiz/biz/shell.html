<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>华信数智房产交易一体化平台 · 统一工作门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-shell data-role="biz">
<iframe id="content-frame" class="content-frame" name="contentFrame" title="业务内容"></iframe>
<script src="../assets/js/app.js"></script>
<script src="../assets/js/flow-data.js"></script>
<script src="../assets/js/flow.js"></script>
<script>
  /* app.js 的 initShell 在未带 ?page= 时会兜底加载 dashboard.html（本项目无该页）。
     这段脚本在解析期执行、早于 DOMContentLoaded，因此先把 page 补进地址栏，
     initShell 读到的就是我的工作台，既避免 404 也不改动运行时代码。 */
  (function () {
    var sp;
    try { sp = new URLSearchParams(location.search); } catch (e) { return; }
    if (!sp.get('page')) {
      sp.set('role', sp.get('role') || 'biz');
      sp.set('page', 'workbench.html');
      try { history.replaceState(null, '', 'shell.html?' + sp.toString()); } catch (e2) {}
    }
  })();

  document.addEventListener('DOMContentLoaded', function () {
    /* iframe 内的操作改变未读消息数后，回到外壳重新同步顶栏红点 */
    var frame = document.getElementById('content-frame');
    frame.addEventListener('load', function () { FLOW.load(); FLOW.chrome(); });
    FLOW.chrome();
  });
</script>
</body>
</html>
