<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>业务动态 · 统一工作门户</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../assets/css/app.css">
</head>
<body data-role="biz" data-active="news">
<main class="app-main">

  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb">
        <i class="fa-solid fa-house bc-home"></i> 指引动态
        <span class="sep">/</span> <span class="cur">业务动态</span>
      </div>
      <div class="page-title">业务动态</div>
    </div>
    <div class="page-actions">
      <button class="btn" onclick="doReadAll()"><i class="fa-solid fa-check-double"></i> 全部标记已读</button>
      <button class="btn" onclick="openNews()"><i class="fa-solid fa-bullhorn"></i> 发布动态</button>
      <button class="btn btn-primary" onclick="openNotice()"><i class="fa-solid fa-file-lines"></i> 发布通知</button>
    </div>
  </div>

  <div class="stat-grid">
    <div class="stat-card"><div class="s-icon red"><i class="fa-solid fa-bell"></i></div><div>
      <div class="s-label">未读消息</div><div class="s-value" id="kUnread">—</div><div class="s-trend text-danger">顶栏红点联动</div></div></div>
    <div class="stat-card"><div class="s-icon blue"><i class="fa-solid fa-envelope"></i></div><div>
      <div class="s-label">消息总数</div><div class="s-value" id="kMsg">—</div></div></div>
    <div class="stat-card"><div class="s-icon orange"><i class="fa-solid fa-file-lines"></i></div><div>
      <div class="s-label">待确认通知</div><div class="s-value" id="kNotice">—</div><div class="s-trend text-danger">强制阅读</div></div></div>
    <div class="stat-card"><div class="s-icon green"><i class="fa-solid fa-chart-line"></i></div><div>
      <div class="s-label">业务动态</div><div class="s-value" id="kNews">—</div></div></div>
  </div>

  <div class="alert alert-info">
    <i class="fa-solid fa-circle-info"></i>
    <span>消息集中提醒汇总<b>待办、催办、督办、预警与系统公告</b>五类，点击直接跳到对应业务页并定位；未读数驱动顶栏红点。标记为<b>重要</b>的通知须阅读确认，确认人与时间全程留痕。</span>
  </div>

  <div class="grid-2">
    <!-- 消息集中提醒 -->
    <div class="card">
      <div class="card-head">
        <h3>消息集中提醒</h3>
        <div class="head-actions">
          <select id="fXxlx" data-dict="xxlx" onchange="render()" style="width:130px"></select>
          <select id="fRead" onchange="render()" style="width:100px">
            <option value="">全部</option><option value="0">未读</option><option value="1">已读</option>
          </select>
        </div>
      </div>
      <div class="card-body" style="padding-top:6px"><div class="home-todo" id="msgList"></div></div>
    </div>

    <!-- 内部通知公告 -->
    <div class="card">
      <div class="card-head"><h3>内部通知公告</h3><span class="sub">重要通知需阅读确认</span></div>
      <div class="card-body" id="noticeList"></div>
    </div>
  </div>

  <!-- 业务动态发布 -->
  <div class="card mt-16">
    <div class="card-head">
      <h3>业务动态</h3>
      <span class="sub">按角色与属地展示</span>
      <div class="head-actions"><span class="node-tag"><i class="fa-solid fa-user-shield"></i>科室负责人</span></div>
    </div>
    <div class="card-body" id="newsList"></div>
  </div>
</main>

<!-- 发布动态 -->
<div class="drawer-mask"></div>
<div class="drawer" id="newsDrawer">
  <div class="drawer-head"><h3>发布业务动态</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i>
      <span>业务动态用于发布业务量、办理时效与重点工作进展，按角色与属地范围展示。</span></div>
    <div class="form-grid">
      <div class="form-item col-full"><label>标题<span class="req">*</span></label>
        <input type="text" id="nTitle" placeholder="如：本月存量房网签备案办理情况"></div>
      <div class="form-item"><label>展示范围</label><select id="nScope" data-dict="said" data-ph="全市"></select></div>
      <div class="form-item col-full"><label>正文<span class="req">*</span></label>
        <textarea id="nContent" rows="4" placeholder="如：全市累计办理 1,286 件，按时办结率 96.2%，平均办理时长 1.8 小时。"></textarea></div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>取消</button>
    <button class="btn btn-primary" onclick="doNews()"><i class="fa-solid fa-bullhorn"></i> 发布</button>
  </div>
</div>

<!-- 发布通知 -->
<div class="drawer-mask"></div>
<div class="drawer" id="noticeDrawer">
  <div class="drawer-head"><h3>发布内部通知</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="alert alert-warning"><i class="fa-solid fa-triangle-exclamation"></i>
      <span>停办通知、系统维护、政策调整与流程变更等重要通知建议勾选<b>强制阅读确认</b>，确认记录用于责任追溯。</span></div>
    <div class="form-grid">
      <div class="form-item col-full"><label>通知标题<span class="req">*</span></label>
        <input type="text" id="tTitle" placeholder="如：商品房买卖合同示范文本更新通知"></div>
      <div class="form-item col-full"><label>通知正文<span class="req">*</span></label>
        <textarea id="tContent" rows="4" placeholder="写明生效时间、影响范围与过渡安排"></textarea></div>
      <div class="form-item col-full">
        <label>阅读要求</label>
        <label class="flex items-center gap-8" style="font-weight:400">
          <input type="checkbox" id="tMust" checked> 需全员阅读确认并留痕</label>
      </div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>取消</button>
    <button class="btn btn-primary" onclick="doNotice()"><i class="fa-solid fa-file-lines"></i> 发布通知</button>
  </div>
</div>

<script src="../assets/js/app.js"></script>
<script src="../assets/js/flow-data.js"></script>
<script src="../assets/js/flow.js"></script>
<script>
(function () {
  function val(id) { return (document.getElementById(id).value || '').trim(); }

  window.render = function () {
    document.getElementById('kUnread').textContent = FLOW.stat('unread');
    document.getElementById('kMsg').textContent = FLOW.get('msgs').length;
    document.getElementById('kNotice').textContent =
      FLOW.where('notices', function (n) { return n.must && !n.confirmed; }).length;
    document.getElementById('kNews').textContent = FLOW.get('news').length;

    /* 功能点 64 消息集中提醒 */
    var lx = val('fXxlx'), rd = val('fRead');
    var msgs = FLOW.get('msgs').filter(function (m) {
      if (lx && m.xxlx !== lx) return false;
      if (rd !== '' && String(m.read) !== rd) return false;
      return true;
    });
    var COLOR = { '0': 'blue', '1': 'orange', '2': 'red', '3': 'red', '4': 'gray', '5': 'cyan', '6': 'purple' };
    document.getElementById('msgList').innerHTML = msgs.length ? msgs.map(function (m) {
      return '<a class="todo-row" href="javascript:void(0)" onclick="openMsg(\'' + m.id + '\')" data-focus="' + m.id + '"' +
        (m.read ? '' : ' style="background:var(--primary-light-2,var(--primary-light))"') + '>' +
        FLOW.badge(FLOW.dict('xxlx', m.xxlx), COLOR[m.xxlx] || 'blue') +
        '<span class="todo-text' + (m.read ? '' : ' fw-600') + '">' + FLOW.esc(m.content) + '</span>' +
        '<span class="todo-time' + (m.read ? '' : ' is-warn') + '">' +
          (m.read ? '已读' : '未读') + ' · ' + FLOW.fmt.time(m.createdAt).slice(5) + '</span></a>';
    }).join('') : '<div class="empty" style="padding:32px"><i class="fa-regular fa-bell-slash"></i><div>没有匹配的消息</div></div>';

    /* 功能点 66 内部通知公告 */
    document.getElementById('noticeList').innerHTML = FLOW.get('notices').map(function (n) {
      return '<div class="grp-card" data-focus="' + n.id + '">' +
        '<div class="grp-head"><span class="gi"><i class="fa-solid fa-file-lines"></i></span>' +
          '<span style="flex:1;min-width:0">' + FLOW.esc(n.title) + '</span>' +
          (n.must ? FLOW.badge('重要 · 需确认', n.confirmed ? 'green' : 'red') : FLOW.badge('一般', 'gray')) +
        '</div>' +
        '<div class="text-2 text-sm" style="line-height:1.8">' + FLOW.esc(n.content) + '</div>' +
        '<div class="flex justify-between items-center mt-16">' +
          '<span class="text-3 text-sm">' + FLOW.esc(n.author) + ' · ' + FLOW.fmt.date(n.createdAt) +
            (n.confirmed ? '　已由 ' + FLOW.esc(n.confirmBy) + ' 于 ' + FLOW.fmt.time(n.confirmAt) + ' 确认阅读' : '') + '</span>' +
          (n.must && !n.confirmed
            ? '<button class="btn btn-sm btn-primary" onclick="doConfirm(\'' + n.id + '\')">' +
              '<i class="fa-solid fa-check"></i> 我已阅读并确认</button>'
            : '') +
        '</div></div>';
    }).join('');

    /* 功能点 65 业务动态 */
    document.getElementById('newsList').innerHTML = FLOW.get('news').length
      ? '<div class="grid-3">' + FLOW.get('news').map(function (n) {
          return '<div class="grp-card">' +
            '<div class="grp-head"><span class="gi"><i class="fa-solid fa-chart-line"></i></span>' +
              '<span style="flex:1;min-width:0">' + FLOW.esc(n.title) + '</span></div>' +
            '<div class="text-2 text-sm" style="line-height:1.8">' + FLOW.esc(n.content) + '</div>' +
            '<div class="text-3 text-sm mt-16">' + FLOW.badge(n.scope, 'blue') + '　' +
              FLOW.esc(n.author) + ' · ' + FLOW.fmt.date(n.createdAt) + '</div></div>';
        }).join('') + '</div>'
      : '<div class="empty"><i class="fa-regular fa-newspaper"></i><div>暂无业务动态</div></div>';
  };

  window.openMsg = function (id) {
    var m = FLOW.byId('msgs', id);
    if (!m) return;
    FLOW.act.readMsg(id);
    if (m.href && m.href !== 'news.html') {
      FLOW.goto(m.href, {});
    } else {
      PMS.toast('已标记为已读');
    }
  };
  window.doReadAll = function () { FLOW.act.readAll(); };
  window.doConfirm = function (id) {
    PMS.confirm({
      title: '阅读确认', type: 'info', okText: '确认已阅读',
      message: '确认您已完整阅读该通知？',
      detail: '确认人与确认时间将写入通知阅读记录，用于后续责任追溯。',
      onOk: function () { FLOW.act.confirmNotice(id); }
    });
  };
  window.openNews = function () {
    document.getElementById('nTitle').value = '';
    document.getElementById('nContent').value = '';
    PMS.openDrawer('newsDrawer');
  };
  window.doNews = function () {
    if (FLOW.act.publishNews({ title: val('nTitle'), content: val('nContent'), scope: val('nScope') })) {
      PMS.closeDrawer('newsDrawer');
    }
  };
  window.openNotice = function () {
    document.getElementById('tTitle').value = '';
    document.getElementById('tContent').value = '';
    PMS.openDrawer('noticeDrawer');
  };
  window.doNotice = function () {
    if (FLOW.act.publishNotice({
      title: val('tTitle'), content: val('tContent'),
      must: document.getElementById('tMust').checked
    })) PMS.closeDrawer('noticeDrawer');
  };

  document.addEventListener('DOMContentLoaded', function () { FLOW.on(render); });
})();
</script>
</body>
</html>
