<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>固化数据查询 · 房产交易数据中心</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-role="admin" data-active="wsdata-08">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb">
        <i class="fa-solid fa-house bc-home"></i> 房产交易数据中心
        <span class="sep">/</span> 统计口径固化
        <span class="sep">/</span> <span class="cur">固化数据查询</span>
      </div>
      <div class="page-title">固化数据查询</div>
    </div>
  </div>

  <div class="dc-layout">
    <div class="card">
      <div class="card-head"><h3><i class="fa-solid fa-folder-tree"></i> 业务数据类别</h3></div>
      <div class="dc-scroll tight dc-tree" id="catTree"></div>
    </div>

    <div class="card">
      <div class="card-head" id="catHead"></div>
      <div class="card-body">
        <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>查询的是<b>具体业务结果数据</b>（项目、楼栋、销售许可证、网签备案合同等明细记录），非统计汇总数据。涉及个人信息的字段默认脱敏，明细按数据共享授权范围提供。</div></div>
        <div class="filter-bar">
          <div class="filter-item"><label>关键字</label><input type="text" id="kw" placeholder="编号 / 名称 / 坐落"></div>
          <div class="filter-item"><label>行政区划</label><select data-dict="said"></select></div>
          <div class="filter-item"><label>起始日期</label><input type="date"></div>
          <div class="filter-item"><label>截止日期</label><input type="date"></div>
          <div class="filter-actions">
            <button class="btn btn-primary" onclick="PMS.toast('已按条件查询')"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
            <button class="btn" onclick="document.getElementById('kw').value='';PMS.toast('已重置查询条件')">重置</button>
            <button class="btn" onclick="PMS.toast('已导出查询结果明细')"><i class="fa-solid fa-download"></i> 导出</button>
          </div>
        </div>
        <div class="table-wrap">
          <table class="data-table" data-static id="listTable">
            <thead id="tblHead"></thead>
            <tbody id="tblBody"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- 记录详情抽屉 -->
<div class="drawer-mask"></div>
<div class="drawer" id="recDrawer">
  <div class="drawer-head"><h3 id="rdTitle">记录详情</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <dl class="desc-list" id="rdBody"></dl>
    <p class="hint mt-16"><i class="fa-solid fa-circle-info"></i> 以上为该业务记录的固化明细。涉及个人信息字段已按脱敏规则显示，如需原始明细请通过数据共享授权申请。</p>
  </div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>关闭</button>
    <button class="btn btn-primary" onclick="PMS.toast('已导出该记录明细')"><i class="fa-solid fa-download"></i> 导出记录</button>
  </div>
</div>

<script src="../../assets/js/app.js"></script>
<script>

      ] },

        ["LD20260012802", "龙城新苑二期", "2 号楼", "26", "104", "预售", "2026-08-01 03:38"],
        ["LD20260008603", "江湾府邸", "3 号楼", "32", "128", "现售", "2026-08-01 03:38"],

      ] },

      head: ["备案编号", "房屋坐落", "出租人", "承租人", "月租金(元)", "备案时间", "状态"],
      rows: [

      ] },
    jgzh: { name: "监管账户数据", icon: "fa-building-columns", cnt: "12,486",
      head: ["账户编号", "所属项目", "开户银行", "账户余额(元)", "账户状态", "更新时间"],
      rows: [
        ["JGZH20260012801", "龙城新苑二期", "中国建设银行柳州分行", "68,420,600.00", "正常", "2026-08-01 04:02"],
        ["JGZH20260008602", "江湾府邸", "中国工商银行柳州分行", "126,800,400.00", "正常", "2026-08-01 04:02"],
        ["JGZH20260004203", "碧水云天花园", "柳州银行", "42,600,200.00", "正常", "2026-08-01 04:02"],
        ["JGZH20260020604", "融水民族家园", "中国农业银行融水支行", "12,480,000.00", "冻结", "2026-08-01 04:02"]
      ] }
  };

  var cur = "xm";

  function renderTree() {
    var html = "";
    Object.keys(CAT).forEach(function (k) {
      var c = CAT[k];
      html += '<div class="t-node' + (k === cur ? ' on' : '') + '" onclick="selCat(\'' + k + '\')"><i class="fa-solid ' + c.icon + '"></i> ' + c.name + '</div>';
    });
    document.getElementById("catTree").innerHTML = html;
  }

  function selCat(k) { cur = k; LIST_PAGE.num = 1; renderTree(); renderHead(); renderList(); }

  var LIST_PAGE = { num: 1, size: 10 };

  function renderHead() {
    var c = CAT[cur];
    document.getElementById("catHead").innerHTML = '<h3><i class="fa-solid ' + c.icon + '"></i> ' + c.name + '</h3><span class="sub">全市数据量约 ' + c.cnt + ' 条</span>';
  }

  function renderList() {
    var c = CAT[cur];
    var th = "<tr>";
    c.head.forEach(function (h) { th += "<th>" + h + "</th>"; });
    th += "<th>操作</th></tr>";
    document.getElementById("tblHead").innerHTML = th;

    var table = document.getElementById("listTable");
    var start = (LIST_PAGE.num - 1) * LIST_PAGE.size;
    var pageItems = c.rows.slice(start, start + LIST_PAGE.size);
    var body = "";
    pageItems.forEach(function (r, pi) {
      var ri = start + pi;
      body += "<tr>";
      r.forEach(function (v, ci) {
        var cls = (ci === 0) ? "nowrap" : "";
        body += '<td class="' + cls + '">' + v + "</td>";
      });
      body += '<td class="nowrap"><span class="link" onclick="viewRec(' + ri + ')">详情</span></td></tr>';
    });
    document.getElementById("tblBody").innerHTML = body;
    PMS.renderPager(table, { pageNum: LIST_PAGE.num, pageSize: LIST_PAGE.size, total: c.rows.length, onChange: function (s) { LIST_PAGE.num = s.pageNum; LIST_PAGE.size = s.pageSize; renderList(); } });
  }

  function viewRec(ri) {
    var c = CAT[cur];
    var r = c.rows[ri];
    document.getElementById("rdTitle").innerHTML = c.name + " · " + r[0];
    var html = "";
    c.head.forEach(function (h, i) {
      var full = (h.indexOf("坐落") >= 0 || h.indexOf("名称") >= 0 || h.indexOf("企业") >= 0) ? " full" : "";
      html += '<div class="desc-item' + full + '"><dt>' + h + '</dt><dd>' + r[i] + '</dd></div>';
    });
    document.getElementById("rdBody").innerHTML = html;
    PMS.openDrawer("recDrawer");
  }

  renderTree();
  renderHead();
  renderList();
</script>
</body>
</html>
