  var curLib = "sp";

  function renderTree() {
    var html = "";
    Object.keys(DB).forEach(function (k) {
      var lib = DB[k];
      html += '<div class="t-node' + (k === curLib ? ' on' : '') + '" onclick="selLib(\'' + k + '\')"><i class="fa-solid fa-cubes"></i> ' + lib.name + '<span class="t-num">' + lib.tables.length + '</span></div>';
    });
    document.getElementById("libTree").innerHTML = html;
  }

  function selLib(k) { curLib = k; TB_PAGE.num = 1; renderTree(); renderHead(); renderTables(); }

  var TB_PAGE = { num: 1, size: 10 };

  function renderHead() {
    var lib = DB[curLib];
    var totalTables = lib.tables.length;
    document.getElementById("libHead").innerHTML = '<h3><i class="fa-solid fa-table-cells-large"></i> ' + lib.name + ' <code>' + lib.code + '</code></h3><span class="sub">共 ' + totalTables + ' 张表 · 更新周期 ' + lib.cycle + '</span>';
  }

  function renderTables() {
    var lib = DB[curLib];
    var kw = (document.getElementById("kw").value || "").trim().toLowerCase();
    var table = document.getElementById("tblTable");
    var hasIdx = !!table.querySelector('thead th.idx-col');
    var arr = lib.tables.filter(function (tb) {
      if (kw && tb.t.toLowerCase().indexOf(kw) < 0 && tb.cn.toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    var start = (TB_PAGE.num - 1) * TB_PAGE.size;
    var pageItems = arr.slice(start, start + TB_PAGE.size);
    var rows = "";
    pageItems.forEach(function (tb, i) {
      var seq = start + i + 1;
      var idxCell = hasIdx ? '<td class="idx-col">' + (seq < 10 ? '0' + seq : seq) + '</td>' : '';
      rows += '<tr>' + idxCell + '<td class="nowrap"><code>' + tb.t + '</code></td><td class="cell-lg">' + tb.cn + '</td><td class="num">' + tb.cnt + '</td><td class="num nowrap">' + tb.rows + '</td><td class="nowrap">' + lib.cycle + '</td><td class="nowrap">' + tb.upd + '</td><td class="nowrap"><span class="link" onclick="viewFields(\'' + tb.t + '\')">查看字段</span></td></tr>';
    });
    if (!rows) rows = '<tr><td colspan="' + (hasIdx ? 8 : 7) + '" class="text-3" style="text-align:center;padding:24px">无匹配的表</td></tr>';
    document.getElementById("tblBody").innerHTML = rows;
    PMS.renderPager(table, { pageNum: TB_PAGE.num, pageSize: TB_PAGE.size, total: arr.length, onChange: function (s) { TB_PAGE.num = s.pageNum; TB_PAGE.size = s.pageSize; renderTables(); } });
  }

  function viewFields(t) {
    var lib = DB[curLib];
    var tb = lib.tables.filter(function (x) { return x.t === t; })[0];
    if (!tb) return;
    document.getElementById("fdTitle").innerHTML = tb.cn + " · " + tb.t;
    document.getElementById("fdMeta").innerHTML =
      '<div class="desc-item"><dt>所属主题库</dt><dd>' + lib.name + '（<code>' + lib.code + '</code>）</dd></div>' +
      '<div class="desc-item"><dt>表名</dt><dd><code>' + tb.t + '</code></dd></div>' +
      '<div class="desc-item"><dt>字段数</dt><dd>' + tb.cnt + ' 个</dd></div>' +
      '<div class="desc-item"><dt>数据量</dt><dd>' + tb.rows + ' 行</dd></div>' +
      '<div class="desc-item"><dt>更新周期</dt><dd>' + lib.cycle + '</dd></div>' +
      '<div class="desc-item"><dt>最近更新时间</dt><dd>' + tb.upd + '</dd></div>';
    var body = "";
    tb.cols.forEach(function (c, i) {
      body += '<tr><td class="num">' + (i + 1) + '</td><td class="nowrap"><code>' + c[0] + '</code></td><td class="cell-lg">' + c[1] + '</td><td class="nowrap">' + c[2] + '</td><td>' + (c[3] === "是" ? '<span class="badge blue">主键</span>' : '否') + '</td><td class="cell-lg">' + c[4] + '</td></tr>';
    });
    document.getElementById("fdBody").innerHTML = body;
    document.getElementById("fdHint").innerHTML = '<i class="fa-solid fa-circle-info"></i> 完整字段共 ' + tb.cnt + ' 个，此处展示主要字段 ' + tb.cols.length + ' 个。涉及个人信息的字段在库中脱敏存储，明细数据按共享授权提供。';
    PMS.openDrawer("fieldDrawer");
  }

  renderTree();
  renderHead();
  renderTables();
</script>
</body>
</html>
