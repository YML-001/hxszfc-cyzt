<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台 · 房产交易数据中心</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
<link rel="stylesheet" href="../../assets/css/wb.css">
<style>
  /* 数据资产头图（设计图顶部蓝色横幅，wb 无对应区块，用 card 区块 + 自定义内容拼装） */
  .dc-hero {
    position: relative; margin: -20px; padding: 26px 30px 24px 34px; min-height: 236px; color: #fff; overflow: hidden;
    background: #2556ba url('../../assets/img/v2/hero-city.jpg') right center / cover no-repeat;
  }
  .dc-hero::before {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(90deg, #2556ba 0%, #2556ba 40%, rgba(37, 86, 186, .6) 68%, rgba(37, 86, 186, .18) 100%);
  }
  .dc-hero > * { position: relative; }
  .dc-hero .dh-top { display: flex; align-items: flex-start; gap: 16px; }
  .dc-hero .dh-t { font-size: 26px; font-weight: 700; letter-spacing: .5px; line-height: 1.2; }
  .dc-hero .dh-s { margin-top: 10px; font-size: 12.5px; opacity: .85; }
  .dc-hero .dh-ops { margin-left: auto; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .dc-hero .dh-ops select {
    height: 32px; padding: 0 28px 0 12px; border: none; border-radius: 4px; background: #fff; color: #303133; font-size: 13px;
  }
  .dc-hero .dh-ops .dh-btn {
    height: 32px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, .7); border-radius: 4px; cursor: pointer;
    background: rgba(255, 255, 255, .12); color: #fff; font-size: 13px; white-space: nowrap;
  }
  .dc-hero .dh-ops .dh-btn:hover { background: rgba(255, 255, 255, .24); }
  .dc-hero .dh-tiles { display: flex; gap: 12px; margin-top: 26px; }
  .dc-hero .dh-tile {
    width: 118px; padding: 12px 12px 12px; border-radius: 8px; cursor: pointer;
    background: linear-gradient(180deg, rgba(255, 255, 255, .92) 0%, rgba(230, 238, 255, .92) 100%);
    box-shadow: 0 4px 14px rgba(0, 21, 41, .12); transition: transform .15s;
  }
  .dc-hero .dh-tile:hover { transform: translateY(-2px); }
  .dc-hero .dh-tile i {
    display: inline-flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: 8px;
    background: #2556ba; color: #fff; font-size: 15px;
  }
  .dc-hero .dh-tile .l { margin-top: 10px; font-size: 12px; color: #4b5b80; white-space: nowrap; }
  .dc-hero .dh-tile .v { margin-top: 2px; font-size: 18px; font-weight: 700; color: #1f2a44; white-space: nowrap; }
  .dc-hero .dh-tile .v small { font-size: 12px; font-weight: 400; color: #6b7590; margin-left: 2px; }

  /* 柱 + 折线组合图（设计图为「月新增柱 + 累计折线」，wb 的 bar 只支持并列多系列柱，故自拼，外观沿用 wb-bars） */
  .dc-legend { display: flex; justify-content: center; gap: 22px; margin-bottom: 4px; font-size: 12px; color: #606266; }
  .dc-legend .sq { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; background: linear-gradient(180deg, #5b8def, #2556ba); }
  .dc-legend .ln { display: inline-block; width: 16px; height: 0; border-top: 2px solid #df2026; margin-right: 6px; vertical-align: 2px; position: relative; }
  .dc-legend .ln::after { content: ""; position: absolute; left: 5px; top: -4px; width: 6px; height: 6px; border-radius: 50%; background: #fff; border: 1.5px solid #df2026; }
  .dc-chart { position: relative; height: 262px; padding: 24px 10px 30px 44px; }
  .dc-chart .unit { position: absolute; left: 0; top: 0; font-size: 11px; color: #909399; }
  .dc-chart .axis { position: absolute; left: 0; top: 24px; bottom: 30px; width: 40px; display: flex; flex-direction: column; justify-content: space-between; font-size: 11px; color: #909399; text-align: right; }
  .dc-chart .grid { position: absolute; left: 44px; right: 10px; top: 24px; bottom: 30px; background: repeating-linear-gradient(180deg, #edf0f5 0 1px, transparent 1px 20%); border-bottom: 1px solid #e3e8f0; }
  .dc-chart .plot { position: absolute; left: 44px; right: 10px; top: 24px; bottom: 30px; }
  .dc-chart .cols { position: absolute; inset: 0; display: flex; align-items: flex-end; }
  .dc-chart .col { position: relative; flex: 1; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
  .dc-chart .col .bar { position: relative; width: 30px; border-radius: 4px 4px 0 0; background: linear-gradient(180deg, #5b8def 0%, #2556ba 100%); box-shadow: 0 4px 10px rgba(38, 86, 187, .25); }
  .dc-chart .col .bar .bv { position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%); font-size: 10px; color: #fff; white-space: nowrap; }
  .dc-chart .col .lab { position: absolute; top: 100%; margin-top: 8px; font-size: 12px; color: #606266; white-space: nowrap; }
  .dc-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
  .dc-chart svg path { fill: none; stroke: #df2026; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; vector-effect: non-scaling-stroke; }
  .dc-chart .pt { position: absolute; width: 7px; height: 7px; border-radius: 50%; background: #fff; border: 2px solid #df2026; transform: translate(-50%, 50%); z-index: 2; }
  .dc-chart .pv { position: absolute; transform: translate(-50%, calc(-100% - 8px)); padding: 0 4px; border: 1px solid #df2026; border-radius: 3px; background: #fff; font-size: 10px; line-height: 15px; color: #df2026; white-space: nowrap; z-index: 2; }

  /* 各主题库数据量占比：标签在上、条在下、数值右对齐（wb 的 hbar 标签列过窄，故自拼） */
  .dc-dist { display: flex; flex-direction: column; gap: 12px; padding: 2px 0; }
  .dc-dist .dd { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto auto; column-gap: 14px; row-gap: 6px; align-items: center; }
  .dc-dist .dd .n { grid-column: 1; font-size: 12.5px; color: #606266; white-space: nowrap; }
  .dc-dist .dd .v { grid-column: 2; grid-row: 1 / span 2; font-size: 13px; color: #1f2a44; font-weight: 600; white-space: nowrap; text-align: right; min-width: 118px; font-variant-numeric: tabular-nums; }
  .dc-dist .dd .track { grid-column: 1; height: 10px; border-radius: 5px; background: #eef1f6; overflow: hidden; }
  .dc-dist .dd .track span { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, #2556ba, #5b8def); }
</style>
</head>
<body data-role="admin" data-active="wsdata-01">
<main class="app-main">
  <div id="wb-root"></div>
</main>

<script src="../../assets/js/app.js"></script>
<script src="../../assets/js/wb.js"></script>
<script>
/* 内容按 Figma「管理后台-房产交易数据中心」工作台逐项还原 */
(function () {
  var go = function (href) { return ' onclick="location.href=\'' + href + '\'"'; };

  /* 头图三块指标 */
  var tiles = [
    { icon: 'fa-database', label: '累计归集数据', value: '2.74亿', unit: '/行', href: 'wsdata-03.html' },
    { icon: 'fa-table-cells-large', label: '主题库 / 库表', value: '8 / 63', href: 'wsdata-03.html' },
    { icon: 'fa-plug-circle-bolt', label: '共享接口', value: '28', unit: '个', href: 'wsdata-10.html' }
  ];
  var heroHtml =
    '<div class="dc-hero">' +
      '<div class="dh-top"><div>' +
        '<div class="dh-t">全市房产交易数据资产 · 一数一源</div>' +
        '<div class="dh-s">本地化大模型底座 + 知识库图谱 + 智能体编排，统一支撑房产交易全业务链的智能应用</div>' +
      '</div>' +
      '<div class="dh-ops">' +
        '<select><option>柳州市（全市）</option><option>城中区</option><option>鱼峰区</option><option>柳南区</option><option>柳北区</option><option>柳江区</option></select>' +
        '<select><option>本月（2026-07）</option><option>上月（2026-06）</option><option>本年（2026）</option></select>' +
        '<button class="dh-btn" onclick="PMS.toast(\'指标定制：可勾选工作台展示的指标项，原型中以占位呈现\')"><i class="fa-solid fa-sliders"></i> 指标定制</button>' +
        '<button class="dh-btn" onclick="PMS.toast(\'已生成数据资产总览报表，可在固化数据查询下载\',\'success\')"><i class="fa-solid fa-file-export"></i> 导出总览</button>' +
      '</div></div>' +
      '<div class="dh-tiles">' + tiles.map(function (t) {
        return '<div class="dh-tile"' + go(t.href) + '><i class="fa-solid ' + t.icon + '"></i><div class="l">' + t.label + '</div>' +
          '<div class="v">' + t.value + (t.unit ? '<small>' + t.unit + '</small>' : '') + '</div></div>';
      }).join('') + '</div>' +
    '</div>';

  /* 近 12 月数据归集趋势：柱 = 月新增（万行），折线 = 累计（亿行） */
  var months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
  var addV = [986, 1042, 980, 1700, 2030, 1020, 986, 1042, 980, 1700, 2030, 1020];
  var cumV = [1500, 1200, 1000, 1300, 2100, 2010, 2000, 2100, 2300, 2300, 1800, 1500];
  var TOP = 2500, n = months.length;
  var fmtN = function (v) { return v.toLocaleString('zh-CN'); };
  var pts = cumV.map(function (v, i) { return { x: (i + 0.5) / n * 100, y: v / TOP * 100 }; });
  var path = pts.map(function (p, i) { return (i ? 'L' : 'M') + (p.x * 10).toFixed(1) + ' ' + ((100 - p.y) * 10).toFixed(1); }).join(' ');
  var ticks = [2500, 2000, 1500, 1000, 500, 0];
  var chartHtml =
    '<div class="dc-legend"><span><i class="sq"></i>月新增（万行）</span><span><i class="ln"></i>累计（亿行）</span></div>' +
    '<div class="dc-chart"><span class="unit">单位(个)</span>' +
      '<div class="axis">' + ticks.map(function (t) { return '<span>' + fmtN(t) + '</span>'; }).join('') + '</div>' +
      '<div class="grid"></div>' +
      '<div class="plot">' +
        '<div class="cols">' + months.map(function (m, i) {
          var h = Math.max(2, Math.round(addV[i] / TOP * 100));
          return '<div class="col"><div class="bar" style="height:' + h + '%"><span class="bv">' + fmtN(addV[i]) + '</span></div><span class="lab">' + m + '</span></div>';
        }).join('') + '</div>' +
        '<svg viewBox="0 0 1000 1000" preserveAspectRatio="none"><path d="' + path + '"></path></svg>' +
        pts.map(function (p, i) {
          return '<span class="pt" style="left:' + p.x.toFixed(3) + '%;bottom:' + p.y.toFixed(2) + '%"></span>' +
            '<span class="pv" style="left:' + p.x.toFixed(3) + '%;bottom:' + p.y.toFixed(2) + '%">' + fmtN(cumV[i]) + '</span>';
        }).join('') +
      '</div>' +
    '</div>';

  /* 各主题库数据量占比（按存量行数） */
  var dist = [
    ['档案与查询主题库', 9910, '9910 万 · 36.1%'],
    ['资金监管主题库', 8679, '8679 万 · 31.6%'],
    ['商品房交易主题库', 4924, '4924 万 · 17.9%'],
    ['存量房交易主题库', 2517, '2517 万 · 9.2%'],
    ['房屋租赁主题库', 1145, '1145 万 · 4.2%'],
    ['项目与楼盘主题库', 209, '209 万 · 0.8%'],
    ['市场主体与信用库', 209, '209 万 · 0.8%'],
    ['统计指标主题库', 15.6, '15.6 万 · 0.1%']
  ];
  var max = dist[0][1];
  var distHtml = '<div class="dc-dist">' + dist.map(function (d) {
    var w = Math.max(3, Math.round(d[1] / max * 100));
    return '<div class="dd"' + go('wsdata-03.html') + ' style="cursor:pointer"><span class="n">' + d[0] + '</span><span class="v">' + d[2] + '</span>' +
      '<div class="track"><span style="width:' + w + '%"></span></div></div>';
  }).join('') + '</div>';

  WB.render({ blocks: [
    /* 1. 数据资产头图 */
    { type: 'card', html: heroHtml },

    /* 2. 六个 KPI */
    { type: 'kpis', cols: 6, items: [
      { icon: 'fa-layer-group', c: 'blue', label: '今日新增归集', value: '302万', sub: '较昨日 +6.2%', trend: 'up', href: 'wsdata-03.html' },
      { icon: 'fa-circle-check', c: 'orange', label: '数据质量合格率', value: '98.6%', sub: '环比 +0.4%', trend: 'up', href: 'wsdata-06.html' },
      { icon: 'fa-share-nodes', c: 'green', label: '今日共享交换调用', value: '42.8 万', sub: '成功率 99.97%', href: 'wsdata-10.html' },
      { icon: 'fa-plug-circle-bolt', c: 'purple', label: '接口在线率', value: '27 / 28', sub: '1 个降级（银行对账）', trend: 'warn', href: 'wsdata-11.html' },
      { icon: 'fa-paper-plane', c: 'cyan', label: '上级报送完成率', value: '100%', sub: '全国联网上报 T+1', href: 'wsdata-14.html' },
      { icon: 'fa-triangle-exclamation', c: 'red', label: '待处理数据问题', value: 9, sub: '质量/空值/重复，待治理', trend: 'warn', href: 'wsdata-05.html' }
    ] },

    /* 3. 归集趋势 + 主题库占比 */
    { type: 'row', cols: [
      { type: 'card', title: '近 12 月数据归集趋势', more: '固化数据查询', moreHref: 'wsdata-08.html', html: chartHtml },
      { type: 'card', title: '各主题库数据量占比', meta: '按存量行数', more: '库表资源目录', moreHref: 'wsdata-03.html', html: distHtml }
    ] }
  ] });
})();
</script>
</body>
</html>
