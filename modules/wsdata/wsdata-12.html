<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报送单位管理 · 房产交易数据中心</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-role="admin" data-active="wsdata-12">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb">
        <i class="fa-solid fa-house bc-home"></i> 房产交易数据中心
        <span class="sep">/</span> 上级报送管理
        <span class="sep">/</span> <span class="cur">报送单位管理</span>
      </div>
      <div class="page-title">报送单位管理</div>
    </div>
    <div class="ph-r">
      <a class="btn" href="wsdata-13.html"><i class="fa-solid fa-right-left"></i> 报送接口配置</a>
    </div>
  </div>

  <div class="card list-card">
    <div class="dc-list">
      <div class="dc-mini">
        <div class="mi"><div class="mv">4</div><div class="ml">报送单位</div></div>
        <div class="mi ok"><div class="mv">3</div><div class="ml">对接正常</div></div>
        <div class="mi warn"><div class="mv">1</div><div class="ml">存在逾期事项</div></div>
        <div class="mi"><div class="mv">9</div><div class="ml">报送事项总数</div></div>
      </div>
      <div class="filter-bar">
        <div class="filter-item"><label>行政层级</label><select id="fLevel" onchange="renderDw()"><option value="">全部</option><option>部级</option><option>自治区级</option></select></div>
        <div class="filter-item"><label>传输方式</label><select id="fTrans" onchange="renderDw()"><option value="">全部</option><option>HTTPS/JSON</option><option>WebService/XML</option><option>文件交换</option></select></div>
        <div class="filter-item"><label>状态</label><select id="fState" onchange="renderDw()"><option value="">全部</option><option>正常</option><option>存在逾期</option><option>已停用</option></select></div>
        <div class="filter-item"><label>关键字</label><input type="text" id="fKw" placeholder="单位名称 / 对接系统" oninput="renderDw()"></div>
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="renderDw()"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
          <button class="btn" onclick="resetDw()">重置</button>
          <button class="btn btn-primary" onclick="PMS.openDrawer('unitDrawer')"><i class="fa-solid fa-plus"></i> 新增报送单位</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" data-static id="dwTable">
          <thead><tr><th class="cell-lg">报送单位</th><th>行政层级</th><th class="cell-lg">对接系统</th><th class="num">报送事项数</th><th>传输方式</th><th class="cell-lg">技术对接人</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="dwBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- 报送单位详情抽屉 -->
<div class="drawer-mask"></div>
<div class="drawer" id="unitViewDrawer">
  <div class="drawer-head"><h3 id="uvTitle">报送单位详情</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body" id="uvBody"></div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>关闭</button>
    <a class="btn btn-primary" href="wsdata-13.html"><i class="fa-solid fa-right-left"></i> 配置报送接口</a>
  </div>
</div>

<!-- 新增报送单位抽屉 -->
<div class="drawer" id="unitDrawer">
  <div class="drawer-head"><h3>新增报送单位</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="alert alert-info"><i class="fa-solid fa-circle-info"></i><div>报送单位是数据报送的上级接收对象。先在此登记单位与对接系统，再到「报送接口配置」为其配置具体报送接口与频率。</div></div>
    <h4 class="section-title">基本信息</h4>
    <div class="form-grid form-align">
      <div class="form-item"><label>报送单位 <span class="req">*</span></label><input type="text" placeholder="上级接收单位全称"></div>
      <div class="form-item"><label>行政层级 <span class="req">*</span></label><select><option>部级</option><option>自治区级</option></select></div>
      <div class="form-item col-2"><label>对接系统 <span class="req">*</span></label><input type="text" placeholder="多个系统以逗号分隔"></div>
      <div class="form-item"><label>传输方式 <span class="req">*</span></label><select><option>HTTPS/JSON</option><option>WebService/XML</option><option>文件交换</option></select></div>
      <div class="form-item"><label>认证方式</label><select><option>国密 SM2/SM4</option><option>双向证书</option><option>AppKey + 签名</option></select></div>
      <div class="form-item"><label>技术对接人 <span class="req">*</span></label><input type="text" placeholder="姓名 / 科室"></div>
      <div class="form-item"><label>联系电话 <span class="req">*</span></label><input type="text" placeholder="联系电话"></div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>取消</button>
    <button class="btn btn-primary" onclick="PMS.closeDrawer();PMS.toast('报送单位已保存','success')"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
  </div>
</div>

<script src="../../assets/js/app.js"></script>
<script>
  var UNITS = [
    { name: "住房和城乡建设部", level: "部级", sys: "全国房屋网签备案系统 / 房地产市场监测系统", items: 3, trans: "HTTPS/JSON · 文件交换", contact: "住建部信息中心 · 400-xxx", state: "正常",
      subs: [["全国房屋网签备案系统", "全国房屋网签备案联网上报", "实时", "运行中", "green"],
             ["房地产市场监测系统", "房地产市场监测数据上报", "日", "运行中", "green"],
             ["房地产市场监测系统", "住建部日报报送", "日", "运行中", "green"]] },
    { name: "自治区住房和城乡建设厅", level: "自治区级", sys: "广西房地产市场监管平台 / 预售资金监管平台 / 房地信息采集 / 事项编码", items: 4, trans: "HTTPS/JSON", contact: "区住建厅信息处 · 0771-xxx", state: "存在逾期",
      subs: [["广西房地产市场监管平台", "住建厅日报报送", "日", "运行中", "green"],
             ["预售资金监管平台", "预售资金监管数据上报", "日", "运行中", "green"],
             ["房地信息采集系统", "广西房地信息采集报送", "月", "逾期", "orange"],
             ["事项编码管理系统", "广西事项编码对接", "事件触发", "运行中", "green"]] },
    { name: "广西一体化政务数据共享交换平台", level: "自治区级", sys: "自治区数据共享交换平台", items: 1, trans: "HTTPS/JSON", contact: "区大数据发展局 · 0771-xxx", state: "正常",
      subs: [["自治区数据共享交换平台", "一网共享数据报送", "日", "运行中", "green"]] },
    { name: "自治区自然资源厅", level: "自治区级", sys: "广西不动产登记信息平台", items: 1, trans: "WebService/XML", contact: "区自然资源厅信息中心 · 0771-xxx", state: "正常",
      subs: [["广西不动产登记信息平台", "网签与登记衔接数据报送", "实时", "运行中", "green"]] }
  ];

  var PAGE = { num: 1, size: 10 };

  function stBadge(s) {
    if (s === "正常") return '<span class="badge green">正常</span>';
    if (s === "存在逾期") return '<span class="badge orange">存在逾期</span>';
    return '<span class="badge gray">已停用</span>';
  }

  function renderDw() {
    var lv = document.getElementById("fLevel").value;
    var tr = document.getElementById("fTrans").value;
    var st = document.getElementById("fState").value;
    var kw = (document.getElementById("fKw").value || "").trim().toLowerCase();
    var arr = UNITS.filter(function (u) {
      if (lv && u.level !== lv) return false;
      if (tr && u.trans.indexOf(tr) < 0) return false;
      if (st && u.state !== st) return false;
      if (kw && u.name.toLowerCase().indexOf(kw) < 0 && u.sys.toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    var table = document.getElementById("dwTable");
    var hasIdx = !!table.querySelector('thead th.idx-col');
    var start = (PAGE.num - 1) * PAGE.size;
    var pageItems = arr.slice(start, start + PAGE.size);
    var body = "";
    pageItems.forEach(function (u, i) {
      var seq = start + i + 1;
      var idxCell = hasIdx ? '<td class="idx-col">' + (seq < 10 ? '0' + seq : seq) + '</td>' : '';
      body += '<tr>' + idxCell + '<td class="cell-lg fw-600">' + u.name + '</td><td class="nowrap">' + u.level + '</td><td class="cell-lg">' + u.sys + '</td><td class="num">' + u.items + '</td><td class="nowrap">' + u.trans + '</td><td class="cell-lg">' + u.contact + '</td><td>' + stBadge(u.state) + '</td><td class="nowrap"><span class="link" onclick="viewUnit(' + UNITS.indexOf(u) + ')">详情</span> <span class="link" onclick="PMS.openDrawer(\'unitDrawer\')">编辑</span></td></tr>';
    });
    if (!body) body = '<tr><td colspan="' + (hasIdx ? 9 : 8) + '" class="text-3" style="text-align:center;padding:24px">无匹配的报送单位</td></tr>';
    document.getElementById("dwBody").innerHTML = body;
    PMS.renderPager(table, { pageNum: PAGE.num, pageSize: PAGE.size, total: arr.length, onChange: function (s) { PAGE.num = s.pageNum; PAGE.size = s.pageSize; renderDw(); } });
  }

  function resetDw() {
    document.getElementById("fLevel").value = "";
    document.getElementById("fTrans").value = "";
    document.getElementById("fState").value = "";
    document.getElementById("fKw").value = "";
    PAGE.num = 1;
    renderDw();
  }

  function viewUnit(i) {
    var u = UNITS[i];
    document.getElementById("uvTitle").innerHTML = "报送单位详情 · " + u.name;
    var rows = u.subs.map(function (s) {
      return '<tr><td class="cell-lg">' + s[0] + '</td><td class="cell-lg">' + s[1] + '</td><td class="nowrap">' + s[2] + '</td><td><span class="badge ' + s[4] + '">' + s[3] + '</span></td></tr>';
    }).join("");
    document.getElementById("uvBody").innerHTML =
      '<h4 class="section-title">基本信息</h4><dl class="desc-list">' +
      '<div class="desc-item full"><dt>报送单位</dt><dd>' + u.name + '</dd></div>' +
      '<div class="desc-item"><dt>行政层级</dt><dd>' + u.level + '</dd></div>' +
      '<div class="desc-item"><dt>报送事项数</dt><dd>' + u.items + '</dd></div>' +
      '<div class="desc-item"><dt>传输方式</dt><dd>' + u.trans + '</dd></div>' +
      '<div class="desc-item"><dt>状态</dt><dd>' + stBadge(u.state) + '</dd></div>' +
      '<div class="desc-item full"><dt>技术对接人</dt><dd>' + u.contact + '</dd></div>' +
      '</dl>' +
      '<h4 class="section-title mt-16">对接系统与报送事项</h4>' +
      '<table class="data-table compact" data-static><thead><tr><th class="cell-lg">对接系统</th><th class="cell-lg">报送事项</th><th>报送频率</th><th>状态</th></tr></thead><tbody>' + rows + '</tbody></table>';
    PMS.openDrawer("unitViewDrawer");
  }

  renderDw();
</script>
</body>
</html>
