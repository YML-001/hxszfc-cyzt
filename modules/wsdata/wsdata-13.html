<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>报送接口配置 · 房产交易数据中心</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../assets/css/app.css">
</head>
<body data-role="admin" data-active="wsdata-13">
<main class="app-main">
  <div class="page-head">
    <div class="ph-l">
      <div class="breadcrumb">
        <i class="fa-solid fa-house bc-home"></i> 房产交易数据中心
        <span class="sep">/</span> 上级报送管理
        <span class="sep">/</span> <span class="cur">报送接口配置</span>
      </div>
      <div class="page-title">报送接口配置</div>
    </div>
    <div class="ph-r">
      <a class="btn" href="wsdata-12.html"><i class="fa-solid fa-building-columns"></i> 报送单位管理</a>
      <a class="btn btn-primary" href="wsdata-14.html"><i class="fa-solid fa-gauge-high"></i> 报送监控</a>
    </div>
  </div>

  <div class="card list-card">
    <div class="dc-list">
      <div class="dc-mini">
        <div class="mi"><div class="mv">7</div><div class="ml">报送接口数</div></div>
        <div class="mi ok"><div class="mv">5</div><div class="ml">运行中</div></div>
        <div class="mi warn"><div class="mv">2</div><div class="ml">异常 / 逾期</div></div>
        <div class="mi"><div class="mv">4</div><div class="ml">报送单位</div></div>
      </div>
      <div class="filter-bar">
        <div class="filter-item"><label>报送单位</label><select id="fUnit" onchange="renderJk()"><option value="">全部</option><option>住房和城乡建设部</option><option>自治区住房和城乡建设厅</option><option>广西一体化政务数据共享交换平台</option></select></div>
        <div class="filter-item"><label>报送频率</label><select id="fFreq" onchange="renderJk()"><option value="">全部</option><option>实时</option><option>日</option><option>月</option><option>事件触发</option></select></div>
        <div class="filter-item"><label>接口状态</label><select id="fState" onchange="renderJk()"><option value="">全部</option><option>运行中</option><option>异常</option><option>已停用</option></select></div>
        <div class="filter-item"><label>关键字</label><input type="text" id="fKw" placeholder="报送编号 / 报送事项" oninput="renderJk()"></div>
        <div class="filter-actions">
          <button class="btn btn-primary" onclick="renderJk()"><i class="fa-solid fa-magnifying-glass"></i> 查询</button>
          <button class="btn" onclick="resetJk()">重置</button>
          <button class="btn btn-primary" onclick="PMS.openDrawer('cfgDrawer')"><i class="fa-solid fa-plus"></i> 新增报送接口</button>
        </div>
      </div>
      <div class="table-wrap">
        <table class="data-table" data-static id="jkTable">
          <thead><tr><th>报送编号</th><th class="cell-lg">报送事项</th><th class="cell-lg">报送单位</th><th>报送频率</th><th>传输方式</th><th class="num">今日报送次数</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="jkBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</main>

<!-- 报送接口配置详情抽屉 -->
<div class="drawer-mask"></div>
<div class="drawer" id="viewDrawer">
  <div class="drawer-head"><h3 id="vdTitle">报送接口配置</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body" id="vdBody"></div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>关闭</button>
    <button class="btn" onclick="viewLogCur()"><i class="fa-solid fa-clock-rotate-left"></i> 报送日志</button>
    <button class="btn btn-primary" onclick="PMS.openDrawer('cfgDrawer')"><i class="fa-solid fa-pen"></i> 编辑配置</button>
  </div>
</div>

<!-- 报送日志抽屉 -->
<div class="drawer" id="logDrawer">
  <div class="drawer-head"><h3 id="ldTitle">报送日志</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <div class="filter-bar">
      <div class="filter-item"><label>报送状态</label><select><option value="">全部</option><option>报送成功</option><option>待回执</option><option>报送失败</option><option>已退回</option></select></div>
      <div class="filter-item"><label>报送时间</label><input type="date"></div>
      <div class="filter-actions"><button class="btn btn-primary" onclick="PMS.toast('已按条件查询报送日志')"><i class="fa-solid fa-magnifying-glass"></i> 查询</button></div>
    </div>
    <div class="table-wrap">
      <table class="data-table compact" data-static>
        <thead><tr><th>批次号</th><th>期间</th><th>发送时间</th><th class="num">条数</th><th>状态</th><th>回执时间</th><th>操作</th></tr></thead>
        <tbody id="ldBody"></tbody>
      </table>
    </div>
    <p class="hint mt-16"><i class="fa-solid fa-circle-info"></i> 报送日志按批次记录，含报文文件与上级回执，保留 10 年。<b>未收到回执不视为报送成功</b>。</p>
  </div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>关闭</button>
    <button class="btn btn-primary" onclick="PMS.toast('已导出该报送事项的报送日志')"><i class="fa-solid fa-download"></i> 导出日志</button>
  </div>
</div>

<!-- 报送接口配置编辑抽屉 -->
<div class="drawer" id="cfgDrawer">
  <div class="drawer-head"><h3>报送接口配置</h3><div class="close" data-close-drawer><i class="fa-solid fa-xmark"></i></div></div>
  <div class="drawer-body">
    <h4 class="section-title">基本信息</h4>
    <div class="form-grid form-align">
      <div class="form-item"><label>报送事项 <span class="req">*</span></label><input type="text" placeholder="如 全国房屋网签备案联网上报"></div>
      <div class="form-item"><label>报送单位 <span class="req">*</span></label><select><option>住房和城乡建设部</option><option>自治区住房和城乡建设厅</option><option>广西一体化政务数据共享交换平台</option></select></div>
      <div class="form-item"><label>对接系统 <span class="req">*</span></label><input type="text" placeholder="如 全国房屋网签备案系统"></div>
      <div class="form-item"><label>责任人 <span class="req">*</span></label><input type="text" placeholder="姓名 / 科室"></div>
    </div>
    <h4 class="section-title mt-16">接口配置</h4>
    <div class="form-grid form-align">
      <div class="form-item"><label>传输方式 <span class="req">*</span></label><select><option>HTTPS/JSON</option><option>WebService/XML</option><option>文件交换</option></select></div>
      <div class="form-item"><label>请求方式</label><select><option>POST</option><option>GET</option></select></div>
      <div class="form-item col-2"><label>接口地址 <span class="req">*</span></label><input type="text" placeholder="https://xxx.gov.cn/api/report"></div>
      <div class="form-item"><label>认证方式</label><select><option>国密 SM2/SM4</option><option>双向证书</option><option>AppKey + 签名</option></select></div>
      <div class="form-item"><label>报文规范版本</label><input type="text" placeholder="如 v2.6"></div>
    </div>
    <h4 class="section-title mt-16">报送频率与规则</h4>
    <div class="form-grid form-align">
      <div class="form-item"><label>报送频率 <span class="req">*</span></label><select><option>实时</option><option>日</option><option>月</option><option>季</option><option>事件触发</option></select></div>
      <div class="form-item"><label>报送时限</label><input type="text" placeholder="如 次日 09:00 前"></div>
      <div class="form-item"><label>前置条件</label><input type="text" placeholder="如 日关账完成 / 脱敏检查通过"></div>
      <div class="form-item"><label>失败重试次数</label><input type="text" value="3"></div>
      <div class="form-item col-2"><label>字段映射说明</label><textarea rows="3" placeholder="报送报文字段与主题库字段的映射关系"></textarea></div>
    </div>
  </div>
  <div class="drawer-foot">
    <button class="btn" data-close-drawer>取消</button>
    <button class="btn btn-primary" onclick="PMS.closeDrawer();PMS.toast('报送接口配置已保存','success')"><i class="fa-solid fa-floppy-disk"></i> 保存</button>
  </div>
</div>

<script src="../../assets/js/app.js"></script>
<script>
  var REPORTS = [
    { id: "SB-0001", name: "住建部住建厅日报报送", unit: "自治区住房和城乡建设厅", freq: "日", trans: "文件交换", calls: "1", state: "运行中",
      cfg: { sys: "广西房地产市场监管平台", url: "https://gxjs.gxzf.gov.cn/api/daily", auth: "国密 SM2/SM4（待改造）", spec: "住建部日报规范 v3.2", limit: "次日 09:00 前", pre: "日关账完成", owner: "覃海燕（市场信息科）", map: "成交套数/面积/金额按区划与用途汇总，映射至住建部日报报文字段" } },
    { id: "SB-0002", name: "全国房屋网签备案联网上报", unit: "住房和城乡建设部", freq: "实时", trans: "HTTPS/JSON", calls: "1,286", state: "运行中",
      cfg: { sys: "全国房屋网签备案系统", url: "https://wqba.mohurd.gov.cn/api/report", auth: "国密 SM2/SM4", spec: "全国网签备案联网接口规范 v2.6", limit: "备案后 24 小时内", pre: "数据质量校验通过", owner: "覃海燕（市场信息科）", map: "合同要素、房屋要素、当事人要素（脱敏）映射至联网上报报文" } },
    { id: "SB-0003", name: "房地产市场监测数据上报", unit: "住房和城乡建设部", freq: "日", trans: "HTTPS/JSON", calls: "1", state: "运行中",
      cfg: { sys: "房地产市场监测系统", url: "https://scjc.mohurd.gov.cn/api/report", auth: "国密 SM2/SM4", spec: "房地产市场监测数据规范 v2.0", limit: "次日 10:00 前", pre: "日关账完成", owner: "覃海燕（市场信息科）", map: "供应、成交、库存、价格等监测指标映射至监测系统报文字段" } },
    { id: "SB-0004", name: "预售资金监管数据上报", unit: "自治区住房和城乡建设厅", freq: "日", trans: "HTTPS/JSON", calls: "0", state: "异常",
      cfg: { sys: "预售资金监管平台", url: "https://gxzj.gxzf.gov.cn/api/report", auth: "国密 SM2/SM4", spec: "预售资金监管数据规范 v1.4", limit: "次日 10:00 前", pre: "银行对账完成（强制）", owner: "韦建国（资金监管科）", map: "监管账户、资金流水、拨付额度映射至资金监管报文字段" } },
    { id: "SB-0005", name: "广西房地信息采集报送", unit: "自治区住房和城乡建设厅", freq: "月", trans: "HTTPS/JSON", calls: "0", state: "异常",
      cfg: { sys: "房地信息采集系统", url: "https://gxjs.gxzf.gov.cn/api/collect", auth: "国密 SM2/SM4", spec: "广西房地信息采集规范 v1.8", limit: "次月 25 日前", pre: "口径确认", owner: "覃海燕（市场信息科）", map: "保障性住房、存量房成交等采集项映射至采集报文字段" } },
    { id: "SB-0006", name: "广西事项编码对接", unit: "自治区住房和城乡建设厅", freq: "事件触发", trans: "HTTPS/JSON", calls: "12", state: "运行中",
      cfg: { sys: "事项编码管理系统", url: "https://gxjs.gxzf.gov.cn/api/itemcode", auth: "国密 SM2/SM4", spec: "广西事项编码规范 v2.4", limit: "事项变更后 24 小时内", pre: "编码映射完整", owner: "覃海燕（市场信息科）", map: "本地事项编码 sxdm 映射至自治区事项编码" } },
    { id: "SB-0007", name: "一网共享数据报送", unit: "广西一体化政务数据共享交换平台", freq: "日", trans: "HTTPS/JSON", calls: "1", state: "运行中",
      cfg: { sys: "自治区数据共享交换平台", url: "https://gxshare.gxzf.gov.cn/api/report", auth: "国密 SM2/SM4", spec: "广西一体化政务数据共享规范 v3.0", limit: "次日 09:00 前", pre: "脱敏检查通过（强制）", owner: "陆志明（信息中心）", map: "商品房/存量房/租赁备案数据（脱敏）映射至共享平台数据项，须与共享目录一致" } }
  ];

  var PAGE = { num: 1, size: 10 };

  function stateBadge(s) {
    if (s === "运行中") return '<span class="badge green">运行中</span>';
    if (s === "异常") return '<span class="badge orange">异常/逾期</span>';
    return '<span class="badge gray">已停用</span>';
  }

  var curIdx = 0;

  function renderJk() {
    var u = document.getElementById("fUnit").value;
    var f = document.getElementById("fFreq").value;
    var st = document.getElementById("fState").value;
    var kw = (document.getElementById("fKw").value || "").trim().toLowerCase();
    var arr = REPORTS.filter(function (r) {
      if (u && r.unit !== u) return false;
      if (f && r.freq !== f) return false;
      if (st && r.state !== st) return false;
      if (kw && r.id.toLowerCase().indexOf(kw) < 0 && r.name.toLowerCase().indexOf(kw) < 0) return false;
      return true;
    });
    var table = document.getElementById("jkTable");
    var hasIdx = !!table.querySelector('thead th.idx-col');
    var start = (PAGE.num - 1) * PAGE.size;
    var pageItems = arr.slice(start, start + PAGE.size);
    var body = "";
    pageItems.forEach(function (r, i) {
      var seq = start + i + 1;
      var idxCell = hasIdx ? '<td class="idx-col">' + (seq < 10 ? '0' + seq : seq) + '</td>' : '';
      var gi = REPORTS.indexOf(r);
      body += '<tr>' + idxCell + '<td class="nowrap">' + r.id + '</td><td class="cell-lg fw-600">' + r.name + '</td><td class="cell-lg">' + r.unit + '</td><td class="nowrap">' + r.freq + '</td><td class="nowrap">' + r.trans + '</td><td class="num">' + r.calls + '</td><td>' + stateBadge(r.state) + '</td><td class="nowrap"><span class="link" onclick="viewCfg(' + gi + ')">配置</span> <span class="link" onclick="viewLog(' + gi + ')">报送日志</span></td></tr>';
    });
    if (!body) body = '<tr><td colspan="' + (hasIdx ? 9 : 8) + '" class="text-3" style="text-align:center;padding:24px">无匹配的报送接口</td></tr>';
    document.getElementById("jkBody").innerHTML = body;
    PMS.renderPager(table, { pageNum: PAGE.num, pageSize: PAGE.size, total: arr.length, onChange: function (s) { PAGE.num = s.pageNum; PAGE.size = s.pageSize; renderJk(); } });
  }

  function resetJk() {
    document.getElementById("fUnit").value = "";
    document.getElementById("fFreq").value = "";
    document.getElementById("fState").value = "";
    document.getElementById("fKw").value = "";
    PAGE.num = 1;
    renderJk();
  }

  function viewCfg(i) {
    curIdx = i;
    var r = REPORTS[i];
    document.getElementById("vdTitle").innerHTML = "报送接口配置 · " + r.id + " " + r.name;
    document.getElementById("vdBody").innerHTML =
      '<h4 class="section-title">报送单位配置</h4><dl class="desc-list">' +
      '<div class="desc-item full"><dt>报送单位</dt><dd>' + r.unit + '</dd></div>' +
      '<div class="desc-item full"><dt>对接系统</dt><dd>' + r.cfg.sys + '</dd></div>' +
      '<div class="desc-item"><dt>责任人</dt><dd>' + r.cfg.owner + '</dd></div>' +
      '<div class="desc-item"><dt>报送状态</dt><dd>' + stateBadge(r.state) + '</dd></div>' +
      '</dl>' +
      '<h4 class="section-title mt-16">接口配置</h4><dl class="desc-list">' +
      '<div class="desc-item"><dt>报送编号</dt><dd>' + r.id + '</dd></div>' +
      '<div class="desc-item"><dt>传输方式</dt><dd>' + r.trans + '</dd></div>' +
      '<div class="desc-item full"><dt>接口地址</dt><dd><code>' + r.cfg.url + '</code></dd></div>' +
      '<div class="desc-item"><dt>认证方式</dt><dd>' + r.cfg.auth + '</dd></div>' +
      '<div class="desc-item"><dt>报文规范版本</dt><dd>' + r.cfg.spec + '</dd></div>' +
      '<div class="desc-item full"><dt>字段映射说明</dt><dd>' + r.cfg.map + '</dd></div>' +
      '</dl>' +
      '<h4 class="section-title mt-16">报送频率与规则</h4><dl class="desc-list">' +
      '<div class="desc-item"><dt>报送频率</dt><dd>' + r.freq + '</dd></div>' +
      '<div class="desc-item"><dt>报送时限</dt><dd>' + r.cfg.limit + '</dd></div>' +
      '<div class="desc-item full"><dt>前置条件</dt><dd>' + r.cfg.pre + '</dd></div>' +
      '</dl>';
    PMS.openDrawer("viewDrawer");
  }

  function viewLog(i) {
    curIdx = i;
    var r = REPORTS[i];
    document.getElementById("ldTitle").innerHTML = "报送日志 · " + r.id + " " + r.name;
    var samples = [
      ["B-20260731-001", "2026-07-30", "2026-07-31 08:42", "1,286", r.state === "异常" ? "报送失败" : "待回执", "—"],
      ["B-20260730-001", "2026-07-29", "2026-07-30 08:38", "1,186", "报送成功", "2026-07-30 08:46"],
      ["B-20260729-001", "2026-07-28", "2026-07-29 08:40", "1,486", "报送成功", "2026-07-29 08:48"],
      ["B-20260728-001", "2026-07-27", "2026-07-28 08:36", "862", "报送成功", "2026-07-28 08:44"],
      ["B-20260727-001", "2026-07-26", "2026-07-27 08:34", "1,042", "报送成功", "2026-07-27 08:42"]
    ];
    var body = "";
    samples.forEach(function (s) {
      var badge = s[4] === "报送成功" ? '<span class="badge green">报送成功</span>' : (s[4] === "待回执" ? '<span class="badge blue">待回执</span>' : '<span class="badge red">报送失败</span>');
      body += '<tr><td class="nowrap">' + s[0] + '</td><td class="nowrap">' + s[1] + '</td><td class="nowrap">' + s[2] + '</td><td class="num">' + s[3] + '</td><td>' + badge + '</td><td class="nowrap">' + s[5] + '</td><td class="nowrap"><span class="link" onclick="PMS.toast(\'已打开报文与回执\')">报文</span></td></tr>';
    });
    document.getElementById("ldBody").innerHTML = body;
    PMS.openDrawer("logDrawer");
  }

  function viewLogCur() { viewLog(curIdx); }

  renderJk();
</script>
</body>
</html>
