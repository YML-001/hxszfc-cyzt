<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的工作台 · 住宅专项维修资金管理系统</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="../../../assets/css/app.css">
<link rel="stylesheet" href="../../../assets/css/wb.css">
<style>
  /* 页面私有：小区余额充足度列表 / 折线图 / KPI 红色副文案 */
  .zj-bal { display: flex; flex-direction: column; gap: 14px; }
  .zj-bal .r { display: flex; flex-direction: column; gap: 6px; }
  .zj-bal .r .top { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
  .zj-bal .r .top .n { color: #303133; }
  .zj-bal .r .top .v { color: #1f2a44; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .zj-bal .r .trk { height: 8px; border-radius: 4px; background: #eef1f6; overflow: hidden; }
  .zj-bal .r .trk span { display: block; height: 100%; border-radius: 4px; background: linear-gradient(90deg, #2556ba, #5b8def); }
  .zj-bal .r .trk span.low { background: linear-gradient(90deg, #f59e0b, #ffc36b); }
  .zj-bal .r .trk span.ok { background: linear-gradient(90deg, #2ea44f, #5fd39a); }
  .zj-line { width: 100%; height: 232px; display: block; }
  .zj-line .gl { stroke: #edf0f5; stroke-width: 1; }
  .zj-line .ax { fill: #909399; font-size: 11px; }
  .zj-line .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .zj-line .ln.a { stroke: #2556ba; }
  .zj-line .ln.b { stroke: #df2026; }
  .wb-kpi .k-s.zj-red { color: #df2026; }
  .zj-wb .wb-todo .t-h .more { margin-left: auto; }
</style>
</head>
<body data-role="reviewer" data-active="wswxzj-01">
<main class="app-main zj-wb"><div id="wb-root"></div></main>
<script src="../../../assets/js/app.js"></script>
<script src="../../../assets/js/wb.js"></script>
<script>
/* 内容按 Figma「管理后台-住宅专项维修资金管理系统」工作台逐项还原 */
(function () {
  /* 小区余额充足度列表 */
  var balRows = [
    ['柳北区 胜利小区（2003 年建成）', '余额 186 万 / 首期 862 万', 21.6, 'low'],
    ['柳南区 五一佳园（2005 年建成）', '余额 268 万 / 首期 1,024 万', 26.2, 'low'],
    ['鱼峰区 桂中海讯小区（2010 年建成）', '余额 642 万 / 首期 1,286 万', 49.9, 'ok'],
    ['柳北区 雅儒新苑（2014 年建成）', '余额 986 万 / 首期 1,420 万', 69.4, 'ok'],
    ['城中区 荣和公园里（2019 年建成）', '余额 1,842 万 / 首期 1,986 万', 92.7, 'ok']
  ];
  var balHtml = '<div class="zj-bal">' + balRows.map(function (r) {
    return '<div class="r"><div class="top"><span class="n">' + r[0] + '</span><span class="v">' + r[1] + '</span></div>' +
      '<div class="trk"><span class="' + r[3] + '" style="width:' + r[2] + '%"></span></div></div>';
  }).join('') + '</div>';

  /* 归集总额与累计使用率走势：双折线 SVG（单位 %，近 12 个月） */
  function smooth(pts) {
    var d = 'M' + pts[0][0] + ',' + pts[0][1];
    for (var i = 0; i < pts.length - 1; i++) {
      var p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      var c1x = p1[0] + (p2[0] - p0[0]) / 6, c1y = p1[1] + (p2[1] - p0[1]) / 6;
      var c2x = p2[0] - (p3[0] - p1[0]) / 6, c2y = p2[1] - (p3[1] - p1[1]) / 6;
      d += ' C' + c1x.toFixed(1) + ',' + c1y.toFixed(1) + ' ' + c2x.toFixed(1) + ',' + c2y.toFixed(1) + ' ' + p2[0] + ',' + p2[1].toFixed(1);
    }
    return d;
  }
  function lineChart(W) {
    var H = 232, L = 44, R = 14, T = 22, B = 30;
    var months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
    var a = [66, 60, 55, 62, 78, 74, 60, 54, 60, 68, 66, 62];   /* 归集总额（蓝） */
    var b = [56, 62, 72, 76, 64, 50, 46, 52, 64, 72, 68, 60];   /* 累计使用率（红） */
    var x = function (i) { return L + i * (W - L - R) / 11; };
    var y = function (v) { return T + (100 - v) / 100 * (H - T - B); };
    var s = '<svg class="zj-line" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="归集总额与累计使用率走势">';
    s += '<text class="ax" x="4" y="12">单位(%)</text>';
    [0, 25, 50, 75, 100].forEach(function (v) {
      s += '<line class="gl" x1="' + L + '" y1="' + y(v) + '" x2="' + (W - R) + '" y2="' + y(v) + '"></line>';
      s += '<text class="ax" x="' + (L - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end">' + v + '</text>';
    });
    months.forEach(function (m, i) { s += '<text class="ax" x="' + x(i) + '" y="' + (H - 8) + '" text-anchor="middle">' + m + '</text>'; });
    s += '<path class="ln a" d="' + smooth(a.map(function (v, i) { return [x(i), y(v)]; })) + '"></path>';
    s += '<path class="ln b" d="' + smooth(b.map(function (v, i) { return [x(i), y(v)]; })) + '"></path>';
    return s + '</svg>';
  }
  var lineHtml = '<div class="wb-legend"><span><i style="background:#2556ba"></i>归集总额（亿元）</span><span><i style="background:#df2026"></i>累计使用率（%）</span></div><div id="zj-line-box"></div>';
  /* 按卡片实际宽度 1:1 绘制，避免 viewBox 缩放导致文字过小 */
  function drawLine() {
    var box = document.getElementById('zj-line-box');
    if (box) box.innerHTML = lineChart(Math.max(240, box.clientWidth));
  }

  WB.render({ blocks: [
    { type: 'row', cols: [
      { type: 'greet', hello: '上午好', name: '韦国强', org: '市房产交易所 · 业务审核员', sys: '您有 14 笔待办，2 个小区余额已低于警戒线',
        date: '2026 年 7 月 31 日 · 星期五',
        tiles: [
          { icon: 'fa-piggy-bank', label: '归集总额(元)', value: '18.28亿', href: 'collect.html' },
          { icon: 'fa-book', label: '分户账(户)', value: '186,420', href: 'ledger.html' },
          { icon: 'fa-chart-pie', label: '累计使用率', value: '18.1%', href: 'monitor.html' }
        ] },
      { type: 'todos', title: '我的待办', weather: false, more: '查看更多', moreHref: 'usage-approve.html',
        items: [
          { tag: '应急维修', c: 'red', text: '荣和公园里3号楼电梯困人，申请应急维修8.60万元', time: '立即处理', over: true, href: 'usage-urgent.html' },
          { tag: '表决临期', c: 'orange', text: '桂中海讯小区电梯整体更换表决剩2天，同意面积61.2%...', time: '剩6h', over: true, href: 'usage-vote.html' },
          { tag: '验收结算', c: 'green', text: '天源国际社区二次供水改造完工，待验收结算并多退少补', time: '剩6h', over: true, href: 'usage-accept.html' },
          { tag: '预算审核', c: 'blue', text: '五一佳园屋面防水工程预算42.80万元，需组织专家评审', time: '剩1天', href: 'usage-budget.html' }
        ] }
    ] },

    { type: 'note', warn: true, text: '分户账是维修资金的账本核心：一房一条，记录本金、增值收益、已使用与当前余额。所有缴存、使用分摊、收益分配、退款，都以分户账为最小记账单位逐笔留痕。分户账余额不允许直接修改，只能由明细汇总回写——这条规矩保证了几十年后账目仍然经得起查。' },

    { type: 'kpis', cols: 5, items: [
      { icon: 'fa-piggy-bank', c: 'blue', label: '归集总额(万元)', value: '426,842', sub: '本年新增 28,642', trend: 'up', href: 'collect.html' },
      { icon: 'fa-book', c: 'orange', label: '分户账', value: '186,420', sub: '覆盖 1,286 个小区', href: 'ledger.html' },
      { icon: 'fa-clipboard-check', c: 'blue', label: '待我审批', value: 13, sub: '3 件今日到期', trend: 'zj-red', href: 'usage-approve.html' },
      { icon: 'fa-triangle-exclamation', c: 'red', label: '余额告急小区', value: 2, sub: '需启动续筹', trend: 'zj-red', href: 'collect-renew.html' },
      { icon: 'fa-square-poll-vertical', c: 'green', label: '表决进行中', value: 6, sub: '2 个临近截止', trend: 'zj-red', href: 'usage-vote.html' }
    ] },

    { type: 'quick', title: '快速入口', sub: '按业务链路顺序排列', rows: [[
      { label: '使用申请', icon: 'fa-file-pen', href: 'usage.html' },
      { label: '业主表决', icon: 'fa-square-poll-vertical', href: 'usage-vote.html' },
      { label: '分户账管理', icon: 'fa-book', href: 'ledger.html' },
      { label: '归集台账', icon: 'fa-money-check-dollar', href: 'collect.html' },
      { label: '应急维修', icon: 'fa-screwdriver-wrench', href: 'usage-urgent.html' },
      { label: '核算清算对账', icon: 'fa-scale-balanced', href: 'settle.html' },
      { label: '资金运行监测', icon: 'fa-chart-line', href: 'monitor.html' },
      { label: '模块导航', icon: 'fa-table-cells-large', href: '../index.html' }
    ]] },

    { type: 'row', cols: [
      { type: 'card', title: '小区余额充足度 TOP 关注', meta: '余额 / 首期缴存额，低于 30% 需续筹', html: balHtml,
        note: '老旧小区的资金缺口是结构性的：2003 年建成的胜利小区余额只剩首期的 21.6%，而未来几年电梯、管网、屋面都到了大修周期。已纳入房屋养老金资金保障能力分析重点跟踪。' },
      { type: 'bar', title: '近 6 月归集与使用对比', unit: '单位：万元 · 双柱对照', series: ['归集入账', '使用拨付'],
        colors: ['linear-gradient(180deg,#5b8def,#2556ba)', 'linear-gradient(180deg,#ffc36b,#f59e0b)'],
        data: [['3月', 50, 200], ['4月', 100, 50], ['5月', 150, 100], ['6月', 150, 100], ['7月', 200, 50], ['8月', 150, 100]],
        note: '归集随新房交付走高，使用随老旧小区大修周期抬升；近 6 月使用强度明显增强，但仍低于归集。' }
    ] },

    { type: 'row', cols: [
      { type: 'donut', title: '本年使用用途结构', meta: '已拨付 1.86 亿元', center: '1.86', centerLabel: '亿元',
        parts: [['消防及其他', 10, '#2ea44f'], ['应急维修', 12, '#f59e0b'], ['电梯更新改造', 34, '#df2026'], ['屋面防水保温', 24, '#2556ba'], ['管网与二次供水', 20, '#7c3aed']],
        note: '电梯类占比最高，与全市 15 年以上楼栋梯龄结构吻合；应急维修占比 12%，需持续压降。' },
      { type: 'card', title: '归集总额与累计使用率走势', meta: '近 12 个月', html: lineHtml,
        note: '归集总额升至 18.28 亿元，累计使用率升至 18.1%；使用率随老旧小区进入大修周期逐月抬升。' },
      { type: 'hbar', title: '各城区归集规模与使用率', unit: '归集额（亿元）· 使用率见右侧',
        data: [['柳南区', 32], ['城中区', 28], ['鱼峰区', 34], ['柳北区', 24], ['柳江区', 34], ['五县合计', 89], ['柳东新区', 89]],
        note: '柳北、鱼峰使用率偏高，与老旧小区占比相关；余额告急的 2 个小区均在柳北区。' }
    ] }
  ] });
  drawLine();
  window.addEventListener('resize', drawLine);
})();
</script>
</body>
</html>
